name: Setup Policy Engine Python
description: Setup Python and uv, then sync the Policy Engine environment.

inputs:
  profile:
    description: Workspace bootstrap profile to sync via the unified workspace bootstrap CLI.
    required: false
    default: ""
  extras:
    description: Space-delimited extras to sync with uv.
    required: false
    default: "dev test"
  python-version:
    description: Python version to provision.
    required: false
    default: "3.14"
  working-directory:
    description: Policy Engine working directory.
    required: false
    default: "policy-engine"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.9.21"

    - name: Install source-build system headers
      # pillow has no cp314 wheel and marker-pdf caps it below 11, so it is built
      # from source. The build needs jpeg/zlib headers, which the runner lacks.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq libjpeg-dev zlib1g-dev

    - name: Sync environment from workspace bootstrap profile
      if: inputs.profile != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # tools.cli is a click app and click is not installed yet at this point.
        # The bootstrapper itself is dependency-free; invoke it directly.
        python3 -m tools.devx.workspace.bootstrap \
          --profile "${{ inputs.profile }}" \
          --skip-frontend \
          --skip-playwright \
          --skip-hooks \
          --skip-doctor

    - name: Sync environment
      if: inputs.profile == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UV_EXTRAS: ${{ inputs.extras }}
      run: |
        set -euo pipefail
        args=()
        for extra in ${UV_EXTRAS}; do
          args+=(--extra "${extra}")
        done
        uv sync --frozen "${args[@]}"
