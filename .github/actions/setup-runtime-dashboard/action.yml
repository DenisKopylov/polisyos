name: Setup Runtime Dashboard
description: Setup Node and install runtime dashboard dependencies.

inputs:
  install-deps:
    description: Whether to run pnpm install.
    required: false
    default: "true"
  install-playwright:
    description: Whether to install Playwright Chromium and OS dependencies.
    required: false
    default: "false"
  node-version:
    description: Node version to provision.
    required: false
    default: "22"
  working-directory:
    description: Runtime dashboard working directory.
    required: false
    default: "policy-engine/apps/runtime-dashboard"

runs:
  using: composite
  steps:
    - name: Enable corepack and pin the pnpm store
      # setup-node's cache: "pnpm" resolves the directory to cache by running
      # `pnpm store path`, so pnpm has to be on PATH before that step: corepack
      # ships with the runner's Node but is not enabled. That alone is not
      # enough. The pnpm setup-node consults is not the one `corepack pnpm`
      # activates from the packageManager pin, so the two pick different default
      # stores; the install populates one and the post-run cache save looks in
      # the other, which is why the job failed in "Post Setup" with a path that
      # does not exist. Naming the store explicitly makes both sides agree.
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        printf 'npm_config_store_dir=%s\n' "${RUNNER_TEMP}/pnpm-store" >> "${GITHUB_ENV}"

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"
        cache-dependency-path: policy-engine/pnpm-lock.yaml

    - name: Install workspace dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      working-directory: policy-engine
      run: corepack pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: corepack pnpm exec playwright install --with-deps chromium
