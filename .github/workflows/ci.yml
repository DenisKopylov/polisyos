name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test
      - name: lint_imports
        run: uv run python tools/lint/lint_imports.py --policy import_policy.toml --exceptions import_exceptions.toml
      - name: lint_foundry
        run: uv run python tools/lint/lint_foundry.py --repo-root .
      - name: check_state_reads
        run: uv run python tools/diagnostics/check_state_reads.py
      - name: check_scientist_node_version_bump
        run: uv run python tools/diagnostics/check_scientist_node_version_bump.py
      - name: check_scholar_imports
        run: uv run python tools/lint/check_scholar_imports.py
      - name: check_connector_contracts
        run: uv run python tools/connectors/check_contracts.py --check
      - name: gen_schema --check
        run: uv run python tools/diagnostics/gen_schema.py --check
      - name: pytest unit/contract (no integration)
        run: uv run pytest -m "not integration" --ignore=tests/runtime/http

  runtime-http:
    runs-on: ubuntu-latest
    needs: quality-and-unit
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test --extra runtime-http
      - name: Verify runtime HTTP dependencies
        run: uv run python -c "import fastapi, jwt"
      - name: pytest runtime/http
        run: uv run pytest tests/runtime/http

  frontend-quality:
    runs-on: ubuntu-latest
    needs: quality-and-unit
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Typecheck dashboard
        run: npm run typecheck
      - name: Lint dashboard
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check frontend architecture
        run: npm run check:architecture
      - name: Run coverage suite
        run: npm run test:coverage
      - name: Run accessibility suite
        run: npm run test:a11y

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build dashboard
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build
      - name: Upload frontend security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-security
          path: policy-engine/frontend/runtime-dashboard/dist/security
          if-no-files-found: warn

  frontend-storybook:
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build Storybook
        run: npm run build-storybook

  frontend-storybook-tests:
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Storybook interaction tests
        run: npm run test:storybook

  frontend-bundle:
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build dashboard for bundle budgets
        run: npm run build
      - name: Check bundle budgets
        run: npm run check:bundle

  frontend-contracts:
    runs-on: ubuntu-latest
    needs:
      - quality-and-unit
      - frontend-quality
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test --extra runtime-http
      - name: Verify Runtime API contract drift
        run: uv run python tools/runtime/check_runtime_api_contract.py
      - name: Install dashboard dependencies
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm ci
      - name: Verify dashboard API types are current
        working-directory: policy-engine/frontend/runtime-dashboard
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/types.ts
      - name: Verify runtime contract fixtures
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm run contracts:verify
      - name: Build dashboard
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm run build

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - runtime-http
      - frontend-build
      - frontend-contracts
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test --extra runtime-http
      - name: Install dashboard dependencies
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm ci
      - name: Install Playwright browsers
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm run test:e2e:smoke

  frontend-visual:
    runs-on: ubuntu-latest
    needs:
      - runtime-http
      - frontend-build
      - frontend-contracts
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test --extra runtime-http
      - name: Install dashboard dependencies
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm ci
      - name: Install Playwright browsers
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npx playwright install --with-deps chromium
      - name: Run Playwright visual tests
        id: run_visual
        working-directory: policy-engine/frontend/runtime-dashboard
        run: |
          export CI=1
          npm run test:visual
      - name: Summarize visual regression output
        if: always()
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm run visual:report
      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-artifacts
          path: |
            policy-engine/frontend/runtime-dashboard/playwright-report
            policy-engine/frontend/runtime-dashboard/test-results
            policy-engine/frontend/runtime-dashboard/visual-regression-summary.md
          if-no-files-found: warn
      - name: Comment visual regression summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: policy-engine/frontend/runtime-dashboard/visual-regression-summary.md
        with:
          script: |
            const fs = require("fs");
            const path = process.env.SUMMARY_PATH;
            if (!fs.existsSync(path)) {
              return;
            }
            const marker = "<!-- runtime-dashboard-visual -->";
            const body = `${marker}\n${fs.readFileSync(path, "utf8")}\n\nArtifact: \`visual-diff-artifacts\``;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                body,
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return;
            }
            await github.rest.issues.createComment({
              body,
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

  frontend-lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - runtime-http
      - frontend-quality
      - frontend-contracts
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test --extra runtime-http
      - name: Install dashboard dependencies
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm ci
      - name: Build dashboard for Lighthouse
        working-directory: policy-engine/frontend/runtime-dashboard
        env:
          VITE_RUNTIME_API_URL: http://127.0.0.1:8000
          VITE_DISABLE_RUNS_LIVE: "true"
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build
      - name: Start fixture runtime API
        run: |
          mkdir -p frontend/runtime-dashboard/.tmp
          PYTHONPATH=src:. uv run --extra runtime-http python frontend/runtime-dashboard/scripts/serve_fixture_runtime_api.py --port 8000 --metadata-file frontend/runtime-dashboard/.tmp/fixture-runtime.json &
          echo $! > /tmp/runtime-dashboard-fixture.pid
      - name: Start dashboard preview server
        working-directory: policy-engine/frontend/runtime-dashboard
        env:
          VITE_RUNTIME_API_URL: http://127.0.0.1:8000
          VITE_DISABLE_RUNS_LIVE: "true"
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/runtime-dashboard-preview.pid
      - name: Wait for Lighthouse servers
        run: |
          for target in http://127.0.0.1:8000/health http://127.0.0.1:4173; do
            for attempt in $(seq 1 60); do
              if curl -fsS "$target" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $target"
                exit 1
              fi
              sleep 2
            done
          done
      - name: Run Lighthouse CI
        id: lighthouse
        continue-on-error: true
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm run lighthouse:ci
      - name: Summarize Lighthouse report
        if: always()
        working-directory: policy-engine/frontend/runtime-dashboard
        run: npm run lighthouse:report
      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            policy-engine/frontend/runtime-dashboard/lighthouse-report
            policy-engine/frontend/runtime-dashboard/lighthouse-summary.md
          if-no-files-found: warn
      - name: Comment Lighthouse summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: policy-engine/frontend/runtime-dashboard/lighthouse-summary.md
        with:
          script: |
            const fs = require("fs");
            const path = process.env.SUMMARY_PATH;
            if (!fs.existsSync(path)) {
              return;
            }
            const marker = "<!-- runtime-dashboard-lighthouse -->";
            const body = `${marker}\n${fs.readFileSync(path, "utf8")}\n\nArtifact: \`lighthouse-report\``;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                body,
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return;
            }
            await github.rest.issues.createComment({
              body,
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
      - name: Stop Lighthouse services
        if: always()
        run: |
          if [ -f /tmp/runtime-dashboard-preview.pid ]; then kill "$(cat /tmp/runtime-dashboard-preview.pid)" || true; fi
          if [ -f /tmp/runtime-dashboard-fixture.pid ]; then kill "$(cat /tmp/runtime-dashboard-fixture.pid)" || true; fi

  frontend-bundle-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build PR bundle stats
        env:
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          npm run build
          node ./scripts/emit-bundle-stats.mjs ./dist/bundle-stats-head.json
      - name: Prepare base worktree
        working-directory: policy-engine
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          git worktree add /tmp/runtime-dashboard-base ${{ github.event.pull_request.base.sha }}
      - name: Install base dashboard dependencies
        working-directory: /tmp/runtime-dashboard-base/policy-engine/frontend/runtime-dashboard
        run: npm ci
      - name: Build base bundle stats
        working-directory: /tmp/runtime-dashboard-base/policy-engine/frontend/runtime-dashboard
        env:
          VITE_SENTRY_RELEASE: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run build
          node ./scripts/emit-bundle-stats.mjs ./dist/bundle-stats-base.json
      - name: Compare bundle stats
        run: |
          node ./scripts/compare-bundle-stats.mjs /tmp/runtime-dashboard-base/policy-engine/frontend/runtime-dashboard/dist/bundle-stats-base.json ./dist/bundle-stats-head.json ./bundle-diff-summary.md
      - name: Upload bundle diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-diff
          path: |
            policy-engine/frontend/runtime-dashboard/dist/bundle-stats-head.json
            policy-engine/frontend/runtime-dashboard/bundle-diff-summary.md
            /tmp/runtime-dashboard-base/policy-engine/frontend/runtime-dashboard/dist/bundle-stats-base.json
          if-no-files-found: warn
      - name: Comment bundle diff summary
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: policy-engine/frontend/runtime-dashboard/bundle-diff-summary.md
        with:
          script: |
            const fs = require("fs");
            const path = process.env.SUMMARY_PATH;
            if (!fs.existsSync(path)) {
              return;
            }
            const marker = "<!-- runtime-dashboard-bundle-diff -->";
            const body = `${marker}\n${fs.readFileSync(path, "utf8")}\n\nArtifact: \`bundle-diff\``;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                body,
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return;
            }
            await github.rest.issues.createComment({
              body,
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
      - name: Remove base worktree
        if: always()
        working-directory: policy-engine
        run: git worktree remove /tmp/runtime-dashboard-base --force

  frontend-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: policy-engine/frontend/runtime-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: policy-engine/frontend/runtime-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run npm audit
        run: |
          npm audit --omit=dev --audit-level=high --json > npm-audit-raw.json || true
      - name: Summarize dependency audit
        run: npm run audit:ci
      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            policy-engine/frontend/runtime-dashboard/npm-audit-raw.json
            policy-engine/frontend/runtime-dashboard/npm-audit-report.json
            policy-engine/frontend/runtime-dashboard/npm-audit-summary.md
          if-no-files-found: warn
      - name: Comment dependency audit summary
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: policy-engine/frontend/runtime-dashboard/npm-audit-summary.md
        with:
          script: |
            const fs = require("fs");
            const path = process.env.SUMMARY_PATH;
            if (!fs.existsSync(path)) {
              return;
            }
            const marker = "<!-- runtime-dashboard-audit -->";
            const body = `${marker}\n${fs.readFileSync(path, "utf8")}\n\nArtifact: \`npm-audit-report\``;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                body,
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return;
            }
            await github.rest.issues.createComment({
              body,
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

  frontend-gate:
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - frontend-build
      - frontend-storybook
      - frontend-storybook-tests
      - frontend-bundle
      - frontend-contracts
      - frontend-e2e-smoke
      - frontend-visual
    steps:
      - name: Frontend gate complete
        run: echo "frontend checks passed"

  integration:
    runs-on: ubuntu-latest
    needs:
      - quality-and-unit
      - runtime-http
      - frontend-gate
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync --frozen --extra dev --extra test --extra runtime-http
      - name: pytest integration
        run: uv run pytest -m integration
