name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync
      - name: lint_imports
        run: uv run python -m tools.lint_imports
      - name: lint_foundry
        run: uv run python -m tools.lint_foundry
      - name: gen_schema --check
        run: uv run python -m tools.gen_schema --check
      - name: pytest unit/contract (no integration)
        run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync environment
        run: uv sync
      - name: pytest integration
        run: uv run pytest -m integration
