            tests/unit/runtime/http/test_api_maturity.py \
            --junitxml=_build/.tmp/test-reports/core-runtime-contracts.xml

      - name: Run soak smoke evidence
        run: |
          uv run pytest -q \
            tests/performance/test_runtime_hot_paths.py \
            -k "run_index_incremental_refresh_soak_smoke or async_artifact_store_repeated_round_trip_soak_smoke or async_artifact_store_concurrent_round_trip_soak_smoke or async_connector_ingestion_round_trip_soak_smoke or async_cursor_store_stream_progress_soak_smoke or partitioned_ingestion_resume_cycle_soak_smoke or streaming_async_adapter_resume_cycle_soak_smoke or streaming_async_adapter_cdc_round_trip_soak_smoke or streaming_async_adapter_combined_resume_cdc_long_soak_smoke or streaming_windowed_legacy_async_chunk_round_trip_soak_smoke or streaming_windowed_async_snapshot_round_trip_soak_smoke or orchestrated_ingestion_async_snapshot_round_trip_soak_smoke"

      - name: Upload runtime contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-runtime-contracts
          path: policy-engine/_build/.tmp/test-reports/core-runtime-contracts.xml
          if-no-files-found: warn
          retention-days: 30

  docs-contract:
    name: Core Runtime / Docs Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.11"
          extras: "docs"

      - name: Check docs accuracy
        run: uv run python tools/quality/validation/check_docs_accuracy.py

      - name: Build docs
        run: uv run python -m mkdocs build

  linkcheck:
    name: Core Runtime / Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check documentation links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: "policy-engine/docs/ policy-engine/README.md policy-engine/CONTRIBUTING.md --exclude-path policy-engine/docs/archive"

  mutation-subset:
    name: Core Runtime / Mutation Subset
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.11"
          extras: "test mutation runtime"

      - name: Run mutation subset
        run: |
          uv run mutmut run \
            --paths-to-mutate src/polisyos/common/serialization.py \
            --paths-to-mutate src/polisyos/core/security/authz.py \
            --paths-to-mutate src/polisyos/runtime/http/dependencies.py \
            --runner "python -m pytest tests/unit/common/test_serialization_properties.py tests/unit/runtime/http/test_access_invariants_properties.py tests/unit/runtime/http/test_runtime_api_authz.py -x -q --no-header"

      - name: Export mutation results
        run: uv run mutmut results > core-runtime-mutation-results.txt

      - name: Upload mutation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-runtime-mutation-results
          path: policy-engine/core-runtime-mutation-results.txt
          if-no-files-found: warn
          retention-days: 30

  performance-smoke:
    name: Core Runtime / Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.11"
          extras: "test runtime causal-discovery sandbox"

      - name: Run performance smoke benchmarks
        run: |
          uv run pytest \
            tests/performance/test_overhead.py \
            tests/performance/test_scientist_runtime_paths.py \
            tests/performance/test_runtime_hot_paths.py \
            --benchmark-only \
            --benchmark-json=core-runtime-benchmarks.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=5 \
            -q

      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-runtime-benchmarks
          path: policy-engine/core-runtime-benchmarks.json
          if-no-files-found: warn
          retention-days: 30

  scientist-phase0-gate:
    name: Scientist / Phase 0 Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.11"
          extras: "test runtime causal-discovery security"

      - name: Run Phase 0 acceptance regressions
        run: |
          mkdir -p _build/.tmp/test-reports
          uv run pytest -q \
            tests/unit/scientist/engine/test_retry.py \
            tests/unit/scientist/engine/runner/test_worker_pool.py \
            tests/unit/scientist/engine/locks/test_fcntl_lock.py \
            tests/unit/scientist/engine/locks/test_lock_metrics.py \
            tests/unit/scientist/engine/locks/test_dynamodb_lock.py \
            tests/unit/scientist/engine/locks/test_redis_lock.py \
            tests/unit/scientist/llm/test_gateway_client_retry.py \
            tests/unit/scientist/test_idempotency.py \
            tests/unit/scientist/llm/test_budget_enforcer.py \
            tests/unit/scientist/backtesting/test_masking.py \
            tests/unit/scientist/adapters/test_foundry_bridge.py \
            tests/unit/scientist/backtesting/test_bootstrap.py \
            tests/unit/scientist/backtesting/test_ipw.py \
            tests/unit/scientist/backtesting/test_distributional.py \
            tests/unit/scientist/search/test_cheap_stage_autotune.py \
            --junitxml=_build/.tmp/test-reports/scientist-phase0.xml

      - name: Build Phase 0 acceptance report
        run: |
          uv run polisyos-tools ci check-scientist-phase0-gate \
            --junit-xml _build/.tmp/test-reports/scientist-phase0.xml \
            --output _build/.tmp/test-reports/scientist-phase0-gate.json \
            --output-format json \
            --require-passing

      - name: Upload Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scientist-phase0-gate
          path: |
            policy-engine/_build/.tmp/test-reports/scientist-phase0.xml
            policy-engine/_build/.tmp/test-reports/scientist-phase0-gate.json
          if-no-files-found: warn
          retention-days: 30

  scientist-phase1-gate:
    name: Scientist / Phase 1 Gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.11"
          extras: "test runtime causal-discovery sandbox"

      - name: Run Phase 1 reliability and mutation regressions
        run: |
          mkdir -p _build/.tmp/test-reports
          uv run pytest -q \
            tests/unit/scientist/test_remediation_status.py \
            tests/unit/scientist/test_reliability_scorecard.py \
            tests/unit/scientist/test_reliability_operational_evidence.py \
            tests/unit/scientist/integration/test_workflow_reliability_scenarios.py \
            tests/unit/scientist/agent/test_data_need_extractor.py \
            tests/unit/scientist/test_norm_loader.py \
            tests/unit/scientist/agent/test_drafter_factory.py \
            tests/unit/scientist/agent/test_drafter_formatting.py \
            tests/unit/scientist/agent/test_router.py \
            tests/unit/scientist/agent/test_supervisor.py \
            tests/unit/scientist/test_rag_index.py \
            tests/unit/scientist/test_cross_graph_evidence.py \
            tests/unit/scientist/cross_graph/test_gatherers.py \
            tests/unit/scientist/autotune/test_execution_plan_autotune.py \
            tests/unit/scientist/autotune/test_calibration_autotune.py \
            tests/unit/scientist/search/funnel/test_level2_causal.py \
            tests/unit/scientist/test_code_verifier.py \
            tests/unit/scientist/nodes/builtins/decide/test_policy_translation.py \
            tests/unit/scientist/engine/test_budget_middleware.py \
            tests/unit/scientist/workflows/test_builder_pinning.py \
            --junitxml=_build/.tmp/test-reports/scientist-phase1.xml

      - name: Run Phase 1 runtime benchmarks
        run: |
          uv run pytest \
            tests/performance/test_scientist_runtime_paths.py \
            --benchmark-only \
            --benchmark-json=_build/.tmp/test-reports/scientist-phase1-benchmarks.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=5 \
            -q

      - name: Build Phase 1 acceptance report
        run: |
          uv run polisyos-tools ci check-scientist-phase1-gate \
            --benchmark-json _build/.tmp/test-reports/scientist-phase1-benchmarks.json \
            --junit-xml _build/.tmp/test-reports/scientist-phase1.xml \
            --output _build/.tmp/test-reports/scientist-phase1-gate.json \
            --output-format json \
            --require-passing

      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scientist-phase1-gate
          path: |
            policy-engine/_build/.tmp/test-reports/scientist-phase1.xml
            policy-engine/_build/.tmp/test-reports/scientist-phase1-benchmarks.json
            policy-engine/_build/.tmp/test-reports/scientist-phase1-gate.json
          if-no-files-found: warn
          retention-days: 30

  release-review-evidence:
    name: Core Runtime / Release Review Evidence
    if: github.event_name == 'workflow_dispatch'
    needs:
      - typing-and-ratchets
      - runtime-contracts
      - docs-contract
      - linkcheck
      - mutation-subset
      - performance-smoke
      - scientist-phase0-gate
      - scientist-phase1-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download performance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-runtime-benchmarks
          path: policy-engine/release-review/benchmarks

      - name: Download mutation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-runtime-mutation-results
          path: policy-engine/release-review/mutation

      - name: Download runtime contract evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-runtime-contracts
          path: policy-engine/release-review/contracts

      - name: Download Scientist Phase 0 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scientist-phase0-gate
          path: policy-engine/release-review/scientist-phase0

      - name: Download Scientist Phase 1 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scientist-phase1-gate
          path: policy-engine/release-review/scientist-phase1

      - name: Assemble release review bundle
        run: |
          mkdir -p release-review/docs release-review/ops
          uv run python tools/devx/workspace/core_runtime_closeout.py \
            --summary release-review/docs/core-runtime-closeout.md \
            --json-output release-review/contracts/core-runtime-closeout.json
          cp docs/reference/operations/slo-error-budget.md release-review/docs/
          cp docs/reference/operations/core-runtime-closeout.md release-review/docs/
          cp docs/runbooks/benchmark-regression-triage.md release-review/docs/
          cp release/core-runtime-closeout.ledger.toml release-review/docs/
          cp release/core-runtime-closeout.evidence.template.toml release-review/docs/
          cp ops/observability/prometheus/slo_alerts.yml release-review/ops/
          cp ops/observability/prometheus/rules/runtime_operability_alerts.yml release-review/ops/
          cp ops/observability/grafana/dashboards/runtime-operability.json release-review/ops/
          cp ops/observability/grafana/dashboards/slo-overview.json release-review/ops/
          cp tests/performance/overhead_baseline.json release-review/benchmarks/
          cat <<'EOF' > release-review/README.md
          # Core Runtime Release Review

          This bundle is assembled only after the same gates used on pull requests pass:

          - typing and ratchets: mypy, basedpyright, expanded Ruff, CI ratchet scan, architecture guardrails;
          - runtime contracts: middleware, lifecycle, and security regression suite;
          - docs and links: docs accuracy, MkDocs build, and link checks;
          - mutation subset: auth, serialization, and runtime dependency mutation gate;
          - performance smoke: current benchmark JSON plus committed baseline.

          Release review evidence lives under:

          - `benchmarks/` for current smoke results and benchmark baselines;
          - `contracts/` for targeted runtime JUnit evidence;
          - `mutation/` for mutmut results;
          - `docs/` for SLI/SLO, closeout ledger, and regression triage policy;
          - `ops/` for Prometheus alert rules and Grafana dashboards.
          EOF

      - name: Publish release review summary
        run: |
          {
            echo "## Core Runtime Release Review"
            echo "- Same gates as daily PR development passed before this bundle was assembled."
            echo "- SLO source of truth: \`policy-engine/docs/reference/operations/slo-error-budget.md\`"
            echo "- Closeout ledger: \`policy-engine/release/core-runtime-closeout.ledger.toml\`"
            echo "- Benchmark baseline: \`policy-engine/tests/performance/overhead_baseline.json\`"
            echo "- Alert rules: \`policy-engine/ops/observability/prometheus/slo_alerts.yml\`, \`policy-engine/ops/observability/prometheus/rules/runtime_operability_alerts.yml\`"
            echo "- Dashboards: \`policy-engine/ops/observability/grafana/dashboards/runtime-operability.json\`, \`policy-engine/ops/observability/grafana/dashboards/slo-overview.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release review bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-runtime-release-review
          path: policy-engine/release-review
          if-no-files-found: warn
          retention-days: 30
