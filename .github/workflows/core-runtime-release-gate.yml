name: Core Runtime Release Gate

on:
  pull_request:
    paths:
      - "policy-engine/src/polisyos/common/**"
      - "policy-engine/src/polisyos/core/**"
      - "policy-engine/src/polisyos/runtime/**"
      - "policy-engine/src/polisyos/scientist/**"
      - "policy-engine/src/polisyos/scholar/**"
      - "policy-engine/tests/unit/common/**"
      - "policy-engine/tests/unit/core/**"
      - "policy-engine/tests/unit/runtime/**"
      - "policy-engine/tests/unit/scientist/**"
      - "policy-engine/tests/unit/scholar/**"
      - "policy-engine/tests/performance/**"
      - "policy-engine/docs/reference/**"
      - "policy-engine/docs/runbooks/**"
      - "policy-engine/docs/explanation/**"
      - "policy-engine/ops/observability/prometheus/**"
      - "policy-engine/ops/observability/grafana/**"
      - "policy-engine/tools/devx/architecture/**"
      - "policy-engine/tools/quality/validation/**"
      - ".github/workflows/core-runtime-release-gate.yml"
  push:
    branches: [main, master]
    paths:
      - "policy-engine/src/polisyos/common/**"
      - "policy-engine/src/polisyos/core/**"
      - "policy-engine/src/polisyos/runtime/**"
      - "policy-engine/src/polisyos/scientist/**"
      - "policy-engine/src/polisyos/scholar/**"
      - "policy-engine/tests/unit/common/**"
      - "policy-engine/tests/unit/core/**"
      - "policy-engine/tests/unit/runtime/**"
      - "policy-engine/tests/unit/scientist/**"
      - "policy-engine/tests/unit/scholar/**"
      - "policy-engine/tests/performance/**"
      - "policy-engine/docs/reference/**"
      - "policy-engine/docs/runbooks/**"
      - "policy-engine/docs/explanation/**"
      - "policy-engine/ops/observability/prometheus/**"
      - "policy-engine/ops/observability/grafana/**"
      - "policy-engine/tools/devx/architecture/**"
      - "policy-engine/tools/quality/validation/**"
      - ".github/workflows/core-runtime-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAX_PLATFORM_NAME: cpu
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  typing-and-ratchets:
    name: Core Runtime / Typing and Ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.14"
          extras: "lint test runtime docs causal-discovery"

      - name: Run mypy strict gate
        run: uv run python tools/devx/workspace/core_runtime_mypy.py

      - name: Run basedpyright gate
        run: uv run --extra lint python tools/devx/workspace/core_runtime_basedpyright.py

      - name: Run expanded Ruff gate
        run: |
          uv run ruff check \
            src/polisyos/common/logger.py \
            src/polisyos/common/async_tools.py \
            src/polisyos/core/artifacts/ir_adapter.py \
            src/polisyos/runtime/http/errors.py \
            src/polisyos/runtime/http/container.py \
            src/polisyos/runtime/http/compliance.py \
            src/polisyos/runtime/http/dependencies.py \
            src/polisyos/runtime/http/cell_router_middleware.py \
            src/polisyos/runtime/http/jwt_auth_middleware.py \
            src/polisyos/runtime/http/resilience.py \
            src/polisyos/runtime/http/services/task_runner.py \
            src/polisyos/runtime/http/services/control_registry_providers.py \
