            tests/unit/core/security/test_identity.py \
            tests/unit/core/security/test_sbom.py \
            tests/unit/core/security/test_tee_middleware.py \
            tests/unit/core/phase0/test_run_context.py \
            tests/unit/core/phase0/test_audit_manifest_compat.py \
            tests/unit/core/phase0/test_decorators.py \
            tests/unit/core/test_llm_core.py \
            tests/unit/scientist/test_api.py \
