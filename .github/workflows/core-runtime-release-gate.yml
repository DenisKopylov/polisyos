            tests/unit/scientist/search/test_portfolio_search.py \
            tests/unit/scientist/test_informed_critic.py \
            tests/unit/scientist/llm/test_factory.py \
            tests/unit/scientist/workflows/test_builder_pinning.py \
            tests/unit/scholar/test_api_web_bootstrap.py \
            tests/unit/scholar/test_freshness.py \
            tests/unit/scholar/search/test_fetcher_security_cache.py \
