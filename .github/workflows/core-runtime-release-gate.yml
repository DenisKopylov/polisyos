            tests/unit/scholar/test_api_web_bootstrap.py \
            tests/unit/runtime/http/test_control_service_di.py \
            tools/quality/validation/check_ci_ratchets.py \
            tools/quality/validation/check_docs_accuracy.py \
            --select E,F,I,UP,S,PT,SIM,RUF,ANN,C4,TCH \
            --ignore E501,ANN401,S101,S603,S607

      - name: Run CI ratchet checks
        run: uv run python tools/quality/validation/check_ci_ratchets.py

      - name: Verify architecture guardrails
        run: uv run polisyos-tools architecture guardrails check

      - name: Verify public API docstring coverage
        run: |
          uv run python tools/quality/validation/check_docstring_quality.py \
            --repo-root . \
            --allowlist tools/quality/validation/docstring_quality_allowlist.txt \
            --coverage-scope public-surface \
            --minimum-coverage 99.5

      - name: Validate core-runtime closeout ledger
        run: |
          uv run python tools/devx/workspace/core_runtime_closeout.py \
            --summary _build/.tmp/core-runtime-closeout.md \
            --json-output _build/.tmp/core-runtime-closeout.json

  runtime-contracts:
    name: Core Runtime / Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Policy Engine Python
        uses: ./.github/actions/setup-policy-engine-python
        with:
          python-version: "3.11"
          extras: "test runtime causal-discovery security"

      - name: Run targeted runtime contract tests
        run: |
          mkdir -p _build/.tmp/test-reports
          uv run pytest -q \
            tests/unit/common/test_async_tools.py \
            tests/unit/core/artifacts/test_ir_adapter.py \
            tests/unit/core/artifacts/test_async_store.py \
