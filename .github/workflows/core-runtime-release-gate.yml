            tests/unit/scientist/engine/test_metrics_slo.py \
            tests/unit/scientist/compute/test_advanced_methods_c7.py \
            tests/unit/fabric/connectors/test_cache_system.py \
            tests/unit/fabric/connectors/test_integration.py \
            tests/unit/fabric/test_ingestion_providers.py \
            tests/unit/scientist/autotune/test_registry_and_runner.py \
            tests/unit/fabric/connectors/test_resilience.py \
            tests/unit/fabric/test_retrieval_service_catalog.py \
            tests/unit/scientist/engine/test_fan_out_async.py \
            tests/unit/scientist/engine/test_operational_monitoring.py \
            tests/unit/scientist/engine/test_retry.py \
            tests/unit/scientist/governance/test_validation_pipeline.py \
            tests/unit/scientist/test_llm_cycle_preflight.py \
            tests/unit/scientist/governance/test_validation_pipeline_observability.py \
