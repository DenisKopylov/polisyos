name: Frontend Quality (Archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archival-notice:
    name: Archived / Frontend quality legacy surface
    runs-on: ubuntu-latest
    steps:
      - name: Explain archival state
        run: |
          echo "This workflow is archival only."
          echo "Canonical paths now live in:"
          echo "  - .github/workflows/abi.yml (PR Fast)"
          echo "  - .github/workflows/ci.yml (PR Standard)"
          echo "  - .github/workflows/frontend-nightly.yml (Nightly Platform)"
