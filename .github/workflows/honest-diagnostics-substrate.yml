name: Honest Diagnostics Substrate

on:
  pull_request:
    paths:
      - "policy-engine/architecture/production_quality/**"
      - "policy-engine/schemas/runtime_quality/**"
      - "policy-engine/src/polisyos/runtime/quality/**"
      - "policy-engine/tests/unit/runtime/quality/**"
      - "policy-engine/tests/unit/tools/test_canary_evidence_authority.py"
      - "policy-engine/tests/repo_quality/tools/test_honest_diagnostics*.py"
      - "policy-engine/tests/repo_quality/tools/test_inventory_legacy_quality_evidence.py"
      - "policy-engine/tests/repo_quality/tools/test_production_invariant_registry.py"
      - "policy-engine/tools/quality/validation/**"
      - ".github/workflows/honest-diagnostics-substrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-pr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install source-build system headers
        # pillow is source-only in uv.lock and marker-pdf caps it below 11, so it is
        # compiled here. The build needs jpeg/zlib headers the runner does not ship.
        # Duplicated from .github/actions/setup-policy-engine-python because these two
        # workflows install uv directly instead of using that composite action.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev zlib1g-dev
      - name: Install Python
        run: uv python install
      - name: Runtime quality contracts
        run: uv run pytest tests/unit/runtime/quality -q
      - name: Registry and proof gates
        run: |
          uv run pytest tests/repo_quality/tools/test_production_invariant_registry.py -q
          uv run pytest tests/repo_quality/tools/test_honest_diagnostics_proof_harness.py -q
          uv run python tools/quality/validation/check_production_invariant_registry.py --repo-root .
          uv run python tools/quality/validation/check_honest_diagnostics_proof_harness.py --repo-root .
      - name: Anti-drift and coverage
        run: |
          uv run python tools/quality/validation/check_substrate_drift.py --repo-root .
          uv run python tools/quality/validation/build_honest_diagnostics_coverage.py --repo-root . --output-dir _build/honest-diagnostics/rebaseline/wave-1 --wave wave-1 --require-targets
