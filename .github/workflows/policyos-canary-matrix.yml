name: PolicyOS Canary Matrix

on:
  pull_request:
    paths:
      - "policy-engine/src/polisyos/**"
      - "policy-engine/tools/ops_runners/runtime/**"
      - "policy-engine/tools/ops_runners/experiments/**"
      - "policy-engine/tests/repo_quality/tools/test_canary_matrix.py"
      - ".github/workflows/policyos-canary-matrix.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "policy-engine/src/polisyos/**"
      - "policy-engine/tools/ops_runners/runtime/**"
      - "policy-engine/tools/ops_runners/experiments/**"
      - ".github/workflows/policyos-canary-matrix.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      live_provider:
        description: "Run quarantined live-provider lane when credentials are configured"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  deterministic-canary-matrix:
    name: Deterministic Canary Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install source-build system headers
        # pillow is source-only in uv.lock and marker-pdf caps it below 11, so it is
        # compiled here. The build needs jpeg/zlib headers the runner does not ship.
        # Duplicated from .github/actions/setup-policy-engine-python because these two
        # workflows install uv directly instead of using that composite action.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev zlib1g-dev
      - name: Run deterministic canary matrix
        run: >
          uv run python tools/ops_runners/runtime/run_canary_matrix.py --deterministic
          --json-output _build/.tmp/production-quality/canary_matrix_result.json

      - name: Upload deterministic canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deterministic-canary-matrix
          path: |
            policy-engine/_build/.tmp/production-quality/canary_matrix_result.json
            policy-engine/_build/.tmp/canary-matrix/**
            policy-engine/.polisyos/canary_evidence/**
          if-no-files-found: ignore

  live-provider-canary:
    name: Quarantined Live-Provider Canary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event.inputs.live_provider == 'true'
    defaults:
      run:
        working-directory: policy-engine
    env:
      POLISYOS_LLM_GATEWAY_API_KEY: ${{ secrets.POLISYOS_LLM_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install source-build system headers
        # pillow is source-only in uv.lock and marker-pdf caps it below 11, so it is
        # compiled here. The build needs jpeg/zlib headers the runner does not ship.
        # Duplicated from .github/actions/setup-policy-engine-python because these two
        # workflows install uv directly instead of using that composite action.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev zlib1g-dev
      - name: Skip when live-provider credentials are absent
        if: env.POLISYOS_LLM_GATEWAY_API_KEY == ''
        run: echo "POLISYOS_LLM_GATEWAY_API_KEY is not configured; skipping quarantined lane."

      - name: Run quarantined live-provider lane
        if: env.POLISYOS_LLM_GATEWAY_API_KEY != ''
        run: >
          uv run python tools/ops_runners/runtime/run_canary_matrix.py
          --lane-id profile-production__provider-live_gonka_proxy__data-canonical_production__scenario-public_golden__ui-api_only
          --allow-live-provider
          --json-output _build/.tmp/production-quality/canary_matrix_live_result.json

      - name: Upload live-provider canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-provider-canary-matrix
          path: |
            policy-engine/_build/.tmp/production-quality/canary_matrix_live_result.json
            policy-engine/_build/.tmp/canary-matrix/**
            policy-engine/.polisyos/canary_evidence/**
          if-no-files-found: ignore
