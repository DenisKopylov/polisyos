name: Architecture Freeze

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  collect-metrics:
    name: Collect Freeze Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,test]"

      - name: Connector hardening lint
        run: |
          python3 tools/lint/lint_connector_hardening.py

      - name: Collect architecture snapshot
        run: |
          mkdir -p .arch-freeze/current
          python3 tools/lint/collect_arch_metrics.py \
            --repo-root . \
            --output-dir .arch-freeze/current \
            --summary-path .arch-freeze/current/summary.json \
            --print-summary

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-freeze-metrics
          path: |
            .arch-freeze/current/import_gate.txt
            .arch-freeze/current/test_collect.txt
            .arch-freeze/current/compileall.txt
            .arch-freeze/current/ruff_stats.txt
            .arch-freeze/current/stale_sources_missing_paths.txt
            .arch-freeze/current/summary.json

  compare:
    name: Compare Against Baseline
    needs: collect-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download metrics artifact
        uses: actions/download-artifact@v4
        with:
          name: arch-freeze-metrics
          path: .arch-freeze/current

      - name: Freeze dry-run status
        run: |
          python3 tools/lint/compare_baseline.py \
            --baseline baseline/summary.json \
            --current .arch-freeze/current/summary.json \
            --mode dry-run \
            --exceptions import_exceptions.toml \
            --exceptions-registry import_exceptions_registry.md \
            --debt-register import_debt_register.csv \
            --baseline-import-gate baseline/import_gate.txt \
            --current-import-gate .arch-freeze/current/import_gate.txt \
            --max-expiry-days 90 \
            --report-json .arch-freeze/current/compare_dry_run.json

      - name: Freeze blocking gate
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/lint/compare_baseline.py \
            --baseline baseline/summary.json \
            --current .arch-freeze/current/summary.json \
            --mode blocking \
            --exceptions import_exceptions.toml \
            --exceptions-registry import_exceptions_registry.md \
            --debt-register import_debt_register.csv \
            --baseline-import-gate baseline/import_gate.txt \
            --current-import-gate .arch-freeze/current/import_gate.txt \
            --max-expiry-days 90 \
            --report-json .arch-freeze/current/compare_blocking.json

      - name: Upload compare reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-freeze-compare
          path: |
            .arch-freeze/current/compare_dry_run.json
            .arch-freeze/current/compare_blocking.json
