name: Architecture Import Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  import-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,test]"
      - name: Run import gate
        run: python tools/lint_imports.py --policy import_policy.toml --exceptions import_exceptions.toml
      - name: Verify ABI schema snapshots
        run: python3 tools/gen_schema.py --check
