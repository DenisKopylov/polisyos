name: Architecture Import Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  import-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,test]"
      - name: Run import gate
        run: python tools/lint_imports.py --policy import_policy.toml --exceptions import_exceptions.toml
      - name: Run Foundry backend lint policy
        run: python tools/lint_foundry.py --repo-root .
      - name: Check Scientist state_reads contract
        run: python tools/check_state_reads.py
      - name: Require Scientist node version bumps
        run: python tools/check_scientist_node_version_bump.py
      - name: Verify Scholar storage boundary
        run: python tools/lint/check_scholar_imports.py
      - name: Verify connector contracts
        run: python tools/connectors/check_contracts.py --check
      - name: Verify ABI schema snapshots
        run: python3 tools/gen_schema.py --check
