name: Causal Phase Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "policy-engine/src/polisyos/foundry/methods/catalog/causal/**"
      - "policy-engine/src/polisyos/ir/analytics/**"
      - "policy-engine/src/polisyos/scientist/**"
      - "policy-engine/tests/foundry/methods/catalog/causal/**"
      - "policy-engine/tests/ir/analytics/**"
      - "policy-engine/tests/scientist/**"
      - "policy-engine/install.sh"
      - "policy-engine/pyproject.toml"
      - "policy-engine/tools/quality/validation/**"
      - "policy-engine/tools/validation/run_causal_phase_validation.sh"
      - "policy-engine/.github/workflows/causal-phases.yml"
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  causal-phase-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: policy-engine/pyproject.toml

      - name: Install dependencies
        working-directory: policy-engine
        run: pip install -e ".[dev,test,runtime-http,causal-discovery]"

      - name: Run causal phase validation
        working-directory: policy-engine
        run: bash tools/validation/run_causal_phase_validation.sh "$RUNNER_TEMP/causal-phase-validation"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-phase-validation
          path: ${{ runner.temp }}/causal-phase-validation
