name: Documentation

on:
  pull_request:

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install uv
      - run: uv sync --frozen --extra docs --extra runtime --extra ml
      - run: uv run polisyos-tools validation check-docs-gate --repo-root . --base-ref ${{ github.event.pull_request.base.sha }}
      - run: uv run python tools/quality/validation/fabric_best_in_class_inventory.py --check
      - run: uv run python tools/quality/validation/fabric_source_contracts.py --check --fail-closed
      - run: uv run python tools/quality/validation/fabric_processing_guarantees.py --check
      - run: uv run python tools/quality/validation/fabric_discovery_intelligence.py --check
      - run: uv run python tools/quality/validation/fabric_product_integration.py --check
      - run: uv run python tools/design/adr_lint.py

  markdownlint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install uv
      - run: uv sync --frozen --extra lint
      - run: uv run polisyos-tools workspace docs-style

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "policy-engine/docs/ policy-engine/README.md policy-engine/CONTRIBUTING.md --exclude-path policy-engine/docs/archive"
