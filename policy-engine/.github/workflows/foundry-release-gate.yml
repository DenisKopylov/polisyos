name: Foundry Release Gate

on:
  pull_request:
    paths:
      - "src/polisyos/foundry/**"
      - "src/polisyos/ukraine_data/**"
      - "tests/foundry/**"
      - "tests/ukraine_data/test_builders.py"
      - "docs/reference/foundry/**"
      - "tools/ci/check_foundry_domain_coverage.py"
      - ".github/workflows/foundry-release-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/polisyos/foundry/**"
      - "src/polisyos/ukraine_data/**"
      - "tests/foundry/**"
      - "tests/ukraine_data/test_builders.py"
      - "docs/reference/foundry/**"
      - "tools/ci/check_foundry_domain_coverage.py"
      - ".github/workflows/foundry-release-gate.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  JAX_PLATFORM_NAME: cpu
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  correctness-and-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen --extra test --extra methods-full --extra hotreload

      - name: Run Foundry correctness release gate
        run: |
          uv run pytest -q \
            tests/foundry/test_release_gate.py \
            tests/foundry/test_frontier_namespace_hygiene.py \
            tests/foundry/test_fidelity_tiers.py \
            tests/foundry/test_skip_marker_audit.py \
            tests/foundry/golden/test_golden_regression.py \
            tests/foundry/test_trinity_field_coverage.py \
            tests/foundry/compile/test_lowering.py \
            tests/foundry/test_executor_fail_semantics.py \
            tests/foundry/test_executor_private_modules.py \
            tests/foundry/test_executor_snapshots.py \
            tests/foundry/test_merge_engine_regressions.py \
            tests/foundry/test_loss_numeric.py \
            tests/foundry/test_treasury.py \
            tests/foundry/test_labor.py \
            tests/foundry/test_method_contracts.py \
            tests/foundry/test_catalog_snapshot.py \
            tests/foundry/agent_sim/test_graph_mechanisms.py \
            tests/foundry/agent_sim/test_actor_critic_numerics.py \
            tests/foundry/agent_sim/test_jit_compatibility.py \
            tests/foundry/methods/backends/test_checkpointing.py \
            tests/foundry/methods/backends/test_backends.py \
            tests/foundry/methods/test_foundry_purity.py \
            tests/foundry/methods/catalog/policy/test_frontier.py \
            tests/foundry/methods/catalog/causal/test_frontier_methods.py \
            tests/foundry/methods/catalog/ml/test_frontier.py \
            tests/foundry/methods/test_cache.py \
            tests/foundry/methods/test_hot_reload_safety.py \
            tests/foundry/methods/test_selection_v2.py \
            tests/foundry/methods/test_cli.py \
            tests/foundry/methods/test_selection_advisor.py
          uv run pytest -q \
            tests/foundry/methods/catalog/bayesian/test_methods.py \
            -k "fail_closed or bart or ep_svgd_flow_and_factor_graph_frontier_methods_run"

      - name: Publish capability matrix artifact
        run: uv run polisyos-foundry capabilities --json > foundry-capability-matrix.json

      - name: Publish operator evidence artifact
        run: uv run polisyos-foundry evidence --json > foundry-operator-evidence.json

      - name: Run bundle-backed release acceptance evidence
        run: |
          uv run pytest -q \
            tests/ukraine_data/test_builders.py \
            -k release_acceptance_roundtrip \
            --junitxml=foundry-release-acceptance.xml

      - name: Upload capability matrix
        uses: actions/upload-artifact@v4
        with:
          name: foundry-capability-matrix
          path: foundry-capability-matrix.json
          retention-days: 30

      - name: Upload operator evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundry-operator-evidence
          path: foundry-operator-evidence.json
          retention-days: 30

      - name: Upload release acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundry-release-acceptance
          path: foundry-release-acceptance.xml
          retention-days: 30

  domain-coverage-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen --extra test --extra methods-full --extra hotreload

      - name: Install coverage
        run: uv run python -m pip install "coverage[toml]>=7.4"

      - name: Run domain coverage sample
        run: |
          uv run coverage run --source=src/polisyos/foundry -m pytest -q \
            tests/foundry/test_executor_private_modules.py \
            tests/foundry/test_executor_snapshots.py \
            tests/foundry/test_merge_engine_regressions.py \
            tests/foundry/test_fiscal.py \
            tests/foundry/test_labor.py \
            tests/foundry/test_treasury.py \
            tests/foundry/test_public_modules.py \
            tests/foundry/methods/catalog/policy/test_frontier.py \
            tests/foundry/methods/catalog/causal/test_frontier_methods.py \
            tests/foundry/methods/catalog/bayesian \
            tests/foundry/methods/catalog/ml \
            tests/foundry/methods/catalog/spatial
          uv run coverage json -o foundry-coverage.json
          uv run python tools/ci/check_foundry_domain_coverage.py \
            --coverage-json foundry-coverage.json \
            --repo-root .

      - name: Upload Foundry coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: foundry-domain-coverage
          path: foundry-coverage.json
          retention-days: 30

  performance-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen --extra test --extra methods-full

      - name: Run Foundry release benchmarks
        run: |
          uv run pytest tests/foundry/benchmarks \
            --benchmark-only \
            --benchmark-json=foundry-benchmarks.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=5 \
            -q

      - name: Upload Foundry benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: foundry-benchmark-results
          path: foundry-benchmarks.json
          retention-days: 30

  scheduled-numerical-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen --extra test --extra methods-full

      - name: Run cross-platform numerical goldens
        run: |
          uv run pytest -q \
            tests/foundry/test_release_gate.py \
            tests/foundry/golden/test_golden_regression.py \
            tests/foundry/test_loss_numeric.py \
            tests/foundry/agent_sim/test_actor_critic_numerics.py \
            tests/foundry/agent_sim/test_jit_compatibility.py \
            --junitxml=foundry-numerical-matrix.xml

      - name: Upload cross-platform numerical matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundry-numerical-matrix-${{ matrix.os }}-py${{ matrix.python-version }}
          path: foundry-numerical-matrix.xml
          retention-days: 30
