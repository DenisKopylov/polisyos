repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000'] # 10MB лимит

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: arch-imports
        name: arch imports (layer boundaries)
        entry: python3 tools/lint/lint_imports.py --policy import_policy.toml --exceptions import_exceptions.toml
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
      - id: mypy
        name: mypy (static type check)
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        # Исключаем папку tests из строгой проверки типов, если там много магии pytest
        exclude: ^tests/
      - id: abi-schema-check
        name: abi schema snapshots
        entry: python3 tools/diagnostics/gen_schema.py --check
        language: system
        files: '^src/polisyos/(ir|fabric/world|core/canon|core/artifacts)/.*\.py$'
        pass_filenames: false
        require_serial: true
