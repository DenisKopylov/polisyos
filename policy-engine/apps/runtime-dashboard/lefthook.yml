no_auto_install: true

pre-commit:
  fail_on_changes: always
  parallel: true
  commands:
    prettier:
      root: "policy-engine/apps/runtime-dashboard/"
      glob: "*.{css,js,json,md,mjs,ts,tsx,yaml,yml}"
      run: corepack pnpm exec prettier --write --ignore-unknown {staged_files}
    eslint:
      root: "policy-engine/apps/runtime-dashboard/"
      glob: "*.{js,mjs,ts,tsx}"
      run: corepack pnpm exec eslint --fix {staged_files}
    check-contrast:
      root: "policy-engine/apps/runtime-dashboard/"
      run: node --experimental-strip-types ../../tools/design/check-contrast.ts
    check-reduced-motion:
      root: "policy-engine/apps/runtime-dashboard/"
      run: node --experimental-strip-types ../../tools/design/check-reduced-motion.ts

pre-push:
  commands:
    typecheck:
      root: "policy-engine/apps/runtime-dashboard/"
      run: corepack pnpm run typecheck

# The unit suite deliberately does NOT run on pre-push. It ran here in a
# configuration CI never uses - default parallel workers against CI's
# --maxWorkers=1 - and refused pushes on CPU contention rather than on
# defects: 14 failures locally against the same nine files passing 177/177
# under CI's flags. A gate that refuses falsely teaches people to bypass it,
# and it was bypassed three times in one day for measurably correct reasons.
# CI runs the same suite in its own frontend-unit-coverage job, which has no
# needs on lint, formatting or architecture, so removing it here loses no
# watcher. typecheck stays: fast, deterministic and station-independent.
