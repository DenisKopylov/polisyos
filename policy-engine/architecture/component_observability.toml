[component_observability]
version = 2
status = "report_only"
owner = "team-observability"
phase = "repository-best-in-class-phase-4.9"
default_gate_mode = "report_only"
description = "Observability expectations for package-level components."
ops_organization_decision = "invert_to_ops_components"
component_bundle_root = "ops/components"
release_gate_policy = "public-stable components need SLO coverage, Prometheus rule ownership, dashboard coverage, trace/log context keys, and a release gate or explicit owner-approved exception"

[[component_contract]]
component = "common"
owner = "team-core"
slo_file = "ops/components/common/slo.yaml"
slo_status = "exception"
prometheus_rules = []
grafana_dashboard = "ops/observability/grafana/dashboards/slo-overview.json"
trace_context_keys = ["service.name", "deployment.environment", "package.name"]
log_context_keys = ["package_name", "dependency_group"]
release_gate = "Common is covered by dependent component SLOs until it exposes standalone runtime traffic"
exception_reason = "Common is a helper facade without standalone user-visible operations; reliability is covered by dependent component SLOs until it exposes runtime traffic"
exception_expires = "2026-08-01"
exception_issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-63---operability-release-and-supply-chain-gate-conversion"

[[component]]
id = "fabric-connectors"
package = "fabric"
owner = "team-fabric"
contract = "architecture/packages/fabric.toml"
slo_files = ["ops/observability/slo/fabric.yaml"]
metrics = ["connector_requests_total", "connector_failures_total", "connector_freshness_seconds"]
logs = ["source_id", "connector_id", "tenant_id", "failure_class"]
traces = ["source_id", "artifact_ref", "data_plane_mode"]
mode = "report_only"

[[component]]
id = "foundry-method-dispatch"
package = "foundry"
owner = "team-foundry"
contract = "architecture/packages/foundry.toml"
slo_files = ["ops/observability/slo/foundry.yaml"]
metrics = ["method_dispatch_total", "method_failure_total", "method_duration_seconds"]
logs = ["method_id", "backend", "determinism_tier", "artifact_ref"]
traces = ["method_id", "seed_manifest", "runtime_backend"]
mode = "report_only"

[[component]]
id = "scientist-workflow-engine"
package = "scientist"
owner = "team-scientist"
contract = "architecture/packages/scientist.toml"
slo_files = ["ops/observability/slo/scientist.yaml"]
metrics = ["workflow_runs_total", "workflow_failures_total", "node_duration_seconds"]
logs = ["workflow_id", "node_id", "run_id", "failure_class"]
traces = ["workflow_id", "node_id", "artifact_ref", "replay_id"]
mode = "report_only"

[[component]]
id = "runtime-control-plane"
package = "runtime"
owner = "team-runtime"
contract = "ops/runtime/runtime-contracts.toml"
slo_files = ["ops/observability/slo/runtime.yaml"]
metrics = ["runtime_api_requests_total", "runtime_api_errors_total", "control_plane_job_admissions_total"]
logs = ["route", "tenant_id", "run_id", "status_code"]
traces = ["route", "run_id", "job_id"]
mode = "report_only"

[[component_contract]]
component = "core"
owner = "team-core"
slo_file = "ops/components/core/slo.yaml"
slo_status = "present"
prometheus_rules = [
  "ops/observability/prometheus/rules/audit_chain_alerts.yml",
  "ops/observability/prometheus/rules/runtime_operability_alerts.yml",
]
grafana_dashboard = "ops/observability/grafana/dashboards/executive-overview.json"
trace_context_keys = ["service.name", "deployment.environment", "tenant.id", "artifact.ref", "audit.chain_id"]
log_context_keys = ["request_id", "tenant_id", "artifact_ref", "audit_chain_id", "severity"]
release_gate = "Core artifact integrity, audit, and tenant-boundary SLOs remain report-only until Phase 6.3 fail-closed conversion"

[[component_contract]]
component = "runtime"
owner = "team-runtime"
slo_file = "ops/components/runtime/slo.yaml"
slo_status = "present"
prometheus_rules = [
  "ops/observability/prometheus/slo_alerts.yml",
  "ops/observability/prometheus/rules/runtime_operability_alerts.yml",
]
grafana_dashboard = "ops/observability/grafana/dashboards/runtime-operability.json"
trace_context_keys = ["service.name", "deployment.environment", "http.route", "tenant.id", "run.id"]
log_context_keys = ["request_id", "tenant_id", "route", "run_id", "decision_id"]
release_gate = "runtime API SLO and OpenAPI contract checks must pass before promotion"

[[component_contract]]
component = "scientist"
