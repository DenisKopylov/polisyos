grafana_dashboard = "ops/observability/grafana/dashboards/scientist-agents.json"
trace_context_keys = ["service.name", "deployment.environment", "run.id", "workflow.id", "node.id", "decision.id"]
log_context_keys = ["run_id", "workflow_id", "node_id", "decision_id", "provider_id"]
