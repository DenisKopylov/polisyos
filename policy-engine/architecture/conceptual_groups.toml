[conceptual_groups]
version = 1
status = "report_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-1.3"
physical_move_required = false
description = "Conceptual grouping for architecture/** during Phase 1.3. Existing legacy files stay in place until gates switch to generated aggregates."

[[group]]
id = "packages"
owner = "team-architecture"
primary_paths = ["architecture/packages/*.toml"]
legacy_paths = [
  "architecture/packages/boundaries.toml",
  "architecture/packages/layout.toml",
  "architecture/public_surface/contract.toml",
  "architecture/tests/topology.toml",
]
notes = "Per-package contract files are the primary edit point for new package architecture."

[[group]]
id = "imports"
owner = "team-architecture"
primary_paths = [
  "architecture/imports/policy.toml",
  "architecture/imports/exceptions.toml",
  "architecture/imports/reports.toml",
  "architecture/imports/contracts.toml",
  "architecture/imports/dynamic.toml",
]
legacy_paths = ["architecture/baselines/imports/deep_import.json"]
notes = "Import boundary, dependency graph, lazy import, and dynamic import reports."

[[group]]
id = "public_surface"
owner = "team-architecture"
primary_paths = [
  "architecture/public_surface/contract.toml",
  "architecture/public_surface/inventory.json",
  "architecture/public_surface/",
]
legacy_paths = []
notes = "Public facade classification and generated inventory remain legacy aggregates until package contracts become the source gate."

[[group]]
id = "exceptions"
owner = "team-architecture"
primary_paths = [
  "architecture/exceptions/",
  "architecture/exceptions/guardrails.toml",
  "architecture/exceptions/complexity.toml",
  "architecture/tooling/static_analysis_overrides.toml",
]
legacy_paths = ["architecture/imports/exceptions.toml"]
notes = "Time-boxed exceptions, override ledgers, and ratchet exemptions."

[[group]]
id = "policies"
owner = "team-architecture"
primary_paths = [
  "architecture/policies/",
  "architecture/policies/directory_contracts.toml",
  "architecture/module_size_budget.toml",
  "architecture/extension_points.toml",
  "architecture/runtime_state_layout.toml",
  "architecture/tests/ratchets.toml",
]
legacy_paths = [
  "architecture/policies/data.toml",
  "architecture/local_runtime_state.toml",
  "architecture/frontend_workspaces.toml",
]
notes = "Policy-level contracts that do not map to one package."

[[group]]
id = "gates"
owner = "team-architecture"
primary_paths = [
  "architecture/gates/report_only.toml",
  "architecture/gates/repository_sota.toml",
  "architecture/gates/structure_remediation.toml",
]
legacy_paths = []
notes = "Fail-closed gates stay in existing registries; Phase 1.3 gates are report-only first."

[[group]]
id = "baselines"
owner = "team-architecture"
primary_paths = [
  "architecture/baselines/",
  "architecture/baselines/imports/deep_import.json",
]
legacy_paths = []
notes = "Generated and manually approved baselines remain committed or local according to their family contracts."

