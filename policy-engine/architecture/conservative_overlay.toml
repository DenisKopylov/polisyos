forbidden_actions = ["move", "rename", "wrapper_removal", "wrapper_tightening"]

[[protected_surface]]
path = "data/data_lex/**"
owner = "local"
reason = "Historical local Lex input workspace protection from the completed run period."
allowed_actions = ["read_only_inventory", "copy_to_isolated_fixture"]
forbidden_actions = ["move", "rename", "delete", "rewrite", "normalize"]

[[protected_surface]]
path = "data/lex_knowledge/**"
owner = "local"
reason = "Historical local Lex output workspace protection from the completed run period."
allowed_actions = ["read_only_inventory", "copy_to_isolated_fixture"]
forbidden_actions = ["move", "rename", "delete", "rewrite", "normalize"]

