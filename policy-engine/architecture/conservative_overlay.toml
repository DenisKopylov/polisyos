[conservative_overlay]
version = 1
status = "closed"
owner = "team-polisyos"
starts_on = "2026-04-24"
source_plan = "docs/plans/accepted/REPOSITORY_SOTA_PLAN.md"
data_forge_plan = "docs/plans/active/DATA_FORGE_CONSOLIDATION_PLAN.md"
mode = "report_only_for_protected_surfaces"
description = """
Closed historical execution overlay for Repository SOTA implementation while
the Lex NPA corpus cloud run was active. This file remains as evidence only and
is no longer an active execution constraint.
"""

[end_gate]
gate_id = "lex-production-run-cutover-readiness"
owner = "team-data-forge"
event_gated = false
required_evidence = [
  "Superseded by Repository SOTA Phase 0 contract normalization on 2026-05-02.",
]

[[protected_surface]]
path = "tools/ops/cloud/**"
owner = "team-ops"
reason = "Historical protected surface from the completed Lex cloud-run period."
allowed_actions = ["read_only_inventory", "narrow_hotfix_preserve_semantics"]
forbidden_actions = ["move", "rename", "wrapper_removal", "runner_import_rewrite", "deploy_asset_move"]

[[protected_surface]]
path = "tools/ops/cloud/**"
owner = "team-ops"
reason = "Historical compatibility protection from the completed Lex cloud-run period."
allowed_actions = ["read_only_inventory", "narrow_hotfix_preserve_semantics"]
forbidden_actions = ["move", "rename", "wrapper_removal", "wrapper_tightening"]

[[protected_surface]]
path = "tools/ops/ukraine_data/pre_shard_lex_corpus.py"
owner = "team-data-forge"
reason = "Historical pre-sharding protection from the completed Lex cloud-run period."
allowed_actions = ["read_only_inventory", "narrow_hotfix_preserve_semantics"]
forbidden_actions = ["move", "rename", "manifest_schema_change", "shard_assignment_change"]

[[protected_surface]]
path = "tools/ops/ukraine_data/pre_shard_lex_corpus.py"
owner = "team-data-forge"
reason = "Historical pre-sharding wrapper protection from the completed Lex cloud-run period."
