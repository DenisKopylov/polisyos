personal_repo_exception_reason = "GitHub team slugs are not provisioned in the current personal repository; logical owners map to @DenisKopylov until organization teams exist."
target_codeowners_patterns = [
  "/.github/**",
  "/.github/CODEOWNERS",
  "/.github/repository-rulesets/**",
  "/.github/workflows/**",
  "/policy-engine/ops/**",
