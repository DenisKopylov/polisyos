[control_plane_supply_chain]
version = 1
status = "active_contract"
mode = "phase5_9_supply_chain_closeout"
phase = "repository-best-in-class-phases-1.7-2.8-5.9"
owner = "team-security"
backup_owner = "team-security"
description = "Active control-plane, CODEOWNERS, CI identity, dependency-update, and release supply-chain contract for the split-root repository topology."
validation_command = "uv run python tools/quality/validation/control_plane_supply_chain_contracts.py"

[root_topology]
product_root = "policy-engine"
repository_control_plane_root = "."
root_decision = "policy-engine is the effective product root; the outer Git root is reserved for GitHub-native control plane and Git-wide metadata."
codeowners_source = ".github/CODEOWNERS"
ruleset_source = ".github/repository-rulesets/main.yml"
wave2_cleanup_phase = "2.8"

[renovate]
current_path = ".github/renovate.json"
target_path = ".github/renovate.json"
preferred_target = ".github/renovate.json"
fallback_policy = "archived root-level fallback was retired on 2026-05-07 after config-location validation; reintroducing renovate.json requires a new ADR and fail-closed control-plane update."
move_gate = "Renovate config is canonical at .github/renovate.json; packageRules matchFileNames must resolve to tracked workspace manifests."

[codeowners_gate]
mode = "fail_closed"
enforced_since_phase = "2.8"
current_enforced_reviewer = "@DenisKopylov"
personal_repo_exception = true
personal_repo_exception_expires = "2026-12-31"
personal_repo_exception_issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
personal_repo_exception_reason = "GitHub team slugs are not provisioned in the current personal repository; logical owners map to the current repository owner until organization teams exist."
owner_source_order = [
  "architecture/packages/*.toml",
  "architecture/packages/boundaries.toml",
  "architecture/packages/layout.toml",
  "architecture/public_surface/contract.toml",
  "docs/reference/ownership.md",
]
required_public_surface_classifications = ["public_stable"]
target_policy = "Every active package owner and every public_stable package has an explicit logical owner mapping and a target CODEOWNERS pattern or a personal-repo exception."

[[owner_mapping]]
owner = "team-platform"
logical_owner_group = "@platform-owners"
current_reviewers = ["@DenisKopylov"]
personal_repo_exception = true
personal_repo_exception_expires = "2026-12-31"
