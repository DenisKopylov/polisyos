[[ruleset_tier]]
id = "required-review"
owner = "team-platform"
target = "main"
requirements = [
  "require pull request before merge",
  "require at least one approval",
  "dismiss stale approvals on push",
  "require approval of the most recent push",
  "require conversation resolution",
]
current_evidence = ".github/repository-rulesets/main.yml"

[[ruleset_tier]]
id = "code-owner-review"
owner = "team-platform"
target = "main"
requirements = [
  "require code-owner review",
  "CODEOWNERS self-protects .github/**, CODEOWNERS, rulesets, workflows, and security config",
]
current_evidence = ".github/repository-rulesets/main.yml"

[[ruleset_tier]]
id = "fast-pr-checks"
owner = "team-platform"
target = "main"
required_status_checks = ["Fast PR / Gate", "Standard PR / Gate"]
current_evidence = ".github/repository-rulesets/main.yml"

[[ruleset_tier]]
id = "release-gate-checks"
owner = "team-release"
target = "release tags and release-critical changes"
required_workflows = [
  ".github/workflows/core-runtime-release-gate.yml",
  ".github/workflows/release.yml",
]
required_jobs = [
  "Release / Operability and promotion gates",
  "Release / SBOM and vulnerability gate",
  "Release / Canary",
  "Release / Sign artifacts",
  "Release / Attest artifacts",
]

[[ruleset_tier]]
id = "protected-branch-restrictions"
owner = "team-platform"
target = "main"
requirements = [
  "block force-push on protected default branch",
  "block branch deletion on protected default branch",
  "treat ruleset application proof as GitHub-side evidence, not repository file evidence",
]
target_evidence = "GitHub ruleset export or screenshot linked from a release/platform acceptance report"

[ci_permissions]
default_top_level_permissions = "contents: read"
top_level_write_permissions_forbidden = true
job_scope_write_permissions_only = true
id_token_policy = "id-token: write is allowed only on jobs that use OIDC-backed publish, Pages, Sigstore/cosign, or GitHub attestations."
long_lived_cloud_secret_policy = "Long-lived cloud provider secrets are forbidden where OIDC, workload identity, or managed identity is supported."
workflow_policy_gate = "uv run python tools/quality/ci/check_workflow_policy.py --repo-root .."
allowed_long_lived_secret_families = [
  "SENTRY_* for non-cloud error-reporting publication in conditional main/push CI paths",
]

[[workflow_write_permission]]
workflow = ".github/workflows/docs-pages.yml"
job = "deploy"
purpose = "GitHub Pages deployment"
permissions = ["pages: write", "id-token: write"]

[[workflow_write_permission]]
workflow = ".github/workflows/release.yml"
job = "sign-artifacts"
purpose = "Sigstore/cosign keyless release artifact signing"
permissions = ["id-token: write"]

[[workflow_write_permission]]
workflow = ".github/workflows/release.yml"
job = "attest-artifacts"
purpose = "GitHub release artifact and supply-chain evidence attestations"
permissions = ["attestations: write", "id-token: write"]

[[workflow_write_permission]]
workflow = ".github/workflows/release.yml"
job = "publish-release"
purpose = "Create the immutable GitHub release and upload release artifacts"
permissions = ["contents: write"]

[[workflow_write_permission]]
workflow = ".github/workflows/frontend-nightly.yml"
job = "scorecard"
purpose = "Upload OpenSSF Scorecard SARIF to GitHub code scanning"
permissions = ["security-events: write"]

[[oidc_job]]
workflow = ".github/workflows/docs-pages.yml"
job = "deploy"
purpose = "GitHub Pages deployment"
permissions = ["pages: write", "id-token: write"]

[[oidc_job]]
workflow = ".github/workflows/release.yml"
job = "sign-artifacts"
purpose = "Sigstore/cosign keyless artifact signing"
permissions = ["id-token: write"]

[[oidc_job]]
workflow = ".github/workflows/release.yml"
job = "attest-artifacts"
purpose = "GitHub artifact provenance attestations"
permissions = ["attestations: write", "id-token: write"]

[[security_secret_policy]]
id = "cloud-identity"
owner = "team-security"
policy = "Prefer OIDC/workload identity/managed identity for cloud deployment and registry publication. Static cloud keys require an owner-approved exception with rotation and sunset."

[[security_secret_policy]]
id = "local-offline-signing"
owner = "team-security"
policy = "Local/offline signing keys may be documented for break-glass or development workflows, but release.yml must use keyless signing when publishing official release artifacts."

[[release_phase_gate]]
phase = "pull_request"
owner = "team-platform"
checks = [
  "Fast PR / Gate",
  "Standard PR / Gate",
  "workflow policy gate",
]
scan_gates = [
  "workflow policy gate",
  "standard PR dependency-sensitive checks when lockfiles or release workflows change",
]
dependency_scan_policy = "Dependency/security scan evidence may be scheduled or path-triggered unless lockfiles or release workflows change."

[[release_phase_gate]]
phase = "dependency_lock_change"
owner = "team-security"
checks = [
  "OSV or equivalent dependency vulnerability scan",
  "SBOM refresh or explicit release-sbom non-commit evidence",
  "dependency update grouping follows .github/renovate.json",
]
trigger_paths = [
  ".github/renovate.json",
  "policy-engine/uv.lock",
  "policy-engine/pnpm-lock.yaml",
]
scan_gates = [
  "OSV or equivalent dependency vulnerability scan",
  "repository or release-candidate SBOM generation",
  "Grype or equivalent vulnerability policy evaluation",
]
sbom_required = true
generated_artifact_family = "release-sbom"

[[release_phase_gate]]
phase = "release_candidate"
owner = "team-release"
checks = [
  "operability release gate",
  "release immutability check",
  "artifact size policy",
  "release SBOM generation",
  "vulnerability scan and policy evaluation",
  "release canary",
  "keyless signing",
  "build provenance attestation",
]
trigger_paths = [
  "v* tags",
  "workflow_dispatch tag input",
  "policy-engine/release/**",
  "policy-engine/release-fragments/**",
]
scan_gates = [
  "release SBOM generation",
  "Grype vulnerability scan from generated SBOM",
  "CVE exception policy evaluation",
  "release canary before signing/publishing",
]
sbom_required = true
provenance_required = true
signed_artifacts_required = true
generated_artifact_family = "release-sbom"

[[release_artifact_contract]]
artifact_type = "python-wheel"
patterns = ["policy_engine-*.whl"]
owner = "team-release"
sbom_required = true
provenance_target = "GitHub build provenance attestation"
signing_target = "cosign keyless sign-blob where release tooling supports it"
evidence_workflow = ".github/workflows/release.yml"
generated_artifact_family = "release-sbom"

[[release_artifact_contract]]
artifact_type = "python-sdist"
patterns = ["policy_engine-*.tar.gz"]
owner = "team-release"
sbom_required = true
provenance_target = "GitHub build provenance attestation"
signing_target = "cosign keyless sign-blob where release tooling supports it"
evidence_workflow = ".github/workflows/release.yml"
generated_artifact_family = "release-sbom"

[[release_artifact_contract]]
artifact_type = "runtime-dashboard-bundle"
patterns = ["runtime-dashboard-dist-*.tar.gz"]
owner = "team-frontend"
sbom_required = true
provenance_target = "GitHub build provenance attestation"
signing_target = "cosign keyless sign-blob where release tooling supports it"
evidence_workflow = ".github/workflows/release.yml"
generated_artifact_family = "release-sbom"

[[release_artifact_contract]]
artifact_type = "checksum-manifest"
patterns = ["SHA256SUMS"]
owner = "team-release"
sbom_required = true
provenance_target = "GitHub build provenance attestation"
signing_target = "cosign keyless sign-blob where release tooling supports it"
evidence_workflow = ".github/workflows/release.yml"
generated_artifact_family = "release-sbom"

[[control_crosswalk]]
control = "OpenSSF Scorecard"
owner = "team-security"
reporting_artifact = "nightly-scorecard"
evidence = ".github/workflows/frontend-nightly.yml"
release_phase = "scheduled and dependency/security review"

[[control_crosswalk]]
control = "SLSA provenance"
owner = "team-security"
reporting_artifact = "build provenance attestations"
evidence = ".github/workflows/release.yml"
release_phase = "release_candidate"

[[control_crosswalk]]
control = "SBOM"
owner = "team-security"
reporting_artifact = "release-supply-chain"
evidence = "ops/security/sbom.toml"
release_phase = "dependency_lock_change and release_candidate"

[[control_crosswalk]]
control = "Signed artifacts"
owner = "team-release"
reporting_artifact = "release-signatures"
evidence = ".github/workflows/release.yml"
release_phase = "release_candidate"
