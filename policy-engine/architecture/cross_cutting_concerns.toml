[cross_cutting_concerns]
version = 1
status = "contract_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-4.8"
source_plan = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-48---cross-cutting-concern-adapters-and-naming-hygiene"
name_registry = "architecture/name_registry.toml"
description = "Canonical ownership and adapter policy for shared concern names that appear across package boundaries."

[defaults]
allowed_decisions = [
  "canonical_interface_plus_package_adapters",
  "package_local_bounded_context",
  "rename_or_sunset",
]
required_concern_fields = [
  "name",
  "decision",
  "canonical_owner",
  "semantic_axis",
  "import_rule",
  "public_status",
  "sunset",
]
global_concepts_requiring_adapters = ["observability", "security"]
adapter_rule = "Global concepts import their canonical interface from core/top-level packages and expose package-local adapters instead of duplicating the global contract."
bounded_context_rule = "The same name may repeat only when the semantic axis documents why each package owns a different concept."
rename_rule = "Unresolved global collisions must carry an owner, replacement direction, and sunset date in this contract or name_registry.toml."

[[concern]]
name = "observability"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-observability"
canonical_package = "polisyos.core.observability"
canonical_interface = "polisyos.core.observability"
public_status = "public"
semantic_axis = "process-wide telemetry primitives versus package-local telemetry vocabulary"
import_rule = "Cross-component telemetry imports use polisyos.core.observability; package-specific metric names, alert records, and SLO helpers stay behind package adapters."
allowed_adapters = [
  { package = "fabric", module = "polisyos.fabric.observability.adapters", public_status = "public", sunset = "none" },
]
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "security"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-core"
canonical_package = "polisyos.core.security"
canonical_interface = "polisyos.core.security"
public_status = "public"
semantic_axis = "tenant identity, authorization, and audit primitives versus package-local data access enforcement"
import_rule = "Cross-package security context and audit primitives import from polisyos.core.security; package security modules adapt those primitives to local resource models."
allowed_adapters = [
  { package = "fabric", module = "polisyos.fabric.security.adapters", public_status = "public", sunset = "none" },
]
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "registry"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-core"
canonical_package = "polisyos.core.registry"
canonical_interface = "polisyos.core.registry"
public_status = "mixed"
semantic_axis = "generic registry primitives versus package-owned registries for manifests and runtime mechanisms"
import_rule = "Reusable registry primitives import from polisyos.core.registry; Fabric and Foundry registry facades are package-local and must not be imported as global singletons."
allowed_adapters = [
  { package = "fabric", module = "polisyos.fabric.registry", public_status = "private_facade", sunset = "none" },
  { package = "foundry", module = "polisyos.foundry.registry", public_status = "compatibility_facade", sunset = "2026-10-01" },
]
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "discovery"
decision = "rename_or_sunset"
canonical_owner = "team-core"
canonical_package = "polisyos.core.discovery"
canonical_interface = "polisyos.core.discovery"
public_status = "mixed"
semantic_axis = "plugin/entry-point discovery primitives versus Scientist hypothesis discovery workflows"
import_rule = "Plugin loading imports from polisyos.core.discovery; Scientist implementation imports use polisyos.scientist.methods.discovery, while polisyos.scientist.discovery is a sunset compatibility shim only."
allowed_adapters = []
sunset = "2026-10-01"
unresolved_collisions = [
  { package = "scientist", module = "polisyos.scientist.discovery", owner = "team-scientist", replacement = "polisyos.scientist.methods.discovery", sunset = "2026-10-01" },
]

[[concern]]
name = "governance"
decision = "package_local_bounded_context"
canonical_owner = "team-architecture"
canonical_package = ""
canonical_interface = ""
public_status = "package_local"
semantic_axis = "core policy primitives, IR governance model/schema rules, and Scientist decision/pass governance"
import_rule = "Governance imports must be package-qualified; cross-package callers use the owning package facade instead of deep-importing another package governance implementation."
allowed_contexts = [
  { package = "core", module = "polisyos.core.governance", owner = "team-core", public_status = "private" },
  { package = "ir", module = "polisyos.ir.governance", owner = "team-ir", public_status = "private" },
  { package = "scientist", module = "polisyos.scientist.governance", owner = "team-scientist", public_status = "package_api" },
]
allowed_adapters = []
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "contracts"
decision = "package_local_bounded_context"
canonical_owner = "team-architecture"
canonical_package = ""
canonical_interface = ""
public_status = "package_local"
semantic_axis = "package-owned Pydantic/schema contracts scoped to each bounded context"
import_rule = "Contracts imports stay within the owning package or its public facade; shared product contracts move through polisyos.core.contracts only after a package-boundary contract change."
allowed_contexts = [
  { package = "berl", module = "polisyos.berl.contracts", owner = "team-architecture", public_status = "package_api" },
  { package = "core", module = "polisyos.core.contracts", owner = "team-core", public_status = "public" },
  { package = "ddm", module = "polisyos.ddm.contracts", owner = "team-architecture", public_status = "package_api" },
  { package = "fabric", module = "polisyos.fabric.connectors.contracts", owner = "team-fabric", public_status = "package_api" },
  { package = "foundry", module = "polisyos.foundry.contracts", owner = "team-foundry", public_status = "package_api" },
]
allowed_adapters = []
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "calibration"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-foundry"
canonical_package = "polisyos.calibration"
canonical_interface = "polisyos.calibration"
public_status = "public"
semantic_axis = "generic calibration diagnostics versus drift, parameter, and governance calibration workflows"
import_rule = "Generic calibration diagnostics import from polisyos.calibration; DDM, Foundry, and Scientist calibration modules adapt those diagnostics to local runtime artifacts."
allowed_adapters = [
  { package = "ddm", module = "polisyos.ddm.calibration", public_status = "package_api", sunset = "none" },
  { package = "foundry", module = "polisyos.foundry.calibration", public_status = "package_api", sunset = "none" },
  { package = "scientist", module = "polisyos.scientist.governance.calibration", public_status = "private", sunset = "none" },
]
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "runtime"
decision = "rename_or_sunset"
canonical_owner = "team-runtime"
canonical_package = "polisyos.runtime"
canonical_interface = "polisyos.runtime"
public_status = "public"
semantic_axis = "top-level product runtime/control plane versus package-local execution glue"
import_rule = "External runtime imports use polisyos.runtime; nested runtime directories are private execution glue and must not expose cross-package runtime contracts."
allowed_adapters = [
  { package = "data_forge", module = "polisyos.data_forge.kernel.runtime", public_status = "private", sunset = "none" },
]
sunset = "2026-10-01"
unresolved_collisions = [
  { package = "foundry", module = "polisyos.foundry.runtime", owner = "team-foundry", replacement = "polisyos.foundry._runtime_glue or package facade fold-in", sunset = "2026-10-01" },
]

[[concern]]
name = "trace"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-core"
canonical_package = "polisyos.core.trace"
canonical_interface = "polisyos.core.trace"
public_status = "public"
semantic_axis = "canonical persisted trace records/sinks versus Foundry runtime trace slices"
import_rule = "Persisted run trace records import from polisyos.core.trace; Foundry trace imports remain a compatibility facade over Foundry runtime tracing."
allowed_adapters = [
  { package = "foundry", module = "polisyos.foundry.trace", public_status = "compatibility_facade", sunset = "2026-10-01" },
]
sunset = "none"
unresolved_collisions = []
