[domain_migration_batches]
version = 1
status = "active"
updated = "2026-05-02"
description = """
Repository SOTA Phase 2 source-to-target map for domain code and production
entrypoint migration. Entries describe the accepted target topology, public
facades, behavior evidence, and compatibility posture for each migration batch.
"""

[[batch]]
id = "academic-to-data-forge"
area = "academic"
owner = "team-data-forge"
risk_class = "M"
status = "complete"
compatibility_status = "removed_after_shim_sunset"
source_paths = ["src/polisyos/academic"]
target_paths = [
  "src/polisyos/data_forge/domains/academic",
  "src/polisyos/data_forge/read_api/academic.py",
]
public_facades = ["polisyos.data_forge.read_api.academic"]
entrypoints = ["polisyos.data_forge.domains.academic.cli"]
shim_ids = []
evidence_paths = [
  "tests/_data/data_forge/non_lex_split/academic",
  "tests/_data/data_forge/non_lex_split/academic_candidate",
]
acceptance_tests = [
  "tests/unit/data_forge/test_phase2_academic_completion.py",
  "tests/unit/data_forge/domains/academic",
]
removal_criteria = "Legacy polisyos.academic package removed after read consumers moved to read_api.academic."

