[structure_remediation_exceptions]
version = 1
status = "active"
owner = "team-architecture"
phase = "repository-structure-remediation-phase-7"
reviewed_at = "2026-10-18"
notes = "Time-bounded exceptions for fail-closed Repository Structure Remediation gates. Every entry must have owner, sunset, reason, and exact match criteria. Reviewed 2026-09-07 after all thirteen entries expired: seven whose deferred condition no longer exists were removed, and the six still live were renewed with a dated basis naming the plan that carries the engineering half. On 2026-10-18, complete Phase 0 findings no longer contained the calibration or Lex root-file matches; those exception rows were retired rather than renewed. Active entries must match a current finding across the full gate set before any finding is suppressed."


[[exception]]
id = "loose-root-common-shared-utilities"
gate = "loose_files_gate"
owner = "team-core-runtime"
sunset = "2026-12-01"
issue = "docs/plans/active/CORE_COMMON_RUNTIME_AUDIT_REMEDIATION_PLAN.md"
reason = "Renewed 2026-09-07. polisyos.common still exposes shared utilities at package root. The engineering half is carried by the Core/Common runtime remediation plan, whose declared scope includes src/polisyos/common/**; the original entry named that plan in prose without pointing the issue field at it."
match = { package = "common", message = "Top-level package has too many root .py files." }


[[exception]]
id = "release-ledger-root-governance-data"
gate = "build_output_gate"
owner = "team-release"
sunset = "2026-12-01"
issue = "docs/plans/active/REPOSITORY_LIFECYCLE_AND_OPS_TAXONOMY_DECISION.md"
reason = "Renewed 2026-09-07, and reclassified. This is not deferred work: the lifecycle and ops taxonomy decision classifies release/** as source_committed - committed release input, policy references, evidence templates and durable ledgers - while build_output_gate reads the directory as generated output. The exception stands until the gate predicate is reconciled with that decision, which is the engineering half and belongs to team-ops and team-release jointly."
match = { path = "policy-engine/release" }

[[exception]]
id = "release-fragments-root-governance-data"
gate = "build_output_gate"
owner = "team-release"
sunset = "2026-12-01"
issue = "docs/plans/active/REPOSITORY_LIFECYCLE_AND_OPS_TAXONOMY_DECISION.md"
reason = "Renewed 2026-09-07, and reclassified for the same reason as the release ledger entry. The taxonomy decision classifies release-fragments/template.toml, the READMEs and release-fragments/unreleased/** as source_committed and only _build/release-fragments/** as generated_ignored; build_output_gate does not make that distinction. Reconciling the gate with the decision closes this, not moving the directory."
match = { path = "policy-engine/release-fragments" }
