[phase_1_3_report_only_overlay]
status = "report_only"
owner = "team-architecture"
source_plan = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-13---architecture-report-only-contracts"
gate_registry = "architecture/gates/report_only.toml"
notes = "Phase 1.3 keeps new extension-point checks report-only and uses package contracts for owners and tests before any fail-closed conversion."

[[phase_1_3_extension_point]]
id = "fabric-connector-sources"
package = "fabric"
owner = "team-fabric"
surface = "polisyos.fabric.connectors.sources"
registry = "polisyos.fabric.connectors.sources._contracts.ALL_SOURCE_CONTRACTS"
boundary_contract = "architecture/packages/fabric.toml"
