[extension_points]
version = 1
status = "contract_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-1.5"
source_plan = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-15---extension-abi-dynamic-import-and-versioning-contracts"
dynamic_import_registry = "architecture/imports/dynamic.toml"
versioning_policy = "docs/adr/repository-structure-0135-versioning-out-of-package-names.md"
parallel_safety = "Physical registry consolidation and registry rewrites wait for Wave 5 integration."

[defaults]
abi_compatibility = "semver-major"
deprecation_notice_window = "2 minor releases"
compatibility_class = "extension-plugin-abi"
version_owner = "extension owner"
release_fragment_change_class = "extension-plugin-abi"
discovery_modes = ["python_entry_points", "declared_builtin_loader"]
dynamic_import_verifier = "tools/quality/validation/decomposition_preflight.py::validate_dynamic_imports"
example_verifier = "installable-example-smoke"

[dynamic_import_policy]
plugin_discovery_rule = "Plugin discovery must use the extension point entry-point group or the extension point builtin_loader."
ad_hoc_import_rule = "Ad hoc string imports must be registered in architecture/imports/dynamic.toml."
required_registry_fields = ["owner", "target", "verifier"]
target_field = "Use target for extension-point loader targets and allowed_targets for concrete import targets."
verifier_field = "Use verifier to name the gate, smoke test, or owner review that proves the target remains intentional."

[[compatibility_category]]
id = "python_public_api"
label = "Python public API"
version_owner = "team-architecture"
deprecation_window = "2 minor releases"
source_of_truth = "architecture/public_surface/contract.toml and package facade modules"
breaking_change_signal = "SemVer major or explicit shim/deprecation entry"
release_fragment_change_class = "python-public-api"

[[compatibility_category]]
id = "schema_openapi_abi"
label = "Schema/OpenAPI ABI"
version_owner = "team-runtime"
deprecation_window = "2 minor releases"
source_of_truth = "schemas/** and committed OpenAPI snapshots"
breaking_change_signal = "Schema major, OpenAPI path major, or migration guide entry"
release_fragment_change_class = "schema-openapi-abi"

[[compatibility_category]]
id = "extension_plugin_abi"
label = "Extension plugin ABI"
version_owner = "team-architecture"
deprecation_window = "2 minor releases"
source_of_truth = "architecture/extension_points.toml"
breaking_change_signal = "contract_version major or incompatible abi_compatibility entry"
release_fragment_change_class = "extension-plugin-abi"

[[compatibility_category]]
id = "runtime_state_format"
label = "Runtime-state format"
version_owner = "team-ops"
deprecation_window = "1 major release"
source_of_truth = "architecture/local_runtime_state.toml and .polisyos schema docs"
breaking_change_signal = "Migration reader/writer version change"
release_fragment_change_class = "runtime-state-format"

[[compatibility_category]]
id = "persisted_artifact_format"
label = "Persisted artifact format"
version_owner = "team-ir"
deprecation_window = "2 minor releases"
source_of_truth = "Artifact schemas, CAS manifests, and producer_version metadata"
breaking_change_signal = "Artifact schema major or migration manifest"
release_fragment_change_class = "persisted-artifact-format"

[[compatibility_category]]
id = "js_package_api"
label = "JS package API"
version_owner = "team-frontend"
deprecation_window = "2 minor releases"
source_of_truth = "frontend workspaces, package exports, and generated client snapshots"
breaking_change_signal = "npm package major or generated client compatibility note"
release_fragment_change_class = "js-package-api"

[[deprecation_window]]
id = "shim_packages"
category = "python_public_api"
minimum_notice = "2 minor releases"
removal_gate = "architecture/shims.toml sunset date plus migration-guide entry"
owner = "team-architecture"

[[deprecation_window]]
id = "renamed_public_imports"
category = "python_public_api"
minimum_notice = "2 minor releases"
removal_gate = "wrapper-only shim, warning, release fragment, and public-surface update"
owner = "team-architecture"

[[deprecation_window]]
id = "extension_contract_versions"
category = "extension_plugin_abi"
minimum_notice = "2 minor releases"
removal_gate = "new contract_version, compatibility adapter, and installable example update"
owner = "team-architecture"

[[deprecation_window]]
id = "runtime_state_migration_readers"
category = "runtime_state_format"
minimum_notice = "1 major release"
removal_gate = "operator migration guide and state-reader compatibility test removal"
owner = "team-runtime"

[[deprecation_window]]
id = "generated_client_compatibility"
category = "js_package_api"
minimum_notice = "2 minor releases"
removal_gate = "OpenAPI snapshot, generated client release note, and dashboard compatibility test"
owner = "team-frontend"

[[extension_point]]
name = "polisyos.fabric_connectors"
entry_point_group = "polisyos.fabric_connectors"
component_kind = "fabric_connector"
contract = "polisyos.fabric.extensions.api.FabricConnectorPlugin"
contract_version = "1.0"
abi_compatibility = "semver-major"
deprecation_notice_window = "2 minor releases"
owner = "team-fabric"
builtin_loader = "polisyos.fabric.connectors.components:__polisyos_components__"
builtin_loader_owner = "team-fabric"
builtin_loader_verifier = "uv run pytest tests/unit/fabric/connectors -q"
dynamic_import_target = "entry-point group polisyos.fabric_connectors or builtin loader polisyos.fabric.connectors.components:__polisyos_components__"
dynamic_import_verifier = "tools/quality/validation/decomposition_preflight.py::validate_dynamic_imports"
example_package = "examples/extensions/fabric_connector"
example_smoke_command = "python -m pip install -e examples/extensions/fabric_connector && polisyos components list --kind fabric_connector --tag external-example"
example_expectations = [
  "declares exactly one polisyos.fabric_connectors entry point",
  "uses ComponentMetadata.kind=fabric_connector",
  "ships a local smoke test that instantiates the connector without network access",
]

