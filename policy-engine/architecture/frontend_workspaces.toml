[frontend_workspaces]
version = 1
owner = "team-frontend"
backup_owner = "team-runtime"
node_baseline = ">=22 <23"
workspace_manager = "pnpm"
workspace_manifest = "pnpm-workspace.yaml"
root_package_json = "package.json"
root_lockfile = "pnpm-lock.yaml"
source_of_truth = "pnpm-workspace.yaml, package.json, apps/* package manifests, packages/* package manifests plus schemas/runtime_api_v1.openapi.json"
generated_output_ignore_policy = "local generated outputs stay ignored unless registered as committed baselines in architecture/generated_artifacts.toml"

[[workspace]]
id = "runtime-api-client"
path = "packages/runtime-api-client"
owner = "team-runtime"
package_json = "packages/runtime-api-client/package.json"
lockfile = "pnpm-lock.yaml"
source_of_truth = "schemas/runtime_api_v1.openapi.json"
public_entrypoints = [
  "canonicalRuntimeApiClient.ts",
  "canonicalRuntimeApiClient.js",
]
schema_inputs = ["schemas/runtime_api_v1.openapi.json"]
generated_outputs = [
  "types.ts",
  "canonicalRuntimeApiClient.ts",
  "canonicalRuntimeApiClient.js",
]
ignored_outputs = [
  "node_modules/",
  "../../_build/packages/runtime-api-client/coverage/",
  "../../_build/packages/runtime-api-client/dist/",
  "../../_build/packages/runtime-api-client/.tmp/",
  "../../_cache/packages/runtime-api-client/eslint/.eslintcache",
]
build_commands = ["corepack pnpm --filter @polisyos/runtime-api-client run build"]
test_commands = ["corepack pnpm --filter @polisyos/runtime-api-client test", "corepack pnpm --filter @polisyos/runtime-api-client run contracts:verify"]
drift_commands = ["corepack pnpm --filter @polisyos/runtime-api-client run generate", "corepack pnpm --filter @polisyos/runtime-api-client run contracts:verify", "corepack pnpm --filter @polisyos/runtime-api-client run check:architecture"]

[[workspace]]
id = "runtime-dashboard"
path = "apps/runtime-dashboard"
owner = "team-frontend"
package_json = "apps/runtime-dashboard/package.json"
lockfile = "pnpm-lock.yaml"
source_of_truth = "schemas/runtime_api_v1.openapi.json and src/polisyos/runtime/http/**"
public_entrypoints = [
  "src/main.tsx",
  "src/app/routes/routes.tsx",
  "src/api/types.ts",
]
schema_inputs = ["schemas/runtime_api_v1.openapi.json"]
generated_outputs = ["src/api/types.ts"]
ignored_outputs = [
  "node_modules/",
  "../../_build/apps/runtime-dashboard/coverage/",
  "../../_build/apps/runtime-dashboard/dist/",
  "../../_build/apps/runtime-dashboard/output/",
  "../../_build/apps/runtime-dashboard/playwright-report/",
  "../../_build/apps/runtime-dashboard/storybook-static/",
  "../../_build/apps/runtime-dashboard/test-results/",
  "../../_build/apps/runtime-dashboard/.tmp/",
  "../../_cache/apps/runtime-dashboard/eslint/.eslintcache",
]
build_commands = ["corepack pnpm --filter @polisyos/runtime-dashboard run build", "corepack pnpm --filter @polisyos/runtime-dashboard run typecheck"]
test_commands = ["corepack pnpm --filter @polisyos/runtime-dashboard run test:components", "corepack pnpm --filter @polisyos/runtime-dashboard run test:contracts"]
drift_commands = [
  "corepack pnpm --filter @polisyos/runtime-dashboard run generate:api",
  "corepack pnpm --filter @polisyos/runtime-dashboard run contracts:verify",
  "corepack pnpm --filter @polisyos/runtime-dashboard run check:architecture",
  "corepack pnpm --filter @polisyos/runtime-dashboard run check:bundle",
]

[[workspace]]
id = "runtime-reference-shell"
path = "apps/runtime-reference-shell"
owner = "team-runtime"
package_json = "apps/runtime-reference-shell/package.json"
lockfile = "pnpm-lock.yaml"
source_of_truth = "packages/runtime-api-client/canonicalRuntimeApiClient.js"
public_entrypoints = [
  "index.html",
  "app.js",
]
schema_inputs = ["packages/runtime-api-client/canonicalRuntimeApiClient.js"]
generated_outputs = []
ignored_outputs = [
  "node_modules/",
  "../../_build/apps/runtime-reference-shell/coverage/",
  "../../_build/apps/runtime-reference-shell/dist/",
  "../../_build/apps/runtime-reference-shell/.tmp/",
  "../../_cache/apps/runtime-reference-shell/eslint/.eslintcache",
]
build_commands = ["corepack pnpm --filter @polisyos/runtime-reference-shell run build"]
test_commands = ["corepack pnpm --filter @polisyos/runtime-reference-shell test"]
drift_commands = ["corepack pnpm --filter @polisyos/runtime-reference-shell run check:architecture"]

[[workspace]]
id = "cli"
path = "packages/cli"
owner = "team-frontend"
package_json = "packages/cli/package.json"
lockfile = "pnpm-lock.yaml"
source_of_truth = "packages/cli/src/**"
public_entrypoints = [
  "src/styleguide/index.ts",
]
schema_inputs = []
generated_outputs = []
ignored_outputs = [
  "node_modules/",
  "../../_cache/packages/cli/eslint/.eslintcache",
]
build_commands = ["corepack pnpm --filter @polisyos/cli run build"]
test_commands = ["corepack pnpm --filter @polisyos/cli test"]
drift_commands = ["corepack pnpm --filter @polisyos/cli run lint"]

[[workspace]]
id = "atlas-ui"
path = "packages/atlas-ui"
owner = "team-frontend / team-design"
package_json = "packages/atlas-ui/package.json"
lockfile = "pnpm-lock.yaml"
source_of_truth = "package.json, src/index.ts, tokens/source/*.tokens.json, tokens/modes/*.tokens.json, and src/tokens/project.ts"
public_entrypoints = ["src/index.ts"]
schema_inputs = [
  "tokens/source/*.tokens.json",
  "tokens/modes/*.tokens.json",
  "https://www.designtokens.org/schemas/2025.10/format.json",
]
generated_outputs = [
  "src/generated/figma.json",
  "src/generated/manifest.json",
  "src/generated/tailwind.ts",
  "src/generated/tokens.css",
  "src/generated/tokens.ts",
]
ignored_outputs = [
  "node_modules/",
  "../../_cache/packages/atlas-ui/eslint/.eslintcache",
]
build_commands = []
test_commands = ["corepack pnpm --filter @polisyos/atlas-ui test"]
drift_commands = [
  "corepack pnpm --filter @polisyos/atlas-ui run typecheck",
  "corepack pnpm --filter @polisyos/atlas-ui run check:architecture",
  "corepack pnpm --filter @polisyos/atlas-ui run tokens:check",
]
regenerate_commands = ["corepack pnpm --filter @polisyos/atlas-ui run tokens:generate"]
