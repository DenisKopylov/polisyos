[package_import_gates]
version = 1
status = "fail_closed"
phase = "repository-best-in-class-phase-6.1"
owner = "team-architecture"
completed_on = 2026-05-06
gate_command = "uv run polisyos-tools validation check-package-import-gates --fail-closed"
active_source_move_report_only_blockers = []
source_contracts = [
  "architecture/gates/package_import.toml",
  "architecture/imports/reports.toml",
  "architecture/imports/contracts.toml",
  "architecture/imports/policy.toml",
  "architecture/imports/exceptions.toml",
  "architecture/baselines/imports/deep_import.json",
  "architecture/imports/dynamic.toml",
  "architecture/imports/lazy.toml",
  "architecture/packages/boundaries.toml",
  "architecture/packages/layout.toml",
  "architecture/public_surface/contract.toml",
  "architecture/public_surface/inventory.json",
  "architecture/name_registry.toml",
  "architecture/policies/cross_cutting_concerns.toml",
  "architecture/shims.toml",
  "architecture/exceptions/structure_remediation.toml",
  "architecture/policies/directory_contracts.toml",
  "architecture/packages/fabric.toml",
  "architecture/packages/ir.toml",
  "architecture/packages/scientist.toml",
  "architecture/module_size_budget.toml",
]

[single_file_shell_package_policy]
status = "fail_closed"
owner = "team-architecture"
scope_roots = ["src/polisyos/fabric", "src/polisyos/ir"]
max_python_files = 2
allowed_facade_packages = []
latest_allowed_sunset = "2026-07-31"
wrapper_only_created_from_loose_file_disallowed_after = "2026-07-31"
local_documentation_source = "architecture/policies/directory_contracts.toml:single_file_shell_package_local_documentation"
exception_required_fields = [
  "path",
  "owner",
  "rationale",
  "sunset",
  "migration_target",
  "smoke_import_test",
]

[[single_file_shell_package_exception_group]]
id = "ir-wave3-shell-packages"
owner = "team-ir"
rationale = "Remaining IR shell-like packages are retained only where Phase 3.2 keeps private facade, connector, schema, or Trinity wrappers."
sunset = "2026-07-31"
migration_target = "architecture/shims.toml#last_mile_import_compatibility_map"
smoke_import_test = "tests/unit/ir/test_root_facade_closeout.py::test_ir_phase_0_3_import_map_declares_shell_group_targets"
created_to_wrap_formerly_loose_file = true
paths = [
  "src/polisyos/ir/_internal",
  "src/polisyos/ir/_lazy_facade",
  "src/polisyos/ir/connectors",
  "src/polisyos/ir/schemas",
  "src/polisyos/ir/trinity",
]

[[gate]]
id = "root-facade-package-layout"
area = "package_layout"
owner = "team-architecture"
mode = "fail_closed"
source_contracts = [
  "architecture/packages/layout.toml",
  "architecture/exceptions/structure_remediation.toml",
]
blocks = [
  "new package-root implementation modules outside the root facade budget",
