[report_only_gates]
version = 1
status = "report_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-1.3"
default_mode = "report_only"
conversion_policy = "No gate may become fail_closed until it has an owner, evidence path, package contract source, and accepted sunset or ratchet."

[[gate]]
id = "package-contract-schema"
area = "packages"
owner = "team-architecture"
mode = "report_only"
command = "uv run python tools/quality/validation/architecture_report_only_contracts.py --report packages"
evidence = "architecture/packages"
source_contracts = ["architecture/packages/*.toml"]
target_fail_closed_not_before = "2026-10-01"

[[gate]]
id = "compatibility-release-gates"
area = "release"
owner = "team-release"
mode = "report_only"
command = "uv run polisyos-tools release check-compatibility-release-gates --fail-on-contract-errors"
evidence = "architecture/compatibility_release_gates.toml"
source_contracts = [
  "architecture/compatibility_release_gates.toml",
  "architecture/extension_points.toml",
  "architecture/generated_artifacts.toml",
  "architecture/public_surface.toml",
  "architecture/runtime_state_layout.toml",
  "ops/migrations/migration-contracts.toml",
  "ops/release/release-fragment-policy.toml",
  "release-fragments/template.toml",
]
target_fail_closed_not_before = "2026-10-01"

[[gate]]
id = "package-aggregate-mirror"
area = "packages"
owner = "team-architecture"
mode = "report_only"
command = "uv run python tools/quality/validation/architecture_report_only_contracts.py --report package-mirrors"
