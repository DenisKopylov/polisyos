owner = "team-data-forge"
approval_owner = "team-data-forge"
source_of_truth = "architecture/data_policy.toml"
outputs = [
  "data/bronze/",
  "data/silver/",
  "data/gold/",
  "data/manifests/",
  "data/quarantine/",
]
regenerate_commands = [
  "manual/local: create medallion directories under the ignored product-root data/ lake as needed",
]
commit_policy = "local_ignored"
freshness_rule = "Local data lake content is local runtime or corpus state and must stay ignored unless promoted to a registered tiny fixture."
drift_gate = "ignored_by_policy"
workflow = "docs/reference/data-lake-policy.md"

[[family]]
id = "local-runtime-state"
