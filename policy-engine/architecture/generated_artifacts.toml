[generated_artifacts]
version = 1

[[family]]
id = "abi-schema-snapshots"
label = "ABI schema snapshots"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "schemas/abi_models.py + src/polisyos/** Pydantic/Enum contracts"
outputs = [
  "schemas/snapshots/ir/",
  "schemas/snapshots/fabric/edge_kind.schema.json",
  "schemas/snapshots/fabric/node_kind.schema.json",
  "schemas/snapshots/fabric/_manifest.json",
]
regenerate_commands = ["PYTHONPATH=src:. uv run --extra ml python tools/quality/diagnostics/gen_schema.py"]
commit_policy = "committed"
freshness_rule = "Regenerate and commit whenever ABI-visible IR or Fabric contracts change."
drift_gate = "automated"
workflow = "../.github/workflows/abi.yml"
check_cwd = "."
check_command = [
  "uv",
  "run",
  "--extra",
  "ml",
  "python",
  "tools/quality/diagnostics/gen_schema.py",
  "--check",
]

[[family]]
id = "fabric-connector-contract-registry"
label = "Fabric connector contract registry"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "polisyos.fabric.connectors.sources._contracts.ALL_SOURCE_CONTRACTS and tools/quality/validation/fabric_schema_governance.py"
outputs = [
  "schemas/snapshots/fabric/connector_contract_registry.json",
  "schemas/snapshots/fabric/source_contracts_v2.json",
  "schemas/snapshots/fabric/source_scorecards.json",
]
regenerate_commands = ["uv run python tools/ci/check_fabric_schema_registry.py --update"]
commit_policy = "committed"
freshness_rule = "Regenerate and commit whenever source connector contracts or their governance metadata change."
drift_gate = "automated"
workflow = "tools/ci/check_fabric_schema_registry.py"
check_cwd = "."
check_command = [
  "uv",
  "run",
  "python",
  "tools/ci/check_fabric_schema_registry.py",
  "--check",
  "--evidence-out",
  "_build/.tmp/fabric-schema-governance.json",
]

[[family]]
id = "runtime-openapi-snapshot"
label = "Runtime OpenAPI snapshot"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "src/polisyos/runtime/http/** FastAPI app factory and DTO contracts"
outputs = ["schemas/runtime_api_v1.openapi.json"]
regenerate_commands = [
  "PYTHONPATH=src:. uv run --extra runtime --extra ml python tools/ops/runtime/export_runtime_openapi.py --output schemas/runtime_api_v1.openapi.json",
]
commit_policy = "committed"
freshness_rule = "Regenerate and commit whenever runtime routes, request/response DTOs, or OpenAPI examples change."
drift_gate = "automated"
workflow = "ops/ci/templates/workflows/arch.yml"
check_cwd = "."
check_command = [
  "uv",
  "run",
  "--extra",
  "runtime",
  "--extra",
  "ml",
  "python",
  "tools/ops/runtime/check_runtime_api_contract.py",
  "--skip-client-drift",
]

[[family]]
id = "runtime-api-client"
label = "Generated runtime API client"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "schemas/runtime_api_v1.openapi.json"
outputs = [
  "frontend/runtime-api-client/runtimeApiClient.ts",
  "frontend/runtime-api-client/runtimeApiClient.js",
]
regenerate_commands = [
  "PYTHONPATH=src:. uv run --extra runtime --extra ml python tools/ops/runtime/generate_runtime_client.py --openapi schemas/runtime_api_v1.openapi.json --out-ts frontend/runtime-api-client/runtimeApiClient.ts --out-js frontend/runtime-api-client/runtimeApiClient.js",
]
commit_policy = "committed"
freshness_rule = "Regenerate and commit whenever the runtime OpenAPI snapshot changes."
drift_gate = "automated"
workflow = "ops/ci/templates/workflows/arch.yml"
check_cwd = "."
check_command = [
  "uv",
  "run",
  "--extra",
  "runtime",
  "--extra",
  "ml",
  "python",
  "tools/ops/runtime/check_runtime_api_contract.py",
]

[[family]]
id = "runtime-dashboard-api-types"
label = "Runtime dashboard generated API types"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "schemas/runtime_api_v1.openapi.json"
outputs = ["frontend/runtime-dashboard/src/api/types.ts"]
regenerate_commands = ["pnpm --filter @polisyos/runtime-dashboard run generate:api"]
commit_policy = "committed"
freshness_rule = "Regenerate and commit whenever runtime OpenAPI changes affect dashboard-facing types."
drift_gate = "automated"
workflow = "ops/ci/templates/workflows/arch.yml"
check_cwd = "frontend/runtime-dashboard"
check_command = ["pnpm", "run", "generate:api"]
check_git_diff_paths = ["src/api/types.ts"]

[[family]]
id = "connector-recorded-fixtures"
label = "Recorded connector fixtures"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "Live upstream connector responses captured through polisyos-tools data record-fixtures."
outputs = ["tests/unit/fabric/connectors/sources/fixtures/"]
regenerate_commands = [
  "uv run polisyos-tools data record-fixtures --wave 1",
  "uv run polisyos-tools data record-fixtures --wave 2",
  "uv run polisyos-tools data record-fixtures --wave 3",
]
commit_policy = "committed"
freshness_rule = "Refresh intentionally when connector contracts, source profiles, or upstream response shapes change."
drift_gate = "manual_review"
workflow = "tools/ops/data/record_fixtures.py"

[[family]]
id = "catalog-relevant-topics-domain-fixtures"
label = "Catalog relevant topics domain fixtures"
owner = "team-data-forge"
approval_owner = "team-data-forge"
source_of_truth = "OpenAlex topic CSV curation via tools/research/experiments/filter_topics.py and tools/research/experiments/organize_relevant_topics.py"
outputs = ["src/polisyos/data_forge/domains/catalog/fixtures/relevant_topics_domain_files/"]
regenerate_commands = [
  "uv run python tools/research/experiments/filter_topics.py --input <approved-openalex-topics.csv> --output <workdir>/relevant_topics.csv",
  "uv run python tools/research/experiments/organize_relevant_topics.py --input <workdir>/relevant_topics.csv --labeled-output <workdir>/relevant_topics_thematic.csv --summary-output src/polisyos/data_forge/domains/catalog/fixtures/relevant_topics_domain_files/relevant_topics_thematic_summary.csv",
]
commit_policy = "committed"
freshness_rule = "Refresh only when topic taxonomy fixtures are intentionally regenerated and reviewed."
drift_gate = "manual_review"

[[family]]
id = "runtime-dashboard-contract-fixtures"
label = "Runtime dashboard contract fixtures"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "Live Runtime API responses captured via frontend/runtime-dashboard/scripts/record-runtime-contracts.mjs"
outputs = ["frontend/runtime-dashboard/src/test/contracts/fixtures/"]
regenerate_commands = ["pnpm --filter @polisyos/runtime-dashboard run contracts:record"]
commit_policy = "committed"
freshness_rule = "Refresh when dashboard contract fixtures are intentionally updated to match runtime API behavior."
drift_gate = "manual_review"
workflow = "frontend/runtime-dashboard/scripts/record-runtime-contracts.mjs"

[[family]]
id = "benchmark-reports-and-bundle-stats"
label = "Benchmark reports and bundle stats"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "benchmarks/** runners, frontend/runtime-dashboard/scripts/emit-bundle-stats.mjs, and benchmark publication helpers"
outputs = ["benchmarks/_reports/", "_build/frontend/runtime-dashboard/dist/bundle-stats.json"]
regenerate_commands = [
  "uv run polisyos-tools benchmarks run-all",
  "pnpm --filter @polisyos/runtime-dashboard run bundle:stats",
]
commit_policy = "mixed"
freshness_rule = "Commit benchmark reports only when they serve as intentional baselines, evidence packs, or review artifacts. `_build/frontend/runtime-dashboard/dist/bundle-stats.json` is local by default and is committed only when reviewers explicitly want a checked-in bundle baseline."
drift_gate = "manual_review"
workflow = "ops/ci/templates/workflows/perf.yml"

[[family]]
id = "audit-and-evidence-artifacts"
label = "Audit and evidence artifacts"
owner = "team-polisyos"
approval_owner = "team-polisyos"
source_of_truth = "Dedicated audit/report generators such as frontend/runtime-dashboard/scripts/run-audit.mjs and curated evidence/report pipelines"
outputs = [
  "docs/archive/reports/",
  "_build/frontend/runtime-dashboard/audit/pnpm-audit-report.json",
  "_build/frontend/runtime-dashboard/audit/pnpm-audit-summary.md",
]
regenerate_commands = ["pnpm --filter @polisyos/runtime-dashboard run audit:ci"]
commit_policy = "mixed"
freshness_rule = "Only intentionally reviewed evidence packs stay committed; frontend audit outputs stay local under `_build/frontend/runtime-dashboard/audit/` unless promoted to a reviewed baseline."
drift_gate = "manual_review"
workflow = "frontend/runtime-dashboard/scripts/run-audit.mjs"

[[family]]
id = "public-surface-inventory"
label = "Public surface inventory"
owner = "team-architecture"
approval_owner = "team-architecture"
source_of_truth = "architecture/public_surface.toml and src/polisyos/**/__init__.py public exports"
outputs = ["architecture/public_surface_inventory.json", "architecture/public_surface/"]
regenerate_commands = ["uv run polisyos-tools quality public-surface snapshot --all"]
commit_policy = "committed"
freshness_rule = "Regenerate whenever supported public entrypoints, __all__, or public signatures change."
drift_gate = "automated"
workflow = "ops/ci/templates/workflows/arch.yml"

[[family]]
id = "release-sbom"
label = "Release SBOM"
owner = "team-security"
approval_owner = "team-security"
source_of_truth = "uv.lock, pnpm-lock.yaml, Dockerfile.reproducible, and release manifest inputs"
outputs = ["_build/release/sbom/"]
regenerate_commands = ["uv run polisyos-tools security sbom --output _build/release/sbom/"]
commit_policy = "local_ignored"
freshness_rule = "Regenerate for every release candidate or dependency-lock change; publish through CI/release artifacts rather than committing local SBOM output."
drift_gate = "ignored_by_policy"
workflow = "ops/ci/templates/workflows/build-and-push.yml"

[[family]]
id = "data-forge-migration-fixture-baselines"
label = "Data Forge migration fixture baselines"
owner = "team-data-forge"
approval_owner = "team-architecture"
source_of_truth = "tests/unit/data_forge/** golden, shadow, replay, and differential fixture contracts"
