[[family]]
id = "frontend-workspace-lockfiles"
label = "Frontend workspace lockfile"
owner = "team-frontend"
approval_owner = "team-frontend"
source_of_truth = "pnpm-workspace.yaml, package.json, frontend/*/package.json, packages/*/package.json, and the Node 22 contributor baseline"
