  "pnpm-lock.yaml",
]
regenerate_commands = ["pnpm install --lockfile-only"]
commit_policy = "committed"
freshness_rule = "Regenerate and commit the root pnpm lockfile whenever any workspace package dependency graph changes."
drift_gate = "manual_review"
workflow = "../.github/workflows/frontend-quality.yml"

[[family]]
id = "frontend-local-generated-outputs"
label = "Frontend local generated outputs"
owner = "team-frontend"
approval_owner = "team-frontend"
source_of_truth = "frontend workspace build, coverage, audit, Playwright, Storybook, cache, and package manager commands"
outputs = [
  "node_modules/",
  "frontend/runtime-api-client/node_modules/",
  "_build/frontend/runtime-api-client/coverage/",
  "_build/frontend/runtime-api-client/dist/",
  "_build/frontend/runtime-api-client/.tmp/",
  "_cache/frontend/runtime-api-client/eslint/.eslintcache",
  "frontend/runtime-dashboard/node_modules/",
  "_build/frontend/runtime-dashboard/coverage/",
  "_build/frontend/runtime-dashboard/dist/",
  "_build/frontend/runtime-dashboard/output/",
  "_build/frontend/runtime-dashboard/playwright-report/",
  "_build/frontend/runtime-dashboard/storybook-static/",
  "_build/frontend/runtime-dashboard/test-results/",
  "_build/frontend/runtime-dashboard/.tmp/",
  "_cache/frontend/runtime-dashboard/eslint/.eslintcache",
  "frontend/runtime-reference-shell/node_modules/",
  "_build/frontend/runtime-reference-shell/coverage/",
  "_build/frontend/runtime-reference-shell/dist/",
  "_build/frontend/runtime-reference-shell/.tmp/",
  "_cache/frontend/runtime-reference-shell/eslint/.eslintcache",
  "packages/cli/node_modules/",
  "_cache/frontend/cli/eslint/.eslintcache",
]
regenerate_commands = [
  "pnpm --filter @polisyos/runtime-dashboard run build",
  "pnpm --filter @polisyos/runtime-dashboard run test:coverage",
  "pnpm --filter @polisyos/runtime-dashboard run build-storybook",
]
commit_policy = "local_ignored"
freshness_rule = "Keep local generated outputs ignored. Commit only explicit reviewed baselines registered in a committed artifact family."
drift_gate = "ignored_by_policy"
workflow = "docs/reference/frontend/workspace-contract.md"

[[family]]
id = "committed-data-fixtures-and-catalogs"
label = "Committed data fixtures and catalogs"
owner = "team-data-forge"
approval_owner = "team-data-forge"
source_of_truth = "data/README.md, data/academic_gold/** tiny examples, and data/dataset_catalog/*.yaml registry entries"
outputs = [
  "data/academic_gold/",
  "data/dataset_catalog/",
]
regenerate_commands = [
  "manual review: refresh tiny gold fixtures or catalog YAML alongside the source schema/contract change",
]
commit_policy = "committed"
freshness_rule = "Commit only small fixtures, contracts, manifests, registry entries, or tiny gold examples. Bulk raw/curated/database outputs remain ignored local data."
drift_gate = "manual_review"
workflow = "docs/reference/data-lake-policy.md"

[[family]]
id = "local-medallion-data-lake"
