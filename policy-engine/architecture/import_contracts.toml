[importlinter]
root_package = "polisyos"

# ---------------------------------------------------------------------------
# Primary layered architecture.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "polisyos.runtime",
  "polisyos.scientist",
  "polisyos.packs | polisyos.scholar | polisyos.foundry | polisyos.lex | polisyos.data_forge | polisyos.fabric",
  "polisyos.core",
  "polisyos.ir",
  "polisyos.common",
]

# ---------------------------------------------------------------------------
# Sink contracts: lowest layers must have no knowledge of higher ones.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "common is a sink contract layer"
type = "forbidden"
source_modules = ["polisyos.common"]
forbidden_modules = [
  "polisyos.ir",
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.packs",
]

[[importlinter.contracts]]
name = "IR is a sink contract layer"
type = "forbidden"
source_modules = ["polisyos.ir"]
forbidden_modules = [
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.packs",
]

[[importlinter.contracts]]
name = "core must not depend on runtime or domain packages"
type = "forbidden"
source_modules = ["polisyos.core"]
forbidden_modules = [
  "polisyos.runtime",
  "polisyos.scientist",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.data_forge",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.packs",
]

# ---------------------------------------------------------------------------
# Data Forge boundary.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "Data Forge domains are independent"
type = "independence"
modules = [
  "polisyos.data_forge.domains.academic",
  "polisyos.data_forge.domains.catalog",
  "polisyos.data_forge.domains.ukraine",
  "polisyos.data_forge.domains.legal",
]

[[importlinter.contracts]]
name = "Runtime packages consume Data Forge only through read_api"
type = "forbidden"
source_modules = [
  "polisyos.runtime",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.lex",
  "polisyos.scientist",
  "polisyos.scholar",
]
forbidden_modules = ["polisyos.data_forge.kernel", "polisyos.data_forge.domains"]
ignore_imports = ["polisyos.data_forge.read_api", "polisyos.data_forge.read_api.*"]

# ---------------------------------------------------------------------------
# Foundry / Lex neutrality.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "Foundry remains domain neutral"
type = "forbidden"
source_modules = ["polisyos.foundry"]
forbidden_modules = [
  "polisyos.scientist",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.academic",
  "polisyos.datasets",
  "polisyos.ukraine_data",
  "polisyos.runtime",
]

[[importlinter.contracts]]
name = "Lex does not import domain-private siblings"
type = "forbidden"
source_modules = ["polisyos.lex"]
forbidden_modules = [
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.foundry._private",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
]
ignore_imports = ["polisyos.data_forge.read_api", "polisyos.data_forge.read_api.*"]

# ---------------------------------------------------------------------------
# Runtime-private: HTTP/services/app factories must not be imported by
# non-runtime code.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "Runtime-private modules are not used outside runtime"
type = "forbidden"
source_modules = [
  "polisyos.common",
  "polisyos.ir",
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.scientist",
  "polisyos.data_forge",
  "polisyos.packs",
]
forbidden_modules = [
  "polisyos.runtime.http",
  "polisyos.runtime.services",
  "polisyos.runtime.app",
  "polisyos.runtime._private",
]

[[importlinter.contracts]]
name = "Runtime consumes only public facades of lower layers"
type = "forbidden"
source_modules = ["polisyos.runtime"]
forbidden_modules = [
  "polisyos.common._private",
  "polisyos.ir._private",
  "polisyos.core._private",
  "polisyos.fabric._private",
  "polisyos.foundry._private",
  "polisyos.lex._private",
  "polisyos.scholar._private",
  "polisyos.scientist._private",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
]
ignore_imports = ["polisyos.data_forge.read_api", "polisyos.data_forge.read_api.*"]

# ---------------------------------------------------------------------------
# Packs must only consume public facades.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "Packs consume only public facades"
type = "forbidden"
source_modules = ["polisyos.packs"]
forbidden_modules = [
  "polisyos.core._private",
  "polisyos.ir._private",
  "polisyos.fabric._private",
  "polisyos.foundry._private",
  "polisyos.lex._private",
  "polisyos.scientist._private",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
]

# ---------------------------------------------------------------------------
# Legacy packages are frozen: nothing imports them except their shims.
# ---------------------------------------------------------------------------

[[importlinter.contracts]]
name = "Legacy top-level packages are frozen"
type = "forbidden"
source_modules = [
  "polisyos.common",
  "polisyos.ir",
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge",
  "polisyos.packs",
]
forbidden_modules = [
  "polisyos.academic",
  "polisyos.datasets",
  "polisyos.ukraine_data",
  "polisyos.batch_common",
  "polisyos.batch_snapshot",
  "polisyos.lex.batch",
]
