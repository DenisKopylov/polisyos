[module_size_budget]
version = 1
status = "report_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-1.3"
default_warning_lines = 1000
default_fail_closed_target_lines = 2500
fail_closed_not_before = "2026-10-01"
ratchet_period = "2026-Q2..2026-Q4"
report_only_command = "uv run python tools/quality/validation/architecture_report_only_contracts.py --report module-size"
phase_4_3_overlay = "characterization-tests-and-god-module-budgets"
requires_current_lines = true
requires_extraction_sequence = true
requires_risk_notes = true
description = "Report-only module size budget. Warnings start at 1,000 lines; fail-closed conversion targets 2,500 lines after the ratchet period. Phase 4.3 records current line counts, shrink plans, owner-ready extraction sequences, and risk notes before physical splits."

