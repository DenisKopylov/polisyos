[name_registry]
version = 1
status = "phase_1c_decided"
owner = "team-architecture"
phase = "repository-structure-remediation-phase-1c"
description = "Allowed shared directory names across top-level packages plus explicit rename/removal backlog for unresolved collisions."

[defaults]
new_shared_names_allowed = false
fail_closed_for_unregistered_collisions = true
required_shared_fields = ["name", "allowed_in", "semantic_axis", "disambiguation", "owner", "target_phase", "sunset"]
required_rename_backlog_fields = ["name", "packages", "locations", "action", "owner", "target_phase", "sunset"]
phase0_4_allowed_decisions = ["scoped_ok", "rename", "merge", "canonical_home_with_adapters", "sunset_shim"]

[[shared_name]]
name = "_internal"
allowed_in = ["fabric", "foundry", "ir", "scientist"]
semantic_axis = "private implementation capsules under each bounded context"
disambiguation = "qualified imports required; _internal directories are package-private and must not be imported across package boundaries"
owner = "team-architecture"
target_phase = "4.8"
sunset = "none"

[[shared_name]]
name = "_impl"
allowed_in = [
  "corpus",
  "data_forge",
  "data_requirement",
  "legal_requirement",
  "method_requirement",
  "obligation_graph",
  "pdc",
  "policy_grammar",
  "scholar",
  "scholar_requirement",
]
semantic_axis = "package-private implementation modules behind package-level public facades"
disambiguation = "qualified imports required only inside the owning package; cross-package callers use the package facade"
owner = "team-architecture"
target_phase = "package-guardrails-closure"
sunset = "none"

