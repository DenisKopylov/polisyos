[name_registry]
version = 1
status = "phase_1c_decided"
owner = "team-architecture"
phase = "repository-structure-remediation-phase-1c"
description = "Allowed shared directory names across top-level packages plus explicit rename/removal backlog for unresolved collisions."

[defaults]
new_shared_names_allowed = false
fail_closed_for_unregistered_collisions = true
required_shared_fields = ["name", "allowed_in", "semantic_axis", "disambiguation", "owner", "target_phase", "sunset"]
required_rename_backlog_fields = ["name", "packages", "locations", "action", "owner", "target_phase", "sunset"]

