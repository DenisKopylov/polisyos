[package_boundaries]
version = 2
status = "draft"
description = """
Canonical per-package dependency contract. Each [[package]] entry is the
source of truth for the tools/quality/validation/package_boundaries.py guard.
Legacy packages are marked with `legacy = true` and carry a `migration_target`
plus `frozen = true`: no new code in-bound or out-bound.
"""

# ---------------------------------------------------------------------------
# Active product layers.
# ---------------------------------------------------------------------------

[[package]]
module = "polisyos.common"
owner = "team-core"
public_facade = "polisyos.common"
allowed_dependencies = []
forbidden_dependencies = ["polisyos.*"]

[[package]]
module = "polisyos.ir"
owner = "team-ir"
public_facade = "polisyos.ir"
allowed_dependencies = ["polisyos.common"]
forbidden_dependencies = [
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.packs",
]

[[package]]
module = "polisyos.core"
owner = "team-core"
public_facade = "polisyos.core"
allowed_dependencies = ["polisyos.common", "polisyos.ir"]
forbidden_dependencies = [
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.packs",
]

