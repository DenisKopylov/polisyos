[package_boundaries]
version = 2
status = "draft"
description = """
Canonical per-package dependency contract. Each [[package]] entry is the
source of truth for the tools/quality/validation/package_boundaries.py guard.
Legacy packages are marked with `legacy = true` and carry a `migration_target`
plus `frozen = true`: no new code in-bound or out-bound.
"""

# ---------------------------------------------------------------------------
# Active product layers.
# ---------------------------------------------------------------------------

[[package]]
module = "polisyos.common"
owner = "team-core"
public_facade = "polisyos.common"
allowed_dependencies = []
forbidden_dependencies = ["polisyos.*"]

[[package]]
module = "polisyos.ir"
owner = "team-ir"
public_facade = "polisyos.ir"
allowed_dependencies = ["polisyos.common", "polisyos.data_forge.read_api"]
forbidden_dependencies = [
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.foundry",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
  "polisyos.lex",
  "polisyos.scholar",
  "polisyos.berl",
  "polisyos.calibration",
  "polisyos.ddm",
]

