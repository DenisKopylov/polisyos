[package]
id = "common"
module = "polisyos.common"
name = "common"
owner = "team-core"
contract_status = "draft"
gate_mode = "report_only"
primary_contract = true
description = "Shared helper boundary for config, logging, serialization, and migrations."
legacy_aggregate_mirrors = [
  "architecture/packages/boundaries.toml",
  "architecture/public_surface/contract.toml",
  "architecture/imports/contracts.toml",
  "architecture/tests/topology.toml",
]

[layout]
status = "active_root_facade"
layout_owner = "team-core"
source_root = "src/polisyos/common"
readme = "src/polisyos/common/README.md"
root_facade_policy = "root package is a lazy public facade over shared helpers and migration primitives"
implementation_roots = [
  "src/polisyos/common/async_tools",
  "src/polisyos/common/config",
  "src/polisyos/common/jax_env",
  "src/polisyos/common/logger",
  "src/polisyos/common/migrations",
  "src/polisyos/common/serialization",
  "src/polisyos/common/timestamps",
]
legacy_layout_mirror = ""

[boundaries]
public_facade = "polisyos.common"
allowed_dependencies = []
forbidden_dependencies = ["polisyos.*"]
import_boundary_report = "architecture/imports/reports.toml"

[public_surface]
classification = "public_stable"
facade_mode = "lazy_facade"
registry_owner = "team-polisyos"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.common", "polisyos.common.text", "polisyos.common.config", "polisyos.common.canonical", "polisyos.common.canonical_profile", "polisyos.common.producer_request", "polisyos.common.hashing", "polisyos.common.migrations"]
major_subsystem = false
notes = "Shared helper boundary for config, logging, serialization, and migrations."

[tests]
status = "report_only"
unit_roots = ["tests/unit/common"]
contract_roots = ["tests/contract"]
integration_required = false
integration_roots = []
property_required = true
property_roots = ["tests/property/common"]
minimum_expectations = [
  "shared helper changes keep dependent package smoke coverage",
  "migration helper changes keep property coverage under tests/property/common",
]

[slo_runbook]
status = "covered_by_dependents"
slo_files = ["ops/components/common/slo.yaml"]
runbooks = ["docs/runbooks/dependency-upgrade-regression.md"]
runbook_expectation = "Common has no standalone runtime traffic; dependency, migration, or helper failures use dependent component runbooks until a standalone SLO is accepted."

# This typed edge names a controlled execution relation only. It does not
# establish production selection, traffic, attainment, or exception closure.
[[slo_runbook.dependent_bindings]]
id = "common-scientist-api-fanout"
schema_version = "1.0"
dependent_package = "scientist"
eligibility_start = "workflow_resolved"
runbook_paths = ["docs/runbooks/runtime-graceful-shutdown-and-stuck-worker.md", "docs/runbooks/benchmark-regression-triage.md"]
outcome_success_report_status = "ok"
outcome_success_metric_status = "success"
outcome_failure_metric_status = "error"

[slo_runbook.dependent_bindings.shared_operation]
package = "common"
module = "polisyos.common.async_tools"
symbol = "run_blocking_async"

[slo_runbook.dependent_bindings.consumer_operation]
package = "scientist"
module = "polisyos.scientist.api"
symbol = "run_experiment"

[slo_runbook.dependent_bindings.callsite_operation]
package = "scientist"
module = "polisyos.scientist.orchestration.engine.fan_out"
symbol = "FanOutNode.execute_async"
nested_code_name = "_run_item"

[slo_runbook.dependent_bindings.profile_operation]
package = "common"
module = "polisyos.common.async_tools"
symbol = "get_shared_executor_profile"

[slo_runbook.dependent_bindings.executor_operation]
package = "common"
module = "polisyos.common.async_tools"
symbol = "get_shared_executor"
capacity_attribute = "_max_workers"
queue_capacity_attribute = "_max_queued"

[slo_runbook.dependent_bindings.report_model]
package = "scientist"
module = "polisyos.scientist.orchestration.engine.executor"
symbol = "WorkflowReport"

[slo_runbook.dependent_bindings.manifest_model]
package = "core"
module = "polisyos.core.run.manifest"
symbol = "RunManifest"

[slo_runbook.dependent_bindings.artifact_ref_model]
package = "core"
module = "polisyos.core.artifacts.manifest"
symbol = "ArtifactRef"

[[slo_runbook.dependent_bindings.objective]]
path = "ops/observability/slo/scientist.yaml"
name = "scientist_dag_success_rate"
measurement_scope_attribute = "measurement_scope"
runbook_path = "docs/runbooks/runtime-graceful-shutdown-and-stuck-worker.md"

[[slo_runbook.dependent_bindings.objective]]
path = "ops/observability/slo/scientist.yaml"
name = "scientist_p99_duration"
measurement_scope_attribute = "measurement_scope"
runbook_path = "docs/runbooks/benchmark-regression-triage.md"

[slo_runbook.dependent_bindings.trace]
api_span_name = "experiment.workflow"
api_run_id_attribute = "polisyos.run_id"
api_workflow_id_attribute = "polisyos.workflow_id"
node_run_id_attribute = "polisyos.scientist.run_id"
node_workflow_id_attribute = "polisyos.scientist.workflow_id"
event_name = "polisyos.common.shared_executor_call"

[observability]
status = "exception"
metrics_owner = "team-core"
metric_surfaces = ["ops/components/common/runtime-contract.toml"]
trace_expectation = "Shared helper observability keeps package.name/dependency context and delegates user-visible SLOs to consuming packages."

[name_collisions]
status = "declared"
owner = "team-core"
registry = "architecture/name_registry.toml"
allowed = ["config"]

[[allowed_name_collision]]
name = "config"
scope = "canonical cross-package helper home"
reason = "Common owns runtime-agnostic configuration parsing and process bootstrap; package-specific configuration contracts remain in their owning packages."
owner = "team-core"

[exceptions]
status = "declared"
owner = "team-core"
registries = ["architecture/component_observability.toml"]

[[exception]]
id = "common-dependent-slo"
owner = "team-core"
kind = "slo_exception"
reason = "Common is a helper facade without standalone user-visible operations; reliability is covered by dependent component SLOs until it exposes runtime traffic."
sunset = "2026-08-01"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
registry = "architecture/component_observability.toml"

[sunsets]
status = "none"
owner = "team-architecture"

[extension_host]
status = "none"
owner = "team-core"
extension_points = []
registry = "architecture/extension_points.toml"
notes = "Common is a shared dependency layer, not an extension host."
