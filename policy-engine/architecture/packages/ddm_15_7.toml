[package]
id = "ddm_15_7"
module = "polisyos.ddm_15_7"
name = "ddm_15_7"
owner = "team-architecture"
contract_status = "draft"
gate_mode = "report_only"
primary_contract = true
description = "Wrapper-only compatibility facade for polisyos.ddm until the versioned package-name shim sunsets."
legacy_aggregate_mirrors = [
  "architecture/packages/boundaries.toml",
  "architecture/packages/layout.toml",
  "architecture/public_surface/contract.toml",
  "architecture/imports/contracts.toml",
]

[layout]
status = "compatibility_shim"
layout_owner = "team-architecture"
source_root = "src/polisyos/ddm_15_7"
readme = "src/polisyos/ddm_15_7/README.md"
root_facade_policy = "wrapper-only compatibility facade to polisyos.ddm; no implementation subpackages"
implementation_roots = []
legacy_layout_mirror = "architecture/packages/layout.toml"
legacy_layout_status = "compatibility_shim"

[boundaries]
public_facade = "polisyos.ddm_15_7"
compatibility_shim = true
shim_id = "ddm-15-7-rename"
allowed_dependencies = ["polisyos.ddm"]
forbidden_dependencies = [
  "polisyos.runtime",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
]
import_boundary_report = "architecture/imports/reports.toml"

[public_surface]
classification = "compatibility"
facade_mode = "eager_exports"
registry_owner = "team-architecture"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.ddm_15_7"]
major_subsystem = false
notes = "Wrapper-only compatibility facade for polisyos.ddm until 2026-07-31; tracked by ddm-15-7-rename and ADR-RSR-0135, with facade smoke coverage only."

[tests]
status = "compatibility_smoke"
unit_roots = ["tests/unit/ddm"]
contract_roots = ["tests/contract"]
integration_required = false
integration_roots = []
property_required = false
property_roots = []
minimum_expectations = [
  "compatibility facade remains wrapper-only",
  "shim removal waits for the public-surface and shims TOML sunset",
]

[slo_runbook]
status = "covered_by_target"
slo_files = ["ops/components/ddm/slo.yaml"]
runbooks = [
  "docs/runbooks/benchmark-regression-triage.md",
  "docs/runbooks/replay-or-restore.md",
]
runbook_expectation = "ddm_15_7 incidents are handled through the canonical polisyos.ddm recovery path while the shim exists."

[observability]
status = "covered_by_target"
metrics_owner = "team-scientist"
metric_surfaces = ["ops/components/ddm/runtime-contract.toml"]
trace_expectation = "The shim should not emit independent telemetry; target DDM flows own context."

[name_collisions]
status = "none"
owner = "team-architecture"
registry = "architecture/name_registry.toml"
allowed = []

[exceptions]
status = "declared"
owner = "team-architecture"
registries = ["architecture/shims.toml"]

[[exception]]
id = "ddm-15-7-rename"
owner = "team-architecture"
kind = "compatibility_shim"
reason = "Remove version/problem number from the Python package name."
sunset = "2026-07-31"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
registry = "architecture/shims.toml"

[sunsets]
status = "declared"
owner = "team-architecture"

[[sunset]]
id = "ddm-15-7-rename"
owner = "team-architecture"
date = "2026-07-31"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
condition = "public imports use polisyos.ddm and wrapper-only compatibility tests can be removed"

[extension_host]
status = "compatibility_shim"
owner = "team-architecture"
extension_points = []
registry = "architecture/extension_points.toml"
notes = "Compatibility shims cannot host extension points."
