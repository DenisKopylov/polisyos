[package]
id = "evidence"
module = "polisyos.evidence"
name = "evidence"
owner = "team-policyos-runtime"
contract_status = "draft"
gate_mode = "report_only"
primary_contract = true
description = "Internal portfolio evidence records for Policy Design Case graph compilation."
legacy_aggregate_mirrors = [
  "architecture/public_surface/contract.toml",
  "architecture/imports/contracts.toml",
  "architecture/tests/topology.toml",
]

[layout]
status = "active_internal_facade"
layout_owner = "team-policyos-runtime"
source_root = "src/polisyos/evidence"
readme = "src/polisyos/evidence/README.md"
root_facade_policy = "top-level package exposes internal evidence records; claim registry lives under evidence.claims"
implementation_roots = [
  "src/polisyos/evidence/claims",
  "src/polisyos/evidence/portfolio",
]
legacy_layout_mirror = ""

[boundaries]
public_facade = "polisyos.evidence"
allowed_dependencies = ["polisyos.common", "polisyos.core"]
forbidden_dependencies = ["polisyos.runtime", "polisyos.data_forge", "polisyos.foundry"]
import_boundary_report = "architecture/imports/reports.toml"

[public_surface]
classification = "internal"
facade_mode = "eager_exports"
registry_owner = "team-policyos-runtime"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.evidence"]
major_subsystem = false
notes = "Wave 8 internal portfolio evidence records for Policy Design Case graph compilation; not a stable public API."

[tests]
status = "report_only"
unit_roots = ["tests/unit/evidence"]
contract_roots = ["tests/unit/evidence", "tests/unit/scientist"]
integration_required = false
integration_roots = []
property_required = false
property_roots = []
minimum_expectations = ["Evidence record changes keep claim-registry and portfolio binding tests."]

[slo_runbook]
status = "not_applicable"
slo_files = ["not_applicable"]
runbooks = ["not_applicable"]
runbook_expectation = "Internal evidence records have no direct operator SLO surface."

[observability]
status = "not_applicable"
metrics_owner = "team-policyos-runtime"
metric_surfaces = []
trace_expectation = "Evidence records surface through runtime-quality and PDC audit outputs."

[name_collisions]
status = "declared"
owner = "team-policyos-runtime"
registry = "architecture/name_registry.toml"
allowed = ["claims", "evidence"]

[exceptions]
status = "none"
owner = "team-policyos-runtime"
registries = []

[sunsets]
status = "none"
owner = "team-architecture"

[extension_host]
status = "none"
owner = "team-policyos-runtime"
extension_points = []
