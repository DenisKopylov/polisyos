[package_layout]
version = 1
status = "fail_closed"
owner = "team-architecture"
phase = "repository-structure-remediation-phase-7"
description = "Repository package layout contract for root facade modules, loose Python files, empty namespace placeholders, and package file budgets."

[defaults]
max_top_level_entries = 250
max_root_py_files = 5
allowed_root_py_files = ["__init__.py", "api.py", "_api.py"]
empty_namespace_policy = "ban_if_populated_descendant_shares_name"
root_facade_policy = "root contains only package facade modules plus registered python_reexport shims; implementation lives in subpackages or _internal"
gate_mode = "fail_closed"

[root_file_exception_policy]
status = "fail_closed"
owner = "team-architecture"
default_sunset = "2026-07-31"
required_fields = ["path", "owner", "sunset", "reason"]
gate = "uv run python tools/quality/validation/check_package_import_gates.py --fail-closed"

[single_file_shell_package_policy]
status = "fail_closed"
owner = "team-architecture"
scope_roots = ["src/polisyos/fabric", "src/polisyos/ir"]
max_python_files = 2
allowed_facade_packages = []
default_sunset = "2026-07-31"
required_fields = ["path", "owner", "sunset", "reason"]
gate = "uv run python tools/quality/validation/check_package_import_gates.py --fail-closed"

[[single_file_shell_package_exception]]
path = "src/polisyos/ir/_internal"
owner = "team-ir"
sunset = "2026-07-31"
reason = "Legacy IR internal shell package is time-boxed until Wave 3 semantic grouping."

