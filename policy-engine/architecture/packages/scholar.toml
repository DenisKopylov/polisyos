[package]
id = "scholar"
module = "polisyos.scholar"
name = "scholar"
owner = "team-scholar"
contract_status = "draft"
gate_mode = "report_only"
primary_contract = true
description = "Topic enrichment, discovery, provider/search registry, and knowledge freshness facade."
legacy_aggregate_mirrors = [
  "architecture/packages/boundaries.toml",
  "architecture/public_surface/contract.toml",
  "architecture/imports/contracts.toml",
  "architecture/tests/topology.toml",
]

[layout]
status = "active_root_facade"
layout_owner = "team-scholar"
source_root = "src/polisyos/scholar"
readme = "src/polisyos/scholar/README.md"
root_facade_policy = "top-level package is a lazy facade over discovery, orchestration, and search subpackages"
implementation_roots = [
  "src/polisyos/scholar/discover",
  "src/polisyos/scholar/orchestrator",
  "src/polisyos/scholar/search",
]
legacy_layout_mirror = ""

[boundaries]
public_facade = "polisyos.scholar"
allowed_dependencies = [
  "polisyos.common",
  "polisyos.ir",
  "polisyos.core",
  "polisyos.fabric",
  "polisyos.data_forge.read_api",
]
forbidden_dependencies = [
  "polisyos.foundry",
  "polisyos.lex",
  "polisyos.scientist",
  "polisyos.runtime",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
  "polisyos.berl",
  "polisyos.calibration",
  "polisyos.ddm",
]
import_boundary_report = "architecture/imports/reports.toml"

[public_surface]
classification = "public_experimental"
facade_mode = "lazy_facade"
registry_owner = "team-polisyos"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.scholar"]
major_subsystem = false
notes = "Topic enrichment service facade; API is user-facing but still evolving."

[tests]
status = "report_only"
unit_roots = ["tests/unit/scholar"]
contract_roots = ["tests/contract"]
integration_required = false
integration_roots = []
property_required = false
property_roots = []
minimum_expectations = [
  "provider/search changes keep frozen-search or freshness tests",
  "public facade changes preserve experimental API smoke coverage",
]

[slo_runbook]
status = "covered"
slo_files = ["ops/components/scholar/slo.yaml", "ops/observability/slo/scholar.yaml"]
runbooks = [
  "docs/runbooks/docs-publication-failure.md",
  "docs/runbooks/cache-rebuild-storm.md",
  "docs/runbooks/lex-production-140k.md",
]
runbook_expectation = "Scholar provider, search registry, and knowledge freshness changes update the Scholar component bundle."

[observability]
status = "covered"
metrics_owner = "team-scholar"
metric_surfaces = ["ops/components/scholar/runtime-contract.toml", "ops/observability/slo/scholar.yaml"]
trace_expectation = "Scholar traces/logs carry provider_id, query_id, registry_version, and artifact_ref."

[name_collisions]
status = "none"
owner = "team-scholar"
registry = "architecture/name_registry.toml"
allowed = []

[exceptions]
status = "none"
owner = "team-scholar"
registries = []

[sunsets]
status = "none"
owner = "team-architecture"

[extension_host]
status = "none"
owner = "team-scholar"
extension_points = []
registry = "architecture/extension_points.toml"
notes = "Scholar provider extension ABI is not a Phase 5.8 host; add a package contract update before promoting one."
