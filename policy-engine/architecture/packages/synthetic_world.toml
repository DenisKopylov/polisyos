[package]
id = "synthetic_world"
module = "polisyos.synthetic_world"
name = "synthetic_world"
owner = "team-foundry"
contract_status = "draft"
gate_mode = "report_only"
primary_contract = true
description = "Wrapper-only compatibility facade for polisyos.foundry.agent_sim.world."
legacy_aggregate_mirrors = [
  "architecture/package_boundaries.toml",
  "architecture/package_layout.toml",
  "architecture/public_surface.toml",
  "architecture/import_contracts.toml",
]

[layout]
status = "compatibility_shim"
layout_owner = "team-foundry"
source_root = "src/polisyos/synthetic_world"
readme = "src/polisyos/synthetic_world/README.md"
root_facade_policy = "wrapper-only compatibility facade to polisyos.foundry.agent_sim.world"
implementation_roots = []
legacy_layout_mirror = "architecture/package_layout.toml"
legacy_layout_status = "compatibility_shim"

[boundaries]
public_facade = "polisyos.synthetic_world"
compatibility_shim = true
shim_id = "synthetic-world-to-agent-sim-world"
allowed_dependencies = ["polisyos.foundry.agent_sim.world"]
forbidden_dependencies = [
  "polisyos.runtime",
  "polisyos.data_forge.kernel",
  "polisyos.data_forge.domains",
]
import_boundary_report = "architecture/imports/reports.toml"

[public_surface]
classification = "compatibility"
facade_mode = "eager_exports"
registry_owner = "team-foundry"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.synthetic_world"]
major_subsystem = false
notes = "Wrapper-only compatibility facade for polisyos.foundry.agent_sim.world until 2026-10-01."

[tests]
status = "compatibility_smoke"
unit_roots = ["tests/unit/synthetic_world"]
contract_roots = ["tests/contract"]
integration_required = false
integration_roots = []
property_required = false
property_roots = []
minimum_expectations = [
  "compatibility facade remains wrapper-only",
  "target world surface changes keep shim import smoke coverage until sunset",
]

[slo_runbook]
status = "covered_by_target"
slo_files = ["ops/components/foundry/slo.yaml", "ops/observability/slo/foundry.yaml"]
runbooks = [
  "docs/runbooks/benchmark-regression-triage.md",
  "docs/runbooks/cache-rebuild-storm.md",
]
runbook_expectation = "synthetic_world incidents are handled through the Foundry agent_sim.world recovery path while the shim exists."

[observability]
status = "covered_by_target"
metrics_owner = "team-foundry"
metric_surfaces = ["ops/components/foundry/runtime-contract.toml"]
trace_expectation = "The shim should not emit independent telemetry; target Foundry world flows own context."

[name_collisions]
status = "none"
owner = "team-foundry"
registry = "architecture/name_registry.toml"
allowed = []

[exceptions]
status = "declared"
owner = "team-foundry"
registries = ["architecture/shims.toml", "architecture/static_analysis_overrides.toml"]

[[exception]]
id = "synthetic-world-to-agent-sim-world"
owner = "team-foundry"
kind = "compatibility_shim"
reason = "Consolidate truth-centric world generation under the Foundry agent simulation owner."
sunset = "2026-10-01"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
registry = "architecture/shims.toml"

[[exception]]
id = "synthetic-world-ruff-shim-ratchet"
owner = "team-foundry"
kind = "lint_ratchet"
reason = "Synthetic world shim ignores remain visible until the wrapper-only facade sunsets."
sunset = "2026-10-01"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
registry = "architecture/static_analysis_overrides.toml"

[sunsets]
status = "declared"
owner = "team-foundry"

[[sunset]]
id = "synthetic-world-to-agent-sim-world"
owner = "team-foundry"
date = "2026-10-01"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
condition = "public imports use polisyos.foundry.agent_sim.world and wrapper-only compatibility tests can be removed"

[extension_host]
status = "compatibility_shim"
owner = "team-foundry"
extension_points = []
registry = "architecture/extension_points.toml"
notes = "Compatibility shims cannot host extension points."
