[[concern]]
name = "security"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-core"
canonical_package = "polisyos.core.security"
canonical_interface = "polisyos.core.security"
canonical_home = "polisyos.core.security"
file_names = ["security"]
adapter_policy = "Package adapters may translate local resources to core identity, authorization, audit, and quota primitives; non-core packages must not define global security context APIs."
proposed_before_wave = "1.5"
public_status = "public"
semantic_axis = "tenant identity, authorization, and audit primitives versus package-local data access enforcement"
import_rule = "Cross-package security context and audit primitives import from polisyos.core.security; package security modules adapt those primitives to local resource models."
allowed_adapters = [
  { package = "fabric", module = "polisyos.fabric.security.adapters", public_status = "public", sunset = "none" },
]
sunset = "none"
unresolved_collisions = []

[[concern]]
name = "registry"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-core"
canonical_package = "polisyos.core.registry"
canonical_interface = "polisyos.core.registry"
canonical_home = "polisyos.core.registry"
file_names = ["registry"]
adapter_policy = "Package registries may adapt domain records to core registry primitives; they must stay package-qualified and must not act as process-wide registry singletons."
proposed_before_wave = "1.5"
public_status = "mixed"
semantic_axis = "generic registry primitives versus package-owned registries for manifests and runtime mechanisms"
import_rule = "Reusable registry primitives import from polisyos.core.registry; Fabric and Foundry registry facades are package-local and must not be imported as global singletons."
allowed_adapters = [
  { package = "fabric", module = "polisyos.fabric._internal.registry", public_status = "private_facade", sunset = "none" },
  { package = "foundry", module = "polisyos.foundry.registry", public_status = "compatibility_facade", sunset = "2026-10-01" },
]
sunset = "none"
unresolved_collisions = []

