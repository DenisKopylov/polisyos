[cross_cutting_concerns]
version = 1
status = "contract_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-4.8"
source_plan = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-48---cross-cutting-concern-adapters-and-naming-hygiene"
name_registry = "architecture/name_registry.toml"
description = "Canonical ownership and adapter policy for shared concern names that appear across package boundaries."

[defaults]
allowed_decisions = [
  "canonical_interface_plus_package_adapters",
  "package_local_bounded_context",
  "rename_or_sunset",
]
required_concern_fields = [
  "name",
  "decision",
  "canonical_owner",
  "semantic_axis",
  "import_rule",
  "public_status",
  "sunset",
]
global_concepts_requiring_adapters = ["observability", "security"]
adapter_rule = "Global concepts import their canonical interface from core/top-level packages and expose package-local adapters instead of duplicating the global contract."
bounded_context_rule = "The same name may repeat only when the semantic axis documents why each package owns a different concept."
rename_rule = "Unresolved global collisions must carry an owner, replacement direction, and sunset date in this contract or name_registry.toml."
required_scoped_exception_fields = ["concern", "path", "owner", "rationale", "sunset"]

[canonical_home_contract]
phase = "repository-best-in-class-last-mile-phase-1.5"
adr = "docs/adr/repository-structure-0148-cross-cutting-concern-canonical-homes.md"
fail_closed = true
adapter_module_pattern = "polisyos.<package>._adapters.<concern>"
adapter_path_pattern = "src/polisyos/<package>/_adapters/<concern>.py"
top_level_root_rule = "Only the canonical home may introduce a root concern file or first-level concern package. Non-canonical roots require a scoped exception with owner, rationale, and sunset."
group_level_file_rule = "Files named after cross-cutting concerns below package groups must live under <package>/_adapters/<concern>.py or carry a scoped exception with owner, rationale, and sunset."
blocked_file_names = [
  "observability",
  "telemetry",
  "security",
  "registry",
  "discovery",
  "configuration",
  "config",
  "tracing",
  "trace",
  "calibration",
]
protected_wave_roots = ["src/polisyos/fabric", "src/polisyos/ir"]

[[concern]]
name = "observability"
decision = "canonical_interface_plus_package_adapters"
canonical_owner = "team-observability"
canonical_package = "polisyos.core.observability"
canonical_interface = "polisyos.core.observability"
canonical_home = "polisyos.core.observability"
file_names = ["observability", "telemetry"]
adapter_policy = "Package adapters may translate local metric, log, and SLO vocabulary to polisyos.core.observability; they must not define competing cross-package telemetry APIs."
proposed_before_wave = "1.5"
public_status = "public"
semantic_axis = "process-wide telemetry primitives versus package-local telemetry vocabulary"
import_rule = "Cross-component telemetry imports use polisyos.core.observability; package-specific metric names, alert records, and SLO helpers stay behind package adapters."
allowed_adapters = [
  { package = "fabric", module = "polisyos.fabric._adapters.observability", public_status = "public", sunset = "none" },
  { package = "scientist", module = "polisyos.scientist._adapters.observability", public_status = "private", sunset = "none" },
]
sunset = "none"
unresolved_collisions = []

