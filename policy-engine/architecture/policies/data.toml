[data_policy]
version = 1
owner = "team-data-forge"
local_data_lake = "data/policy-engine-local"
local_data_lake_status = "adr_backed_legacy_local_state_name"
local_data_lake_adr = "docs/adr/repository-structure-0147-data-root-local-state-naming.md"
product_data_root = "data"
product_commit_policy = "allowlist_only"
max_committed_example_bytes = 10485760
promotion_rule = "Bulk local data can be committed only after being reduced to a fixture, contract, manifest, registry entry, or tiny gold example and registered in architecture/generated_artifacts.toml."
cleanup_commands = [
  "rm -rf data/bronze data/silver data/gold data/manifests data/quarantine",
  "rm -rf data/policy-engine-local/raw data/policy-engine-local/curated data/policy-engine-local/databases",
]

[[medallion_zone]]
id = "bronze"
path = "data/bronze"
state = "ignored_local"
retention_class = "short_lived_source_cache"
cleanup_command = "rm -rf data/bronze"

[[medallion_zone]]
id = "silver"
path = "data/silver"
state = "ignored_local"
retention_class = "intermediate_transform"
cleanup_command = "rm -rf data/silver"

[[medallion_zone]]
id = "gold"
path = "data/gold"
state = "ignored_local"
retention_class = "review_candidate"
cleanup_command = "rm -rf data/gold"

[[medallion_zone]]
id = "manifests"
path = "data/manifests"
state = "ignored_local"
retention_class = "local_evidence"
cleanup_command = "rm -rf data/manifests"

[[medallion_zone]]
id = "quarantine"
path = "data/quarantine"
state = "ignored_local"
retention_class = "security_or_schema_hold"
cleanup_command = "rm -rf data/quarantine"

[[product_data_class]]
id = "academic_gold_examples"
paths = ["data/academic_gold/"]
commit_policy = "committed_tiny_gold"
allowed_patterns = [
  "data/academic_gold/*.md",
  "data/academic_gold/*.json",
  "data/academic_gold/*.jsonl",
]
owner = "team-data-forge"

[[product_data_class]]
id = "dataset_catalog_registry"
paths = ["data/dataset_catalog/"]
commit_policy = "committed_registry"
allowed_patterns = ["data/dataset_catalog/*.yaml"]
owner = "team-data-forge"

[[product_data_class]]
id = "legacy_local_data_lake_documentation"
paths = ["data/policy-engine-local/README.md"]
commit_policy = "committed_documentation"
allowed_patterns = ["data/policy-engine-local/README.md"]
owner = "team-data-forge"
adr = "docs/adr/repository-structure-0147-data-root-local-state-naming.md"

[[product_data_class]]
id = "local_raw_curated_database_outputs"
paths = [
  "data/policy-engine-local/raw/",
  "data/policy-engine-local/curated/",
  "data/policy-engine-local/databases/",
]
commit_policy = "ignored_local"
allowed_patterns = [
  "data/policy-engine-local/raw/*",
  "data/policy-engine-local/curated/*",
  "data/policy-engine-local/databases/*",
]
owner = "team-data-forge"
