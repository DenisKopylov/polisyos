schema_version: policyos.construct_registry.v1
registry_id: policyos.policy_evidence.construct_registry
registry_version: 2026.05.phase2
rule_version_ref: construct-registry-v1.0
owner: team-runtime-quality
source_refs:
  - repo://docs/adr/0174-policy-evidence-capability-graph.md
  - repo://docs/plans/active/POLICYOS_POLICY_EVIDENCE_CAPABILITY_GRAPH_PLAN.md#phase-2---construct-registry
  - repo://data/dataset_catalog/metrics_map.yaml
  - repo://production_data/canonical/local_data_20260501/ukraine_server_support_20260410/runtime_calibration_internals/calibration/d2/measurement_registry.json
compatibility_policy:
  legacy_scenario_family_aliases: deprecated_projection_only
  authority_selector: construct
  may_not_use_for:
    - evidence_authority_selector
    - production_closeout_authority
authority_boundary:
  authoritative_for:
    - governed_construct_semantics
    - construct_authority_requirement_inspection
  may_not_use_for:
    - producer_evidence_authority
    - scenario_family_authority
    - capability_binding_without_resolver
summary:
  construct_count: 40
constructs:
  - construct_id: construct:firm_survival
    aliases: [firm survival, msme survival, survival_status]
    compatibility_aliases:
      - alias: production_msme_panel
        alias_type: legacy_scenario_family
        deprecation: &legacy_family_deprecation
          status: deprecated
          owner: team-runtime-quality
          created: "2026-05-25"
          sunset_date: "2026-12-31"
          sunset_trigger: Policy Evidence Capability Graph Phase 7 closes legacy scenario-family authority.
          replacement: construct_to_capability_resolver
          reason: Scenario-family labels map to constructs for compatibility but do not grant authority.
          may_not_use_for: [evidence_authority_selector, production_closeout_authority]
    domain: [msme_credit, employment_outcome]
    entity_scope: [firm]
    description: Whether a firm continues operating or exits within a defined horizon.
    concept_spine_ref: concept:firm_survival
    required_time_roles: &time_roles_default [observation_time, policy_time, freshness_time, replay_time]
    allowed_evidence_modes: &modes_default
      - observed
      - derived
      - proxy_observational
      - bounds_only
      - legal_threshold
      - scholarly_causal_support
      - participation_attestation
      - reviewer_admitted
    authority_requirements: &authority_admin_proxy
      research:
        identification_modes: [point_identified, partially_identified, proxy_identified, bounds_only]
        trust_tier_min: weak_anchor
        requires_proxy_validation_when_proxy: false
        requires_construct_validity_evidence: false
        construct_validity_floor: face_validated
        admissible_authority_results: [admissible, admissible_with_limitation]
      governed_pilot:
        identification_modes: [point_identified, partially_identified, proxy_identified]
        trust_tier_min: administrative_noisy
        requires_proxy_validation_when_proxy: true
        requires_construct_validity_evidence: true
        construct_validity_floor: proxy_validated
        admissible_authority_results: [admissible, admissible_with_proxy_limitation]
      production:
        identification_modes: [point_identified, partially_identified]
        trust_tier_min: authoritative_partial_coverage
        requires_proxy_validation_when_proxy: true
        requires_construct_validity_evidence: true
        construct_validity_floor: construct_validated
        admissible_authority_results: [admissible]
    construct_validity_requirements: &validity_default
      minimum_status_by_posture:
        research: face_validated
        governed_pilot: proxy_validated
        production: construct_validated
      required_validation_refs: [semantic_probe, negative_control]
      negative_controls: [name_match_only, simulation_only, llm_candidate_only]
    proxy_validation_rules: &proxy_rules_default
      - proxy evidence must name the latent construct and the observable proxy.
      - proxy evidence must carry construct_validity_status for governed_pilot and production.
      - old family labels never satisfy proxy validation by name alone.
    allowed_method_contracts: [foundry.ml.survival_data.v1, foundry.causal.dynamic_treatment_data.v1]
    legal_authority_patterns:
      - norm_type: eligibility
      - threshold_metric_any: [employee_count, annual_revenue]
    related_scholar_claim_patterns:
      - cause: construct:credit_access
        effect: construct:firm_survival
    corpus_bindings:
      - case_id: ua-msme-affordable-loans-2022
        obligation_refs: [obligation:claim-level-credit-additionality]
        evidence_family_refs: [bank_portfolio_and_credit_additionality_data]
      - case_id: w11a_us_ppp_2020
        obligation_refs: [obligation:ppp-cross-program-fraud-screening]
        evidence_family_refs: [fraud_risk_analytics]
    source_refs:
      - repo://production_data/canonical/local_data_20260501/ukraine_server_support_20260410/normalized_corpus/normalized/dps_financials
      - repo://production_data/canonical/local_data_20260501/ukraine_server_support_20260410/runtime_calibration_internals/calibration/d2/measurement_registry.json#firm_fundamentals

