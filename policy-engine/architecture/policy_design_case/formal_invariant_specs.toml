[[specs]]
spec_id = "bounded_liveness_escalation_authority"
family = "formal_temporal_liveness_invariant_spec.v1"
owner = "team-runtime-quality"
source_adrs = ["ADR-0169"]
statement = "Runtime liveness escalation is visible governance evidence but never domain evidence or closeout satisfaction."
protected_authority_property = "Escalated, timed_out, blocked, degraded, abandoned, and rerun_required states may block, downgrade, acquire, reissue, or review, but cannot satisfy evidence authority."
implementation_scopes = [
  "src/polisyos/runtime/quality/formal_invariants.py",
  "src/polisyos/runtime/quality/closeout_reader.py",
  "src/polisyos/runtime/quality/producer_pipeline.py",
]
accepted_check_type = "state_machine_model_check"
model_property = "bounded_liveness_escalation_does_not_satisfy_authority"
minimum_evidence_artifacts = [
  "architecture/policy_design_case/formal_invariant_specs.toml",
  "tests/unit/runtime/quality/test_formal_invariants.py",
  "tests/unit/runtime/quality/test_closeout_reader.py",
]
revisit_triggers = [
  "Closeout readers consume new liveness states.",
  "Producer escalation status vocabulary changes.",
  "Authority boundary fields change for runtime blockers.",
]
retirement_rule = "May be superseded only by an ADR that keeps runtime escalation outside domain authority."
criticality = "substrate_critical"
status = "active"
negative_tests = [
  "tests/unit/runtime/quality/test_formal_invariants.py::test_bounded_liveness_rejects_escalation_authority_and_late_reissue",
]

