[[specs]]
spec_id = "bounded_liveness_producer_pipeline"
family = "formal_temporal_liveness_invariant_spec.v1"
owner = "team-runtime-quality"
source_adrs = ["ADR-0169"]
statement = "C40 producer waits must satisfy their expected state within the governed deadline or emit runtime escalation."
protected_authority_property = "A producer in requested, preflighted, waiting_on_spine, or waiting_on_peer cannot remain live past deadline without escalation; late success cannot satisfy liveness."
implementation_scopes = [
  "src/polisyos/runtime/quality/formal_invariants.py",
  "src/polisyos/runtime/quality/producer_pipeline.py",
  "src/polisyos/runtime/quality/concept_spine.py",
]
accepted_check_type = "state_machine_model_check"
model_property = "bounded_liveness_producer_pipeline_deadline_consistency"
minimum_evidence_artifacts = [
  "architecture/policy_design_case/formal_invariant_specs.toml",
  "tests/unit/runtime/quality/test_formal_invariants.py",
  "tests/unit/runtime/quality/test_producer_pipeline.py",
]
revisit_triggers = [
  "C40 producer states change.",
  "Producer pipeline liveness record shape changes.",
  "Closeout-sensitive producer wait semantics change.",
]
retirement_rule = "May be superseded only by an ADR that preserves finite deadline-or-escalate semantics for producer waits."
criticality = "substrate_critical"
status = "active"
negative_tests = [
  "tests/unit/runtime/quality/test_formal_invariants.py::test_bounded_liveness_flags_producer_wait_past_deadline_without_escalation",
  "tests/unit/runtime/quality/test_producer_pipeline.py::test_waiting_on_peer_without_artifact_fields_and_deadline_emits_liveness_blocker",
]

