[metadata]
schema_version = "policyos.source_truth_lattice.v1"
owner = "team-runtime-quality"
next_diagnostic_command = "uv run pytest tests/unit/runtime/quality/test_layer3_g1_substrate_grounding.py::test_g1_adapter_contract_registry_loads_with_existing_loader_and_two_paths -q"

[semantic_preservation]
required_fields = [
  "status",
  "provenance",
  "owner",
  "schema",
  "rule_version",
  "lineage",
  "tenant",
  "time_context",
  "jurisdiction",
  "source_family",
  "method_expectation",
  "claim_sets",
  "rights",
  "freshness",
  "contamination",
  "authority_boundary",
]

[losing_authority_record_format]
schema = "policyos.runtime.quality.losing_authority_record.v1"
required_fields = [
  "record_schema",
  "field_family",
  "authoritative_producer",
  "authoritative_surface",
  "losing_surface",
  "lost_fields",
  "failure_code",
  "owner",
  "next_diagnostic_command",
]

[[field_families]]
id = "runtime_refs"
description = "Runtime refs and G1 artifact identities crossing acquisition/SourceContract adapters."
authoritative_producer = "polisyos.runtime.quality.proving_ground.substrate_grounding_search"
owner = "team-runtime-quality"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_runtime_ref_authority_conflict"
required_semantic_fields = ["lineage", "schema", "rule_version"]
adapter_semantic_preservation_requirements = [
  "preserve G1 artifact refs and schema/rule versions",
  "preserve lineage refs before adapter admission",
]

[[field_families]]
id = "final_claims"
description = "Claim-related fields remain empty for G1 because search and SourceContracts are not claim authority."
authoritative_producer = "scientist.claim_compiler"
owner = "team-policy-semantics"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_final_claim_authority_conflict"
required_semantic_fields = ["claim_sets", "authority_boundary"]
adapter_semantic_preservation_requirements = [
  "preserve the empty claim set",
  "preserve may-not-use authority boundaries that block claim authority",
]

[[field_families]]
id = "source_data_context"
description = "Source family, dataset lineage, freshness, rights, and contamination context."
authoritative_producer = "fabric.source_contract"
owner = "team-runtime-quality"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_source_data_authority_conflict"
required_semantic_fields = [
  "source_family",
  "lineage",
  "rights",
  "freshness",
  "contamination",
]
adapter_semantic_preservation_requirements = [
  "preserve production-vs-fixture provenance",
  "preserve rights, freshness, and contamination status",
]

[[field_families]]
id = "legal_context"
description = "Jurisdiction and rights context attached to source use."
authoritative_producer = "fabric.source_contract"
owner = "team-policy-semantics"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_legal_context_authority_conflict"
required_semantic_fields = ["jurisdiction", "rights", "time_context", "lineage"]
adapter_semantic_preservation_requirements = [
  "preserve jurisdiction and legal-use limits",
  "block projection if rights are missing or weakened",
]

[[field_families]]
id = "foundry_method_context"
description = "Method expectation for using G1 data as substrate grounding only."
authoritative_producer = "foundry.method_quality"
owner = "team-runtime-quality"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_method_context_authority_conflict"
required_semantic_fields = ["method_expectation", "authority_boundary", "lineage"]
adapter_semantic_preservation_requirements = [
  "preserve that G1 is not causal or publication authority",
  "preserve method limitations through adapters",
]

[[field_families]]
id = "scorecard_identity_and_gates"
description = "G1 gate status and blocker semantics for readiness surfaces."
authoritative_producer = "polisyos.runtime.quality.proving_ground.substrate_grounding_search"
owner = "team-quality-closeout"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_scorecard_identity_conflict"
required_semantic_fields = ["status", "schema", "rule_version", "authority_boundary"]
adapter_semantic_preservation_requirements = [
  "preserve pass/fail status and blocker semantics",
  "block adapter promotion from projection-only evidence",
]

[[field_families]]
id = "approval_readiness_public_status"
description = "Readiness status with public/reviewer projection explicitly out of scope for G1."
authoritative_producer = "runtime.approval"
owner = "team-quality-closeout"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_approval_readiness_authority_conflict"
required_semantic_fields = ["status", "authority_boundary", "schema", "rule_version"]
adapter_semantic_preservation_requirements = [
  "preserve that G1 does not publish or approve",
  "preserve out-of-scope surface boundaries",
]

[[field_families]]
id = "mode_and_fallback_records"
description = "Fallback deletion, hardcode strangle, and fail-closed gap routing records."
authoritative_producer = "polisyos.runtime.quality.proving_ground.substrate_grounding_search"
owner = "team-runtime-quality"
allowed_projection_surfaces = [
  "layer3.data_asset_port",
  "fabric.acquisition_record",
  "fabric.source_contract",
  "layer3.g1.audit_surface",
]
allowed_package_surfaces = [
  "layer3.g1.readiness",
  "layer3.g1.machine_surface",
]
conflict_failure_code = "layer3_g1_mode_fallback_authority_conflict"
required_semantic_fields = ["status", "method_expectation", "authority_boundary"]
adapter_semantic_preservation_requirements = [
  "preserve fail-closed fallback status",
  "block hardcoded construct fallback from closing G1",
]

[[adapter_paths]]
id = "layer3_data_asset_port_to_source_contract"
source_surface = "layer3.data_asset_port"
target_surface = "fabric.source_contract"
field_families = [
  "runtime_refs",
  "final_claims",
  "source_data_context",
  "legal_context",
  "foundry_method_context",
  "scorecard_identity_and_gates",
  "approval_readiness_public_status",
  "mode_and_fallback_records",
]
required_semantic_fields = [
  "status",
  "provenance",
  "owner",
  "schema",
  "rule_version",
  "lineage",
  "tenant",
  "time_context",
  "jurisdiction",
  "source_family",
  "method_expectation",
  "claim_sets",
  "rights",
  "freshness",
  "contamination",
  "authority_boundary",
]
blocker_code = "layer3_g1_semantic_loss"
owner = "team-runtime-quality"
next_diagnostic_command = "uv run pytest tests/unit/runtime/quality/test_layer3_g1_substrate_grounding.py::test_g1_adapter_contract_registry_loads_with_existing_loader_and_two_paths -q"

