id = "layer3_g3_l2_skg_to_proof_candidate_binding"
source_surface = "layer3.g3.l2_skg"
target_surface = "layer3.g3.ir_catalog"
field_families = [
  "runtime_refs",
  "final_claims",
  "source_data_context",
  "legal_context",
  "foundry_method_context",
  "scorecard_identity_and_gates",
  "approval_readiness_public_status",
  "mode_and_fallback_records",
]
