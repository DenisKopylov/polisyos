  "jurisdiction",
  "source_family",
  "method_expectation",
  "claim_sets",
  "rights",
  "freshness",
  "contamination",
  "authority_boundary",
]
blocker_code = "layer3_g3_adapter_contract_registry_missing"
owner = "team-runtime-quality"
