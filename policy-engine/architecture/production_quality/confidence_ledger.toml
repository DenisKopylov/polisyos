weight = { numerator = 3, denominator = 20 }
obligation_classes = ["calibration"]

[[obligation_pools]]
pool_id = "data"
weight = { numerator = 1, denominator = 10 }
obligation_classes = ["data"]

[[obligation_pools]]
pool_id = "eval"
weight = { numerator = 1, denominator = 10 }
obligation_classes = ["implementation", "eval_safety"]

[[obligation_pools]]
pool_id = "mc"
weight = { numerator = 1, denominator = 10 }
obligation_classes = ["coupling", "equilibrium"]

[[proof_profiles]]
