schema_version = "policyos.runtime.confidence_ledger.registry.v1"

[policy]
delta = { numerator = 1, denominator = 100 }
default_schedule_profile_id = "default_basel_square"
conditionality_clause = "P(false promotion | maintained assumptions) <= delta is conditional on obligation completeness + validator soundness (the spec's A4 = our open P29)."

[[schedule_profiles]]
profile_id = "default_basel_square"
proof_kernel_id = "basel_square_v1"
mass = { numerator = 1, denominator = 1 }

[[schedule_profiles]]
profile_id = "half_mass_basel_square"
proof_kernel_id = "basel_square_v1"
mass = { numerator = 1, denominator = 2 }

[[obligation_pools]]
pool_id = "value"
weight = { numerator = 1, denominator = 5 }
obligation_classes = ["normative", "value"]

[[obligation_pools]]
pool_id = "ground"
weight = { numerator = 3, denominator = 20 }
obligation_classes = ["syntax", "type", "slot", "param"]

[[obligation_pools]]
pool_id = "id"
weight = { numerator = 1, denominator = 5 }
obligation_classes = ["effect", "identification", "measurement"]

[[obligation_pools]]
