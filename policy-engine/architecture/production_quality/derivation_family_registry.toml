[[families]]
family_id = "share_of_aggregate_exact_year"
method_id = "arithmetic.exact_year.share_times_aggregate"
method_version = "1.0.0"
year_domain_role = "share"
input_specs = [
  { role = "aggregate", basis = { quantity_kind = "monetary_scale", unit = "usd", attributes = [{ name = "currency", value = "USD" }, { name = "price_basis", value = "current" }] }, value_constraints = [] },
  { role = "share", basis = { quantity_kind = "share_of_aggregate", unit = "percent", attributes = [{ name = "denominator", value = "gross_domestic_product" }] }, value_constraints = [] },
]
output_basis = { quantity_kind = "monetary_flow", unit = "usd", attributes = [{ name = "currency", value = "USD" }, { name = "price_basis", value = "current" }] }
parameter_rules = []
output_parameter_bindings = []
expression = { operator = "divide", operands = [{ operator = "multiply", operands = [{ operator = "current_value", role = "aggregate" }, { operator = "current_value", role = "share" }] }, { operator = "constant", constant_value = "100" }] }
assumption_rules = [
  { name = "formula", literal_value = "aggregate_t * share_t / 100" },
  { name = "year_join", literal_value = "exact; no interpolation" },
]
