[registry]
name = "polisyos.runtime_quality.diagnostic_event_types"
version = "1.0"
owner = "team-observability"
adr = "ADR-0154"
description = "Registry-scoped diagnostic event types for serious-run authority, projection, replay, and reconciliation events."

[[event_types]]
name = "polisyos.runtime.diagnostic.producer_execution.v1"
category = "producer_execution"
description = "A runtime producer executed and emitted or blocked authority-bearing evidence."
owner = "team-runtime-quality"
authority_role = "runtime_authority"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime"]
payload_ref_policy = "cas_required_for_authority_payload"

[[event_types]]
name = "polisyos.runtime.diagnostic.cas_write.v1"
category = "cas_write"
description = "A runtime component wrote an authority payload or artifact to CAS."
owner = "team-runtime-quality"
authority_role = "runtime_authority"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime", "polisyos.cas"]
payload_ref_policy = "cas_required"

[[event_types]]
name = "polisyos.runtime.diagnostic.ref_publication.v1"
category = "ref_publication"
description = "A runtime-owned CAS ref was published to a reader, control plane, or progress surface."
owner = "team-runtime-quality"
authority_role = "runtime_authority"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime"]
payload_ref_policy = "optional"

[[event_types]]
name = "polisyos.runtime.diagnostic.phase_transition.v1"
category = "phase_transition"
description = "A serious-run state machine phase transition was accepted or blocked."
owner = "team-runtime-control"
authority_role = "runtime_authority"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime"]
payload_ref_policy = "optional"

[[event_types]]
name = "polisyos.runtime.diagnostic.blocker.v1"
category = "blocker"
description = "A typed blocker was emitted for missing, stale, incompatible, or unsafe authority evidence."
owner = "team-runtime-quality"
authority_role = "runtime_blocker"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime"]
payload_ref_policy = "optional"

[[event_types]]
name = "polisyos.runtime.diagnostic.effective_mode.v1"
category = "effective_mode"
description = "A requested/effective mode ledger was emitted for a serious run or canary lane."
owner = "team-runtime-ops"
authority_role = "runtime_authority"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime"]
payload_ref_policy = "optional"

[[event_types]]
name = "polisyos.runtime.diagnostic.fallback_degradation.v1"
category = "fallback_degradation"
description = "A fallback, degradation, fixture overlay, adapter downgrade, or simulated path was ledgered."
owner = "team-runtime-ops"
authority_role = "runtime_authority"
phase_required = true
producer_required = true
serious_no_sampling = true
allowed_event_sources = ["polisyos.runtime"]
payload_ref_policy = "optional"

