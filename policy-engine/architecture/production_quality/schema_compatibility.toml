schema_version = "policyos.production_quality.schema_compatibility.v1"
owner = "runtime.quality"
purpose = "Producer-reader schema compatibility and legacy quarantine declarations for Honest Diagnostics Substrate closeout."

decisions = [
  "compatible",
  "compatible_with_migration",
  "legacy_quarantined",
  "unknown_schema_blocked",
  "incompatible_blocked",
  "stale_schema_blocked",
]

production_closeout_blocking_decisions = [
  "legacy_quarantined",
  "unknown_schema_blocked",
  "incompatible_blocked",
  "stale_schema_blocked",
]

[[readers]]
name = "scorecard"
consumer = "polisyos.runtime.quality.scorecard"
production_closeout_policy = "block_non_compatible"
diagnostic_policy = "legacy_readable_only"
accepted_schema_families = [
  "policyos.runtime.production_data_quality",
  "policyos.lex.normative_applicability_report",
  "policyos.fabric.source_selection_trace",
  "policyos.foundry.method_quality_report",
  "policyos.scientist.policy_grounding_matrix",
  "policyos.lex.policy_conflict_check",
  "policyos.foundry.causal_statistical_validity",
  "policyos.replay_manifest",
  "policyos.drift_explanation",
  "policyos.runtime.resilience_matrix",
  "policyos.runtime_resilience_matrix",
  "policyos.human_review_calibration_report",
  "policyos.scientist.decision_artifact_quality",
  "policyos.privacy_compliance_report",
  "policyos.runtime.policy_design_case.rule_evolution_registry",
  "policyos.runtime.governance_lifecycle_report",
]
min_version = "1"
max_version = "1"
current_version = "1"
legacy_versions = ["0"]

[[readers]]
name = "readiness"
consumer = "production_quality_best_in_class_readiness"
production_closeout_policy = "block_non_compatible"
