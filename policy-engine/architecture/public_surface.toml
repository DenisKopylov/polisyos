[public_surface]
version = 1
internal_rule = "Any polisyos module path not listed in this manifest is internal by default."
version_owner = "team-architecture"
deprecation_window = "2 minor releases for public_stable removals; compatibility package rows use their explicit shim sunset date."
release_fragment_change_class = "python-public-api"
inventory = "architecture/public_surface_inventory.json"
inventory_regenerate_command = "uv run polisyos-tools quality public-surface snapshot --all"
inventory_review_owner = "team-architecture"
inventory_review_policy = "Public-surface release fragments must declare surface_classification and set public_surface_inventory_reviewed=true after the committed inventory is regenerated or reviewed."

[[package]]
module = "polisyos.common"
classification = "public_stable"
facade_mode = "lazy_facade"
owner = "team-polisyos"
readme = "src/polisyos/common/README.md"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.common"]
major_subsystem = false
notes = "Shared helper boundary for config, logging, serialization, and migrations."

[[package]]
module = "polisyos.core"
classification = "public_stable"
facade_mode = "lazy_facade"
owner = "team-polisyos"
readme = "src/polisyos/core/README.md"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.core"]
major_subsystem = true
notes = "Cross-layer contracts, CAS, registry, observability, and security primitives."

[[package]]
module = "polisyos.ir"
classification = "public_stable"
facade_mode = "lazy_facade"
owner = "team-polisyos"
readme = "src/polisyos/ir/README.md"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.ir", "polisyos.ir.api"]
major_subsystem = true
notes = "Primary compatibility boundary for policy, governance, analytics, and observation contracts; api.py owns public-surface helper metadata."

[[package]]
module = "polisyos.fabric"
classification = "public_stable"
facade_mode = "lazy_facade"
owner = "team-polisyos"
readme = "src/polisyos/fabric/README.md"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = ["polisyos.fabric", "polisyos.fabric.api"]
major_subsystem = true
notes = "Connector-backed ingestion, world queries, and catalog surfaces."

[[package]]
module = "polisyos.foundry"
classification = "public_stable"
facade_mode = "lazy_facade"
owner = "team-polisyos"
readme = "src/polisyos/foundry/README.md"
reference_doc = "docs/reference/public-surface.md"
supported_entrypoints = [
  "polisyos.foundry",
  "polisyos.foundry.api",
  "polisyos.foundry.compile",
  "polisyos.foundry.execute",
]
major_subsystem = true
notes = "Stable compile/execute facade over the compute and method stack. Phase 6 keeps root public exports in polisyos.foundry.api and narrow public subpackages; moved legacy FQN are compatibility shims registered in architecture/shims.toml."

[[package]]
module = "polisyos.scientist"
classification = "public_stable"
