[public_surface]
version = 1
internal_rule = "Any polisyos module path not listed in this manifest is internal by default."
version_owner = "team-architecture"
deprecation_window = "2 minor releases for public_stable removals; compatibility package rows use their explicit shim sunset date."
release_fragment_change_class = "python-public-api"
inventory = "architecture/public_surface/inventory.json"
inventory_regenerate_command = "uv run python tools/devx/architecture/guardrails.py sync --skip-deep-import-baseline"
inventory_review_owner = "team-architecture"
inventory_review_policy = "Public-surface release fragments must declare surface_classification and set public_surface_inventory_reviewed=true after the committed inventory is regenerated or reviewed."
last_mile_import_map = "architecture/shims.toml#last_mile_import_compatibility_map"
last_mile_shim_caller_report = "_build/.tmp/last-mile/shim_callers.json"
last_mile_shim_caller_report_command = "uv run python tools/quality/validation/repository_last_mile_shim_callers.py --json-output _build/.tmp/last-mile/shim_callers.json --check"

[[generated_artifact_family]]
id = "policy-design-case-layer3-gy-loop-artifacts"
owner = "team-runtime-quality"
regenerate = "uv run python tools/quality/validation/check_layer3_gy_loop_artifacts.py --repo-root . --write --output-format json"
stale_output_behavior = "fail"
outputs = [
  "architecture/policy_design_case/layer3_gy_production_loop_run_proofs.json",
]

