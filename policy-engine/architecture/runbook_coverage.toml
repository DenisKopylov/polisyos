[runbook_coverage]
version = 2
status = "report_only"
owner = "team-ops"
phase = "repository-best-in-class-phase-4.9"
default_gate_mode = "report_only"
description = "Package and component runbook coverage map."
ops_organization_decision = "invert_to_ops_components"
component_bundle_root = "ops/components"
component_bundle_status = "active_drafts_in_ops_components"
component_index = "ops/components/index.toml"
alert_policy = "every Prometheus alert must map to at least one runbook or an explicit exception before fail-closed conversion"
preferred_bundle_shape = [
  "README.md",
  "slo.yaml",
  "alerts.yml",
  "dashboard.json",
  "runbooks.md",
  "runtime-contract.toml",
  "retention-policy.toml",
]
phase_6_6_completeness_gate = "fail_closed"
phase_6_6_plan_window_start = "2026-05-07"
phase_6_6_plan_completion_target = "2026-05-31"
phase_6_6_exception_minimum_days_after_completion = 90
required_public_stable_bundle_files = [
  "README.md",
  "alerts.yml",
  "dashboard.json",
  "retention-policy.toml",
  "runbooks.md",
  "runtime-contract.toml",
  "slo.yaml",
]
exception_policy = "SLO exceptions require owner, reason, expiration, and an action plan due inside the last-mile plan window unless the exception expires at least 90 days after the plan completion target."

[[coverage]]
id = "fabric-ingestion-recovery"
package = "fabric"
owner = "team-fabric"
status = "covered"
contract = "architecture/packages/fabric.toml"
runbooks = ["docs/runbooks/fabric-quarantine-dlq-and-data-plane-recovery.md"]
slo_files = ["ops/observability/slo/fabric.yaml"]
expectation = "Connector ingestion, quarantine, DLQ, and data-plane recovery changes update the runbook."

[[coverage]]
id = "foundry-method-registry-recovery"
package = "foundry"
owner = "team-foundry"
status = "covered"
contract = "architecture/packages/foundry.toml"
runbooks = ["docs/runbooks/benchmark-regression-triage.md"]
slo_files = ["ops/components/foundry/slo.yaml", "ops/observability/slo/foundry.yaml"]
expectation = "Foundry method-registry and execution degradation changes update the Foundry bundle before fail-closed conversion."

[[coverage]]
id = "core-artifact-audit-recovery"
package = "core"
owner = "team-core"
status = "covered"
contract = "ops/components/core/runtime-contract.toml"
runbooks = [
  "docs/runbooks/artifact-corruption-recovery.md",
  "docs/runbooks/idempotency-incident.md",
  "docs/runbooks/mutation-audit-investigation.md",
  "docs/runbooks/cas-opa-outage.md",
]
slo_files = ["ops/components/core/slo.yaml", "ops/observability/slo/core.yaml"]
expectation = "Core artifact, audit, idempotency, and tenant-boundary changes update the Core bundle."

[[coverage]]
id = "ir-schema-compatibility-recovery"
package = "ir"
owner = "team-ir"
status = "covered"
contract = "architecture/packages/ir.toml"
runbooks = [
  "docs/runbooks/broken-contract-generation.md",
  "docs/runbooks/dependency-upgrade-regression.md",
]
slo_files = ["ops/components/ir/slo.yaml", "ops/observability/slo/ir.yaml"]
expectation = "IR schema catalog, migration, and compatibility changes update the IR bundle."

[[coverage]]
id = "lex-scholar-knowledge-freshness"
package = "lex-scholar"
owner = "team-lex"
status = "covered"
contract = "ops/components/lex/runtime-contract.toml"
runbooks = [
  "docs/runbooks/lex-production-140k.md",
  "docs/runbooks/cache-rebuild-storm.md",
  "docs/runbooks/docs-publication-failure.md",
]
slo_files = [
  "ops/components/lex/slo.yaml",
  "ops/components/scholar/slo.yaml",
  "ops/observability/slo/lex.yaml",
  "ops/observability/slo/scholar.yaml",
]
expectation = "Lex and Scholar freshness or provider/search changes update their component bundles."

[[coverage]]
id = "scientist-replay-restore"
package = "scientist"
owner = "team-scientist"
status = "covered"
contract = "architecture/packages/scientist.toml"
runbooks = [
  "docs/runbooks/replay-or-restore.md",
  "docs/runbooks/runtime-graceful-shutdown-and-stuck-worker.md",
]
slo_files = ["ops/observability/slo/scientist.yaml"]
expectation = "Workflow, replay, checkpoint, and stuck-worker incidents have operator-facing recovery steps."

[[coverage]]
id = "generated-artifact-recovery"
package = "architecture"
owner = "team-architecture"
status = "covered"
contract = "architecture/generated_artifacts.toml"
runbooks = [
  "docs/runbooks/broken-contract-generation.md",
  "docs/runbooks/artifact-corruption-recovery.md",
  "docs/runbooks/retained-artifact-recovery.md",
]
slo_files = ["ops/observability/slo/schema_drift.yaml"]
expectation = "Generated artifact drift and recovery procedures remain tied to artifact contracts."

[[component_contract]]
component = "common"
owner = "team-core"
runbooks = ["docs/runbooks/dependency-upgrade-regression.md"]
alerts = []
dashboards = ["ops/observability/grafana/dashboards/slo-overview.json"]
escalation = "team-core primary; team-platform joins for shared dependency or migration incidents"
slo_exception = "ops/components/common/slo.yaml"
slo_exception_reason = "Component `common` has an explicit SLO exception mirrored in ops/components/common/slo.yaml."
slo_exception_expires = "2026-08-01"
slo_exception_owner = "team-core"
slo_exception_action_plan = "Decide whether Common exposes standalone runtime traffic; if yes, replace the exception with a present SLO bundle, otherwise keep coverage delegated to dependent public-stable components."
slo_exception_action_due = "2026-05-31"
slo_exception_issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-63---operability-release-and-supply-chain-gate-conversion"

