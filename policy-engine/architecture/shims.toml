[migration_shims]
version = 2
status = "active"
description = """
Registry of remaining compatibility and file-relocation records after the
Repository SOTA clean cut. Every active entry must carry an owner, sunset_date,
and migration target. CI enforces sunset: expired shims fail the build.
"""

[last_mile_import_compatibility_map]
version = 1
phase = "0.3"
status = "active"
owner = "team-architecture"
created = "2026-05-07"
report = "docs/archive/reports/REPOSITORY_BEST_IN_CLASS_LAST_MILE_IMPORT_MAP.md"
caller_report = "_build/.tmp/last-mile/shim_callers.json"
caller_report_command = "uv run python tools/quality/validation/repository_last_mile_shim_callers.py --json-output _build/.tmp/last-mile/shim_callers.json --check"
scope = "Wave 2-4 planned source moves and wrapper-only compatibility roots."
required_retained_fields = ["owner", "reason", "test", "release_note", "sunset"]
phase_2_3_removal_rule = "A shim may be removed only when caller_count is zero or all remaining callers are examples/tests intentionally exercising compatibility."
waves_2_4_precondition = "No package source move in Waves 2-4 starts until every planned source path has exactly one compatibility decision in this map."

