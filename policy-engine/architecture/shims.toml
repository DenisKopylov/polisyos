reason = "Phase 4 keeps the legacy W7.A data-family heuristic behind an opt-in feature flag while RequirementToCapabilityResolver supplies construct-resolved compatibility family projections on the primary path."
owner = "team-universal-compilation"
created = "2026-05-25"
sunset_date = "2026-06-30"
sunset_trigger = "Remove after Policy Evidence Capability Graph Phase 7 closes: frozen legacy replay can read old scenario-family projections, W12.A quick path keeps production_data_scenario_contracts_missing at zero, and W11.E reports construct-vocabulary obligations without regression."
