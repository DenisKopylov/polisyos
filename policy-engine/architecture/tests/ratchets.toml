[test_ratchets]
version = 1
status = "active"
owner = "team-quality"
phase = "repository-best-in-class-phase-6.2"
default_gate_mode = "fail_closed_no_regression"
last_verified = "2026-05-07"
description = "Active test and benchmark ratchet contract for package mirror no-regression, property/integration decisions, fixture roots, pytest roots, and benchmark collection shape."
legacy_mirror = "architecture/tests/topology.toml"
topology_contract = "architecture/tests/topology.toml"
baseline_inventory = "architecture/baselines/repository_best_in_class_phase0_4/verification_inventory.json"
report_command = "uv run python tools/quality/testing/report_test_ratchets.py --fail-on-regression --output _build/.tmp/test-reports/test-ratchets-summary.md"

[[ratchet]]
id = "fabric-package-tests"
package = "fabric"
owner = "team-fabric"
contract = "architecture/packages/fabric.toml"
required_roots = ["tests/unit/fabric"]
recommended_roots = ["tests/unit/fabric/connectors", "tests/integration"]
minimum_new_change_expectation = "new connectors and data-plane paths include unit or contract coverage plus fixtures when behavior changes"
mode = "fail_closed_contract"

[[ratchet]]
id = "foundry-package-tests"
package = "foundry"
owner = "team-foundry"
contract = "architecture/packages/foundry.toml"
required_roots = ["tests/unit/foundry", "tests/property/foundry"]
recommended_roots = ["tests/unit/foundry/methods", "tests/unit/foundry/validation", "tests/contract"]
minimum_new_change_expectation = "new methods include family-local tests and update golden/property coverage when semantics change"
mode = "fail_closed_contract"

[[ratchet]]
id = "scientist-package-tests"
package = "scientist"
owner = "team-scientist"
contract = "architecture/packages/scientist.toml"
required_roots = ["tests/unit/scientist", "tests/property/scientist"]
recommended_roots = ["tests/integration/scientist", "tests/contract"]
minimum_new_change_expectation = "new workflow nodes include replay/idempotency coverage and phase acceptance updates when promotion behavior changes"
mode = "fail_closed_contract"

[ratchet_policy]
ratchet_mode = "fail_closed_no_regression"
mirror_presence_metric = "loose_name_mirror_ratio"
strict_mirror_metric = "strict_module_mirror_ratio"
ratchet_floor_source = "measured_baseline"
first_critical_target_ratio = 0.7000
no_regression_rule = "Fail when an observed loose mirror ratio falls below ratchet_floor, a strict mirror ratio falls below baseline, or required property tests fall below floor unless the package has an explicit mirror_regression_exception or strict_mirror_regression_exception."
fail_closed_threshold_policy = "No package may receive a fail-closed mirror floor above its measured baseline until a newer baseline is committed."
runtime_over_coverage_policy = "Normalize runtime over-coverage through module mappings or declared cross-module behavior tests; raw test-file count does not satisfy module mirror presence."
new_package_move_policy = "New package moves must include characterization, mirror, or explicit cross-layer behavior-test mapping in this contract before merging."

[layers.unit]
root = "tests/unit"
source_root = "src/polisyos"
mirror_presence_metric = "loose_name_mirror_ratio"
strict_mirror_metric = "strict_module_mirror_ratio"

[layers.integration]
root = "tests/integration"
decision_source = "package_ratchet.integration_decision"
package_local_exceptions_allowed = true

[layers.property]
root = "tests/property"
decision_source = "package_ratchet.property_decision"
required_when_declared = true

[layers.performance]
root = "tests/performance"
marker = "performance"
benchmark_marker = "benchmark"
role = "Internal performance and cost-regression checks. Public product evaluation suites live under the benchmark policy."

[pytest_policy]
root_config = "pytest.ini"
pytest_roots = ["tests"]
marker_policy = "Markers are registered in pytest.ini and auto-applied by tests/conftest.py; --strict-markers remains required."
duplicate_config_cleanup = "No additional pytest.ini, tox.ini pytest section, setup.cfg pytest section, or pyproject [tool.pytest.ini_options] may be introduced without an explicit pytest_universe_exception."
third_universe_policy = "No pytest root outside tests/ may define independent collection/configuration without an explicit pytest_universe_exception."
forbidden_config_roots = [
  "pyproject.toml:[tool.pytest.ini_options]",
  "setup.cfg:[tool:pytest]",
  "tox.ini:[pytest]",
  "benchmarks/pytest.ini",
]

[[pytest_universe_exception]]
id = "benchmarks-conftest-transition"
path = "benchmarks/conftest.py"
kind = "conftest"
mode = "explicit_exception"
owner = "team-quality"
expires_phase = "Wave 2 benchmark runner relocation"
expires = "2026-09-01"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-53---mirror-and-property-test-expansion"
reason = "Legacy benchmark scripts still import shared benchmark helpers through a pytest-compatible conftest. It may not grow an independent pytest config, and runner helpers move under src/polisyos/benchmarks in the benchmark relocation wave."

[fixture_policy]
shared_fixture_root = "tests/_data"
shared_golden_root = "tests/_golden"
shared_helper_root = "tests/_helpers"
benchmark_data_root = "benchmarks/_data"
root_transition_policy = "Phase 2.4 split shared raw fixtures to tests/_data, shared golden records to tests/_golden, and Python fixture helpers to tests/_helpers."
package_local_fixture_policy = "Package-coupled data fixtures move to tests/_data/<package> unless a package-local runtime fixture root is explicitly generated at test time."
package_local_golden_policy = "Package-scoped golden records live under tests/_golden/<package> or an explicitly registered snapshot root."
fixture_helper_policy = "Fixture helper Python lives under tests/_helpers or package conftest modules; raw data fixtures do not live in tests/contract."
target_fixture_roots = ["tests/_data", "tests/_data/<package>", "benchmarks/_data"]
target_golden_roots = ["tests/_golden", "tests/_golden/<package>"]
product_fixture_exception_roots = [
  "src/polisyos/data_forge/domains/catalog/fixtures",
  "src/polisyos/scientist/nodes/builtins/data",
]

[test_helper_topology]
status = "active_contract"
owner = "team-quality"
baseline = "architecture/baselines/repository_best_in_class_last_mile/test_helper_topology.json"
shared_helper_root = "tests/_helpers"
layer_local_conftest_glob = "tests/**/conftest.py"
shared_helper_allowed_imports = [
  "product_code",
  "standard_library",
  "standard_test_libraries",
]
shared_helper_forbidden_test_layers = [
  "tests/unit",
  "tests/integration",
  "tests/property",
  "tests/contract",
  "tests/repo_quality",
]
shared_helper_contract = "Shared helpers may import product code and standard test libraries, but may not import concrete test-layer modules."
layer_local_conftest_contract = "Layer-local conftest.py files may import shared helpers and local product/test dependencies, but identical copied fixture factories require owner and reason registration."
unused_helper_policy = "Shared helper modules must have at least one importing test, helper, or pytest_plugins consumer."
duplicate_fixture_policy = "Identical fixture factories copied across layer-local conftest.py files must be removed or registered below with owner and reason."
growth_policy = "ratchet_update_required"
mode = "fail_closed_no_regression"

[[test_helper_duplicate_fixture_factory]]
id = "scientist-cas-store-local-fixture"
fixture = "cas_store"
paths = [
  "tests/unit/scientist/governance/conftest.py",
  "tests/unit/scientist/nodes/conftest.py",
]
owner = "team-scientist"
reason = "Both Scientist slices intentionally keep a tiny local FileSystemCAS fixture next to slice-specific context factories; registered until a shared Scientist helper can replace both without broad fixture shadowing."

[repo_quality_tests]
roots = [
  "tests/repo_quality/architecture",
  "tests/repo_quality/lint",
  "tests/repo_quality/tools",
]
excluded_from_package_mirror_ratio = true
policy = "Repository-quality tests validate architecture contracts and tooling behavior; they are not counted as package unit mirror coverage."

[benchmark_policy]
decision = "public_product_evaluation"
status = "active_contract"
current_collection_root = "benchmarks"
current_performance_root = "tests/performance"
target_public_root = "benchmarks"
target_suite_root = "benchmarks/suites"
target_data_root = "benchmarks/_data"
target_runner_root = "src/polisyos/benchmarks"
target_runner_subroots = [
  "src/polisyos/benchmarks/runner",
  "src/polisyos/benchmarks/metrics",
  "src/polisyos/benchmarks/reporting",
  "src/polisyos/benchmarks/harness",
]
internal_performance_root = "tests/performance"
collection_rule = "Public product benchmark suites and committed data collect under benchmarks/; reusable runner implementation moves under src/polisyos/benchmarks; pytest performance checks remain under tests/performance."
physical_moves_deferred_to = ["Wave 2", "Wave 3"]
new_suite_policy = "New public benchmark suites should land under benchmarks/suites with data in benchmarks/_data, or document a temporary transition path in this contract."

[[coverage_normalization]]
id = "runtime-http-cross-module-behavior"
package = "runtime"
test_path = "tests/unit/runtime/http"
classification = "integration"
source_globs = ["src/polisyos/runtime/api.py", "src/polisyos/runtime/http/**"]
counts_toward = "integration_coverage_decision"
reason = "Runtime HTTP coverage exercises route, middleware, authz, resilience, and ASGI boundary behavior across many source modules; it is intentionally declared as cross-module behavior coverage instead of one-test-file-per-module mirror coverage."

[[coverage_normalization]]
id = "data-forge-domain-flow-characterization"
package = "data_forge"
test_path = "tests/unit/data_forge"
classification = "characterization"
source_globs = [
  "src/polisyos/data_forge/domains/**",
  "src/polisyos/data_forge/kernel/**",
  "src/polisyos/data_forge/read_api/**",
]
counts_toward = "behavior_test_mapping"
reason = "Data Forge behavior is dominated by domain flows, golden snapshots, schema evolution, and read-API cutover tests that intentionally cover multiple source modules per test."

[[coverage_normalization]]
id = "fabric-connector-and-data-plane-characterization"
package = "fabric"
test_path = "tests/unit/fabric"
classification = "characterization"
source_globs = [
  "src/polisyos/fabric/connectors/**",
  "src/polisyos/fabric/data_plane/**",
  "src/polisyos/fabric/world/**",
]
counts_toward = "behavior_test_mapping"
reason = "Fabric connector, data-plane, and world-store tests exercise source contracts across provider adapters, cursor state, replay, and fact emission rather than one file at a time."

[[coverage_normalization]]
