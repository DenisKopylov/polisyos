[test_topology]
version = 3
status = "active"
owner = "team-quality"
phase = "repository-best-in-class-phase-3-5"
last_verified = "2026-05-06"
description = "Test topology contract: product behavior stays under unit/integration/property/e2e/performance roots, product contracts stay under tests/contract, and repository-quality gates collect under tests/repo_quality."
source_package_root = "src/polisyos"
unit_root = "tests/unit"
integration_root = "tests/integration"
property_root = "tests/property"
performance_root = "tests/performance"
e2e_root = "tests/e2e"
contract_root = "tests/contract"
repo_quality_root = "tests/repo_quality"
repo_quality_architecture_root = "tests/repo_quality/architecture"
repo_quality_lint_root = "tests/repo_quality/lint"
repo_quality_tools_root = "tests/repo_quality/tools"
legacy_repo_quality_redirect_roots = ["tests/lint", "tests/tools"]
ratchets_contract = "architecture/tests/ratchets.toml"
ratchets_status = "fail_closed_no_regression"

[defaults]
unit_required = true
integration_required = "package_specific"
property_required = "package_specific"
fixtures_root = "tests/_data"
helpers_root = "tests/_helpers"
golden_root = "tests/_golden"
global_conftest = "tests/conftest.py"
package_conftest_pattern = "tests/unit/<package>/conftest.py"

[[topology_rule]]
id = "unit-tests-mirror-source-package"
description = "Each active top-level source package has tests/unit/<package>/ and tests/unit/<package>/conftest.py."
owner = "team-quality"
mode = "fail_closed"
target_phase = "1E"

[[topology_rule]]
id = "integration-tests-live-outside-unit"
description = "Package integration tests live in tests/integration/<package>/, never in tests/unit/<package>/integration/."
owner = "team-quality"
mode = "fail_closed"
target_phase = "1E"

[[topology_rule]]
id = "property-tests-declared-or-excepted"
description = "Each active top-level package either has tests/property/<package>/ or a documented property-test exception."
owner = "team-quality"
mode = "fail_closed"
target_phase = "1E"

[[topology_rule]]
id = "no-loose-package-test-sprawl"
description = "Large package roots keep tests in local subpackage hubs rather than loose tests/unit/<package>/test_*.py files."
owner = "team-quality"
mode = "fail_closed"
target_phase = "1E"

[[topology_rule]]
id = "repo-quality-tests-are-consolidated"
description = "Repository structure, lint, and tooling tests live under tests/repo_quality/{architecture,lint,tools}; the old architecture root is retired, while legacy tests/lint and tests/tools roots are redirects only."
owner = "team-quality"
mode = "fail_closed"
target_phase = "3.5"

[[source_package_exception]]
name = "schemas"
source_path = "src/polisyos/schemas"
classification = "product_contract_catalog"
owner = "team-architecture"
sunset = "2026-12-31"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-65---exception-and-sunset-cleanup"
reason = "The ABI schema catalog is governed by product contract tests and schema-generation gates; it is not promoted to a package behavior mirror in this phase."

[[move]]
id = "data-forge-unit-hub"
from = "tests/data_forge"
to = "tests/unit/data_forge"
reason = "Data Forge now follows the same tests/unit/<package>/ hub as the other top-level packages."

[[move]]
id = "scientist-integration-hub"
from = "tests/unit/scientist/integration"
to = "tests/integration/scientist"
reason = "Scientist integration coverage is no longer collected from the unit topology."

[[move]]
id = "scientist-wave2-rename"
from = "tests/unit/scientist/wave2"
to = "tests/unit/scientist/orchestrator_v2"
reason = "Wave-specific label replaced by the stable orchestrator_v2 contract hub."

[[move]]
id = "repo-quality-architecture-hub"
from = "retired architecture test root"
to = "tests/repo_quality/architecture"
reason = "Architecture and topology gates are repository-quality tests, not product behavior or product contracts."

[[move]]
id = "repo-quality-lint-hub"
from = "tests/lint"
to = "tests/repo_quality/lint"
reason = "Pytest-backed lint ratchets are repository-quality tests."

[[move]]
id = "repo-quality-tools-hub"
from = "tests/tools"
to = "tests/repo_quality/tools"
reason = "Tooling, workspace, and CI ratchet tests are repository-quality tests."

[[package]]
name = "berl"
source_path = "src/polisyos/berl"
unit_path = "tests/unit/berl"
conftest_path = "tests/unit/berl/conftest.py"
integration = { required = false, reason = "No package-specific integration lane; BERL coverage is unit scoped while the package remains small." }
property = { required = false, reason = "Legacy/compatibility package with deterministic unit coverage only in Phase 1E." }

[[package]]
name = "calibration"
source_path = "src/polisyos/calibration"
unit_path = "tests/unit/calibration"
conftest_path = "tests/unit/calibration/conftest.py"
integration = { required = false, reason = "Calibration integration coverage is owned by Foundry/Scientist package slices." }
property = { required = false, reason = "Top-level calibration is a compatibility surface; package-specific property coverage lives with Foundry/Scientist calibration domains." }

[[package]]
name = "common"
source_path = "src/polisyos/common"
unit_path = "tests/unit/common"
conftest_path = "tests/unit/common/conftest.py"
integration = { required = false, reason = "Common primitives are exercised through unit, contract, and dependent package tests." }
property = { required = true, path = "tests/property/common" }

[[package]]
name = "core"
source_path = "src/polisyos/core"
unit_path = "tests/unit/core"
conftest_path = "tests/unit/core/conftest.py"
integration = { required = false, reason = "Core cross-layer compatibility is covered by tests/contract and package integration suites." }
property = { required = false, reason = "Core currently uses schema/contract tests for invariants; dedicated property suite is deferred until artifact contracts stabilize." }

[[package]]
name = "data_forge"
source_path = "src/polisyos/data_forge"
unit_path = "tests/unit/data_forge"
conftest_path = "tests/unit/data_forge/conftest.py"
integration = { required = false, reason = "Data Forge domain flows are covered by local golden/shadow/replay tests inside tests/unit/data_forge and mapped in coverage_normalization." }
property = { required = true, path = "tests/property/data_forge" }

[[package]]
name = "ddm"
source_path = "src/polisyos/ddm"
unit_path = "tests/unit/ddm"
conftest_path = "tests/unit/ddm/conftest.py"
integration = { required = false, reason = "DDM behavior coverage is unit scoped under tests/unit/ddm; the ddm_15_7 compatibility root keeps one facade smoke test only." }
property = { required = false, reason = "DDM has deterministic replay and acceptance unit tests; property coverage is deferred until the monitor API stabilizes." }

[[package]]
name = "fabric"
source_path = "src/polisyos/fabric"
unit_path = "tests/unit/fabric"
conftest_path = "tests/unit/fabric/conftest.py"
integration = { required = false, reason = "Connector/reference integration cases are marked from package-local unit subtrees until external service lanes are split and mapped in coverage_normalization." }
property = { required = true, path = "tests/property/fabric" }

[[package]]
name = "foundry"
source_path = "src/polisyos/foundry"
unit_path = "tests/unit/foundry"
conftest_path = "tests/unit/foundry/conftest.py"
integration = { required = false, reason = "Foundry does not keep tests/unit/foundry/integration; runtime and benchmark-style coverage lives in local subpackage hubs." }
property = { required = true, path = "tests/property/foundry" }

[[package]]
name = "ir"
source_path = "src/polisyos/ir"
unit_path = "tests/unit/ir"
conftest_path = "tests/unit/ir/conftest.py"
integration = { required = false, reason = "IR integration behavior is covered through contract tests and consuming package suites." }
property = { required = true, path = "tests/property/ir" }

[[package]]
name = "lex"
source_path = "src/polisyos/lex"
unit_path = "tests/unit/lex"
conftest_path = "tests/unit/lex/conftest.py"
integration = { required = false, reason = "Lex domain batch coverage is localized through tests/unit/data_forge/legal_batch plus tests/unit/lex and mapped in coverage_normalization." }
property = { required = true, path = "tests/property/lex" }

[[package]]
name = "runtime"
source_path = "src/polisyos/runtime"
unit_path = "tests/unit/runtime"
conftest_path = "tests/unit/runtime/conftest.py"
integration = { required = true, path = "tests/unit/runtime/http", reason = "Runtime HTTP tests are marked integration but remain package-local because they exercise the local ASGI boundary." }
property = { required = true, path = "tests/property/runtime" }

[[package]]
name = "scholar"
source_path = "src/polisyos/scholar"
unit_path = "tests/unit/scholar"
conftest_path = "tests/unit/scholar/conftest.py"
integration = { required = false, reason = "Scholar freshness/search coverage is unit scoped; networked integration remains out of Phase 1E." }
property = { required = false, reason = "Scholar property coverage depends on stable frozen-search fixtures and is not required in Phase 1E." }

[[package]]
name = "scientist"
source_path = "src/polisyos/scientist"
unit_path = "tests/unit/scientist"
conftest_path = "tests/unit/scientist/conftest.py"
integration = { required = true, path = "tests/integration/scientist" }
property = { required = true, path = "tests/property/scientist" }
