mode = "report_only"
sunset = "2026-10-01"
issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-55---tool-config-split-and-overrides-lane"
expectation = "No new blanket package-level ignores; shrink by connector and data-plane slices."

