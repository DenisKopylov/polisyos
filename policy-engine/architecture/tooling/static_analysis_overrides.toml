[static_analysis_overrides]
version = 1
status = "report_only"
owner = "team-architecture"
phase = "repository-best-in-class-phase-1.3"
default_gate_mode = "report_only"
description = "Report-only dead mypy/ruff override checks. Counts are baselines; fail-closed conversion happens only after package owners accept ratchets."
scan_command = "uv run python tools/quality/validation/architecture_report_only_contracts.py --report static-analysis-overrides"
phase_3_6_report_command = "uv run python tools/ops_runners/reports/dead_overrides.py"

[tool_config_split]
manifest = "architecture/tooling/tool_config_split.toml"
owner = "team-devx"
status = "active"
phase = "repository-best-in-class-phase-5.5"
check_command = "uv run polisyos-tools workspace tool-configs --check"
mypy_config = "architecture/tooling/mypy/generated.ini"
ruff_config = "architecture/tooling/ruff/generated.toml"
mkdocs_config = "architecture/tooling/mkdocs/generated.yml"
root_mypy_config = "mypy.ini"
root_ruff_config = "ruff.toml"
root_mkdocs_config = "mkdocs.yml"

[baselines]
inline_type_ignore_count = 665
inline_noqa_count = 98
ruff_config = "architecture/tooling/ruff/generated.toml"
mypy_config = "architecture/tooling/mypy/generated.ini"
dead_override_policy = "report_only_first"
phase0_baseline_stale_mypy_override_count = 0
phase0_baseline_stale_ruff_concrete_override_count = 0
phase0_baseline_import_exceptions_expiring_within_60_days = 19

[phase_3_6_dead_override_gate]
status = "report_only"
owner = "team-devx"
mode = "report_only"
command = "uv run python tools/ops_runners/reports/dead_overrides.py"
required_exception_metadata = ["owner", "sunset_or_permanent_rationale"]
move_policy = "Moved files emit cleanup warnings; deleted files remain visible as stale tool-config debt."
fail_closed_not_before = "2026-10-01"

[[override_scope]]
id = "fabric-ruff-package-ratchet"
package = "fabric"
owner = "team-fabric"
