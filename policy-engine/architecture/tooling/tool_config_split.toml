[tool_config_split]
version = 1
status = "active"
owner = "team-devx"
phase = "repository-best-in-class-phase-5.5"
check_command = "uv run polisyos-tools workspace tool-configs --check"
description = "Root tool configs are policy stubs; generated operational configs are assembled from small, reviewable fragments."
dead_override_report_command = "uv run python tools/ops_runners/reports/dead_overrides.py"

[mypy]
root_config = "mypy.ini"
base_config = "architecture/tooling/mypy/base.ini"
generated_config = "architecture/tooling/mypy/generated.ini"
invocation_policy = "Repo commands that need historical package overrides must pass --config-file architecture/tooling/mypy/generated.ini."
override_fragments = [
  "architecture/tooling/mypy/overrides/10-ir.ini",
  "architecture/tooling/mypy/overrides/20-fabric.ini",
  "architecture/tooling/mypy/overrides/30-lex-scholar-data-forge-legal.ini",
  "architecture/tooling/mypy/overrides/40-foundry.ini",
  "architecture/tooling/mypy/overrides/50-data-forge-legacy.ini",
  "architecture/tooling/mypy/overrides/60-scientist.ini",
  "architecture/tooling/mypy/overrides/70-core.ini",
]

[ruff]
root_config = "ruff.toml"
base_config = "architecture/tooling/ruff/base.toml"
generated_config = "ruff.generated.toml"
workspace_root_generated_config = "architecture/tooling/ruff/workspace_root.toml"
workspace_root_prefix = "policy-engine"
workspace_nested_ruff_config_filenames = [".ruff.toml", "ruff.toml", "pyproject.toml"]
workspace_root_path_settings = ["cache-dir", "src"]
workspace_root_pattern_settings = ["include", "exclude", "extend-include", "extend-exclude"]
root_policy = "Product-root discovery and explicit product callers use the root-colocated generated config; Git-workspace-root callers use workspace_root_generated_config directly. Nested discovery follows Ruff filename precedence and projects only direct product-root per-file-ignore maps with literal selected-config path components and positive relative matchers made from literal segments, *, or complete-component **. Path glob metacharacters, backslashes, negative or otherwise unrepresentable matchers, malformed maps, unsupported local/indirect maps, and overlapping overrides fail closed. Other nested Ruff settings remain local and are not projected."
per_file_ignore_fragments = [
  "architecture/tooling/ruff/per-file-ignores/10-tests-ir.toml",
  "architecture/tooling/ruff/per-file-ignores/20-core.toml",
  "architecture/tooling/ruff/per-file-ignores/30-foundry.toml",
  "architecture/tooling/ruff/per-file-ignores/40-data-forge.toml",
  "architecture/tooling/ruff/per-file-ignores/50-fabric.toml",
  "architecture/tooling/ruff/per-file-ignores/60-lex-scholar.toml",
  "architecture/tooling/ruff/per-file-ignores/70-scientist.toml",
  "architecture/tooling/ruff/per-file-ignores/80-runtime-core-ir.toml",
  "architecture/tooling/ruff/per-file-ignores/90-repository-tools.toml",
]

[ruff.product_root_settings]
cache-dir = "_cache/ruff"
src = [".", "src"]
# Historical evidence snapshots and E02 evidence tools use explicit consumers below.
# Phase 8 research and benchmark paths are owned by workspace benchmark-surfaces.
extend-exclude = [
  "docs/archive/**",
  "docs/research/e02-cloud-test-plan/implementation-handoffs/**",
  "docs/research/e02-cloud-test-plan/integration/**",
  "docs/research/e02-cloud-test-plan/closure-decisions/**",
  "docs/research/e02-cloud-test-plan/execution-organization/**",
  "docs/research/e02-cloud-test-plan/execution-prompts/unified-local-2026-10-09/**",
  "docs/research/e02-cloud-test-plan/full-run/**",
  "docs/research/e02-cloud-test-plan/results/**",
  "docs/research/e02-cloud-test-plan/verification/**",
  "docs/plans/active/agent-packages/**",
  "docs/research/policy-operations/**",
  "docs/superpowers/journals/**",
  "docs/superpowers/research/**",
  "benchmarks/**",
  "tools/research/**",
]

[mkdocs]
root_config = "mkdocs.yml"
base_config = "architecture/tooling/mkdocs/base.yml"
exclude_docs_fragment = "architecture/tooling/mkdocs/exclude_docs.yml"
not_in_nav_fragment = "architecture/tooling/mkdocs/not_in_nav.yml"
generated_config = "architecture/tooling/mkdocs/generated.yml"
root_policy = "Root mkdocs.yml inherits the generated config assembled from docs nav fragments."
nav_fragments = [
  "architecture/tooling/mkdocs/nav/00-home.yml",
  "architecture/tooling/mkdocs/nav/10-tutorials.yml",
  "architecture/tooling/mkdocs/nav/20-how-to.yml",
  "architecture/tooling/mkdocs/nav/30-reference.yml",
  "architecture/tooling/mkdocs/nav/40-explanation.yml",
  "architecture/tooling/mkdocs/nav/50-contracts.yml",
  "architecture/tooling/mkdocs/nav/60-runbooks.yml",
  "architecture/tooling/mkdocs/nav/70-adrs.yml",
]
