[topology]
version = 2
status = "final"
owner = "team-polisyos"
description = "Allowed single-root product topology after Phase 2A workspace-boundary collapse. Guardrails should read this file instead of hardcoding path policy."

# ---------------------------------------------------------------------------
# Repository topology (policy-engine is the only product/workspace root).
# ---------------------------------------------------------------------------

[[path]]
scope = "repo_root"
path = "architecture"
category = "source"
commit_policy = "committed"
owner = "team-architecture"

[[path]]
scope = "repo_root"
path = "schemas"
category = "generated_committed"
commit_policy = "registered_generated_artifacts"
owner = "team-architecture"

[[path]]
scope = "repo_root"
path = "src"
category = "source"
commit_policy = "committed"
owner = "team-polisyos"

[[path]]
scope = "repo_root"
path = "tests"
category = "test_fixture"
commit_policy = "committed"
owner = "team-quality"

[[path]]
scope = "repo_root"
path = "tools"
category = "source"
commit_policy = "committed"
owner = "team-devx"

[[path]]
scope = "repo_root"
path = "ops"
category = "source"
commit_policy = "committed"
owner = "team-ops"

[[path]]
scope = "repo_root"
path = "docs"
category = "docs"
commit_policy = "committed_with_lifecycle"
owner = "team-docs"

[[path]]
scope = "repo_root"
path = "design"
category = "docs"
commit_policy = "committed_or_ignored_by_subpath"
owner = "team-design"

[[path]]
scope = "repo_root"
path = "frontend"
category = "source"
commit_policy = "committed_except_generated_outputs"
owner = "team-frontend"

[[path]]
scope = "repo_root"
path = "data"
category = "test_fixture"
commit_policy = "committed_small_fixtures_only"
owner = "team-data-forge"

[[path]]
scope = "repo_root"
path = ".polisyos"
category = "runtime_state"
commit_policy = "ignored"
owner = "local"

[[path]]
scope = "repo_root"
path = ".devcontainer"
category = "source"
commit_policy = "committed"
owner = "team-devx"

[[path]]
scope = "repo_root"
path = ".cursor"
category = "source"
commit_policy = "committed"
owner = "team-design"

[[path]]
scope = "repo_root"
path = ".vscode"
category = "source"
commit_policy = "committed_or_ignored_by_subpath"
owner = "team-devx"

[[path]]
scope = "repo_root"
path = "packages"
category = "source"
commit_policy = "committed_except_generated_outputs"
owner = "team-frontend"

# ---------------------------------------------------------------------------
# Additional committed root surfaces governed by the final topology.
# ---------------------------------------------------------------------------

[[path]]
scope = "repo_root"
path = "benchmarks"
category = "source"
commit_policy = "committed"
owner = "team-quality"

[[path]]
scope = "repo_root"
path = "examples"
category = "source"
commit_policy = "committed"
owner = "team-devx"

[[path]]
scope = "repo_root"
path = "release-fragments"
category = "release_workspace"
commit_policy = "committed_with_lifecycle"
owner = "team-release"

[[path]]
scope = "repo_root"
path = "release"
category = "release_workspace"
commit_policy = "committed_with_lifecycle"
owner = "team-release"

# ---------------------------------------------------------------------------
# Generated, cache, and local output umbrellas (must never be committed).
# ---------------------------------------------------------------------------

[[path]]
scope = "repo_root"
path = "_build"
category = "build_output"
commit_policy = "ignored"
owner = "local"

[[path]]
scope = "repo_root"
path = "_cache"
category = "cache"
commit_policy = "ignored"
owner = "local"

[[path]]
scope = "repo_root"
path = ".venv"
category = "legacy_local_env"
commit_policy = "ignored"
owner = "local"

# ---------------------------------------------------------------------------
# Loose-file allow-lists and deny-lists.
# ---------------------------------------------------------------------------

[loose_files.repo_root]
allow = [
  ".env.example",
  ".env",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".markdownlint-cli2.jsonc",
  ".nvmrc",
  ".pre-commit-config.yaml",
  ".python-version",
  ".taplo.toml",
  ".yamllint",
  "CHANGELOG-DESIGN.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "README.md",
  "SECURITY.md",
  "SUPPORT.md",
  "Dockerfile.reproducible",
  "install.sh",
  "migrate.py",
  "jax_bootstrap.py",
  "mkdocs.yml",
  "basedpyright.toml",
  "mutmut.cfg",
  "mypy.ini",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "pyproject.toml",
  "pytest.ini",
  "ruff.toml",
  "uv.toml",
  "uv.lock",
]
deny = [
  "setup.py",
  "setup.cfg",
  "requirements.txt",
  "requirements-dev.txt",
  "Pipfile",
  "poetry.lock",
  "Dockerfile",
  "docker-compose.yml",
  "package-lock.json",
  "env_example.txt",
  "all_1000_policy_topics.csv",
  "=2.5.0",
  ".DS_Store",
  "audit_R_recover_*.polisyos-audit.tar.gz",
]
