# ---------------------------------------------------------------------------
# Additional committed root surfaces governed by the final topology.
# ---------------------------------------------------------------------------

[[path]]
scope = "repo_root"
path = "benchmarks"
category = "source"
commit_policy = "committed"
owner = "team-quality"

[[path]]
scope = "repo_root"
path = "examples"
category = "source"
commit_policy = "committed"
owner = "team-devx"

[[path]]
scope = "repo_root"
path = "release-fragments"
category = "release_workspace"
commit_policy = "committed_with_lifecycle"
owner = "team-release"

[[path]]
scope = "repo_root"
path = "release"
category = "release_workspace"
commit_policy = "committed_with_lifecycle"
owner = "team-release"

# ---------------------------------------------------------------------------
# Generated, cache, and local output umbrellas (must never be committed).
# ---------------------------------------------------------------------------

[[path]]
scope = "repo_root"
path = "_build"
category = "build_output"
commit_policy = "ignored"
owner = "local"

[[path]]
scope = "repo_root"
path = "_cache"
category = "cache"
commit_policy = "ignored"
owner = "local"

[[path]]
scope = "repo_root"
path = ".venv"
category = "legacy_local_env"
commit_policy = "ignored"
owner = "local"

# ---------------------------------------------------------------------------
# Loose-file allow-lists and deny-lists.
# ---------------------------------------------------------------------------

[loose_files.repo_root]
allow = [
  ".env.example",
  ".env",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".markdownlint-cli2.jsonc",
  ".nvmrc",
  ".pre-commit-config.yaml",
  ".python-version",
  ".taplo.toml",
  ".yamllint",
  "CHANGELOG-DESIGN.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "README.md",
  "SECURITY.md",
  "SUPPORT.md",
  "Dockerfile.reproducible",
  "install.sh",
  "migrate.py",
  "jax_bootstrap.py",
  "mkdocs.yml",
  "basedpyright.toml",
  "mutmut.cfg",
  "mypy.ini",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "pyproject.toml",
  "pytest.ini",
  "ruff.toml",
  "uv.toml",
  "uv.lock",
]
