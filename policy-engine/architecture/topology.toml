# ---------------------------------------------------------------------------
# Loose-file allow-lists and deny-lists.
# ---------------------------------------------------------------------------

[loose_files.repo_root]
allow = [
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  "README.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "SUPPORT.md",
  "lefthook.yml",
  "renovate.json",
]
deny = [
  "uv.lock",
  "pyproject.toml",
  "package.json",
  "package-lock.json",
  "pnpm-lock.yaml",
  "bun.lockb",
  "poetry.lock",
  "requirements.txt",
  "Pipfile",
  "Pipfile.lock",
  "mkdocs.yml",
  ".python-version",
  ".nvmrc",
  "Dockerfile",
  "docker-compose.yml",
  "docker-compose.yaml",
  ".DS_Store",
  "compileall.txt",
  "import_gate.txt",
  "ruff_stats.txt",
  "stale_sources_missing_paths.txt",
  "summary.json",
  "test_collect.txt",
  "filter_topics.py",
  "organize_relevant_topics.py",
  "scm-implementation-spec-v3.md",
  "topics.csv",
]

[loose_files.product_root]
allow = [
  ".env.example",
  ".env",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".nvmrc",
  ".pre-commit-config.yaml",
  ".python-version",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "README.md",
  "Dockerfile.reproducible",
  "freeze_policy.md",
  "import_policy.toml",
  "import_exceptions.toml",
  "import_exceptions_registry.md",
  "install.sh",
  "migrate.py",
  "jax_bootstrap.py",
  "mkdocs.yml",
  "pyproject.toml",
  "uv.lock",
]
deny = [
  "setup.py",
  "setup.cfg",
  "requirements.txt",
  "requirements-dev.txt",
  "Pipfile",
  "poetry.lock",
  "Dockerfile",
  "docker-compose.yml",
  "package.json",
  "package-lock.json",
  "env_example.txt",
  "all_1000_policy_topics.csv",
  "=2.5.0",
  ".DS_Store",
  "audit_R_recover_*.polisyos-audit.tar.gz",
]
