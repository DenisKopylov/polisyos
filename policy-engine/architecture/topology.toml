  "setup.py",
  "setup.cfg",
  "requirements.txt",
  "requirements-dev.txt",
  "Pipfile",
  "poetry.lock",
  "Dockerfile",
  "docker-compose.yml",
  "package-lock.json",
  "env_example.txt",
  "all_1000_policy_topics.csv",
  "=2.5.0",
  ".DS_Store",
  "audit_R_recover_*.polisyos-audit.tar.gz",
]
