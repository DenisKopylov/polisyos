             "державний борг", "дефіцит бюджету"]
  sdmx_concepts: ["GGFL", "GGR", "GGXWDG_NGDP"]
  worldbank_indicators: ["GC.BAL.CASH.GD.ZS", "GC.DOD.TOTL.GD.ZS"]

population:
