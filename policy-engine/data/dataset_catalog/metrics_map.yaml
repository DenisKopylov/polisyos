  sdmx_concepts: ["CPI", "PCPI_IX"]
  worldbank_indicators: ["FP.CPI.TOTL.ZG"]
  eurostat_codes: ["prc_hicp_manr"]

avg_price:
  keywords: ["price index", "price level", "цінова", "індекс цін"]
  sdmx_concepts: ["PCPI_IX", "PPI"]
  worldbank_indicators: ["FP.CPI.TOTL"]

gov_balance:
