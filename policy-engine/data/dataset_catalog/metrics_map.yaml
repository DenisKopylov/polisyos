# Mapping from PolicyOS ir/kernel/ metric IDs to external indicator codes & keywords.
# Used by datasets/batch/normalizer.py to tag datasets with polisyos_metrics.

avg_income:
  keywords: ["average income", "mean income", "середній дохід", "wage", "earnings"]
  sdmx_concepts: ["EARN", "EARN_NT_NET"]
  worldbank_indicators: ["SI.SPR.PCAP", "NY.ADJ.NNTY.PC.CD"]

gdp:
  keywords: ["GDP", "gross domestic product", "ВВП", "валовий внутрішній продукт"]
  sdmx_concepts: ["GDP", "B1GQ", "NGDP"]
  worldbank_indicators: ["NY.GDP.MKTP.CD", "NY.GDP.MKTP.KD"]
  eurostat_codes: ["nama_10_gdp"]

unemployment_rate:
  keywords: ["unemployment", "безробіття", "jobless"]
  sdmx_concepts: ["UNE_RT_A", "UNEMPRT", "LUR"]
  worldbank_indicators: ["SL.UEM.TOTL.ZS", "SL.UEM.TOTL.NE.ZS"]
  eurostat_codes: ["une_rt_a", "une_rt_m"]

inflation_rate:
