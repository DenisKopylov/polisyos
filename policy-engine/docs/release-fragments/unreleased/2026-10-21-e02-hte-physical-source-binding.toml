compatibility = 'The new physical binding is emitted only when prepare_hte_observational_input receives materialization_binding_version="physical_v1". Default and legacy calls keep their existing return behavior, bytes, and artifact creation behavior. The selected binding, submitted input, and effective input require exact Core manifest profiles. The reader reopens both inputs, replays legacy normalization from the submitted raw bytes, recomputes physical array/slot/row-order bindings, and optionally compares the captured worker DTO.'
change_class = "python-public-api"
surface_classification = "public_stable: polisyos.foundry.data_plane additive opt-in HTE physical source materialization binding"
migration = "No migration is required for existing callers or persisted HTE artifacts. Callers using the new opt-in must persist and pass the returned profile-qualified materialization_binding_ref through their selected attempt context. Profileless refs refuse on this path. The new behavior is additive; no input rewrite is required."
api = "The supported data_plane facade exports HTEPhysicalArraySlotBinding, HTEPhysicalSourceMaterializationBinding, HTE_PHYSICAL_SOURCE_BINDING_KIND, HTE_PHYSICAL_SOURCE_BINDING_SCHEMA, prepare_hte_observational_input, and load_hte_physical_source_materialization_binding. PreparedHTEObservationalInput.materialization_binding_ref is absent by default and populated only for the explicit physical_v1 opt-in. The reader accepts expected_submitted_ref, expected_effective_ref, CoreJsonReadLimits, and optional expected_data."
limitations = "The receipt proves only selected physical payload field/index, shape, dtype, values, and row order under the actual producer materializer. It does not identify requested VariableRef, query, contrast, treatment/outcome semantics, external UnitRef, causal identification, population, law, issuer, permission, custody, production currentness, or publication authority; semantic_alignment_status remains not_established. The owner-generated public-surface inventory has not been regenerated/reviewed in this candidate. Runtime/Anchor persistence and IR/Search semantic consumers require their separately reviewed companion changes; this Foundry slice alone is not an end-to-end HTE capability closure."
