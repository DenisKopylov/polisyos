summary = "Add an opt-in, profile-bound physical materialization receipt for selected HTE inputs, with a bounded Core reader that recomputes source normalization and compares the worker DTO before Runtime can capture the ref."
evidence = [
  "src/polisyos/foundry/data_plane/bindings.py",
