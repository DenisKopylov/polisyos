title = "Preserve method-capture provenance on legacy simulation results"
type = "changed"
component = "scientist"
owner = "team-polisyos"
summary = "Persist the producer's full-profile method-execution bundle and metric-binding-set refs as SimulationResults manifest roles, then expose bounded capture availability through JobResult."
evidence = [
  "src/polisyos/scientist/compute/job_spec.py",
  "src/polisyos/scientist/compute/runner.py",
  "src/polisyos/scientist/compute/__init__.py",
  "tests/unit/scientist/compute/test_runner_execution_lineage.py",
]
compatibility = "The SimulationResults payload and schema remain unchanged. JobResult adds an optional strict typed provenance field that is omitted from its default serialized form when unset; existing constructors retain their defaults. Legacy Scientist capture is not a Foundry graph admission or policy-authority signal."
change_class = "python-public-api"
surface_classification = "internal: polisyos.scientist.compute JobResult provenance"
migration = "Consumers that need this provenance should resolve JobResult.simulation_results_ref through read_job_result_method_execution_capture with an explicit positive manifest-byte limit; no default-profile fallback is available."
api = "JobResult.method_execution_capture exposes MethodExecutionCaptureProvenance with availability=available|partial|unavailable and exact full-profile bundle/binding-set refs. read_job_result_method_execution_capture(store, result, *, max_manifest_bytes) validates the selected SimulationResults manifest and each selected input manifest without loading artifact payloads."
limitations = "Availability proves only that the exact profile-qualified refs are present and resolve to the expected artifact kinds. The 256 KiB legacy manifest bound is an operational metadata-read limit, not a payload, process RSS, scientific resource, graph-admission, validity, or authority guarantee. Refs returned with producer failure or partial status remain diagnostic; availability does not establish successful execution."
