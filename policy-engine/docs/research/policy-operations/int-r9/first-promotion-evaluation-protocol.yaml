title: INT-R9 — First Promotion Evaluation Protocol (research specification)
status: delivered
kind: deep-research-support
research_task: INT-R9
result_type: accepted_narrow_scope
repository: https://github.com/DenisKopylov/polisyos
repository_branch: research/int-r9-first-promotion-protocol
historical_repository_commit: 4813b49f6ce14e8debf3aaea096f0967d38d9768
current_repository_commit: d152565dcc11cea457dacd61fadc6e15dc3ecc86
inspection_date: 2026-08-02
research_only: true
authoritative_for:
  - research-level executable procedure for prospectively governing the first positive PolicyOS promotion
  - minimum anti-selection, sealing, adjudication, falsification, and publication conditions
  - typed research shapes for later consolidation and implementation handoff
may_not_use_for:
  - production implementation authorization
  - final code or wire contract
  - canonical owner assignment
  - authority grant
  - capability claim
  - promise that a positive promotion is achievable
  - benchmark passage
  - legal compliance conclusion
  - production readiness
  - creation of a second status lattice
  - creation of a second oracle-independence framework

protocol:
  protocol_id: int-r9-first-promotion-v1
  protocol_version: research-v1
  posture: prospective_only
  governing_question: >-
    Can the earliest qualifying attempt in a prospectively sealed sequence support one
    bounded first-promotion claim without selecting the case, criteria, threshold,
    evaluator, run, exclusion, or stopping rule after outcome-relevant information is
    known?
  non_promise: >-
    The protocol has no success target. Refused, disputed, void, exhausted-without-
    promotion, and no-attempt outcomes are publishable terminal outcomes.
  result_supported_if_successful: >-
    Only that the named implementation revision, environment, selected sealed case,
    adjacent unseen case, declared assumptions, existing owner gates, evaluator version,
    and protocol version satisfied the predeclared predicates.
  claims_never_supported:
    - existence of any promotable real policy design
    - population-level or domain-wide generalization
    - legal compliance
    - institutional competence
    - production readiness
    - authority to administer or implement policy
    - benchmark passage beyond the named fixtures
    - completeness beyond the bounded INT-R1 declaration consumed by the run

classification_of_requirements:
  theorem:
    - id: risk-ledger-theorem-delegation
      statement: >-
        Any false-promotion probability accounting is inherited from the existing
        confidence-ledger theorem and predictable allocation, not proved by this
        governance protocol.
      owner_ref: policy-engine/src/polisyos/runtime/quality/confidence_ledger.py
  impossibility_results:
    - id: public-corpus-not-sealable
      statement: >-
        The existing thirteen real cases and two synthetic adjudications cannot become a
        sealed holdout retroactively because outcome-relevant expectations are committed
        in the implementation-visible tree.
    - id: role-only-independence-insufficient
      statement: >-
        A synthetic reviewer or role identifier cannot establish independent human
        adjudication.
    - id: n1-no-population-inference
      statement: >-
        One first-promotion event does not identify population performance or external
        validity.
    - id: no-positive-existence-proof
      statement: >-
        No prospective protocol can promise that a qualifying positive result exists.
    - id: no-proof-against-secret-collusion
      statement: >-
        Custody and conflict controls close observable opportunistic degrees of freedom;
        they cannot prove the absence of undisclosed collusion or fabricated records.
  governance_protocol:
    - prospective sealing
    - immutable attempt ordering
    - result-independent publication
    - independent signed adjudication
    - deviation and dispute handling
  empirical_rules:
    - fresh held-back cases reduce known contamination but do not prove distributional equivalence
    - adjacent-case behavior is transfer evidence only within the declared adjacency relation
    - inter-rater coefficients diagnose agreement but do not establish correctness
  design_patterns:
    - registered-report-style acceptance of the evaluation plan before outcomes
    - public regression plus separately held sealed evaluation
    - append-only attempt and deviation ledgers
    - outcome-neutral positive controls
  engineering_conveniences:
    - exact three-slot attempt queue
    - content-addressed package identifiers
    - public regression before each sealed reveal

boundary_verdict:
  own:
    - custody and publication of PolicyOS's own preregistration, attempt, adjudication, promotion, refusal, dispute, correction, suspension, supersession, or withdrawal records
    - enforcement that a PolicyOS promotion claim does not outrun the admitted evidence and predeclared protocol
  integrate:
    - externally authored case facts and expectations
    - S0-GAP-02 sealing, commitment, access-control, rotation, challenge, and inter-reviewer machinery
    - named human adjudicator identities, expertise, conflicts, signatures, and succession
    - INT-R1 bounded obligation-set declaration
    - existing GY-N9/N11/N12 owner results and confidence-ledger receipts
  observe:
    - funder, employer, reporting-line, and institutional conflict signals
    - adjudicator availability and succession risk
    - public criticism, challenge, and correction requests
  out_of_scope:
    - policy administration or implementation
    - legal-effect adjudication
    - certification of institutional competence
    - guarantee of case representativeness
    - guarantee that a positive case exists
    - replacement of canonical gate, status, evidence, or publication owners

prerequisites:
  must_be_true_before_drafting_case_registration:
    - id: baseline-pinned
      requirement: exact repository, code, rule, dependency, model, environment, and evaluator baselines can be content-bound
    - id: gap02-available
      requirement: >-
        S0-GAP-02 machinery or a consolidation-approved equivalent supplies commitment,
        independent custody, access logging, challenge, rotation, and evaluator separation.
    - id: named-humans-available
      requirement: three named adjudicators and two named alternates satisfy the independence policy
    - id: int-r1-interface-available
      requirement: >-
        A versioned obligation-set declaration exists, even if it says completeness is
        weak, unresolved, or insufficient. Weakness narrows or blocks promotion; it does
        not void the procedural protocol.
    - id: publication-commitment
      requirement: >-
        Governance signs a result-independent commitment to publish every attempted,
        void, refused, disputed, and promoted record in sequence.
  automatic_block_if_missing:
    - gap02-available
    - named-humans-available
    - publication-commitment

attempt_program:
  queue_length: 3
  queue_length_classification: engineering_convenience_not_theorem
  rationale: >-
    One slot makes a single case-design mistake irrecoverable; an open-ended sequence
    permits indefinite search. Three fully presealed slots create a finite, auditable
    opportunity while preserving an honest no-promotion terminal.
  preparation_rule: >-
    All three primary case packages, all three adjacent case packages, all expectation
    packages, the order, the criteria, and the stopping rule are committed before any
    selected primary input is disclosed to an implementation-side person or system.
  case_requirements:
    primary:
      count: 3
      requirements:
        - not one of the thirteen current proving-ground cases
        - not one of the two current synthetic adjudication fixtures
        - no prior integrated-loop execution
        - no implementation-visible expected answer, gold card, label, or reviewer vote
        - no case identifier, source fingerprint, binding, alias, adapter, or configuration branch in the frozen implementation
        - declared domain, jurisdiction, time, authority, evidence, and obligation scope
    adjacent:
      count: 3
      pairing: exactly_one_per_primary
      requirements:
        - same declared mechanism family or policy problem class as its primary
        - materially different jurisdiction, time, source mix, implementation context, or affected population
        - separately authored and separately committed
        - not a paraphrase, identifier substitution, or field-order mutation of the primary
        - no shared case-specific binding or configuration
  diversity_floor:
    distinct_primary_domains: 3
    meaning: coverage boundary only, not representativeness
  order:
    rule: fixed_before_first_inspection
    public_fields:
      - slot_number
      - opaque_primary_commitment_id
      - opaque_adjacent_commitment_id
      - declared_domain_stratum
      - selection_rule_version
    hidden_until_slot_freeze:
      - primary_input_package
      - adjacent_input_package
      - expectation_packages
  stopping_rule:
    - stop permanently when one slot reaches promoted
    - halt while an earlier slot is disputed
    - continue to the next slot only after the prior slot is publicly refused or void
    - stop with exhausted_without_promotion after slot 3 does not promote
    - never insert, reorder, replace, or omit a slot after first inspection
  statistical_accounting:
    owner: existing confidence ledger
    rule: >-
      Each attempted or voided slot keeps its chronological execution ordinal and
      predictable allocation. No reset, refund, or parallel alpha budget is created by
      this protocol.

pre_registration_record:
  artifact_name: FirstPromotionPreRegistration
  standing: research_shape_not_canonical_contract
  required_fields:
    identity:
      - preregistration_id
      - protocol_id
      - protocol_version
      - repository_commit
      - implementation_tree_hash
      - dependency_lock_hash
      - model_or_runtime_refs
      - environment_image_hash
      - evaluator_package_commitment
      - rule_version_refs
      - schema_version_refs
    population_and_selection:
      - eligible_population_definition
      - excluded_population_with_reasons
      - contamination_census_ref
      - attempt_queue_commitments
      - attempt_order
      - stopping_rule
      - no_substitution_rule
    criteria:
      - existing_owner_predicate_refs
      - procedural_predicates
      - threshold_refs_without_redefinition
      - materiality_rule
      - ambiguity_rule
      - deviation_rule
      - no_go_reasons
    people_and_conflicts:
      - criteria_authors
      - case_authors
      - implementation_authors
      - adjudicators
      - alternates
      - custodian
      - disclosed_conflicts
      - independence_assessments
    time_and_custody:
      - drafted_at
      - case_package_received_at
      - sealed_at
      - transaction_visible_at
      - verified_at
      - admitted_for_first_promotion_evaluation_at
      - first_inspection_not_before
      - commitment_receipts
      - custody_access_log_ref
    publication:
      - public_regression_plan
      - negative_result_publication_commitment
      - raw_vote_publication_rule
      - dispute_and_correction_rule
    authority_boundary:
      - authoritative_for
      - may_not_use_for
  ordering_invariant: >-
    sealed_at and transaction_visible_at must be provably earlier than the earliest
    candidate_first_inspected_at, input-package disclosure, evaluator-answer access, or
    result-bearing execution.

criteria:
  frozen_before_seal: true
  existing_owner_gates:
    rule: >-
      The registration names exact existing owner predicates and versions. INT-R9 neither
      adds a bypass nor changes any denominator, validator, threshold, obligation class,
      confidence number, or status meaning.
    minimum_references:
      - canonical GY-N9 promotion-sequence output
      - confidence-ledger scope, head, receipt, allocation, and maintained assumptions
      - candidate firewall result
      - canonical grounding, evidence, value, calibration, transport, delegation, and evaluation-safety owner results applicable to the case
      - INT-R1 obligation-set declaration
  procedural_pass_predicates:
    - id: prospective-ordering
      property: seal and transaction visibility precede first inspection
    - id: fixed-slot
      property: evaluated case is the next committed slot and no earlier slot was omitted
    - id: public-regression
      property: frozen binary and configuration satisfy the predeclared public regression battery
    - id: sealed-primary
      property: frozen binary produces an owner-valid positive promotion on the selected primary case
    - id: adjacent-transfer
      property: same binary and configuration produce the sealed-oracle-correct terminal behavior on the paired adjacent case
    - id: no-case-specific-code
      property: no code, configuration, binding, alias, adapter, prompt, or fixture was introduced or activated for the revealed case
    - id: source-dependency-sensitivity
      property: a predesignated material source flip cannot leave the same positive authority claim intact
    - id: obligation-monotonicity
      property: removing or making unknown a required material obligation cannot leave the positive promotion intact
    - id: independent-adjudication
      property: signed panel adjudication satisfies the independence, quorum, dissent, and conflict rules
    - id: bounded-claim
      property: public wording stays within the named revision, environment, cases, assumptions, evaluator, and protocol
    - id: result-independent-publication
      property: all earlier attempts, deviations, votes, disputes, and refusals are retained and published
  promotion_logic: all_applicable_existing_owner_gates_and_all_procedural_pass_predicates
  no_threshold_tuning: >-
    A threshold, criterion, owner predicate, case inclusion, fixture interpretation, or
    materiality rule changed after sealing cannot apply to the scored run. It starts a
    new protocol version and fresh case queue; the old attempt remains scored under its
    original version.

public_regression:
  population:
    - thirteen canonical real cases
    - two synthetic adjudication fixtures
    - public metamorphic mutations
  status: visible_regression_not_holdout
  required_mutations:
    - opaque identifier renaming
    - source delivery reordering
    - field ordering changes
    - semantically equivalent encoding
    - wrong-scope look-alike
    - public source flip
    - public obligation removal
    - constant-refusal positive control
  positive_control_boundary: >-
    A deterministic contract-level fixture may prove that the gate is technically capable
    of a positive transition when every owner predicate is supplied. It is not a real
    policy promotion, does not count in useful_design_rate, and does not prove that a real
    positive result exists.
  failure_effect: automatic_no_go_before_holdout_reveal

sealed_holdout:
  owner: reuse_S0-GAP-02
  required_packages:
    input_package:
      visible_after: implementation_and_environment_freeze
      excludes:
        - expected terminal decision
        - expected claim identifiers where they reveal the answer
        - gold card
        - reviewer votes
        - evaluator rubric details that reveal case-specific expectations
    expectation_evaluator_package:
      visible_after: candidate_output_environment_and_source_snapshot_freeze
      contains:
        - expected predicate outcomes
        - admissible alternative outcomes
        - materiality designations
        - source-flip target and expected relation
        - obligation-removal target and expected relation
        - adjacency relation
        - adjudication guide and version
  commitment:
    requirements:
      - canonical serialization
      - content digest
      - high-entropy nonce or hiding commitment mechanism
      - independent custodian signature
      - independently verifiable timestamp or equivalent append-only transaction proof
      - commitment-policy identifier
      - reveal verification receipt
    warning: >-
      A plain unsalted hash of a predictable answer key provides change detection, not
      meaningful secrecy. Cryptographic mechanism selection remains with S0-GAP-02.
  access:
    requirements:
      - least privilege
      - named access principals
      - immutable access logs
      - dual control for answer-key reveal
      - no implementation-side answer access before freeze
      - incident and leakage reporting
  leak_rule: >-
    Any unplanned access or credible answer leakage before the relevant freeze makes the
    slot void or disputed. It is never silently reclassified as passed and never removed
    from the attempt ledger.

implementation_freeze:
  freeze_before_primary_input_reveal:
    - source tree and commit
    - generated source and build output
    - dependency lock and resolved artifact digests
    - container or environment image
    - model and prompt versions
    - configuration
    - adapter and registry contents
    - data-source snapshot and query cutoffs
    - evaluator executable package, excluding held answer data
    - random seed policy
  after_reveal_rule: >-
    No change to code, dependencies, model, prompt, configuration, adapter, binding,
    evaluator logic, or data query is permitted for the slot. Incident containment may
    stop the run but makes it void; it cannot salvage the score.
  between_slots_rule: >-
    General implementation repair is allowed only after the prior terminal record is
    published and before the next input reveal. The next freeze is new and content-bound.
    Criteria, attempt order, case commitments, stopping, and cumulative ledger scope stay
    unchanged.

no_case_specific_code_check:
  property: >-
    The promoted behavior must arise from preexisting general discovery, binding,
    admission, and owner predicates, not a branch keyed directly or indirectly to the
    case, source set, expected claim, domain alias, or holdout fingerprint.
  evidence_required:
    - pre-reveal and post-run source-tree equality receipt
    - dependency and configuration equality receipt
    - case identifier and source-fingerprint scan
    - semantic alias and binding provenance review
    - registry and adapter delta proof
    - opaque-ID rerun
    - same-binary adjacent-case run
    - human provenance declaration covering prior hand-coded bindings
  insufficient_evidence:
    - absence of the literal case ID
    - a passing unit test
    - contributor self-attestation alone
    - successful adjacent run after code changes
  automatic_failure:
    - case-specific code or configuration branch
    - hand-coded binding to the heldout case
    - hidden fixture copied into implementation assets
    - post-reveal patch or prompt change

independent_adjudication:
  panel:
    members: 3
    alternates: 2
    quorum: all_three_members_or_predesignated_alternate_substitution
    promotion_vote_rule:
      minimum_approve_votes: 2
      maximum_dispute_votes: 0
      unresolved_material_dissent_allowed: false
      abstention_rule: >-
        An abstention is retained. Promotion requires two approvals, no dispute, no
        unresolved material dissent, and a documented reason for any abstention.
  identity_rule: named_accountable_humans_with_signatures
  synthetic_or_role_only_reviewer:
    satisfies_independence: false
    permissible_use: internal development or public-regression self-check only
  independent_of:
    - implementation and case-specific bindings
    - case selection and authorship
    - criteria and threshold authorship
    - answer-key custody before authorized reveal
    - direct line management of evaluated implementers
    - outcome-contingent compensation or reward
    - prior outcome observation for the scored run
  disclosures:
    - employment and affiliation
    - funding and material financial interests
    - reporting lines
    - implementation contributions
    - case or criteria contributions
    - prior access to cases, answers, or outputs
    - personal or institutional stake in a positive result
  calibration:
    corpus: all_fifteen_public_adjudication_manifests
    timing: before_seal
    outputs:
      - raw votes
      - abstentions
      - pairwise agreement
      - Cohens_kappa_where_applicable
      - Krippendorffs_alpha_where_applicable
      - criterion-by-criterion disagreement log
      - adjudication-guide amendments
    pass_rule: >-
      No promotion-critical criterion remains materially ambiguous after calibration.
      Agreement coefficients are reported diagnostics, not correctness proofs and not a
      substitute for resolving known material ambiguity.
  unavailability_rule: >-
    Substitute only a predeclared alternate who has not seen prohibited information. If
    quorum cannot be restored, the attempt becomes disputed; no favorable reviewer may be
    selected after votes are known.

falsifiers:
  source_flip:
    property_tested: dependency_sensitivity
    construction: >-
      Preserve transport shape and nonmaterial fields while revoking, reversing,
      superseding, or materially changing one predesignated dependency-bearing source.
    required_result: >-
      The same positive authority claim must not survive unchanged. The canonical owner
      must downgrade, refuse, suspend, or require revalidation according to existing
      semantics.
    bounded_meaning: one sampled dependency relation; not proof for every source
  obligation_removal:
    property_tested: obligation_monotonicity
    construction: >-
      Remove, invalidate, or turn unknown one predesignated required material obligation
      or its certificate while preserving unrelated evidence.
    required_result: no positive promotion under the same authority claim
    bounded_meaning: one sampled obligation; not proof of open-world completeness
  opaque_identity:
    property_tested: identifier_independence
    construction: replace case, source, claim, and artifact identifiers consistently
    required_result: semantically equivalent decision and trace
  wrong_scope_look_alike:
    property_tested: scope_sensitivity
    construction: preserve surface similarity while changing jurisdiction, validity, purpose, or authority scope
    required_result: no silent reuse of the original positive authority
  constant_refusal:
    property_tested: nontrivial_response
    construction: public contract-level positive control plus known-groundable regression seeds
    required_result: generic or invariant refusal is detected
    bounded_meaning: does not prove a real positive case exists

useful_design_rate_firewall:
  reported_only: true
  may_be_used_for:
    - descriptive monitoring with immutable denominator
  may_not_be_used_for:
    - case selection
    - attempt ordering
    - criteria or threshold setting
    - fixture exclusion
    - stopping
    - reviewer reward
    - staff performance evaluation
    - promotion decision
  immutable_denominator:
    includes:
      - every precommitted slot
      - attempted slots
      - void slots
      - refused slots
      - disputed slots
      - successful slots
    exclusions: none_after_first_inspection
  forbidden_optimization_observables:
    - easier-case substitution after failure
    - post-result threshold or materiality change
    - hidden reruns or best-run selection
    - exclusion of failed or void attempts
    - stopping only when a positive appears contrary to the predeclared queue
    - denominator edits
    - output-contingent reviewer, implementer, or manager reward
    - case-specific repairs after reveal
  anti_abstention_controls:
    - refusal must cite one or more predeclared owner-backed reasons
    - generic safety language without evidence is nonconforming
    - known-groundable public seeds measure false abstention and search recall
    - public positive-control fixture detects a mechanically locked refusal path
    - a failed primary emits an acquisition or repair record where an existing owner can do so
    - no domain-ceiling claim while search recall or index freshness is inadequate
  anti_abstention_boundary: >-
    These controls make refusal inspectable and costly to fake; they do not require a
    positive real-policy outcome and do not convert a known control into promotion evidence.

predeclared_no_go_reasons:
  - preregistration sealed after first inspection or outcome-relevant access
  - evaluated case not the next committed slot
  - current public corpus case used as decisive sealed holdout
  - current role-only reviewer presented as independent adjudicator
  - missing named-human quorum or unresolved material dissent
  - missing, unverifiable, or leaked answer-key custody
  - code, dependency, model, prompt, configuration, adapter, binding, evaluator, or query change after reveal
  - case-specific or hand-coded binding
  - hidden rerun, run selection, slot omission, or result-based substitution
  - post-result threshold, criterion, fixture, materiality, or stopping change
  - public regression failure
  - source-flip falsifier leaves the same positive claim intact
  - obligation-removal falsifier leaves the positive promotion intact
  - adjacent case evaluated with a different binary or configuration
  - adjacent sealed-oracle behavior is incorrect
  - existing canonical owner gate fails, is unknown, is scope-insufficient, or is bypassed
  - confidence-ledger receipt, scope, head, predictable allocation, or maintained-assumption declaration is invalid
  - INT-R1 declaration says the relevant obligation basis is insufficient for the proposed authority claim
  - result-independent publication commitment is breached
  - useful_design_rate affects any protected decision
  - attempted exclusion lacks a completed isolation proof
  - public claim exceeds the bounded external-validity statement

state_machine:
  note: protocol phases are custody workflow states, not a new PolicyOS authority status lattice
  initial: pre_registration_drafted
  states:
    pre_registration_drafted:
      owner: protocol_author_group
      editable: true
      public_meaning: proposal only; no protection against selection yet
      exits:
        seal: sealed
        abandon: terminal_no_attempt
    sealed:
      owner: independent_custodian
      editable: false
      entry_evidence:
        - signed commitment set
        - transaction visibility receipt
        - access policy and log opened
        - panel and alternates accepted conflicts
      clocks:
        - seal transaction time
        - expiry or review-due time
      exits:
        reveal_next_primary_after_freeze: candidate_inspected
        preinspection_misspecification: retired_before_inspection
        seal_breach: disputed
        expiry: terminal_no_attempt
    candidate_inspected:
      owner: canonical_run_owner_plus_custodian
      editable: false
      public_meaning: the slot is irrevocably in the denominator
      clocks:
        - first inspection time
        - run start and completion times
        - source and transaction cutoffs
      exits:
        freeze_output_and_reveal_expectation: adjudicated
        leak_or_integrity_failure: void
        material_process_dispute: disputed
    adjudicated:
      owner: independent_panel
      editable: false
      required_evidence:
        - raw signed votes
        - evaluator outputs
        - deviations
        - source-flip and obligation-removal results
        - adjacent-case result if primary otherwise qualifies
      exits:
        all_promotion_conditions: promoted
        no_go_or_nonqualification: refused
        unresolved_material_dissent_or_challenge: disputed
    promoted:
      terminal: true
      public_meaning: bounded first positive governed promotion under named conditions
      reopening: append_only_correction_suspension_withdrawal_or_supersession
    refused:
      terminal_for_slot: true
      public_meaning: no promotion from this slot; not evidence that promotion is impossible
      next: next_precommitted_slot_if_any
    void:
      terminal_for_slot: true
      public_meaning: scored custody or integrity conditions failed; no substantive positive inference
      next: next_precommitted_slot_if_any
    disputed:
      terminal_until_resolved: true
      public_meaning: no promotion may be represented as current while material dispute remains
      escalation: predeclared_challenge_and_adjudication_path_from_S0-GAP-02
      exits:
        append_only_resolution_refused: refused
        append_only_resolution_promoted: promoted
        unresolved: disputed
    retired_before_inspection:
      terminal: true
      public_meaning: preregistration version withdrawn before any result-bearing access; no attempt occurred
      condition: independent custodian attests and proves no inspection or answer access
    terminal_no_attempt:
      terminal: true
      public_meaning: protocol sealed or drafted but no candidate was inspected
    exhausted_without_promotion:
      terminal: true
      public_meaning: all three precommitted slots ended without promotion
  global_invariants:
    - no terminal record is overwritten
    - every transition is time- and actor-bound
    - later corrections reference rather than mutate prior records
    - a dispute blocks a current positive public claim
    - workflow state never substitutes for canonical runtime status

outcome_and_status_mapping:
  rule: use_existing_status_lattice_only
  protocol_phase_field: custody_workflow_projection_not_authority_status
  canonical_runtime_sources:
    - CanonicalPromotionReceipt
    - SearchTerminalKind
    - PromotionObligationStatus
    - confidence-ledger completion and receipt records
  mapping:
    promoted: >-
      Requires the existing canonical receipt to say promoted under its owner semantics;
      INT-R9 adds procedural admissibility and signed adjudication, not a replacement status.
    refused: >-
      Retains the canonical receipt, terminal kind, obligation outcomes, and refusal
      reasons; no synthetic success/failure enum replaces them.
    disputed: >-
      Is a custody/publication challenge posture over the claimed decision. It cannot
      turn a runtime refusal into promotion or mint a parallel promotion status.
  atlas_consumer: Atlas_DS12_and_related_projection_owners_after_consolidation

adjudication_record:
  artifact_name: FirstPromotionAdjudicationRecord
  standing: research_shape_not_canonical_contract
  required_fields:
    - adjudication_id
    - preregistration_ref
    - slot_number
    - primary_case_commitment_and_reveal_receipts
    - adjacent_case_commitment_and_reveal_receipts
    - implementation_freeze_receipt
    - candidate_output_freeze_receipt
    - existing_owner_receipt_refs
    - confidence_ledger_refs
    - public_regression_receipt
    - no_case_specific_code_evidence
    - source_flip_result
    - obligation_removal_result
    - adjacent_case_result
    - evaluator_version_and_output
    - raw_signed_votes
    - abstentions_and_dissent
    - conflict_disclosures
    - deviations
    - no_go_findings
    - bounded_external_validity_statement
    - terminal_disposition
    - publication_receipt
    - authoritative_for
    - may_not_use_for

edge_cases:
  preregistered_case_fails_unregistered_case_succeeds:
    disposition: refused_for_registered_slot; unregistered success is development evidence only
  adjudicator_unavailable_mid_adjudication:
    disposition: use predeclared clean alternate or enter disputed
  criterion_ambiguous_after_sealing:
    disposition: disputed; do not reinterpret for scored run; amendment starts new version
  sealed_holdout_leaks:
    disposition: void_or_disputed; keep chronological and risk position; never silently replace
  promotion_later_found_unjustified:
    disposition: append-only suspension, correction, withdrawal, or supersession by canonical owners; original remains auditable
  two_candidates_qualify_simultaneously:
    disposition: only the earlier precommitted slot and canonical transaction order can be first; no best-case selection
  preregistration_misspecified_before_any_result_seen:
    disposition: retire old version with no-inspection proof, correct, and reseal before any reveal
  hand_coded_binding_from_three_slices_ago:
    disposition: contamination and automatic no-go even if author departed and every runtime check passes
  earlier_disputed_later_case_passes:
    disposition: halt; later case cannot become first until earlier dispute is resolved

amendment_and_failure_policy:
  before_any_inspection:
    permitted: true
    conditions:
      - independent no-inspection and no-answer-access proof
      - old version retained and marked retired_before_inspection
      - new commitment, version, timestamp, and public diff
  after_inspection:
    permitted_for_scored_run: false
    rule: >-
      Deviations are recorded and adjudicated under the sealed version. A changed protocol
      starts a fresh version and fresh case queue; it never rescoring the old run.
  after_failed_slot:
    same_protocol:
      permitted_changes:
        - general implementation repair before next case reveal
      forbidden_changes:
        - criteria
        - thresholds
        - case commitments or order
        - stopping
        - publication rule
        - cumulative risk scope
    same_case_rerun_as_confirmatory: forbidden
  after_queue_exhaustion:
    result: exhausted_without_promotion
    future_protocol: >-
      A v2 may be prospectively ratified with fresh cases, but must retain v1 history,
      explain changes, preserve cumulative confidence accounting where applicable, and
      cannot present v2 as if v1 never happened.

interfaces:
  INT-R1:
    consumes: ObligationSetDeclaration
    minimum_fields:
      - declaration_id_and_version
      - purpose_and_scope
      - enumerated_or_classified_obligations
      - bounded_completeness_posture
      - maintained_assumptions
      - known_unknowns_and_unresolved_classes
      - criticality_and_owner_refs
      - may_not_use_for
    graceful_degradation:
      strong_enough: criteria may proceed within declared scope
      weaker: narrow authority and public claim
      insufficient_or_unknown_for_material_class: automatic no-go
    non_ownership: INT-R9 does not decide open-world obligation completeness
  S0-GAP-02:
    reuses:
      - oracle and evaluator separation
      - commitments and sealing
      - access control and access logs
      - evaluator versioning
      - rotation and succession
      - challenge and inter-reviewer adjudication
      - raw-label, abstention, dispute, and correction retention
    INT-R9_specific_delta:
      - finite precommitted first-promotion attempt queue
      - no substitution or run selection
      - first-event ordering
      - no-case-specific-code and same-binary adjacent-case condition
      - result-independent public refusal/no-promotion outcome
      - useful_design_rate enforcement surface
      - post-promotion correction meaning for the irreversible first public claim
    deferred_to_GAP02:
      - cryptographic mechanism choice
      - key and secret management
      - generic evaluator platform architecture
      - generic reviewer rotation policy
  INT-R5:
    consumes_not_redefines:
      - institutional competence and delegation evidence relevant to adjudicator or evidence-producer eligibility
  INT-R8:
    consumes_not_redefines:
      - public projection, compression, disclosure, challenge, and currentness semantics
    INT-R9_requirement_only: negative, void, disputed, and positive outcomes must be equally projectable and auditable

handoff:
  producers:
    - protocol author group
    - independent case authors
    - S0-GAP-02 custodian
    - canonical GY run owners
    - independent adjudication panel
  persisted_artifacts:
    - FirstPromotionPreRegistration
    - HoldoutCommitmentReceipt
    - ImplementationFreezeReceipt
    - FirstPromotionAttemptRecord
    - FirstPromotionAdjudicationRecord
    - FirstPromotionDeviationRecord
    - FirstPromotionChallengeResolution
    - FirstPromotionPublicRecord
  bridges:
    - GY-N9 canonical promotion sequence
    - GY-N11 confidence ledger
    - GY-N12 or later governed closeout/publication bridge
    - S0-GAP-02 evaluator and custody architecture
    - Atlas DS12 status and public projection surface
  verification:
    - commitment verification
    - transaction-order verification
    - owner-receipt replay
    - confidence-ledger validation
    - source/config/build equality
    - case-specific-code audit
    - signed-vote and conflict validation
    - public-record completeness check
  surfaces:
    - governance audit
    - expert review
    - machine-readable attempt ledger
    - bounded public record
