[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "polisyos-data-forge-domain-example"
version = "0.1.0"
description = "Minimal external Data Forge domain extension example."
requires-python = ">=3.14,<3.15"
dependencies = ["policy-engine"]

[project.entry-points."polisyos.data_forge_domains"]
"example.city_budget" = "polisyos_data_forge_domain_example:city_budget_domain_component"

[tool.hatch.build.targets.wheel]
packages = ["src/polisyos_data_forge_domain_example"]
