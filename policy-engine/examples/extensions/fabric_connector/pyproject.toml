[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "polisyos-fabric-connector-example"
version = "0.1.0"
description = "Minimal external Fabric connector extension example."
requires-python = ">=3.14,<3.15"
dependencies = ["policy-engine"]

[project.entry-points."polisyos.fabric_connectors"]
"example.local_rows" = "polisyos_fabric_connector_example:local_rows_connector_component"

[tool.hatch.build.targets.wheel]
packages = ["src/polisyos_fabric_connector_example"]
