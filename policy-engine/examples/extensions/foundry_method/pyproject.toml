[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "polisyos-foundry-method-example"
version = "0.1.0"
description = "Minimal external Foundry method extension example."
requires-python = ">=3.14,<3.15"
dependencies = ["policy-engine"]

[project.entry-points."polisyos.foundry_methods"]
"example.weighted_average" = "polisyos_foundry_method_example:weighted_average_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/polisyos_foundry_method_example"]
