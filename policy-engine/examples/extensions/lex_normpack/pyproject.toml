[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "polisyos-lex-normpack-example"
version = "0.1.0"
description = "Minimal external Lex NormPack provider extension example."
requires-python = ">=3.14,<3.15"
dependencies = ["policy-engine"]

[project.entry-points."polisyos.lex_normpacks"]
"example.minimum_wage" = "polisyos_lex_normpack_example:minimum_wage_normpack_component"

[tool.hatch.build.targets.wheel]
packages = ["src/polisyos_lex_normpack_example"]
