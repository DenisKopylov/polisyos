[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "polisyos-runtime-middleware-example"
version = "0.1.0"
description = "Minimal external Runtime middleware extension example."
requires-python = ">=3.14,<3.15"
dependencies = ["policy-engine"]

[project.entry-points."polisyos.runtime_middlewares"]
"example.response_header" = "polisyos_runtime_middleware_example:response_header_middleware_component"

[tool.hatch.build.targets.wheel]
packages = ["src/polisyos_runtime_middleware_example"]
