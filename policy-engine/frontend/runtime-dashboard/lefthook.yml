pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{css,js,json,md,mjs,ts,tsx,yaml,yml}"
      run: npx prettier --write --ignore-unknown {staged_files}
    eslint:
      glob: "*.{js,mjs,ts,tsx}"
      run: npx eslint --fix {staged_files}
    check-contrast:
      run: node --experimental-strip-types ../../tools/design/check-contrast.ts
    check-reduced-motion:
      run: node --experimental-strip-types ../../tools/design/check-reduced-motion.ts

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test
