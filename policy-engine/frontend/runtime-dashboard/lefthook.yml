pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{css,js,json,md,mjs,ts,tsx,yaml,yml}"
      run: npx prettier --write --ignore-unknown {staged_files}
    eslint:
      glob: "*.{js,mjs,ts,tsx}"
      run: npx eslint --fix {staged_files}

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test
