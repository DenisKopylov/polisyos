[build.targets.wheel]
packages = ["src/polisyos", "tools"]

[build.targets.wheel.force-include]
"data/dataset_catalog/seed_variable_alignments.yaml" = "polisyos/data_forge/domains/catalog/_resources/seed_variable_alignments.yaml"
"data/dataset_catalog/proxy_metric_alignments.yaml" = "polisyos/data_forge/domains/catalog/_resources/proxy_metric_alignments.yaml"
"data/dataset_catalog/wvs_indicator_registry.yaml" = "polisyos/data_forge/domains/catalog/_resources/wvs_indicator_registry.yaml"
"data/dataset_catalog/metrics_map.yaml" = "polisyos/data_forge/domains/catalog/_resources/metrics_map.yaml"

"architecture/production_quality/method_catalog_dependency_digest_domains.toml" = "polisyos/foundry/methods/catalog/_resources/method_catalog_dependency_digest_domains.toml"

"workers/dowhy-014/worker.py" = "polisyos/foundry/methods/catalog/causal/_dowhy_profile/worker.py"
"workers/dowhy-014/protocol.py" = "polisyos/foundry/methods/catalog/causal/_dowhy_profile/protocol.py"
"workers/dowhy-014/pyproject.toml" = "polisyos/foundry/methods/catalog/causal/_dowhy_profile/pyproject.toml"
"workers/dowhy-014/uv.lock" = "polisyos/foundry/methods/catalog/causal/_dowhy_profile/uv.lock"
"workers/dowhy-014/.python-version" = "polisyos/foundry/methods/catalog/causal/_dowhy_profile/.python-version"
"workers/dowhy-014/README.md" = "polisyos/foundry/methods/catalog/causal/_dowhy_profile/README.md"

[build]
directory = "_build/dist"

[build.targets.sdist]
include = [
  "data/dataset_catalog/seed_variable_alignments.yaml",
  "data/dataset_catalog/proxy_metric_alignments.yaml",
  "data/dataset_catalog/wvs_indicator_registry.yaml",
  "data/dataset_catalog/metrics_map.yaml",
  "architecture/production_quality/method_catalog_dependency_digest_domains.toml",
  "src/polisyos",
  "benchmarks",
  "docs",
  "ops",
  "schemas",
  "tools",
  "CHANGELOG.md",
  "README.md",
  "ruff.toml",
  "ruff.generated.toml",
  "mypy.ini",
  "basedpyright.toml",
  "pytest.ini",
  "mutmut.cfg",
  "pyproject.toml",
  "hatch.toml",
  "workers/dowhy-014/worker.py",
  "workers/dowhy-014/protocol.py",
  "workers/dowhy-014/pyproject.toml",
  "workers/dowhy-014/uv.lock",
  "workers/dowhy-014/.python-version",
  "workers/dowhy-014/README.md",
]
