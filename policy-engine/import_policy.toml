[policy]
version = "2"
internal_prefix = "polisyos"
src_root = "src"

[roots]
# data_forge is the planned build-time layer. calibration and synthetic_world are
# Foundry-adjacent but intentionally separate public-experimental roots:
# calibration exposes governance diagnostics/recalibration APIs, while
# synthetic_world exposes truth-centric benchmark fixtures consumed by Foundry.
known = [
  "common",
  "ir",
  "core",
  "fabric",
  "foundry",
  "calibration",
  "synthetic_world",
  "data_forge",
  "scientist",
  "runtime",
  "scholar",
  "lex",
  "packs",
  "academic",
  "batch_common",
  "batch_snapshot",
  "datasets",
  "ukraine_data",
]

[internal.allow]
common = ["common"]
ir = ["ir", "datasets"]
core = ["core", "ir", "common"]
fabric = ["fabric", "core", "ir", "common"]
foundry = ["foundry", "calibration", "synthetic_world", "academic", "core", "ir", "common"]
calibration = ["calibration", "scientist", "core", "ir", "common"]
synthetic_world = ["synthetic_world", "core", "ir", "common"]
data_forge = ["data_forge", "fabric", "core", "ir", "common"]
scientist = [
  "scientist",
  "lex",
  "scholar",
  "foundry",
  "fabric",
  "runtime",
  "core",
  "ir",
  "common",
  "academic",
  "datasets",
]
runtime = ["runtime", "scientist", "lex", "foundry", "fabric", "core", "ir", "common"]
scholar = ["scholar", "fabric", "ir", "core", "common"]
lex = ["lex", "batch_common", "fabric", "ir", "core", "common"]
packs = ["*"]
academic = ["academic", "batch_common", "ir", "core", "common"]
batch_common = ["batch_common", "ir", "core", "common"]
batch_snapshot = ["batch_snapshot", "batch_common", "ir", "core", "common"]
datasets = ["datasets", "batch_common", "fabric", "ir", "core", "common"]
ukraine_data = [
  "ukraine_data",
  "data_forge",
  "scientist",
  "lex",
  "foundry",
  "fabric",
  "batch_common",
  "ir",
  "core",
  "common",
]

[external.allow.ir]
# Top-level external modules allowed in IR (stdlib is always allowed).
modules = ["pydantic", "typing_extensions", "yaml", "numpy", "rustworkx", "networkx", "kuzu"]
