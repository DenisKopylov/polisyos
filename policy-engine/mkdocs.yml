site_name: PolicyOS Documentation
site_description: AI-driven Policy Simulation System using JAX and Unified Data Fabric
site_url: https://deniskopylov.github.io/polisyos/
repo_url: https://github.com/DenisKopylov/polisyos

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_if_no_docstring: false
            members_order: source
            show_root_heading: true
            show_source: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

exclude_docs: |
  archive/**
  CAUSAL_ENGINE_ARCHITECTURE.md
  DOCUMENTATION_SOTA_PLAN.md
  IMPLEMENTATION_GUIDE.md
  LEX_PRODUCTION_140K_RUNBOOK.md
  RESEARCH_TRACK_HANDOFF_TEMPLATE.md
  SYSTEM_PIPELINE_ARCHITECTURE.md
  benchmarks/**
  migration/**
  quality/**

