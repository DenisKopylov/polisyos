name: Design Wave 1 Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/design-wave1-evidence.yml"
      - "docs/brand/**"
      - "docs/compliance/**"
      - "release/design-wave1-release-notes.md"
      - "apps/runtime-dashboard/**"
      - "schemas/runtime_api_v1.openapi.json"
      - "src/polisyos/runtime/http/**"
      - "tools/design/**"
      - "tools/ops_runners/runtime/**"
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/design-wave1-evidence.yml"
      - "docs/brand/**"
      - "docs/compliance/**"
      - "release/design-wave1-release-notes.md"
      - "apps/runtime-dashboard/**"
      - "schemas/runtime_api_v1.openapi.json"
      - "src/polisyos/runtime/http/**"
      - "tools/design/**"
      - "tools/ops_runners/runtime/**"

jobs:
  evidence:
    name: Publish Wave 1 evidence bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        run: pip install uv

      - name: Sync Python dependencies
        run: uv sync --frozen --extra docs --extra lint --extra test --extra runtime --extra ml

      - name: Install frontend dependencies
        working-directory: apps/runtime-dashboard
        run: corepack pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: apps/runtime-dashboard
        run: corepack pnpm run lint

      - name: Typecheck frontend
        working-directory: apps/runtime-dashboard
        run: corepack pnpm run typecheck

      - name: Verify glyph vocabulary
        working-directory: apps/runtime-dashboard
        run: corepack pnpm run test:glyph-vocabulary

      - name: Run accessibility suite
        working-directory: apps/runtime-dashboard
        run: corepack pnpm run test:a11y

      - name: Run Storybook tests
        working-directory: apps/runtime-dashboard
        run: corepack pnpm run test:storybook

      - name: Build Storybook archive
        working-directory: apps/runtime-dashboard
        run: corepack pnpm run build-storybook

      - name: Verify Runtime API contract drift
        run: uv run --extra ml python tools/ops_runners/runtime/check_runtime_api_contract.py

      - name: Verify generated frontend API types
        working-directory: apps/runtime-dashboard
        run: |
          corepack pnpm run generate:api
          git diff --exit-code -- src/api/types.ts

      - name: Write evidence manifest
        run: |
          cat > wave1-evidence.json <<EOF
          {
            "git_sha": "${GITHUB_SHA}",
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "storybook_artifact_name": "wave1-storybook-static",
            "playwright_report_artifact_name": "wave1-playwright-report",
            "visual_report_artifact_name": "wave1-visual-report",
            "a11y_suite_status": "passed",
            "openapi_sync_status": "passed",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: wave1-evidence-manifest
          path: wave1-evidence.json
          if-no-files-found: error

      - name: Upload Storybook static archive
        uses: actions/upload-artifact@v4
        with:
          name: wave1-storybook-static
          path: _build/apps/runtime-dashboard/storybook-static
          if-no-files-found: error

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: wave1-playwright-report
          path: _build/apps/runtime-dashboard/playwright-report
          if-no-files-found: ignore

      - name: Upload visual report
        uses: actions/upload-artifact@v4
        with:
          name: wave1-visual-report
          path: |
            _build/apps/runtime-dashboard/test-results
            _build/apps/runtime-dashboard/playwright-report
          if-no-files-found: ignore

      - name: Upload contrast artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave1-contrast-artifact
          path: docs/compliance/A11Y_CONTRAST.md
          if-no-files-found: error
