name: Replay Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/polisyos/core/artifacts/**"
      - "src/polisyos/runtime/**"
      - "src/polisyos/scientist/**"
      - "src/polisyos/core/components/cli.py"
      - "tests/unit/core_phase0/test_artifact_graph.py"
      - "tests/unit/core_phase0/test_artifact_export_import.py"
      - "tests/unit/runtime/test_replay_runtime.py"
      - "tests/unit/scientist/replay/test_replay_backend.py"
      - "tests/unit/scientist/nodes/test_decision_packet_node_v3.py"
      - ".github/workflows/replay.yml"
  push:
    branches: [main]

jobs:
  replay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,test,causal-discovery]"
      - name: Run replay smoke tests
        run: |
          pytest \
            tests/unit/core_phase0/test_artifact_graph.py \
            tests/unit/core_phase0/test_artifact_export_import.py \
            tests/unit/runtime/test_replay_runtime.py \
            tests/unit/scientist/replay/test_replay_backend.py \
            tests/unit/scientist/nodes/test_decision_packet_node_v3.py \
            -q
