apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "polisyos-cell.fullname" . }}-quota
  namespace: {{ include "polisyos-cell.namespaceName" . }}
  labels:
    {{- include "polisyos-cell.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.resources.requests.cpu | quote }}
    requests.memory: {{ .Values.resources.requests.memory | quote }}
    limits.cpu: {{ .Values.resources.limits.cpu | quote }}
    limits.memory: {{ .Values.resources.limits.memory | quote }}
    pods: {{ .Values.resources.pods | quote }}
    services: {{ .Values.resources.services | quote }}
    persistentvolumeclaims: {{ .Values.resources.persistentvolumeclaims | quote }}
