{{- if and .Values.linkerd.enabled .Values.linkerd.strictMtls }}
{{- $ns := include "polisyos-cell.namespaceName" . }}
{{- range .Values.linkerd.servers }}
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "polisyos-cell.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ .component | quote }}
  port: {{ default "http" .port }}
  proxyProtocol: {{ default "HTTP/1" .proxyProtocol }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ .name }}-authn
  namespace: {{ $ns }}
  labels:
    {{- include "polisyos-cell.labels" $ | nindent 4 }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: {{ .name }}
  requiredAuthentication:
    - meshTLS:
        identityRefs:
          {{- if $.Values.linkerd.trustedServiceAccounts }}
          {{- range $.Values.linkerd.trustedServiceAccounts }}
          - kind: ServiceAccount
            namespace: {{ $ns }}
            name: {{ . }}
          {{- end }}
          {{- else }}
          - kind: ServiceAccount
            namespace: {{ $ns }}
          {{- end }}
---
{{- end }}
{{- end }}
