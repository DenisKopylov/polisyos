apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
  namespace: {{ .Values.namespace }}
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      server_address = "spire-server.{{ .Values.namespace }}.svc.cluster.local"
      server_port = "8081"
      socket_path = "{{ .Values.agent.socketPath }}/agent.sock"
      trust_domain = "{{ .Values.server.trustDomain }}"
    }

    plugins {
      KeyManager "memory" {
        plugin_data {}
      }
      WorkloadAttestor "k8s" {
        plugin_data {}
      }
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "policyos"
        }
      }
    }
