apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
  namespace: {{ .Values.namespace }}
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      trust_domain = "{{ .Values.server.trustDomain }}"
      data_dir = "{{ .Values.server.dataDir }}"
      log_level = "INFO"
      ca_ttl = "24h"
      default_x509_svid_ttl = "1h"
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "{{ .Values.server.dataDir }}/spire.sqlite3"
        }
      }
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "policyos" = {
              service_account_allow_list = ["{{ .Values.agent.serviceAccountName }}"]
            }
          }
        }
      }
      KeyManager "disk" {
        plugin_data {
          keys_path = "{{ .Values.server.dataDir }}/keys.json"
        }
      }
      Notifier "k8sbundle" {
        plugin_data {
          namespace = "{{ .Values.namespace }}"
          config_map = "spire-bundle"
        }
      }
    }
