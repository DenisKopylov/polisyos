[component_bundles]
version = 1
status = "active_draft"
owner = "team-ops"
phase = "repository-best-in-class-phase-4.9"
ops_organization_decision = "invert_to_ops_components"
component_bundle_root = "ops/components"
runbook_coverage_contract = "architecture/runbook_coverage.toml"
observability_contract = "architecture/component_observability.toml"
retention_policy_reference = "docs/reference/operations/retention-and-recovery.md"
runtime_contract_reference = "ops/runtime/runtime-contracts.toml"
compatibility_policy = "component aliases include package facade names and active compatibility roots so old and new caller language resolves to the same operability bundle"

[[component]]
id = "common"
aliases = ["common", "polisyos.common"]
classification = "public_stable"
owner = "team-core"
bundle = "ops/components/common"
source_readme = "src/polisyos/common/README.md"
slo_status = "exception"
slo_file = "ops/components/common/slo.yaml"
runbooks = ["docs/runbooks/dependency-upgrade-regression.md"]
alerts = []
dashboards = ["ops/observability/grafana/dashboards/slo-overview.json"]
runtime_contracts = ["architecture/public_surface.toml", "architecture/runtime_state_layout.toml"]
retention_policy = "ops/components/common/retention-policy.toml"
escalation = "team-core primary; team-platform joins for shared dependency or migration incidents"
exception_reason = "Common is a helper facade without standalone user-visible operations; reliability is covered by dependent component SLOs until it exposes runtime traffic."
exception_expires = "2026-08-01"
exception_issue = "docs/plans/archive/2026-05-07-repository-best-in-class-remediation-master-plan.md#phase-63---operability-release-and-supply-chain-gate-conversion"

