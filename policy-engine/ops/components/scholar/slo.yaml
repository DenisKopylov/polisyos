service: scholar
version: 1
owner: team-scholar
objectives:
  - name: scholar_search_provider_success_rate
    sli: rate(polisyos_scholar_provider_requests_total{status="success"}[30m]) / rate(polisyos_scholar_provider_requests_total[30m])
    threshold: ">= 0.95"
    window: 28d
    owner: team-scholar
    runbook: docs/runbooks/cache-rebuild-storm.md
  - name: scholar_bundle_freshness_seconds
    sli: max(polisyos_scholar_bundle_age_seconds)
    threshold: "< 604800s"
    window: 7d
    owner: team-scholar
    runbook: docs/runbooks/docs-publication-failure.md

