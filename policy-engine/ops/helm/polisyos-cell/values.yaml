cell:
  id: ""
  tier: "shared"
  region: "us-gov-west-1"
  isolationLevel: "namespace"

confidentialCompute:
  enabled: false
  runtimeClassName: ""
  vmSize: "Standard_DC16as_v5"
  attestation:
    enabled: true
    verifyBeforeDataAccess: true
    cacheAttestationSeconds: 300
    requiredMeasurements: []
    minTcbVersion: 0
  nodePool:
    minNodes: 2
    maxNodes: 8
    autoScaling: true

nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "8"
    memory: "16Gi"
  pods: 20
  services: 10
  persistentvolumeclaims: 5

networkPolicy:
  enabled: true
  allowedEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/component: monitoring
      ports:
        - port: 9090
          protocol: TCP
        - port: 4317
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

podSecurityStandard:
  enforce: "restricted"
  audit: "restricted"
  warn: "restricted"

rbac:
  create: true
  serviceAccountName: "polisyos-cell-sa"

opa:
  enabled: true
  policies: {}

linkerd:
  enabled: true
  strictMtls: true
  trustedServiceAccounts: []
  servers: []

deployGate:
  enabled: true
  policyPath: "polisyos/deploy/decision"
