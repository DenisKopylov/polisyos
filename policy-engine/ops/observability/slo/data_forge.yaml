service: data_forge
owner: team-data-forge
version: 1
objectives:
  - name: academic_pipeline_p95_duration
    sli: histogram_quantile(0.95, rate(data_forge_stage_duration_seconds_bucket{pipeline="academic"}[5m]))
    threshold: "< 3600"
    window: 28d
    runbook: docs/runbooks/benchmark-regression-triage.md
  - name: llm_cache_hit_rate
    sli: rate(data_forge_llm_cache_hits_total[5m]) / rate(data_forge_llm_requests_total[5m])
    threshold: "> 0.6"
    window: 7d
    runbook: docs/runbooks/benchmark-regression-triage.md
