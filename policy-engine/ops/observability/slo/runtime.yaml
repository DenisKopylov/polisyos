service: runtime
version: 1
owner: team-runtime
objectives:
  - name: runtime_api_p95_latency
    sli: polisyos:runtime_api_service_p95_latency_seconds:5m
    threshold: "< 1s"
    window: 28d
    owner: team-runtime
    runbook: docs/runbooks/runtime-api-outage.md
  - name: runtime_error_rate
    sli: polisyos:runtime_api_service_error_rate:rate5m
    threshold: "< 0.01"
    window: 28d
    owner: team-runtime
    runbook: docs/runbooks/runtime-api-outage.md
