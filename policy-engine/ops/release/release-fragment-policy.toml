[release_fragments]
version = 1
owner = "team-release"
mode = "fail_closed"
root = "release-fragments"
unreleased_root = "release-fragments/unreleased"
template = "release-fragments/template.toml"
accepted_extensions = [".toml"]
required_fields = [
  "id",
  "title",
  "type",
  "owner",
  "summary",
  "evidence",
]
allowed_types = [
  "added",
  "changed",
  "deprecated",
  "removed",
  "fixed",
  "security",
]
structured_compatibility_table = "compatibility_change"
structured_compatibility_required_fields = [
  "id",
  "change_class",
  "impact",
  "surface",
  "owner",
  "version_owner",
  "deprecation_window",
  "release_note",
]
generated_client_compatibility_values = [
  "not_applicable",
  "declared_compatible",
  "requires_regeneration",
  "breaking_requires_consumer_action",
]
baseline_command = "manual review: validate release fragments against this policy before release candidate cut"
