[secrets_baseline]
version = 1
owner = "team-security"
mode = "fail_closed"
primary_scanner = "gitleaks"
deep_scanner = "trufflehog"
config_paths = [
  "ops/security/gitleaks.toml",
  "ops/security/trufflehog.yaml",
]
blocked_secret_locations = [
  ".env",
  ".polisyos/",
  "ops/cloud/deploy/assets/",
  "policy-engine/.polisyos/",
]
allowed_placeholder_patterns = [
  "PLACEHOLDER_",
  "example-secret",
]
baseline_commands = [
  "gitleaks detect --config ops/security/gitleaks.toml --no-banner",
  "trufflehog filesystem --config ops/security/trufflehog.yaml .",
]
