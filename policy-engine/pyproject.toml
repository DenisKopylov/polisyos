    "optax>=0.1.9",
    "jaxtyping>=0.2.25",
    # Data Fabric
    "duckdb>=0.9.2",
    "hnswlib",
    "pyarrow>=14.0.0",
    "aiohttp>=3.9.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "odfpy>=1.4.1",
    "pypdf>=5.5.0",
    "openai",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "tiktoken",
    "orjson>=3.10.0",
    "opt_einsum>=3.4.0",
