[tool.hatch.build.targets.wheel]
packages = ["src/polisyos", "tools"]

[tool.hatch.build.targets.sdist]
include = [
  "src/polisyos",
  "benchmarks",
  "docs",
  "ops",
  "schemas",
  "tools",
  "CHANGELOG.md",
