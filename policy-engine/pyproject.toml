[project]
name = "policy-engine"
version = "0.1.0"
description = "AI-driven Policy Simulation System using JAX and Unified Data Fabric"
requires-python = ">=3.11"
dependencies = [
    # Core Math & Sim
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "diffrax>=0.5.0",
    "optax>=0.1.9",
    "jaxtyping>=0.2.25",
    # Data Fabric
    "duckdb>=0.9.2",
    "pyarrow>=14.0.0",
    "aiohttp>=3.9.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    # Observability
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-prometheus>=0.41b0",
    # Orchestration
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "pymoo>=0.6.0",
    # Utils
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "loguru>=0.7.2",
    "packaging>=23.0",
    "jax-metal>=0.1.1",
    "chex>=0.1.91",
    "streamlit>=1.52.2",
    "plotly>=6.5.0",
    "hypothesis>=6.151.2",
]

[project.optional-dependencies]
kuzu = ["kuzu>=0.1.0"]
analytics = [
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "linearmodels>=5.0",
    "pandas>=2.0.0",
]
causal = [
    "dowhy>=0.11",
    "econml>=0.15",
]
solvers = [
    "ortools>=9.8",
    "pulp>=2.8",
]
methods-full = [
    "policy-engine[analytics]",
    "policy-engine[causal]",
    "policy-engine[solvers]",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "prometheus-client>=0.17.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]
search_bo = [
    "torch>=2.0.0",
    "gpytorch>=1.11",
    "botorch>=0.9.0",
    "linear_operator>=0.5.0",
    "scipy>=1.10.0",
]
search_mo = [
    "torch>=2.0.0",
    "gpytorch>=1.11",
    "botorch>=0.9.0",
    "linear_operator>=0.5.0",
    "scipy>=1.10.0",
]

[project.scripts]
polisy = "polisyos.foundry.plugins.cli:main"
polisyos = "polisyos.core.components.cli:main"

[project.entry-points."polisyos.methods"]
# Method plugins can register entry points here.

[project.entry-points."polisyos.ir_fragments"]
"roads.core" = "polisyos.packs.roads.ir_fragments:roads_ir_fragment_component"
"econ.core" = "polisyos.packs.econ.ir_fragments:econ_ir_fragment_component"

[project.entry-points."polisyos.foundry_methods"]
"roads.method" = "polisyos.packs.roads.foundry_methods:roads_method_component"

[project.entry-points."polisyos.scholar_extractors"]
"roads.extractor" = "polisyos.packs.roads.scholar_extractors:roads_extractor_component"

[project.entry-points."polisyos.lex_extractors"]
"roads.lex_regex" = "polisyos.packs.roads.scholar_extractors:lex_norm_regex_extractor_component"

[project.entry-points."polisyos.lex_evaluators"]
"roads.simple_eval" = "polisyos.packs.roads.lex_evaluators:lex_simple_evaluator_component"

[project.entry-points."polisyos.norm_pack_providers"]
"roads.norms" = "polisyos.packs.roads.norms_provider:roads_norms_provider_component"

# --- Tool Configurations ---

# 1. Настройка Ruff (Линтер + Форматер)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (imports sorting)
    "B",   # flake8-bugbear (catching common bugs)
    "T20", # flake8-print (FORBID PRINT STATEMENTS - требование ТЗ)
    "N",   # pep8-naming
]
ignore = []

# Запрещаем print только в продакшн коде (src), разрешаем в скриптах и утилитах
[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["T201"]
"tests/*" = ["T201"]
"tests/**" = ["T201"]
"src/polisyos/common/*" = ["T201"]  # Разрешаем print в утилитах для отладки
"tools/*" = ["T201"]
"tools/**" = ["T201"]

# 2. Настройка Mypy (Типизация)
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true # Для библиотек без типов (некоторые ML либы)
plugins = ["pydantic.mypy"] # Плагин для корректной работы с Pydantic v2

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=prepend"
testpaths = ["tests"]
markers = [
    "integration: slow or DB-backed workflow tests",
]

[dependency-groups]
test = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.14.10",
    "types-requests>=2.32.4.20250913",
]
