# --- Tool Configurations ---

# 1. Настройка Ruff (Линтер + Форматер)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (imports sorting)
    "B",   # flake8-bugbear (catching common bugs)
    "T20", # flake8-print (FORBID PRINT STATEMENTS - требование ТЗ)
    "N",   # pep8-naming
]
ignore = []

# Запрещаем print только в продакшн коде (src), разрешаем в скриптах и утилитах
[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["T201"]
"tests/*" = ["T201"]
"tests/**" = ["T201"]
"src/polisyos/common/*" = ["T201"]  # Разрешаем print в утилитах для отладки
"tools/*" = ["T201"]
"tools/**" = ["T201"]

# 2. Настройка Mypy (Типизация)
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true # Для библиотек без типов (некоторые ML либы)
plugins = ["pydantic.mypy", "polisyos.foundry.methods.mypy_plugin"] # Плагин для корректной работы с Pydantic v2

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: slow or DB-backed workflow tests",
    "benchmark: performance regression benchmarks (requires pytest-benchmark)",
    "property: hypothesis property-based tests",
]

# ---------------------------------------------------------------------------
# Mutation testing (mutmut) — run locally, not on every PR (too slow)
# ---------------------------------------------------------------------------
# Run with:
#   cd policy-engine
#   mutmut run --paths-to-mutate src/polisyos/foundry/methods/backends/ \
#               --tests-dir tests/foundry/methods/backends/
#   mutmut results
#
# Target mutation score: ≥ 70% kill rate for backends/ and base.py core paths.
[tool.mutmut]
paths_to_mutate = "src/polisyos/foundry/methods/"
tests_dir = "tests/foundry/"
runner = "python -m pytest tests/foundry/methods/ -x -q --no-header"
dict_synonyms = "Synth, Fake, Dummy, Stub, Mock"
