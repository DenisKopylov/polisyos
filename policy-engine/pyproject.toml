[tool.basedpyright]
# Repository-wide policy keeps the root basedpyright scope curated and green.
# Phase 3 adds a baseline for the IR foundation layer so `common -> ir -> core`
# can ratchet serially without hiding new regressions. Phase 5A extends the same
# baseline ratchet to Scientist instead of making the full consumer layer
# fail-closed in one pass.
include = [
  "src/polisyos/common",
  "src/polisyos/ir",
  "src/polisyos/core",
  "src/polisyos/fabric",
  "src/polisyos/data_forge",
  "src/polisyos/academic",
  "src/polisyos/datasets",
  "src/polisyos/ukraine_data",
  "src/polisyos/batch_common",
  "src/polisyos/batch_snapshot",
  "src/polisyos/scientist",
  "src/polisyos/runtime",
]
baselineFile = ".basedpyright/baseline.json"
exclude = [
  "**/__pycache__",
  ".venv",
  ".venv_codex",
  ".hypothesis",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "docs/archive",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"
reportPrivateUsage = "warning"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast isolated tests; applied by default when no broader taxonomy class matches",
  "contract: compatibility and schema-boundary tests for stable cross-layer surfaces",
  "property: hypothesis property-based tests",
  "integration: multi-component or runtime-boundary tests that cross subsystem seams",
  "performance: runtime, benchmark, and regression-cost tests",
  "benchmark: performance regression benchmarks (requires pytest-benchmark)",
  "smoke: minimal confidence tests for local and CI fast paths",
  "slow: intentionally higher-cost tests excluded from the fastest loops",
  "flaky: unstable tests that require explicit owner follow-up",
  "quarantine: temporarily de-gated tests tracked in tests/quarantine.toml",
]

# ---------------------------------------------------------------------------
# Mutation testing (mutmut) — run locally, not on every PR (too slow)
# ---------------------------------------------------------------------------
# Run with:
#   cd policy-engine
#   mutmut run --paths-to-mutate src/polisyos/foundry/methods/backends/ \
#               --tests-dir tests/foundry/methods/backends/
#   mutmut results
#
# Target mutation score: ≥ 70% kill rate for backends/ and base.py core paths.
[tool.mutmut]
paths_to_mutate = "src/polisyos/foundry/methods/"
tests_dir = "tests/foundry/"
runner = "python -m pytest tests/foundry/methods/ -m 'not slow and not benchmark and not performance' -x -q --no-header"
dict_synonyms = "Synth, Fake, Dummy, Stub, Mock"
