# --- Tool Configurations ---

# 1. Настройка Ruff (Линтер + Форматер)
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort (imports sorting)
  "B",   # flake8-bugbear (catching common bugs)
  "T20", # flake8-print (FORBID PRINT STATEMENTS - требование ТЗ)
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "S",   # flake8-bandit
  "PT",  # pytest style
  "SIM", # simplify
  "RUF", # ruff-native correctness rules
  "ANN", # explicit annotations
  "C4",  # comprehensions
  "TCH", # type-checking import hygiene
]
ignore = []
allowed-confusables = [
  "–",
  "σ",
  "−",
  "α",
  "с",
  "ρ",
  "р",
  "γ",
  "В",
  "е",
  "а",
  "б",
  "о",
  "∪",
  "у",
  "×",
]

# Suppression policy: new noqa/type-ignore entries require an ADR-style comment
# in the touched file or an explicit per-file ignore here; blanket project-wide
# ignores are intentionally left empty.
# Запрещаем print только в продакшн коде (src), разрешаем в скриптах и утилитах
[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["T201"]
"tests/*" = ["ANN", "S101", "T201"]
"tests/**" = [
  "ANN",
  "E402",
  "E501",
  "F841",
  "PT011",
  "PT018",
  "RUF100",
  "S101",
  "S108",
  "S603",
  "S607",
  "SIM102",
  "T201",
  "TC001",
  "TC002",
  "TC003",
  "UP047",
]
"src/polisyos/ir/**" = [
  "ANN401",
  "TC001",
  "TC003",
  "E501",
  "SIM102",
] # IR contracts rely on runtime-visible annotations for Pydantic model rebuilds.
"tests/ir/**" = [
  "ANN",
  "B017",
  "E501",
  "N806",
  "PT011",
  "RUF043",
  "S101",
  "T201",
] # IR tests assert broad validation behavior and use math-style fixture names.
# Phase 3 keeps Core on the same ratchet model as IR: keep public facades and
# optional runtime adapters stable now, then remove these local ignores module by
# module as the base layer is hardened.
