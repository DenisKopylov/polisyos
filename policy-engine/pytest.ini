[pytest]
minversion = 6.0
addopts = -ra -q --import-mode=importlib --strict-markers --benchmark-storage=file://./_cache/benchmarks
cache_dir = _cache/pytest
testpaths =
    tests
asyncio_mode = auto
markers =
    unit: fast isolated tests; applied by default when no broader taxonomy class matches
    contract: compatibility and schema-boundary tests for stable cross-layer surfaces
    property: hypothesis property-based tests
    integration: multi-component or runtime-boundary tests that cross subsystem seams
    performance: runtime, benchmark, and regression-cost tests
    repo_quality: repository structure, lint, tooling, and test-topology quality gates
    benchmark: performance regression benchmarks (requires pytest-benchmark)
    smoke: minimal confidence tests for local and CI fast paths
    slow: intentionally higher-cost tests excluded from the fastest loops
    flaky: unstable tests that require explicit owner follow-up
    quarantine: temporarily de-gated tests tracked in tests/quarantine.toml
