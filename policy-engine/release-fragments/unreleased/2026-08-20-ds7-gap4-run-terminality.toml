  "architecture/atlas_surfaces/generated_client_receipt_census.py",
  "architecture/atlas_surfaces/status-retirement-inventory.json",
]
compatibility = "Client regeneration is required. GAP4's net client contribution is additive, while the dashboard regeneration also incorporates the inherited AuthMeResponse.permissions narrowing registered as open GY-DEF20; the release owner retains the compatibility-impact ruling."
change_class = "schema-openapi-abi"
surface_classification = "public_stable: polisyos.runtime RunSummary"
migration = "Regenerate both runtime OpenAPI client families before consuming run_terminality, review dashboard permission consumers against RuntimePermission, preserve not_established, and never derive terminality from status or timestamps."
api = "RunSummary now carries run_terminality as terminal, non_terminal, or not_established; governed runs-channel registry examples move from version v1 to v2."
limitations = "The lifecycle terminality fact is distinct from design-search terminal_kind. Clients predating this fragment have no lifecycle binding and must render that state as absent rather than false. GY-DEF20 remains open for generated-family output ownership and required freshness execution. GY-DEF21 remains open because the one-time status-inventory receipt refresh does not close generated-construct identity safety."
