id = "2026-08-20-ds7-gap4-run-terminality"
title = "Expose producer-owned run terminality"
type = "added"
component = "runtime"
owner = "team-polisyos"
summary = "Expose producer-owned run terminality through RunSummary and regenerate both OpenAPI client families."
evidence = [
  "docs/superpowers/journals/2026-08-20-ds7-cycle-board.md",
  "docs/superpowers/journals/2026-08-16-gy-gap4-run-terminality.md",
