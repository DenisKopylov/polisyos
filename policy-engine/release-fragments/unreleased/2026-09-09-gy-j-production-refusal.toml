  "docs/superpowers/journals/gy-eight-gaps-evidence/j/companions/openapi-current-contract.json",
]
compatibility = "SearchQualityRecord requires recall_at_known_seeds and permits null only with its strict not_established population basis. A refused workspace and refused ledger are distinct types, not ordinary workspace/search results with fabricated references. Their durable search-exit and ledger artifacts use manifest schema 2.0; ordinary artifacts retain schema 1.0. Readers limited to the ordinary/schema-1.0 dialect must handle the new refusal dialect explicitly."
change_class = "persisted-artifact-format"
surface_classification = "internal: polisyos.pdc; internal: polisyos.runtime.quality.workspace.loop; internal: polisyos.runtime.http.services.control"
migration = "Runtime-quality owns the consumer update: distinguish a required null recall from numeric zero, retain its typed unavailable reason and request binding, and decode the paired refused workspace/ledger before reading component references or rates. Runtime owns supported schema/client migration if the actual OpenAPI diff requires it. Preserve historical receipts and rederive current outcome v3, graded report v2 and replay v2 through the existing owner; do not relabel historical bytes."
api = "The complete OpenAPI comparison changes only dependency/replay scalars in the governed confidence-ledger example; HTTP schema shapes are unchanged and all generated clients remain byte-identical to the L checkpoint. The actual full API contract check is red for that example dependency drift. The worker readset contains a random temporary-probe absence; sole-cause attribution is not established because the earlier export did not retain its complete readset. No release readiness is claimed. Internal durable manifest schema 2.0 is separate from the HTTP API version."
limitations = "A source-admission refusal does not supply missing original-construct/scope evidence, an institutional appointment, causal identification, or partial-admissibility authority. Unavailable evidence must not enter a positive useful-design numerator. A missing or unreadable population is unavailable rather than an assumed zero. The canonical case's remaining evidence-admission limitation is reported separately in the task journal. The current Runtime API contract check remains red for governed N11 example dependency drift; the default architecture check remains unavailable under the forbidden-input rule. Both require their named owners before release promotion."
generated_client_compatibility = "declared_compatible"
public_surface_inventory_reviewed = true
migration_docs = ["docs/superpowers/journals/2026-09-09-gy-j-repair.md"]
runbook_docs = ["docs/runbooks/migration-release-promotion.md"]

