id = "2026-09-09-gy-j-production-refusal"
title = "Preserve unavailable evidence in production workspace refusals"
type = "fixed"
component = "runtime-quality"
owner = "team-runtime-quality"
summary = "Production workspace refusals retain their verified original-demand limitations and unavailable search quantities without inventing workspace components or useful-design credit."
evidence = [
  "tests/unit/runtime/quality/workspace/test_production_case_admission.py",
  "tests/unit/runtime/quality/workspace/test_production_case_proof_custody.py",
  "tests/unit/runtime/quality/workspace/test_production_case_public_contracts.py",
  "tests/repo_quality/architecture/test_layer3_gy_artifact_lifecycle.py",
  "docs/superpowers/journals/2026-09-09-gy-j-repair.md",
