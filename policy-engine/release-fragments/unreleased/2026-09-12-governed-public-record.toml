id = "2026-09-12-governed-public-record"
title = "Add bounded governed public record admission"
type = "added"
component = "runtime"
owner = "team-polisyos"
summary = "Add an explicitly selected governed publication mode that verifies an exact Claim-owner source and separately signed institutional mandate, retains public meaning, and feeds installed signature custody."
evidence = ["tests/unit/runtime/http/test_public_export.py", "tests/unit/scientist/governance/continuous/test_governed_public_record.py", "tests/unit/scientist/governance/continuous/test_governed_public_record_population.py", "apps/runtime-dashboard/src/features/runs/routes/PublicDecisionViewerPage.governed.test.tsx"]
compatibility = "Default verification-report issuance and legacy pvr records retain their existing schema and refusal behavior. Explicit governed modes and gpr responses add strict union arms."
change_class = "schema-openapi-abi; js-package-api"
surface_classification = "public_stable: runtime public decision HTTP API; internal: Scientist admission owner and runtime-dashboard viewer"
migration = "Regenerate consumers and discriminate publication_class before handling governed responses. Configure the separate publication trust slot and an externally signed exact mandate; the default slot remains empty."
api = "Adds governed_public_record_candidate and governed_public_record query modes to the existing authenticated issuance route and a governed response arm to anonymous verification."
limitations = "Establishes bounded issuer issuance and exact-profile faithfulness only; no actual institution is appointed, no real first promotion is asserted, and policy performance, complete history, current authority and public evidence obtainability remain unestablished."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = true
migration_docs = ["docs/how-to/configure-governed-publication.md"]
runbook_docs = ["docs/how-to/configure-governed-publication.md"]

