compatibility = "Legacy ATTRIBUTION inputs remain readable and are normalized at the validation boundary to an explicit intervention target plus an observational comparator. Historical causal-query-result payloads with schema 1.0 remain readable; new persisted results use matching payload and CAS-manifest schema 1.1, with the original 1.0 source recorded when a legacy payload is normalized."
change_class = "python-public-api; persisted-artifact-format"
surface_classification = "public_stable: polisyos.ir causal query DTOs and facade"
migration = "Continue reading historical 1.0 result artifacts through the existing loader. New callers should construct CausalContrastSpec with an interventional InterventionSpec target and an explicitly tagged CausalRegime comparator, then preserve both arms when forwarding results to producer, CAS, and ensemble consumers. Regenerate the checked-in IR schemas/catalog and review the public-surface inventory before release promotion."
api = "Adds the CausalRegime and CausalContrastSpec contracts (with compatibility aliases), exposes them through the polisyos.ir facade, persists both contrast arms in CausalQueryResult and uncertainty-envelope metadata, and rejects mixed canonical arms before ensemble aggregation."
limitations = "An explicit observational comparator is not do(X=0), and an independent mean contrast is not a shared-U individual effect. The change does not establish causal identification, empirical-root authority, or nonlinear posterior support; existing unsupported abduction paths remain typed limited and non-gate-eligible. Checked-in generated schemas and the public-surface inventory are release companions and must be regenerated/reviewed before this fragment is promoted."
