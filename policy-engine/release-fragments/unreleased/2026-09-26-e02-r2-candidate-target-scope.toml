compatibility = "Additive optional NaturalLanguageRunRequest field. A selector is retained in the job payload and status, but does not grant world-model authority or select the repository's default Ukraine world."
change_class = "schema-openapi-abi"
surface_classification = "public_stable: natural-language run request and job-status progress"
migration = "Regenerate the runtime client and dashboard types from the exported OpenAPI snapshot. Callers may omit the field; old schema-1.0 job payloads remain readable."
api = "POST /api/v1/control/runs/nl accepts optional target_world_scope_profile_id. The job-status API reports target_world_scope_status and target_world_scope_profile_status for candidate work."
limitations = "There is no owner-admitted target-world profile or complete served N4-to-N5-to-S8 authority bridge. A supplied profile remains profile_admission_missing; N5 and S8 are not run from this candidate-only path. Job-status progress carries these keys in an untyped map, not named OpenAPI response fields."
