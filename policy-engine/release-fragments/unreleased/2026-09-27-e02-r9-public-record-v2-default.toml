id = "2026-09-27-e02-r9-public-record-v2-default"
title = "Version governed public-record responses with selected-view provenance"
type = "changed"
component = "runtime-api"
owner = "team-polisyos"
summary = "Governed public-record responses now default to a versioned v2 projection that retains selected CAS manifest-profile identity in public evidence references."
evidence = [
  "tests/unit/scientist/governance/continuous/test_governed_public_record.py",
  "tests/unit/runtime/http/test_public_export.py",
  "apps/runtime-dashboard/src/features/runs/routes/PublicDecisionViewerPage.governed.test.tsx",
  "docs/how-to/governed-public-record-v2-consumer-migration.md",
]
compatibility = "Governed publication now emits a v2 document/profile and signed-record schema/rule pair by default. V2 public evidence references retain an opaque selected-view handle alongside the existing blob identifier. Strict response consumers must discriminate paired document and record versions. The v1 owner projection emits selector-free references; the dashboard retains a v1 parsing arm. Historical v1 signed-byte replay remains not_established. Artifact ID strings and route paths do not change."
change_class = "schema-openapi-abi; js-package-api"
surface_classification = "public_stable: Runtime API governed-public-record response; public_stable: @polisyos/runtime-api-client; internal: runtime-dashboard response validator"
migration = "Before consuming the changed default, regenerate the runtime API client and dashboard API types. Validate document schema_version with its profile and promoted-record schema_version with its rule_version, then require the two versions to agree. Preserve every selected evidence reference, including manifest_profile_sha256; do not collapse references by artifact_id. This migration declaration does not claim historical v1 signed-byte replay."
api = "The existing governed publication and verification routes remain unchanged. The default public document/profile and signed-record schema/rule move to v2. The v2 public evidence references retain selected manifest-profile identity; public_document remains recursively typed JSON in OpenAPI."
limitations = "This change does not establish historical v1 signed-byte replay, evidence-byte public obtainability, institutional authority, or the truth of claims. The public selected-view handle is opaque; it is not a CAS address, a recomputable digest, or an evidence retrieval URL."
generated_client_compatibility = "breaking_requires_consumer_action"
public_surface_inventory_reviewed = false
migration_docs = ["docs/how-to/governed-public-record-v2-consumer-migration.md"]
runbook_docs = ["docs/how-to/governed-public-record-v2-consumer-migration.md"]

