id = "2026-10-05-async-cache-recovery"
title = "Recover async node cache entries without blocking the event loop"
type = "fixed"
component = "scientist-engine"
owner = "team-scientist"
summary = "AsyncWorkflowExecutor emits NODE_CACHE_STORE after successful cache persistence so a new executor can recover verified state operations without rerunning the producer. Cold trace and checkpoint recovery uses one bounded worker-private cache with caller context, read-budget and absolute workflow-deadline checks; cancelled, expired or superseded recovery cannot publish that cache, and the workflow body receives time remaining after startup."
evidence = ["tests/integration/scientist/test_execution_state_replay.py", "tests/integration/scientist/test_async_cache_recovery.py"]
compatibility = "Internal trace parity with WorkflowExecutor; no artifact schema changes. Synchronous cache seed/load calls preserve their existing default behavior; optional absolute deadlines bound recovery admission when supplied."
change_class = "internal-runtime-behavior"
surface_classification = "internal: scientist orchestration engine"
migration = "No migration. Older async traces without cache-store events remain readable but cannot seed their unreferenced cache entries."
limitations = "Local FileSystemCAS and spawned-worker behavior are measured. An already-entered backend read and early workflow/state persistence may finish after deadline or cancellation; timed-out worker caches remain private. Thread-affine stores, full concurrent reentrant execute, current institutional authorization, production latency and operated Temporal/Ray history remain unverified."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = true
