summary = "Level 6 invokes an effectful promotion runner only when a declared owner recheck returns the boolean True. A missing recheck, strings, mappings and other truthy values now defer before invoking the runner."
compatibility = "Generic callers must supply an owner callback returning an explicit boolean permission. The native policy callback already recomputes its permission and returns bool. Read-only attached promotion results retain their interpretation."
surface_classification = "internal: scientist multi-fidelity funnel callback boundary"
limitations = "An explicit True establishes callback ordering, not independently verified owner admission. A content-bound typed owner contract remains required for arbitrary generic promotion callbacks."
