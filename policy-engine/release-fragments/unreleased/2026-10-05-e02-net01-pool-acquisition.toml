id = "2026-10-05-e02-net01-pool-acquisition"
title = "Bound connector acquisition and retain cleanup ownership"
type = "fixed"
component = "fabric-connectors"
owner = "team-polisyos"
summary = "Connector pools recompute their absolute acquisition budget before physical work, retries, and final handle publication. Suppressed connector cancellation cannot admit a late handle, and publication commits successful acquisition accounting without a later await. Shutdown retains physical ownership through cleanup."
evidence = [
  "tests/unit/fabric/connectors/test_pool_e02.py",
  "src/polisyos/fabric/connectors/README.md",
]
compatibility = "The configured acquisition timeout now covers semaphore waiting, connect, and health validation together. The pool reports its deadline as PoolExhaustedError; a shorter connection timeout retains TimeoutError. Cleanup may finish after that deadline while retaining the physical connection and permit."
change_class = "internal"
surface_classification = "internal: polisyos.fabric.connectors.pool under the public-surface manifest default rule"
migration = "Review acquire_timeout_seconds as the complete acquisition budget. No configuration fields or exports change."
api = "ConnectionPool.acquire and close_all retain their signatures."
limitations = "An entered connector operation or disconnect can suppress cancellation or remain blocked. The deadline prevents late admission; it is not a hard wall-time bound or permission to abandon a live handle. Failed disconnect retains ownership and can delay shutdown."
generated_client_compatibility = "not_applicable"
