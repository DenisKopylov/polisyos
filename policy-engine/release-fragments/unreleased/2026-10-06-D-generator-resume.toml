id = "2026-10-06-D-generator-resume"
title = "Expose native Bayesian generator continuation and configured transfer activation"
type = "added"
component = "scientist-search"
owner = "team-policyos-runtime"
change_class = "internal-contract"
surface_classification = "internal"
summary = "The existing BayesianCandidateGenerator exposes get_state/set_state with a strict versioned wrapper delegating the actual native strategy artifact and numerical model/RNG continuation. Paired configure_transfer(bridge,fingerprint) activates the existing CAS admission reader before any generator activity."
compatibility = "The wrapper schema bayesian_candidate_generator.v2 binds metric, direction, split, space, n_initial, seed and configured numerical basis. Unknown/mismatched wrappers are refused before native atomic restore. A resumed caller must retain the converted numerical history prefix; indexed converted history rows retain full current transfer refs, and the same configured admission reader resolves them before native restore; service custody owns the original full history and run lifecycle. Historical generator v1 wrappers lack that current-row custody and are refused. Transfer configuration after activity is refused. Existing constructor-based activation remains supported."
migration = "Checkpoint the internal generator through get_state/set_state rather than reaching into its native optimizer. Supply the configured bridge and target fingerprint as a pair before warm/history/generation. Preserve null/unavailable outcomes; neither a discovery match nor a checkpoint issues source authority."
evidence = ["tests/unit/scientist/methods/autotune/test_generator_checkpoint_activation.py"]
limitations = "This is a conditional existing receiver API; persistence and factory lifecycle are owned by the native search service/controller companion. Raw history custody, institutional ownership and live production producer appointment are not established by synthetic CAS fixtures."

