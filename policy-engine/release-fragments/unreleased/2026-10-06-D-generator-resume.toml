summary = "The existing BayesianCandidateGenerator exposes get_state/set_state with a strict versioned wrapper delegating the actual native strategy artifact and numerical model/RNG continuation. Paired configure_transfer(bridge,fingerprint) activates the existing CAS admission reader before any generator activity."
compatibility = "The additive wrapper schema bayesian_candidate_generator.v1 binds metric, direction, split, space, n_initial, seed and configured numerical basis. Unknown/mismatched wrappers are refused before native atomic restore. A resumed caller must retain the converted numerical history prefix; service custody owns the original full history and run lifecycle. Transfer configuration after activity is refused. Existing constructor-based activation remains supported."
migration = "Checkpoint the public generator through get_state/set_state rather than reaching into its native optimizer. Supply the configured bridge and target fingerprint as a pair before warm/history/generation. Preserve null/unavailable outcomes; neither a discovery match nor a checkpoint issues source authority."
evidence = ["tests/unit/scientist/methods/autotune/test_generator_checkpoint_activation.py"]
limitations = "This is a conditional existing receiver API; persistence and factory lifecycle are owned by the native search service/controller companion. Raw history custody, institutional ownership and live production producer appointment are not established by synthetic CAS fixtures."
