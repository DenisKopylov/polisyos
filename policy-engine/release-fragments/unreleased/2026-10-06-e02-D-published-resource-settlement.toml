summary = "Extend the existing file budget ledger with owned reservations and atomic measured provider-event settlement; wire LLMBudgetEnforcer through BudgetMiddleware with fresh-reader accounting. Preserve full reported charges above estimates and on unlimited keys, separate cache reuse, and retain unknown billing for reconciliation."
evidence = ["tests/unit/scientist/orchestration/engine/test_budget_ledger.py", "tests/integration/scientist/orchestration/llm/test_budget_enforcer.py"]
compatibility = "Legacy budget methods and non-persisted LLM estimate accounting remain available. Existing snapshots admit empty event state; snapshots written with resource identity state require the updated reader. Measured mode requires an explicit persisted BudgetMiddleware and definite run/provider/request identity."
limitations = "Provider amounts are reported receipts, not independently attested billing. Numerical duration or tariff estimates are not measured spend. Unresolved calls retain reservations pending provider reconciliation; durable identities remain for the ledger lifetime."
