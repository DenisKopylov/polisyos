compatibility = "New adversarial writers emit StressTestReport schema 1.1 with optional strict scenario evidence. New readers accept 1.0 only without new evidence fields; unknown schema versions are refused. Absent new fields are omitted from legacy serialization. Legacy strict readers require upgrade for 1.1. is_robust now requires complete available scenario evidence; historical issue-only reports remain readable but do not establish robustness. Threshold intakes refuse booleans, strings, nonfinite values and overflowing numbers. D challenge-case intake refuses non-boolean passed values before coercion; the report adapter publishes typed case outcomes even for passing/empty suites. Empty and incomplete suites cannot be promoted; unknown/skipped outcomes stay separate."
migration = "Upgrade stress report consumers before activating 1.1 writers. Inspect scenario_evidence, partial adequacy and observed-finite scope; never infer population probability or model uncertainty from this fraction. Blueprint suite replacement carries individual count bases, including known challenge_case_pass outcomes with unique case identities; unsupported legacy components require their producer evidence. Scientific case rules and runners are unchanged. An optional caller-supplied BudgetMiddleware reaches the ordinary node funnel factory through the internal frozen keyword-only PolicyBudgetExecutionContext subtype, with the same run scope; JSON state never carries this object. Plain ExecutionContext remains unmanaged. Anonymous report retries bind actual canonical content and are counted once; same identity with changed content is refused. This is not deployed service wiring."
limitations = "The declared finite observed stream is not whole-space coverage or a population sampling law. Existing grouped example order/top-k and payload bounds are preserved. No finding closure, institutional acceptance or default deployed owner wiring is established by this change. E owns DOE engine/profile adoption; B owns resource authority."
