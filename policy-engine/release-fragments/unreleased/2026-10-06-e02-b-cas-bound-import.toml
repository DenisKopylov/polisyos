compatibility = "Scoped imports of unbound manifests now refuse, including previously unclaimed targets. Passive unscoped caches can retain bound metadata without scoped claims. Explicit foreign bound context refuses generic put/resume. Write-through publishes remotely before exact local population; existing local defaults remain immutable."
change_class = "behavior-runtime"
surface_classification = "public_stable: filesystem CAS import and caching store"
migration = "Use a matching bound source manifest for scoped import. Retain unscoped non-authority caches for passive exact-byte reuse. Handle existing cache warn/raise policy after remote publication."
api = "Public method arguments are unchanged; duplicate exact same-owner imports return existing references without private staging or owner-generation mutation."
limitations = "Implements the bounded fail-closed E02 recommendation, not a ratified public cross-tenant policy. Producer writes with unspecified context retain existing behavior. Legacy unbound-to-scoped consumer tests remain a disclosed compatibility conflict."
