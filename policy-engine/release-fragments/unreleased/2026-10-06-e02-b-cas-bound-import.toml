id = "2026-10-06-e02-b-cas-bound-import"
title = "Admit bound CAS imports before staging and preserve exact cache bytes"
type = "fixed"
component = "artifacts"
owner = "team-runtime"
summary = "Scoped import requires the exact bound tenant/cell before private stage or claims; already claimed views accept only byte-identical owner no-ops. Write-through caching copies the durable owner's selected metadata bytes."
