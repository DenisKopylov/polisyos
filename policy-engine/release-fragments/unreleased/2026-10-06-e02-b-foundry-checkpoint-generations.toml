compatibility = "New saves use a generation-v1 pointer file. Existing direct-JSON checkpoints remain readable; consumers must load through ChainCheckpoint.load rather than inspect root JSON state fields."
change_class = "behavior-change"
surface_classification = "internal: polisyos.foundry.methods.backends.checkpointing"
migration = "Use ChainCheckpoint.load for both pointer and legacy files. Treat CheckpointPublicationUncertainError as a visible publication with unacknowledged directory durability and inspect or retry the checkpoint."
limitations = "Generations are retained without garbage collection. The protocol assumes a local filesystem supporting flock, atomic replacement and directory fsync. Real-process termination and concurrent readers/writers are tested; power loss, hostile filesystem mutation, Scientist orchestration and exactly-once external effects remain outside this change."
