id = "2026-10-06-e02-b-foundry-checkpoint-generations"
title = "Publish complete Foundry checkpoint generations"
type = "fixed"
component = "foundry"
owner = "team-policyos-foundry"
summary = "Publish state, completed frontier, original result history and NumPy sidecars in one immutable generation selected by an atomic content-bound pointer; keep failed-writer rollback under the same filesystem lock."
evidence = [
