id = "2026-10-06-native-search-resume"
title = "Persist and reopen native search runs"
type = "added"
component = "scientist-search"
owner = "team-policyos-runtime"
surface_classification = "public_stable: polisyos.scientist"
summary = "The native autotune factory persists exact CAS checkpoints and resumes pending evaluations through the existing ask/tell and controller state owner with restored history, frontier, candidate IDs, generator cursor and stopping clock."
change_class = "python-public-api"
compatibility = "Existing ask/tell adapters remain supported. New persisted checkpoints accept only search-service.v1 and the same suite, metric policy, generator configuration and stopping rule; malformed, unknown-version and incompatible checkpoints refuse before run-state admission."
migration = "Read the exact checkpoint_ref from the result telemetry or exposed service after an evaluator interruption. Reopen the configured artifact store and call SearchLoopRunner.resume with the same active suite and supported generator replay contract. Old in-memory service instances have no persisted checkpoint to migrate."
api = "polisyos.scientist lazily exports NativeSearchService, SearchServiceCheckpoint and SearchLoopRunner. SearchLoopRunner.create_service constructs its actual native evaluator/registry consumer; resume restores an exact artifact reference."
limitations = "The served hierarchical caller remains unappointed here. Checkpoint identity does not appoint evaluator or promotion authority. Callback state and external owner handles must be supplied again. External promotion and service-checkpoint publication are separate atomic boundaries. Unsupported generator/stopping profiles and enabled diversity tracking refuse resume. Shared CAS generation/profile consumer verification awaits the separately selected B owner checkpoint."
evidence = ["tests/unit/scientist/methods/search/test_service_persistence.py", "tests/unit/scientist/methods/autotune/test_native_search_lifecycle.py"]
generated_client_compatibility = "not_applicable"
