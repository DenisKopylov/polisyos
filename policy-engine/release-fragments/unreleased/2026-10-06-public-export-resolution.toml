id = "2026-10-06-public-export-resolution"
title = "Resolve declared public export maps without module execution"
type = "fixed"
component = "architecture-tooling"
owner = "team-architecture"
summary = "Resolve declared __all__ through maintained local/imported literal name maps and sequences. Generated entrypoint inventory records actual dependency reads; missing, unreadable, cyclic, rebound, shadowed or escaped bindings refuse measurement instead of reporting an empty export set. A direct literal prefix followed only by unresolved extensions records a null total and fails the completeness guardrail."
compatibility = "Supported causal library facades retain their canonical classes and functions. Retired shadow filenames were already absent before this slice; filename loaders have no implicit alias. Generated inventory gains export_resolution and known_export_count metadata with a bounded static selector; unresolved extension totals are null and remain gate failures."
change_class = "tooling"
surface_classification = "internal: public-surface generator and caller census; public_stable: existing causal library facade addresses unchanged"
migration = "Use supported package imports for causal_engine, id_engine and interference; private helpers use their canonical leaf owners. Dynamic-import AST candidates are classified by source/configuration and are not established runtime clients."
limitations = "The static grammar does not execute modules or prove external plugin/configuration caller coverage. Finite passive alias/container consumers are audited transitively; unknown calls after a selected binding, executable class mutation and undeclared class-creation hooks refuse completeness. Runtime function bodies are outside the static selector. Unsupported runtime-dependent declarations are unresolved. Generation on the current composed producer namespace is required separately; source fixture checks do not establish scientific causal validity, admitted data or Runtime authority."
evidence = ["tests/repo_quality/architecture/test_public_surface_export_resolution.py", "tests/unit/foundry/methods/catalog/causal/test_facade_consumer_continuation.py"]
public_surface_inventory_reviewed = false
