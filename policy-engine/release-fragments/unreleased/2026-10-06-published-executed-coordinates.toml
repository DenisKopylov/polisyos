type = "changed"
summary = "Search spaces refuse finite bounds whose affine span is not representable, and logarithmic endpoints execute exactly within declared bounds. Multi-objective and neural candidates now carry normalized coordinates of the actual typed action. Neural prediction and acquisition values are evaluated at that executed action; the multi-objective converter explicitly marks its scalar prediction unavailable and its existing acquisition value as belonging to the relaxed proposal. The existing training and acquisition algorithms are preserved."
component = "scientist-search"
owner = "team-policyos-runtime"
change_class = "execution-contract"
compatibility = "Unrepresentable affine spans are refused at construction. Suggestions report executed normalized coordinates; neural predictions use that point, MO scalar predictions remain unavailable."
migration = "Consumers needing relaxed proposals use metadata.relaxed_proposal; check explicit acquisition/prediction basis."
limitations = "Bounded duplicate retries do not guarantee a new action in an exhausted finite space; complete MO/neural checkpoint replay is unestablished."
