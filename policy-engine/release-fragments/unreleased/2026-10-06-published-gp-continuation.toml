message = "Single-objective GP checkpoints use gp_state_version=2 with the fitted and full-refit raw corpus, ordered observation identities, fitted transforms/model bytes, numerical target, refit counters, backend identity and local RNG. Incomplete older GP checkpoints are refused. Warm history requires an explicit configured synthetic target or the numeric_transfer_basis.v1 CAS admission reader; restore repeats admission. Same-basis continuation uses conditioning without a silent MLL refit; due schedules and changed corpus identities refit. Acquisition uses the versioned sobol_ranked_restarts.v1 policy with locally seeded scored restart pools and qEI sampler, changing restart selection while preserving ambient Torch RNG. RL checkpoints now bind a supported linear_decay.v1 schedule and nested strategy state; incomplete old wrapper states are refused. These are technical continuation properties, not source authorization, production deployment or optimization-quality claims."
