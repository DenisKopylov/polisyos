workflow_deadline = "Startup, report/state/provenance immutable CAS waits consume the original absolute workflow deadline and fence executor-local ref admission after await. Retry receives the same deadline across cache delay and attempts; elapsed time cannot become a fresh 1ms admission budget."
async_store_policy = "AsyncArtifactStoreAdapter, AsyncFileSystemArtifactStore and ensure_async_artifact_store add unbounded=False. Legacy omitted/None timeout retains the default; explicit unbounded=True delegates wait ownership to the caller and rejects a simultaneous finite timeout before backend admission. Native async stores retain their existing policy."
mutable_publication_boundary = "Already-entered synchronous run finalization and checkpoint head update may complete after owner expiry. WorkflowTimeoutError carries execution_state=unknown and publication_operation; no hard preemption, rollback or safe duplicate retry is claimed. Immutable late CAS artifacts are independently readable without late executor input/output admission."
workflow_cancellation = "The original workflow task cancellation baseline guards all later node/artifact/checkpoint/run-finalization admissions. A hook suppressing CancelledError may finish its entered checkpoint, but cannot reauthorize a fresh report/state/output/finalization operation."
