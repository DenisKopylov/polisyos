compatibility = "Existing StrategyState codec and optimizer signatures remain unchanged. Complete MO profile 1 binds exact installed numerical backend/runtime, objective names/directions, configuration, search space, reference and fitted corpus/model content. Missing or unknown MO profiles refuse; no silent reconstruction of absent learned parameters or RNG is supported."
migration = "Keep the original checkpoint and refusal. Use its recorded supported implementation/environment for exact continuation, or create an explicitly new run from original evaluated inputs. Never edit profile, backend, configuration or basis markers to force a resume."
api = "No new optimizer, GP library, public export or storage subsystem is introduced. Restore performs no MLL fit and preserves the existing MO CPU policy of one fit per subsequent ask."
limitations = "Numerical checkpoint profile 1 covers the ordinary CPU SingleTaskGP/ModelListGP with Normalize and corpus-derived Standardize on the exact recorded backend; it does not establish GPU, custom-transform, cross-version or concurrent-thread global Torch RNG compatibility. Sequential calls preserve the ambient stream and independent replicas. Optional backend absence is UNRUN for numerical verification; synthetic oracle measurements do not establish production evaluator truth or tenant reuse authority."
