compatibility = "Actual Base no-op update, exact canonical wrapper types/callable implementations, Sequence corpus/cursor and qualified canonical RL nested-base profiles remain supported. Borrowed subclass or instance-replaced wrapper profiles remain live-only unless their owner supplies a complete checkpoint implementation. Changed source-bound service builds and old adapter/native wrapper schemas refuse rather than guessing consumed rows. Unconsumed tell tails and legitimate receiving count zero remain distinct from lost consumption."
migration = "Keep original CAS refs and refusal outputs. Use the recorded implementation/backend for exact old continuation or start an explicitly new run from re-admitted original observations; do not edit count/schema/corpus markers."
api = "Existing public NativeSearchService and SearchLoopRunner aliases remain. Restore now requires a complete generator history-admission contract; internal strategy owner ports do not appoint an authority or add an optimizer/registry."
limitations = "Bounded protocol fixtures prove consumption/next-proposal behavior. Arbitrary opaque update state, NN's unpersisted update corpus and unsupported custom profiles cannot establish service replay. Direct NN warm-state and RL state codecs retain their existing laws; absent numerical backends remain UNRUN."
