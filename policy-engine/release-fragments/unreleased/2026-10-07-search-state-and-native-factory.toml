compatibility = "Valid finite Base RNG/Sobol codecs and scalar StrategyAdapter policy remain unchanged. Grid continuation requires supported profile 1 and its original points/cutoff/space/size. Empty scalar Sequence configuration refuses explicitly; the existing batch-empty path remains supported. Embedding measurements require real finite coordinates and explicit nonblank model/version."
migration = "Retain original checkpoints and refuse marker edits. For incomplete historical Grid or changed source-bound native factory checkpoints, use their recorded supported implementation for exact continuation or start an explicitly new run. Supply the actual owner model/revision for embedding convergence; do not fabricate a version."
api = "Existing internal StrategyState and native factory/public resume entry points are retained. Topology selection initializes at its actual suggestion owner and preserves the existing handled unavailable result. No public facade or new optimizer is introduced."
limitations = "Bounded native CAS/fresh-reader and deterministic model fixtures do not appoint a scientific evaluator, served production caller or embedding authority, and do not establish distributed atomicity. Missing optional numerical backends remain UNRUN for their numerical properties."
