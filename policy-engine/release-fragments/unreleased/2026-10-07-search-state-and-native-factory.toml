id = "2026-10-07-search-state-and-native-factory"
title = "Admit search continuation before changing live state"
type = "fixed"
component = "scientist-search"
owner = "team-policyos-runtime"
change_class = "persisted-artifact-format"
surface_classification = "internal: internal-only"
summary = "Native scalar factory continuation preserves its proposal policy, sampler checkpoints refuse unrepresentable values atomically, Grid state binds the actual grid configuration, embedding convergence requires declared current measurements, native adapters preserve supported checkpoint custody, and canonical owner admission keeps unresolved charges unavailable."
evidence = ["tests/unit/scientist/methods/search/test_sequence_generator_admission.py", "tests/unit/scientist/methods/search/test_service_factory_fault_resume.py", "tests/unit/scientist/methods/search/strategies/test_strategy_state.py", "tests/unit/scientist/methods/search/strategies/test_state_inventory.py", "tests/unit/scientist/orchestration/engine/test_convergence_numerical_oracle.py", "tests/unit/scientist/methods/search/test_strategy_adapter_factory_resume.py", "tests/unit/scientist/methods/search/test_controller_owner_admission.py"]
compatibility = "Valid finite Base RNG/Sobol codecs and scalar StrategyAdapter policy remain unchanged. Grid continuation requires supported profile 1 and its original points/cutoff/space/size. Empty scalar Sequence configuration refuses explicitly; the existing batch-empty path remains supported. Embedding measurements require real finite coordinates and explicit nonblank model/version."
migration = "Retain original checkpoints and refuse marker edits. For incomplete historical Grid or changed source-bound native factory checkpoints, use their recorded supported implementation for exact continuation or start an explicitly new run. Supply the actual owner model/revision for embedding convergence; do not fabricate a version."
api = "Existing internal StrategyState and native factory/public resume entry points are retained. Topology selection initializes at its actual suggestion owner and preserves the existing handled unavailable result. No public facade or new optimizer is introduced."
limitations = "Bounded native CAS/fresh-reader and deterministic model fixtures do not appoint a scientific evaluator, served production caller or embedding authority, and do not establish distributed atomicity. Missing optional numerical backends remain UNRUN for their numerical properties."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
migration_docs = ["docs/how-to/search-checkpoint-profile-compatibility.md"]
runbook_docs = ["docs/how-to/search-checkpoint-profile-compatibility.md"]

