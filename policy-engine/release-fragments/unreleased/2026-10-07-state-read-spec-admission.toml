compatibility = "The command retains its human-readable success/failure lines and adds a prefixed JSON measurement record. Unreadable, unparsable or unsupported selected inputs return exit 2 (UNRUN), distinct from a measured missing-read exit 1 and bounded success exit 0."
migration = "Consumers must preserve the measurement record and treat exit 2 as incomplete. Resolve the disclosed input or syntax through the existing owner, then rerun the identical canonical command; do not waive or reinterpret a missing-read failure."
limitations = "This AST diagnostic does not establish runtime execution, alias/dynamic dispatch, scientific truth, permission or closure of the similarly named A finding B04. Files outside the named selector and indirect reads remain unresolved."
