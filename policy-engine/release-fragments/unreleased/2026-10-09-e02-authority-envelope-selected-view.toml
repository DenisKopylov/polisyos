id = "2026-10-09-e02-authority-envelope-selected-view"
title = "Preserve selected authority-envelope manifest views"
type = "fixed"
component = "core-artifacts"
owner = "runtime"
summary = "Authority payload manifests now persist the producer-issued profile of their linked envelope. One core resolver selects that exact manifest view, validates the envelope kind/media/schema contract, and returns a typed ArtifactRef used by runtime consumers. Profileless historical links retain their old serialized shape and resolve through the explicit default-view branch."
evidence = ["tests/unit/core/artifacts/test_authority_envelope_ref.py", "tests/unit/core/artifacts/test_ir_adapter.py", "tests/unit/runtime/quality/test_authority_reconciliation.py", "tests/unit/runtime/quality/test_workspace_loop.py"]
compatibility = "Historical profileless authority links remain readable. New links carry an optional profile digest so same-byte sibling manifest views remain distinguishable."
change_class = "python-public-api"
surface_classification = "public_stable: polisyos.core authority-envelope resolver and fixed contract constants; optional persisted manifest lineage field"
migration = "No data rewrite is required. Readers use the explicit default manifest view for old authority links without a profile digest."
api = "core.artifacts exports resolve_authority_envelope_ref and the fixed envelope contract constants. Authority consumers use the returned typed ref for manifest, byte, and integrity reads."
limitations = "The profile digest identifies a manifest view; it does not establish the source of the envelope or external legal, billing, or provider custody facts."
