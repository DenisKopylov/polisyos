id = "2026-10-09-e02-c12-catalog-search-status"
title = "Expose Catalog vector-search refusal on results"
type = "changed"
component = "data-forge"
owner = "team-data-forge"
summary = "Catalog results, tool responses, and workspace artifacts retain the selected embedding generation and live reader profile checked for each query, along with retrieval mode and any refusal, including empty results."
evidence = [
  "tests/unit/data_forge/domains/catalog/knowledge/test_store.py",
  "tests/unit/data_forge/domains/academic/knowledge/test_knowledge_tools.py",
  "tests/unit/runtime/quality/test_semantic_binding.py",
  "tests/unit/runtime/quality/test_workspace_loop.py",
  "tests/unit/data_forge/domains/catalog/batch/test_benchmark.py",
]
compatibility = "DatasetSearchResult adds optional typed search_mode, vector_refusal_code, and query_generation_context fields; DatasetSearchResponse adds the same query context alongside results, search_mode, vector_refusal_code, and limitation_code. Direct DatasetCatalogGraph.search_datasets and KnowledgeToolkit.search_datasets calls keep their legacy list return, while the registered search_datasets tool and workspace artifacts preserve query context for empty and non-empty results. Semantic benchmark run v2 adds per-query status and query-generation context; legacy v1 payloads retain their exact serialized shape."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.data_forge.read_api.catalog DatasetSearchResult, DatasetSearchResponse, CatalogEmbeddingProfile, and CatalogQueryGenerationContext; registered KnowledgeToolkit search_datasets tool response"
migration = "Direct Python list callers need no change but cannot retain query context for empty results. Registered-tool and workspace consumers can inspect search_mode/vector_refusal_code/limitation_code and query_generation_context; text fallback rows remain candidates, and empty results may carry a refusal, limitation, and explicit absent/refused/selected/unknown context."
api = "DatasetSearchResponse carries rows plus same-query mode, vector refusal, limitation, and query-generation context; DatasetCatalogGraph.search_datasets_with_status and the registered KnowledgeToolkit search_datasets tool expose it. DatasetSearchResult carries the same context when rows exist. Measurement-root artifacts and semantic benchmark run v2 persist per-query context without changing semantic adequacy scoring; query metrics remain diagnostics, and the prompt formatter renders text fallback as candidate-only."
limitations = "Selected profiles report persisted generation inputs and the live reader asset identity used in compatibility admission. They do not establish executable encode behavior, trusted provider ownership, vector ranking quality, or policy authority. Unknown remains explicit for legacy callers that cannot supply query-local context."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
migration_docs = ["src/polisyos/data_forge/domains/catalog/knowledge/README.md"]
runbook_docs = []

