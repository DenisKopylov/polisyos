id = "2026-10-09-e02-c12-catalog-search-status"
title = "Expose Catalog vector-search refusal on results"
type = "changed"
component = "data-forge"
owner = "team-data-forge"
summary = "Catalog results, tool responses, and workspace artifacts retain the selected embedding generation and live reader profile checked for each query, along with retrieval mode and any refusal, including empty results."
evidence = [
  "tests/unit/data_forge/domains/catalog/knowledge/test_store.py",
  "tests/unit/data_forge/domains/academic/knowledge/test_knowledge_tools.py",
  "tests/unit/runtime/quality/test_semantic_binding.py",
  "tests/unit/runtime/quality/test_workspace_loop.py",
  "tests/unit/data_forge/domains/catalog/batch/test_benchmark.py",
]
compatibility = "Direct DatasetCatalogGraph.search_datasets and KnowledgeToolkit.search_datasets remain list-returning; their typed status additions are additive. The registered search_datasets tool has a separate breaking JSON ABI: its prior top-level array is now a DatasetSearchResponse object with results and query-local retrieval status. Strict registered-tool clients that expect an array must update. Semantic benchmark run v2 carries the new per-query status; legacy run v1 keeps its exact serialized shape."
change_class = "python-public-api; registered-tool JSON ABI"
surface_classification = "public_experimental: polisyos.data_forge.read_api.catalog typed search DTOs and direct Python methods; breaking schema-openapi-abi: registered KnowledgeToolkit.search_datasets JSON result envelope"
migration = "Direct Python list callers keep their existing return shape. Registered tool clients must decode the DatasetSearchResponse object and consume its results list, search_mode, vector_refusal_code, limitation_code, and query_generation_context.state; empty results must retain refusal/limitation context rather than being treated as an unqualified no-match. Update strict decoders before using the current registered response. See docs/migration/e02-catalog-search-datasets-envelope.md and docs/runbooks/catalog-search-datasets-envelope-rollout.md."
api = "DatasetCatalogGraph.search_datasets_with_status returns one same-query DatasetSearchResponse. The registered KnowledgeToolkit.search_datasets tool now serializes an object envelope with results, search_mode, vector_refusal_code, limitation_code, and query_generation_context; direct list-returning Python methods remain unchanged. Workspace artifacts and semantic benchmark v2 preserve query-local context, while benchmark v1 serialization remains unchanged."
limitations = "Selected profiles describe persisted generation inputs and the live reader asset identity used in compatibility admission. They do not establish executable encode behavior, trusted provider ownership, vector ranking quality, or policy authority. The registered-tool output has no old-array compatibility mode in this candidate; public-surface inventory review remains false and independent G acceptance is pending."
generated_client_compatibility = "breaking_requires_consumer_action"
public_surface_inventory_reviewed = false
migration_docs = ["docs/migration/e02-catalog-search-datasets-envelope.md", "src/polisyos/data_forge/domains/catalog/knowledge/README.md"]
runbook_docs = ["docs/runbooks/catalog-search-datasets-envelope-rollout.md"]

