compatibility = "StorePutOptions and Mapping callers may supply typed Pydantic metadata or plain mapping values; all Core ArtifactWriteOptions fields, including tenant context, same-input closure, authority, and warnings, survive projection. CanonInfo mappings and Pydantic instances are revalidated strictly across Mapping, StorePutOptions, and ArtifactWriteOptions carriers; the exact JSON-mode separators list of two strings is normalized to the existing tuple form, and a missing or None canon remains legal. The IR producer persists only payload bytes that round-trip under its selected profile and registered IR tag set; malformed known tags fail before CAS persistence. Exact ArtifactRef selectors remain preserved for sidecar and blob reads."
change_class = "internal"
surface_classification = "internal: polisyos.ir.artifacts is not a supported entrypoint"
migration = "Valid typed writes retain their existing bytes, profile, and CAS identifiers; no persisted artifact rewrite is required. Callers supplying coercible malformed CanonInfo mappings must send values with the declared field types, while the documented exact JSON separators list remains accepted."
api = "The IR ArtifactStore contract types write options as StorePutOptions or Mapping, with metadata options accepting Pydantic BaseModel or Mapping values, and requires raw get_manifest_bytes plus exact typed get_manifest resolution for strict profile-bearing reads; the Core adapter accepts ArtifactWriteOptions directly and forwards selected-view reads. Core selector unknown-field checks remain scoped to selector admission."
limitations = "Current Core native canonical-value emission covers the shared bytes, date, datetime, decimal, and float tags. Core decoding recognizes the bytes_hex and float_hex alternate spellings, which are refused by IR after exact selected-view resolution. Separately, the Core Mapping canonicalizer preserves a caller-supplied array_digest typed mapping, and the raw-reader test demonstrates that IR refuses it; this is not evidence of a qualifying Foundry producer-to-persisted-CAS-to-consumer chain. Foundry static-hash normalization is a separate surface and does not establish that artifact chain. The producer round-trip proves only that emitted bytes are readable under the selected IR profile; it does not attest producer identity or recover input choices that leave no byte witness, such as exclude_none when there are no null values. Core/IR tag-family changes and profile-less history migration remain separate G decisions."
generated_client_compatibility = "not_applicable"
