id = "2026-10-09-e02-can-options-mapping"
title = "Core-to-IR writes preserve typed option mappings"
type = "fixed"
component = "ir-artifacts"
owner = "team-polisyos"
summary = "The Core-to-IR adapter preserves every declared write option, and IR reads now require complete raw profiles and byte-level conformance."
evidence = [
  "tests/unit/core/artifacts/test_ir_adapter.py::test_ir_adapter_mapping_write_options_preserve_every_core_option_field",
  "tests/unit/core/artifacts/test_ir_adapter.py::test_ir_adapter_refuses_malformed_supplied_mapping_options",
]
compatibility = "Mapping-based callers retain all Core ArtifactWriteOptions fields, including tenant context, same-input closure, authority, and warnings; malformed or unknown supplied values fail closed. IR reads also refuse incomplete or malformed raw profiles and payload bytes that do not round-trip under the declared supported IR profile. Exact ArtifactRef selectors are preserved for both sidecar and blob reads."
change_class = "internal"
surface_classification = "internal: polisyos.ir.artifacts is not a supported entrypoint"
migration = "No persisted manifest schema, canonicalization profile, payload bytes, or CAS identifiers change."
api = "The IR ArtifactStore contract types write options as StorePutOptions or Mapping and requires raw get_manifest_bytes for strict reads; the Core adapter accepts ArtifactWriteOptions directly and forwards selected-view reads."
limitations = "Byte conformance shows that the declared profile reproduces stored bytes; it does not attest producer identity or recover input choices that leave no byte witness, such as exclude_none when there are no null values. Core/IR tag-family changes and profile-less history migration remain separate G decisions."
