summary = "Welfare propagation samples existing weighted posterior carriers, pairs empirical inputs only for matching declared identities and nonempty axes, and binds selected PE envelope refs through Delta and Monte Carlo reports. Explicit transient PolicyOS errors retry at most once on the same sampled input; explicit sample-domain declarations and existing typed output failures remain partial draws. Global access/contract failures and unclassified, cyclic, or truncated exception graphs fail closed, and incomplete Monte Carlo runs withhold the interval while retaining the nominal point and qualified conditional summary."
