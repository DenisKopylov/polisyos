summary = "Welfare propagation samples existing weighted posterior carriers, pairs empirical inputs only for matching declared identities and nonempty axes, and binds selected PE envelope refs through Delta and Monte Carlo reports. Every requested Monte Carlo draw is persisted as a terminal outcome; incomplete runs remain partial, withhold the interval, and distinguish the nominal point evaluation from the report's conditional successful-draw mean."
