compatibility = "The persisted welfare propagation report adds draw-outcome provenance and conditional summaries, using report schema 1.1 or 2.1; older 1.0/2.0 reports remain readable. Delta report manifest lineage now retains selected uncertainty-envelope inputs, including their manifest profiles; report payload schema stays 1.0/2.0. Incomplete Monte Carlo adds diagnostics and a warning to the existing Welfare bundle without changing its schema. No HTTP, OpenAPI, generated-client, or public package facade changes."
