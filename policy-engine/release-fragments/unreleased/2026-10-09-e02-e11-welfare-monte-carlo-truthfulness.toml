surface_classification = "internal: Scientist welfare artifacts and node outputs; no external API surface change."
migration = "No stored-artifact rewrite is required. New report payloads use schema 1.2/2.2 with per-attempt outcome provenance; earlier report versions remain supported."
api = "A single empirical carrier uses its source weights and exact atoms. Multiple empirical inputs are joined by row only when source joint ID, nonempty sample axis, row count, and normalized weights match; the identifier is explicitly recorded as declared and non-authoritative. Propagation reports and sample bundles bind selected input envelope refs. Each requested Monte Carlo draw records its draw identity, sampled-input digest, bounded attempt count, and terminal outcomes. Only PolicyOS errors explicitly categorized transient with an acyclic, complete cause graph retry once against the same draw; cyclic or truncated graphs remain scope-unknown. Explicit sample-domain declarations remain consumer-asserted missing mass. Permission, validation, fatal, and scope-unknown failures terminate the node. Incomplete outputs use a conditional summary and no Monte Carlo credible interval; the Welfare bundle point estimate remains the nominal-input evaluation and warns when the report mean is conditional on successful draws."
limitations = "This preserves candidate numerical support and row alignment only. A sample-domain signal is an evaluator declaration, not independently verified scientific authority; it does not establish source authority for the posterior or its joint law. Missing or incompatible empirical joint identity withholds the interval. Provider/institutional source facts remain outside this change."
