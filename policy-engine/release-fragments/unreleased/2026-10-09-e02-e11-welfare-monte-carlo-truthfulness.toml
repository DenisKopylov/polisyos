compatibility = "New persisted welfare propagation reports use schema 1.2 or 2.2 and add draw-attempt provenance and conditional summaries; existing reports need no rewrite. Delta report manifest lineage retains selected uncertainty-envelope inputs, including their manifest profiles; its report payload schema remains 1.0/2.0. Incomplete Monte Carlo adds diagnostics and a warning to the existing Welfare bundle without changing its schema. No HTTP, OpenAPI, generated-client, or public package facade changes."
change_class = "internal"
surface_classification = "internal: Scientist welfare artifacts and node outputs; no external API surface change."
migration = "No stored-artifact rewrite is required. New report payloads use schema 1.2/2.2 with per-attempt outcome provenance; earlier report versions remain supported."
api = "A single empirical carrier uses its source weights and exact atoms. Multiple empirical inputs are joined by row only when source joint ID, nonempty sample axis, row count, and normalized weights match; the identifier is explicitly recorded as declared and non-authoritative. Propagation reports and sample bundles bind selected input envelope refs. Each requested Monte Carlo draw records its draw identity, sampled-input digest, bounded attempt count, and terminal outcomes. Only PolicyOS errors explicitly categorized transient with an acyclic, complete cause graph retry once against the same draw; cyclic or truncated graphs remain scope-unknown. Explicit sample-domain declarations remain consumer-asserted missing mass. Permission, validation, fatal, and scope-unknown failures terminate the node. Incomplete outputs use a conditional summary and no Monte Carlo credible interval; the Welfare bundle point estimate remains the nominal-input evaluation and warns when the report mean is conditional on successful draws. A report is marked complete only when the reconciled requested draw denominator, terminal outcome identities, attempt counters, successful sample indices, and finite value arrays all agree; caller-provided completeness/provenance/summary claims that disagree are rejected. Successful, failed, and unattempted draw counts are derived from the terminal rows and attempt counter, and their sum must equal the requested count. Missing optional fields may use existing defaults, while a present malformed config or value, empty response basis, or unsupported explicit method fails with the existing typed refusal. Response, weight, sensitivity, and metric-fallback fields share finite real-scalar admission: Python and NumPy booleans are refused, Decimal and NumPy real scalars are retained, and every supplied mapping value is checked before label selection. Numeric strings remain admitted only through the declared Metrics.values string representation; direct welfare response, weight, and sensitivity strings are refused."
limitations = "This preserves candidate numerical support and row alignment only. A sample-domain signal is an evaluator declaration, not independently verified scientific authority; it does not establish source authority for the posterior or its joint law. Missing or incompatible empirical joint identity withholds the interval. Provider/institutional source facts remain outside this change."
