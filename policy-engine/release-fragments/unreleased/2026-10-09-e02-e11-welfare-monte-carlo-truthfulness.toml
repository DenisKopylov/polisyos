summary = "Welfare propagation samples existing weighted posterior carriers, pairs empirical inputs only for matching declared identities and nonempty axes, and binds selected PE envelope refs through Delta and Monte Carlo reports. Explicit transient PolicyOS errors retry at most once on the same sampled input; explicit sample-domain declarations and existing typed output failures remain partial draws. Global access/contract failures and unclassified, cyclic, or truncated exception graphs fail closed, and incomplete Monte Carlo runs withhold the interval while retaining the nominal point and qualified conditional summary. Present-but-malformed response, sensitivity, weight, method, or propagation-config inputs now refuse with existing typed errors instead of selecting omission defaults or a Monte Carlo fallback; empty welfare bases are refused. Persisted report completeness, summary, and provenance are reconciled against terminal draw rows, attempt counters, and sample arrays before publication. Success, observed failure, and unattempted draw counts partition the requested denominator without double-counting. The stable node/error facade now delegates to focused welfare implementation modules and the same bounded exception classifier used by generic Monte Carlo."
