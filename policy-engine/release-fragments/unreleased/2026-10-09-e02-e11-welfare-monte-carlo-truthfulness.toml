surface_classification = "internal: Scientist welfare artifacts and node outputs; no external API surface change."
migration = "No stored-artifact rewrite is required. New report payloads carry an incremented schema version and additive outcome provenance; old report versions remain supported."
api = "A single empirical carrier uses its source weights and exact atoms. Multiple empirical inputs are joined by row only when source joint ID, nonempty sample axis, row count, and normalized weights match; the identifier is explicitly recorded as declared and non-authoritative. Propagation reports and sample bundles bind selected input envelope refs. Each requested Monte Carlo draw records a terminal result, sampled-input digest, and bounded exception type/message when applicable. Incomplete outputs use a conditional summary and no Monte Carlo credible interval; the Welfare bundle point estimate remains the nominal-input evaluation and warns when the report mean is conditional on successful draws."
limitations = "This preserves candidate numerical support and row alignment only. It does not establish source authority for the posterior or its joint law; missing or incompatible empirical joint identity withholds the interval. Provider/institutional source facts remain outside this change."
