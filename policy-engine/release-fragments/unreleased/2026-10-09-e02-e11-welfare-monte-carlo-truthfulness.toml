compatibility = "New persisted welfare propagation reports use schema 1.2 or 2.2 and add draw-attempt provenance and conditional summaries; existing reports need no rewrite. Delta report manifest lineage retains selected uncertainty-envelope inputs, including their manifest profiles; its report payload schema remains 1.0/2.0. Incomplete Monte Carlo adds diagnostics and a warning to the existing Welfare bundle without changing its schema. No HTTP, OpenAPI, generated-client, or public package facade changes."
