id = "2026-10-09-e02-s3-posterior-summary-v11-consumer"
title = "Persist role-indexed candidate posterior summaries from native method results"
type = "added"
component = "foundry"
owner = "team-polisyos"
summary = "After native Bayesian result and method-evidence artifacts persist, MethodBackend emits candidate-only v1.1 summaries for both named point roles and exposes their typed refs on JobResult. The explicit Foundry Monte Carlo API can fresh-read a selected role and consume its exact content-bound source rows."
