id = "2026-10-09-e02-v5-search-methodjob-cas"
title = "Connect autotune search to MethodJob and CAS evidence"
type = "added"
component = "scientist-search"
owner = "scientist-methods"
summary = "Autotune now has a concrete Foundry MethodJob evaluator, persists method result and execution evidence refs in benchmark evaluations, and keeps missing or incompatible primary metrics unavailable instead of replacing them with zero. The canonical Bayesian strategy produces native fitted-corpus and GP state profiles and admits external warm history only under the exact target context, objective, and search space. Transfer histories round-trip canonical numeric values through a fresh CAS reader. The policy runtime separates requested draw settings from uninstrumented draw execution and persists a source-bound packet for each successful L3/L4 evaluator invocation. An opt-in diagnostic causal MethodJob path counts bootstrap work at the actual loop, binds the exact dispatched method-state arrays to persisted DataSnapshot fields using content fingerprints and full manifest selectors/schemas, and fresh-reads the typed CAS packet through SearchLoop evaluation."
evidence = ["tests/unit/scientist/methods/autotune/test_v5_search_pipeline.py", "tests/unit/scientist/methods/autotune/test_bayesian_generator.py", "tests/unit/scientist/methods/autotune/test_warm_start.py", "tests/unit/scientist/search/funnel/test_policy_runtime_work_packets.py", "tests/unit/scientist/nodes/builtins/decide/test_policy_runtime_support.py"]
compatibility = "Additive Python evaluator/profile fields; existing benchmark evaluations remain readable when the new optional fields are absent. Missing method metrics now remain unavailable and cannot improve a search candidate through a zero default."
change_class = "internal"
surface_classification = "Additive internal Python runtime path and typed CAS lineage; no HTTP, OpenAPI, or generated-client change."
migration = "No transfer-history migration is required; canonical and ordinary valid JSON payloads remain readable through the canonical reader. Diagnostic method-work packets advance to schema 1.2; prior schema 1.1 packets lack actual-dispatch bindings and are rejected by the fresh reader, so they must be regenerated for opt-in work capture."
api = "SearchLoopRunner accepts WarmStartBridge inputs, and MethodJobBenchmarkEvaluator invokes the configured Foundry method through compute.runner.run_job. BenchmarkEvaluation retains the method result and method execution evidence refs. FunnelOutcome projects validated L3/L4 invocation packet refs into trace, stage results, and VOI observation metadata."
limitations = "The V5 pipeline exercises a real native GP fit, persists its fitted profile with MethodJob/CAS lineage, and proves a same-context transfer row enters the receiving optimizer's real fitted corpus alongside current MethodJob evaluations. The default policy-runtime packet binds one successful evaluator invocation to run/ticket/candidate/stage/attempt and a persisted evaluation-vector ref, but that backend still has no scientific draw loop: its actual draw counters remain uninstrumented and null. A separate diagnostic MethodJob prototype counts real bootstrap-loop iterations, binds actual dispatched inputs to source fields with recomputed dtype/shape/content fingerprints and full input selectors/schemas, and compares direct L4 with L3→L4 on the same source snapshot, seed, and full L4 config; its nuisance and tau fit layers are patched. An unpatched native direct-L4 versus L3→L4 witness is prepared with 80 full-L4 draws and 40 reduced-L3 draws but remains unrun pending the serialized numerical slot. The diagnostic packet is not joined to a policy-effect mapping or the default policy funnel, so B157 remains held for the default consumer. B108 remains limited until an actual fiscal producer/result, owner-issued sign/unit/alias profile, measurement time/context, and conflict/missing policy are supplied."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
