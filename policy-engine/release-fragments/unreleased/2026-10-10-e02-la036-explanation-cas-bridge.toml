id = "2026-10-10-e02-la036-explanation-cas-bridge"
title = "Add typed CAS persistence and loading for BERL explanation bundles"
type = "added"
component = "berl"
owner = "team-runtime-quality"
summary = "BERL now exposes a fixed-kind, versioned CAS writer and exact-view reader for ExplanationBundle. A producer-to-CAS-to-fresh-reader integration witness feeds the loaded bundle through the existing Phase-5 and warrant-reliability consumers; marginal identity is preserved and unsupported conditional evidence remains blocked."
evidence = [
  "tests/unit/berl/test_persistence.py",
  "tests/integration/scientist_berl/test_explanation_reliability_bridge.py",
]
compatibility = "Additive public experimental exports. The existing in-memory ExplanationOrchestrator API is unchanged. Persisted artifacts use scientist.explanation_bundle, application/json, the existing generated ExplanationBundle schema identifier, and schema version 1.0.0; the reader requires a typed ref and validates its exact selected manifest view."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.berl CAS persistence and loading helpers"
migration = "Call persist_explanation_bundle explicitly after producing a bundle, then pass its full ExplanationBundleRef to load_explanation_bundle when a fresh reader needs the persisted view. Preserve manifest_profile_sha256; do not reduce the ref to an artifact ID."
api = "The writer and reader are additive facade exports. The reader refuses wrong kind, media, schema identity/version, malformed selected views, and incomplete persisted wire payloads before Pydantic defaults can fill missing fields."
limitations = "No production call site currently wires ExplanationOrchestrator.explain to CAS; the tested route is an integration prototype and remains implemented_but_not_orchestrated. No verified conditional-law producer exists. Conditional bundles remain diagnostic, and declared refs or method assumptions do not verify a law."
generated_client_compatibility = "not_applicable"
migration_docs = ["src/polisyos/berl/README.md"]
