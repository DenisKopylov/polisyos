summary = "GraphPriorBundle 1.1 retains supporting-hypothesis identification snapshots. The selected GraphPrior view links the utility report, edge-confidence matrix, and bootstrap stability report; the report and hypothesis set link selected task and hypothesis views. Cross-graph compilation replays the ordered-source aggregation and GraphPriorBuilder output, compares complete matrix and emitted-edge semantics, and recomputes identification on the same selected graph used by UtilityJudge. A differing raw/resolved basis remains not_established without a qualified translation proof; missing or mismatched source binding remains review-required, and STRICT emits a blocker."
