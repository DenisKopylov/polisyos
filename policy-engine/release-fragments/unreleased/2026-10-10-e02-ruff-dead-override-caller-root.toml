surface_classification = "Internal repository-quality reporting; no public API or generated-client surface changes."
migration = "Regenerate the tool-config outputs after upgrading; the product Ruff operational config moves to ruff.generated.toml so automatic discovery and explicit --config calls use the same matcher base."
api = "The report includes the resolved Ruff caller root in configs.ruff_project_root so path normalization is auditable."
limitations = "The report continues to evaluate Ruff selector existence and lifecycle metadata; it does not replace Ruff's own configuration validation or lint execution."
