compatibility = "DataNeed, FetchPlan, and ResolveOutcome schemas are unchanged. Known-incompatible targets are removed from selected plans, public ResolveOutcome candidates, and plan fallbacks. Partial overlap, identity ambiguity, and missing coverage remain unverified; C05 reconciliation, profile-admission, and exact material-read refusals propagate. The standalone discovery endpoint remains candidate-only and has no selected run-profile."
change_class = "runtime-selection-behavior"
surface_classification = "public_stable: polisyos.fabric.retrieval ResolveOutcome warnings, fetch plans, and candidates; public_experimental: polisyos.data_forge.read_api.catalog.normalize_country_code"
public_surface_inventory_reviewed = false
migration = "No persisted-artifact migration is required. Consumers should continue to treat FetchPlan as a retrieval candidate and inspect ResolveOutcome.warnings. A C05 or exact catalog-read refusal remains a refusal and is no longer softened to a warning."
api = "ResolveOutcome omits known-incompatible targets from fetch_plans, candidates, and fallbacks; warnings may include catalog_scope_incompatible:<metric>:<dataset-id> or catalog_scope_unverified:<metric>:<reason>. The existing normalize_country_code implementation is exposed through the lazy catalog read_api facade. No connector-specific filter names are added."
limitations = "This is selected candidate filtering, not proof of returned-row scope, source truth, or scientific availability. Generic FetchPlan has no request-occurrence reference; mixed same-metric scopes remain unverified and cannot be assigned to individual occurrences. Standalone discovery remains raw candidate metadata because its request carries no selected run-profile and it emits no executable plan."
generated_client_compatibility = "not_applicable"
