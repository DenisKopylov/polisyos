id = "2026-10-10-scholar-citation-span-offsets"
title = "Bind Scholar citations to raw CAS page snapshots"
type = "fixed"
component = "scholar-search; scientist-evidence"
owner = "scholar-search"
summary = "Scholar snippets retain exact offsets into the extracted page text. The search cache carries the complete raw-page ArtifactRef through FetchResult and SourceMetadata; source-aware verification resolves and content-binds the selected CAS view, replays Scholar extraction and sanitization, and requires each citation span to select exactly its reported text. The ordinary enrich_topic web-bootstrap path verifies every usable source before bundle persistence and derives byte SourceSpec inputs from the same typed reference."
evidence = ["src/polisyos/scholar/search/source_binding.py", "src/polisyos/scholar/search/cache.py", "src/polisyos/scholar/search/models.py", "src/polisyos/scholar/search/scoring.py", "src/polisyos/scholar/api.py", "src/polisyos/scholar/orchestrator/enrich.py", "src/polisyos/scientist/evidence/snippet_ledger.py", "src/polisyos/scientist/evidence/verifier.py", "tests/unit/scholar/search/test_scoring.py", "tests/unit/scholar/search/test_source_binding.py", "tests/unit/scholar/search/test_fetcher_security_cache.py", "tests/unit/scholar/test_api_web_bootstrap.py", "tests/unit/scientist/evidence/test_claim_support.py", "tests/unit/scientist/evidence/test_snippet_ledger.py", "tests/unit/scientist/evidence/test_verifier.py"]
compatibility = "Offsets remain half-open Python character positions into the extracted text passed to the compressor. FetchResult, SourceMetadata, and SourceSpec gain optional typed raw_artifact_ref fields. The verifier call signature remains source-compatible because cas is optional, but web bundles with citation snippets now fail closed when no CAS is supplied; callers relying on no-CAS acceptance must provide the artifact store. Legacy artifact-ID-only sources can use only the CAS default manifest view and receive an explicit profileless warning."
change_class = "internal"
surface_classification = "public_experimental: typed polisyos.core.contracts.scholar.SourceSpec schema; internal: Scholar raw-page cache, source verification, and Scientist evidence verification. Public-surface inventory review remains pending."
migration = "No persisted-bundle migration was exercised. Existing bundles without a resolvable raw CAS snapshot cannot establish source-content binding and fail closed in the verifier. Runtime callers of verify_web_evidence_bundle that pass web citation bundles must provide a CAS store."
api = "compress_page_to_snippets keeps its signature and emits offsets delimiting SourceSnippet.text in the extracted input string. SourceSpec adds optional raw_artifact_ref: ArtifactRef; SourceMetadata and FetchResult preserve the same typed ref, including manifest_profile_sha256 when selected. verify_web_evidence_bundle adds optional cas and now reports source_cas_unavailable/not_established when citation evidence is checked without a resolver."
limitations = "This verifies a raw response payload against its CAS digest, manifest contract, selected profile when present, current Scholar extractor/sanitizer, and citation span. It does not prove that a page was truthful, authoritative, publicly available, unchanged at a later time, or current; no live-web assertion, issuer authority, legal interpretation, or publication/admissibility decision is made. The legacy profileless path uses only the CAS default manifest view and is marked with a warning. Direct calls to ScholarDeepSearchService.persist_bundle remain storage writes; the demonstrated admission check is the ordinary enrich_topic bootstrap path before persistence."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = false
