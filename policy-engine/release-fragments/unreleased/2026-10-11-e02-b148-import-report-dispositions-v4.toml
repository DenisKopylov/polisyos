compatibility = "ImportReport retains its existing constructor fields and the meanings of imported_artifacts and imported_refs; added receipt fields are defaulted. Existing CLI JSON keys remain, with additive outcome detail in all four JSON and four text replay routes. Actual-bundle integration evidence covers successful import and export; existing-store consumer witnesses cover exact no-op and prior-generation refusal. The no-op witness binds producer and receiver to the same tenant/cell, verifies every selected manifest context, and confirms no private import stage or persisted owner-generation change. The parameterized route test remains a projection-only test for other route branches."
change_class = "Additive Python API and replay CLI reporting"
surface_classification = "public_stable: polisyos.core.artifacts"
migration = "No CAS manifest or stored-byte migration is required. Existing callers may keep using the legacy fields; consumers adopting the new receipt fields must carry disposition_basis with the outcome."
api = "ImportReport separates unique recognized received_artifact_ids from canonical-profile published_refs, reused_refs, and verifier-positive integrity_verified_refs, plus the requested flag and disposition_basis. The default profile and its explicit canonical-profile alias count as one view; genuinely distinct profiles remain distinct."
limitations = "The report describes local archive intake, local CAS owner-transaction stage intent, exact profile views, and the configured integrity verifier only. It does not establish law, signer trust, external custody, provenance truth, owner authority beyond existing CAS admission, or production currentness. The public replay --bundle entry point starts with a temporary CAS; exact no-op and prior-generation refusal are exercised through the same existing-store report consumer, with importer tests retaining the owner-generation preservation proof. The no-op witness applies to the declared same-bound tenant/cell fixture and does not establish a global no-op policy or external custody. When integrity verification is not requested, integrity_verified_refs is empty."
