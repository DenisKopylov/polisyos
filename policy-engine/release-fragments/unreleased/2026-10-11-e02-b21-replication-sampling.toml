summary = "New N5 v3 results retain each selected engine's per-point replicate outputs, ordered seeds, and full engine states with the actual count, aggregate point values, and recomputable sample standard error. One draw is typed as standard_error_not_estimated with no numeric error. Fresh CAS validation checks the full draw denominator, seed/state identity using strict canonical JSON bytes that distinguish bool/int/float values, key set, means, and error against stored samples; malformed or nonfinite state input is rejected. N8 derives the limitation from the exact loaded result and stays low-grade candidate-only under the existing K_sim blocker. Historical v1/v2 payloads remain byte-readable and report legacy_sampling_not_established without rewriting stored artifacts."
