api = "Per-point sampling summaries carry raw outcome/effect draws, actual replicate count, ordered distinct seeds, full JSON-ready engine states, and estimated or standard_error_not_estimated status. N5 and N8 compare ordered states through strict canonical JSON bytes, preserving bool/int/float distinctions and rejecting malformed/nonfinite values. N8 recomputes the candidate blocker from the fresh-loaded CAS result. A two-or-more-draw standard error is conditional sampling error under the selected model only; it is not total/world uncertainty or a calibration claim."
