compatibility = "The CausalEffectReport payload, ABI snapshot, public facade exports, and registered causal method identities remain unchanged. The internal run basis advances to v2; historical v1 basis or profileless default-manifest reads are limited and never upgraded. The typed causal-report persistence helper preserves historical default-reference behavior; its strict selected-profile option returns the profile from the same CAS write, and the B31 producer opts into it. Historical profileless report refs are never retrofitted. ValueDataProfile advances to strict v2 because the method-run basis requires an explicit measurement unit. A historical v1 profile has no unit and is not upgraded implicitly; reacquire it through the source owner before a candidate method run."
migration = "N8 owners must supply an explicit ValueOwnerMethodRunIntentV1 bound to the selected v2 profile, assignment reference, typed estimand and method. Missing or malformed supplied owner inputs remain typed refusals; the default gateway still supplies no treatment assignment."
limitations = "DID and synthetic-control controlled runs are candidate-fixture witnesses only. Their persisted ValueOuterSet keeps assignment bounds distinct from native statistical CI, is search_only with gate_eligible=false, and does not establish identification, owner authority, calibration, law, production currentness, or S10 admission. The post-run receipt binds submitted request intent and runner-returned facts as candidate lineage; strict numeric input types reject bool/string/float/null coercion for integer fields and bool/string/null coercion for fixture bounds. Full used-parameter coverage remains not_established, and the receipt is not an external signature. The original B31/EMP01 whole-property criterion remains unclosed."
