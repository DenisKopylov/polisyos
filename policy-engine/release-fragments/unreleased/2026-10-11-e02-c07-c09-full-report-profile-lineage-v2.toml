compatibility = "BacktestOrchestrator.run retains its historical BacktestReport return shape; run_with_ref returns the report together with its exact persisted report ref. Selected-profile returns remain opt-in: store_method_artifact and the uncertainty persistence helper preserve profileless defaults for existing callers, while ForecastOwner opts in for its four generated report-basis artifacts. Empirical evidence schemas 1.0 and 1.1 remain readable with their historical ID/role edge semantics; new profile-bearing evidence uses schema 1.2."
change_class = "persisted-artifact-format; python-public-api"
