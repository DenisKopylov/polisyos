api = "The existing BacktestOrchestrator.run API is unchanged and returns BacktestReport. The additive run_with_ref returns tuple[BacktestReport, BacktestReportRef]: the report and the exact typed ref emitted by persistence. Core/IR write methods add an opt-in return_selected_profile keyword to retain the profile computed inside the same write. No generated HTTP/OpenAPI contract changes."
limitations = "Exact profile lineage identifies CAS manifest views but does not prove complete or semantically adequate inputs, producer authority, S10 mapping, issuer/currentness, causal validity, or dashboard consumption. The predictive content sidecar continues to require the existing default-false server setting. The reviewed public route is limited to backtest-orchestrator-run-with-ref; it does not establish a complete polisyos.scientist.methods.backtesting export/member inventory or generated-inventory acceptance. See docs/research/e02-cloud-test-plan/implementation-handoffs/LOCAL/release-inventory-two-row-local-review-attestation-20261016.json."
