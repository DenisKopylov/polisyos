id = "2026-10-11-e02-la023-active-wealth-trajectory-refusal"
title = "Stop Economics training before unsupported active Gini projections"
type = "changed"
component = "foundry"
owner = "team-policyos-runtime"
summary = "The selected Economics training profile recomputes the finite, nonnegative active wealth-and-income predicate before native-to-composite projections and after every Economics producer before aggregate Gini updates. A typed in-band status is terminal across the native scan: no later transition, PPO update, evaluation result, or policy artifact is produced, including when a later producer could restore values. The artifact descriptor is persisted and read back with schema 1.1; generic schema 1.0 reads remain available. Shared CAS storage validates every required and optional TrainingMetrics field before writing either object, stores floating metrics canonically without mutating runtime artifacts, and restores declared runtime types on read; the legacy numeric-string cast remains limited to training_steps. A schema-1.0 manifest with the entire metrics block absent uses the historical placeholder defaults on read; those placeholders do not attest observed metrics. Present metrics blocks remain strict, and optional nulls retain their canonical mapping shape."
compatibility = "General signed-resource simulation and fiscal/tax rules remain unchanged. Only the selected Economics bridge opts into the fixed typed profile. Existing six native trainer arguments and optimizer behavior are unchanged; the legacy `track_active_wealth` and `require_supported_active_wealth` names remain compatible and wealth-only unless the typed Economics profile is selected. Built-in Economics mechanisms preserve each destination field dtype, and dependent calculations use the stored value; x64 calculations can round when a destination slot is narrower."
change_class = "python-public-api"
surface_classification = "public_stable: PolisySimulator.train and TrainingResult.bridge_pending; public_experimental: TrainingConfig Gini selector, CompositeExecutor Gini profile selector, CompositeState.gini_profile_supported status, GiniPopulationProfile and active-resource predicate, and schema 1.1 training-profile descriptor; internal: native trajectory scan status"
api = "No native trainer arguments change. TrainingConfig adds an optional immutable source-defined profile selector; selecting it activates the complete wealth-and-income trajectory predicate. CompositeExecutor accepts the same optional selector, defaulting to unrestricted behavior. CompositeState carries a default-true dynamic status leaf for JAX-safe terminal refusal. The agent-sim facade adds the shared active-resource predicate and profile enum. Selected Economics artifacts use schema 1.1 and record profile identity; schema 1.0 artifacts remain profileless."
migration = "Generic schema 1.0 artifacts remain readable and are not rewritten. A legacy schema-1.0 manifest with no metrics key at all retains the prior reader placeholders (unknown run id, zero steps, zero loss, and null optional values); these are compatibility defaults, not observed training evidence. If a metrics key is present, its required fields must be supplied and valid. Schema 1.1 has no absent-metrics fallback. Selected Economics artifacts use schema 1.1 because the existing policy manifest is the carrier; a sidecar would split profile identity from the policy. Readers of selected artifacts must accept schema 1.1 and its exact descriptor. A missing 1.1 descriptor, malformed or unknown descriptor, or descriptor supplied with schema 1.0 fails closed; none falls back to a profileless interpretation. Optional None fields remain explicit nulls under the current canonical mapping. Callers should inspect bridge_pending and its typed reason when a transition leaves the profile."
limitations = "The descriptor records selected source/profile provenance only; it is not scientific validation, external authority, or proof that a particular trajectory passed. The recomputed predicate controls terminal admission. This candidate does not define a signed-resource inequality law or close every classical-Gini consumer. Independent source review and the frozen producer/artifact/readback test wave remain required; no LA-023 closure or G acceptance is claimed."
