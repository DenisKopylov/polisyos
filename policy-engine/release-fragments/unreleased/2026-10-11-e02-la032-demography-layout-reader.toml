compatibility = "The scalar readers retain no-argument selection of one complete layout and isolated single-member compatibility. Their additive keyword-only layout selector pins reads to new or legacy and requires complete targets and priors even for a scalar read; an absent optional donor remains empty only for an unselected root with no known members or a selected complete layout. Missing, malformed, mixed, partial, and ambiguous inputs refuse."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.data_forge.read_api"
migration = "Pass the same layout keyword to each scalar read when composing multiple members; prefer load_demography_artifacts when one typed aggregate is needed. The selector does not add provenance or source-custody evidence."
api = "load_reconciled_targets, load_transition_priors, and load_donor_pool accept a keyword-only layout of new or legacy. Explicit selection requires that snapshot's complete targets and priors; the donor member remains optional within the selected snapshot."
limitations = "The layout reader validates local file coherence only. It does not establish the authoritative LA-032 inventory, producer/profile identity, member custody, rule epoch, currentness, external law, or permission. No source-inventory finding is closed by this change."
