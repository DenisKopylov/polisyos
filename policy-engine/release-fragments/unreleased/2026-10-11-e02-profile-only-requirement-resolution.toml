compatibility = "The typed compiler carrier is additive and optional. Historic reports without it remain readable as not established; a present empty carrier means the current compiler resolved no required constructs. Supplied direct and profile declarations are joined conjunctively or typed-refused if malformed/incompatible; a present null construct alias is malformed rather than absence/default. Candidate proposals remain separate and are not promoted to requirements or queries."
change_class = "internal-and-schema-versioned-artifact"
surface_classification = "internal: polisyos.data_requirement is absent from the supported-surface inventory; the N7 compiler-to-acquisition bridge adds no new HTTP/OpenAPI or generated-client surface."
migration = "No historical report is rewritten. Consumers that need N7 construct gaps must use reports carrying the versioned resolution rows; older reports retain their existing data-family behavior and are limited where profile-resolution evidence was not recorded."
api = "The compilation report, acquisition gaps, planner records, and receipt add an optional typed resolution carrier with an explicit schema version. Existing call signatures remain compatible; N7 forwards direct required aliases and explicit profile/context scopes to the shared validated compiler input builder, and passes the carrier only when emitted by the current compiler."
limitations = "A resolved binding is evidence from the existing capability resolver only. An unresolved or unobserved requirement remains not_established; this bridge creates no capability family, law, issuer, authority, source custody, or external-currentness fact."
