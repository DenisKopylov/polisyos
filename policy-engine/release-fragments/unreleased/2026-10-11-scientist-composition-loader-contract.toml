change_class = "python-public-api"
surface_classification = "public_stable: polisyos.core.components.DeclaredBuiltinLoader"
migration = "Existing callable-loader APIs remain accepted. The frozen Layer 3 value-gate remains v1 and is not refreshed here; the default Foundry candidate now emits provenance v2 and must be separately admitted by the value-gate contract owner. Readers accept established v1 data and compare v2 declared-loader records against live typed discovery."
api = "The existing Foundry target and entry-point group are passed through the public Core DeclaredBuiltinLoader in the canonical default path, then resolved through the existing discovery, kind validation, registry bridge, and catalog/value-gate consumer. The public compatibility tuple remains callable. DecisionReadiness has one shared evidence source owner and a stable legacy module identity for pickle writes."
limitations = "A scoped local independent review of the declared-loader public facade route is recorded at docs/research/e02-cloud-test-plan/implementation-handoffs/LOCAL/release-inventory-local-review-attestation-20261015.json. The snapshot collector now resolves statically imported public aliases, but the frozen pre-decomposition snapshot has not been regenerated or accepted; that separate gate is not claimed green. The declared-loader v2 source profile remains candidate evidence and does not establish authority or execution quality."
