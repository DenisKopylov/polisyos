]
compatibility = "RunDetails adds an optional generic_cycle_simulation projection. Existing runs without the generic compiled history keep the field absent. Consumers can ignore the field when it is absent."
change_class = "schema-openapi-abi"
surface_classification = "public-api: RunDetails.generic_cycle_simulation"
migration = "Regenerate the runtime API OpenAPI snapshot and client types from the additive RunDetails field."
api = "GET /api/v1/runs/{run_id} exposes source-bound generic cycle history, complete child-profile bindings, candidate-only N5 observations, typed sibling limitations, and the recursive checkpoint."
limitations = "The projection is candidate-only. It does not establish live currentness, world truth, external authority, or publication eligibility. Historical reads verify persisted CAS/profile/source lineage; unresolved lineage remains not_established with a typed limitation."
