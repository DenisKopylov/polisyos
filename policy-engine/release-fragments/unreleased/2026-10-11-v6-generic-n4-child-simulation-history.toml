summary = "Preserve source-bound generic N4 child-profile lineage and successful N5 observations when a later recursive sibling fails. A fresh run-details read resolves the persisted generic parent profile, full N4 child-profile family and set, N5 request/result lineage, and conditional value projection; per-sibling failures remain visible beside any independently replayed successful child observation."
