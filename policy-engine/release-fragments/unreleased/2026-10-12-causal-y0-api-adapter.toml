change_class = "python-public-api"
surface_classification = "public additive causal-family enum value and registered experimental method parameters; no artifact structure or schema-version change"
compatibility = "Y0 direct-ID and TRSO routes consume actual Y0 operation results; shared transport dispatch no longer labels local formulas as Y0 or R output. TRSO population-indexed expressions remain an unsupported typed candidate with an oracle-needed proof because the existing EstimandAST cannot preserve them. Review-required Y0 direct candidates are blocked by protected transport consumers. Native ID/TR routes remain unchanged; the capability contract adds the TRSO enum value without changing its structure or schema version."
migration = "Y0 TRSO callers must provide schema_version=policyos.y0.surrogate-data-profile.v1 and one or more population_id/outcomes/interventions rows. This is caller-declared request context only; it does not establish data existence, currentness, authority, or a valid empirical transport claim."
limitations = "The existing EstimandAST cannot preserve population-indexed Y0 probability leaves, so the exact Y0 expression and source/target quantity candidates remain in result metadata with unsupported status and an oracle-needed proof. Caller profile declarations do not establish data existence, currentness, or authority. API unavailability, API errors, null results, and bounds-operation errors are limitations, never non-identification witnesses. Capability families name only executable Y0 direct-ID and TRSO operations; front-door, do-calculus, and c-component families are not advertised, and R causaleffect execution remains unimplemented. Protected consumer paths block or warn on review-required candidates; they do not confer authority."
