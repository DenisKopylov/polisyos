compatibility = "Additive selected-profile opt-in and artifact schemas. The opt-in defaults to false. WelfareBundle schema 1.1 adds optional nominal PE/post-GE component vectors; WelfareSampleBundle schema 1.1 adds optional raw MC component vectors. Historical schema 1.0 artifacts remain loadable but are not eligible for source-bound weighted-output verification. Existing profileless producer behavior, SearchUncertaintyObservation, UncertaintyEnvelope, FunnelOutcome, current uncertainty, and historical merge_max behavior are unchanged."
change_class = "persisted-artifact-format"
surface_classification = "Existing FunnelOutcome.audit_refs serialization and generic authorized artifact-content route carry the candidate-only artifact; no generated DTO or promotion surface is added."
migration = "No history rewrite or backfill. Existing welfare bundles and profileless execution results gain no retroactive source basis. Historical WelfareBundle and WelfareSampleBundle schema 1.0 remain readable, but the source-bound consumer withholds them because nominal operands or MC component vectors are absent. New WelfareBundle and sample artifacts use schema 1.1; the reader requires nominal operands, MC component vectors, and exact selected-role edges, including the sample manifest's direct welfare_weights edge. New Ukraine DataSnapshots bind their selected data_ref edge; older selected snapshots without the required source edges remain readable outside this adapter but are withheld from source-bound observation. Feedback_uncomposed welfare output is persisted without an execution-basis edge and remains withheld by the fresh consumer. With return_selected_profile=true, the nested FeedbackResultRef preserves the exact CAS-selected profile; false keeps profileless compatibility, and no historical artifact is rewritten. Source-bound reads normalize the caller store once through the existing Core-to-IR adapter for the welfare bundle, weight, method, report, and sample; selected refs remain subject to the existing profile and source checks."
api = "SourceBoundRiskObservation schema 1.2 stores the candidate-only welfare measurement, selected weight ref, recomputed weight-application status, source-time role, draw counts, and ExecutionSourceProjection. WelfareBundle schema 1.1 stores the nominal PE and post-GE component operands returned by the actual nominal-input evaluator; WelfareSampleBundle schema 1.1 stores the corresponding component vectors for each MC row. The fresh reader resolves selected profiles, reconciles the candidate and execution DataSnapshot data_ref and optional uncertainty_envelope_ref fields to their exact selected manifest edges, then reconciles typed welfare policy, weight, model, method, report, sample, execution-basis, SimulationResult and Metrics refs to their manifest roles, verifies the sample's direct selected weight edge against the bundle source, and recomputes nominal PE/total/GE and every MC PE/total/GE scalar from the selected raw weights and producer operands. FoundryExecutionInputBasis still records only the selected single-step request/source graph and effective posture. The candidate artifact is emitted through existing audit_refs. Unit, validity, risk meaning, refinement, and authority stay not_established; scope remains consumer_asserted."
limitations = "Recomputed weight application is an internal producer/artifact/consumer consistency property, not a risk or refinement relation. It does not establish that welfare measures search risk, same-scope refinement, units, valid time/currentness, independence, law or authority. The vector check uses exact selected weight values without normalization. The positive semantic fixture uses two actual Foundry Metrics labels and a non-unit/non-normalized vector; the existing one-component [1.0] fallback remains unchanged and is not the evidence basis for this property. A newly materialized social-weight manifest is reconciled as a source role but is not claimed to supply the applied vector; that vector is the separate ir.welfare_weights payload. Profileless externally supplied social-manifest refs remain unqualified. No value enters UncertaintyEnvelope; routing/promotion and historical merge_max are unchanged. DataSnapshot sources with missing or divergent selected source edges, Feedback_uncomposed runs, and schema 1.0 artifacts lacking operands/vectors are withheld. A feedback welfare bundle can be persisted without inventing a missing execution basis; its source result retains the actual feedback-result edge. Only selected-profile MC sources with complete nominal and draw component vectors, coherent reports, and a recomputed single-step Foundry basis are supported. Runtime imports/tests, Ruff, generated-schema refresh, architecture/public-surface checks, and native composed acceptance remain UNRUN under the task hold."
