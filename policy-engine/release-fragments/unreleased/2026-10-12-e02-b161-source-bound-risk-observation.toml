compatibility = "Additive internal artifact kind; existing SearchUncertaintyObservation, UncertaintyEnvelope, FunnelOutcome, current uncertainty, and historical merge_max behavior are unchanged."
change_class = "persisted-artifact-format"
surface_classification = "Existing FunnelOutcome.audit_refs serialization and generic authorized artifact-content route carry the candidate-only artifact; no generated DTO or promotion surface is added."
migration = "No history rewrite. Existing welfare bundles remain unchanged; the bridge only emits when an exact selected welfare bundle and its current candidate scope claim resolve."
api = "The new strict SourceBoundRiskObservation stores raw welfare measure, nominal point, recomputed sampled mean/spread and credible interval, Monte Carlo method-profile ref, selected report/sample refs, source production time, and recomputed requested/attempted/successful/failed/unattempted/valid/simulation/retry counts. It fixes unit, valid-time, risk-interpretation, and refinement statuses to not_established, and scope relation to consumer_asserted. The consumer resolves exact CAS profile views, checks the original selected lineage refs, recomputes attempt identities, counts, sample-derived report summaries and quantiles, and only then exposes the artifact ref in audit_refs."
limitations = "This does not identify a search-risk quantity or same-scope refinement law; bundle policy_ref equality is only a consumer-asserted candidate association. Welfare units and validity/currentness are absent, and manifest created_at is only source production time. No value is normalized to UncertaintyEnvelope, no history maximum is lowered, no independent risk is overwritten, and no causal-admissibility or publication authority is inferred. Only Monte Carlo welfare sources with coherent persisted samples/reports are supported; delta/analytical/robust, N5 K_sim, native causal uncertainty, and calibrated Hessian sources remain separate candidates. Pytest/runtime and public-surface inventory verification are UNRUN under the task hold."
generated_client_compatibility = "No generated client shape changes; audit_refs remains the existing generic ArtifactRef list."
