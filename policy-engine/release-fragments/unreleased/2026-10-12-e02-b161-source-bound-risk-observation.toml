summary = "The policy-runtime funnel can derive an audit-only observation from an existing persisted welfare Monte Carlo bundle, preserve selected source profiles, and freshly recompute execution attempts, draw counts, summaries, and the interval before exposing the observation through FunnelOutcome.audit_refs."
