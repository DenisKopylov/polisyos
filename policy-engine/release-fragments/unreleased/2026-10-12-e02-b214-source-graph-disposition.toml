id = "2026-10-12-e02-b214-source-graph-disposition"
title = "Preserve graph source profiles through DAG-only discovery consumers"
type = "fixed"
component = "ir"
owner = "team-ir"
summary = "Discovery reports, hypotheses, fitted SCMs, and scalar ID consumers retain typed source-graph boundaries; full-field graph snapshots are detached before analysis, current GraphHypothesis writes recursively revalidate the complete declared nested model tree before CAS, and PAG/CPDAG scalar identification remains a typed limitation until completion semantics are adjudicated."
compatibility = "CausalDiscoveryReport advances to schema 1.1 and StructuralCausalModelSpec to 1.2 with additive graph-disposition fields; TransportabilityResult adds source-profile identity fields under schema 2.1. GraphHypothesis current writes are exactly schema 1.1, recursively reconstruct all declared nested model fields from actual storage, and bind payload and CAS manifest versions; only exact historical schema-1.0 payloads without a projection disposition use the typed legacy adapter. Valid DAG projection preserves graph content but returns a detached canonical snapshot rather than the caller's object. Historical receipts are replayed only against the canonical profile projector, otherwise their candidate projection stays typed unsupported."
change_class = "persisted-artifact-format"
surface_classification = "public_stable: versioned polisyos.ir.analytics artifacts; internal graph-admission implementation"
migration = "Readers preserve historical source graphs and fail closed when a prior resolved graph cannot be reproduced from the complete source payload. Only unversioned input mappings and manifest-bound schema-1.0 GraphHypothesis payloads without the disposition use the historical adapter; the latter are upgraded only by exact profile recomputation and remain typed unsupported when unresolved. Current GraphHypothesis writes require payload and manifest schema 1.1 to match, and mismatches or missing current versions are rejected before analysis. Schema-1.1 payloads must include the disposition. Regenerate and review the IR schema snapshots and public-surface inventory before release."
api = "The canonical causal-graph module exports GraphProjectionDisposition, GraphProjectionStatus, graph_for_analysis, graph_content_sha256, and project_graph_to_dag. Existing package facade exports, high-level method identities, and Foundry registration names are unchanged; no generated HTTP client contract changes."
limitations = "This change does not establish graph truth, complete PAG/CPDAG identification semantics, completion-set probability, empirical calibration, or publication authority. Unknown or unresolved endpoint profiles remain unsupported. Runtime, generated-schema, and public-surface inventory verification are pending root-owned validation."
