id = "2026-10-12-e02-b26-joint-interaction-uncertainty"
title = "Preserve paired uncertainty for joint interactions"
type = "changed"
component = "runtime-quality"
owner = "team-runtime"
summary = "New N5 v4 results derive every identified pairwise interaction and the aggregate higher-order residual from actual common-seed trajectories, preserve each seed vector and uncertainty summary in candidate readback, and do not report order two when a one-atom request has no pair scope. The explicit candidate intent now means a hypothetical all-unique-member diagnostic: N4 candidates remain alternatives, and the typed request plus v2 selection receipt bind this basis without claiming an N4-authored compound design. Fresh N8 readback binds the request hash and source/profile/child identities while composition and child-to-parent refinement remain not_established. Historical v1 receipts retain source-identity readability with explicit composition/refinement limitations; no intent performs no member union. Parent N8 remains not_established and value_pending_n8 without coupling evidence. Three-atom persistence/fresh-GET and generic three/four-atom permutation vectors are authored; runtime verification remains pending."
evidence = [
  "src/polisyos/runtime/quality/joint_simulation_horizon.py",
  "src/polisyos/runtime/quality/generation_cycle.py",
  "src/polisyos/runtime/http/routes/runs.py",
