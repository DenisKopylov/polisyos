id = "2026-10-12-e02-b28-n9-continuation"
title = "Carry acquisition re-entry through the N6 current front and N9 gate"
type = "changed"
component = "runtime"
owner = "team-polisyos"
summary = "A V6 acquisition re-entry now appends the new cycle and its summaries to a continued GenerationCycleRun, applies the shared N6 currentness and N9 promotion gates, and persists the resulting current front or typed refusal inside a versioned re-entry receipt. For same-candidate re-entry the fresh run-details GET binds prior/current N4/N5 refs, same profile selection identity with separate content hashes, and a changed selected-target baseline."
compatibility = "Re-entry receipts v1 and v2 remain readable. New re-entry receipts use manifest schema 2.0 and receipt schema v3; the run-details continuation projection is additive."
change_class = "schema-openapi-abi"
surface_classification = "public-api: RunDetails.candidate_simulation.acquisition_history[].continuation"
migration = "Regenerate the OpenAPI snapshot and generated dashboard API types from the updated runtime contract."
api = "GET /api/v1/runs/{run_id} may expose a typed candidate-only continuation containing the current occurrences/fronts and canonical N9 status or refusal, bound to the exact continued-run content hash and selected N4/N5 source refs."
limitations = "This does not establish production deployment currentness or publication authority. A second distinct acquisition update on the same route remains bounded by the existing single-attempt pointer and typed replay-conflict behavior; multi-attempt source history is not claimed. The new N9/current-front run remains candidate evidence and formal closure is not claimed."
