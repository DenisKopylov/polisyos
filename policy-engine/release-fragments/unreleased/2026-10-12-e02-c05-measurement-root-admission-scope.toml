surface_classification = "public_stable: runtime_quality authority envelope schema"
migration = "No existing CAS bytes are rewritten. Consumers of the v1 JSON schema should refresh generated DTOs for the nullable requested field; historical non-null payloads retain their exact schema version and identity. The new null value is emitted only from a typed workflow request whose admitted creation event records omission."
api = "MeasurementRootExecutionBinding is threaded from the exact ControlJobExecutionAdmission through MeasurementRootProducer and N7/N9 readers. Established writers use admitted tenant/cell/job/run plus effective profile; unestablished scope emits only a generic unclaimed candidate and no authority envelope/event."
limitations = "This change does not establish upstream shared/system source neutrality, cross-tenant permission, a new issuer, or a G-level owner selection. Protected readers require a fresh independently captured binding; unknown scope is not assigned a concrete fallback. Native overlay verification remains separate from the R359 source-bound checkpoint."
