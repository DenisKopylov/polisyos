compatibility = "The additive canon_read_status response field distinguishes a verified declared profile from explicitly requested candidate-only unqualified inspection. Default semantic reads refuse profile absence; present malformed or byte-inconsistent Core profiles refuse projection with a typed 409. Predictive diagnostics and JSON content previews check their exact selected-byte limits before decoding; schema-view key extraction remains uncapped because it has no existing route limit. Artifact bytes and CAS hashes are unchanged. The source-derived authority import closure follows literal lazy facade providers and refuses unresolved or ambiguous dispatch. Generated public-surface inventory review remains pending; from the repository root after source freeze run cd policy-engine && uv run polisyos-tools architecture guardrails sync --skip-deep-import-baseline, then run cd policy-engine && uv run polisyos-tools architecture guardrails check and review the generated snapshot."
change_class = "schema-openapi-abi"
surface_classification = "public_stable: polisyos.runtime HTTP API"
migration = "No stored artifacts are rewritten or re-profiled. Existing profileless catalog receipts remain unqualified and cannot activate; regenerate downstream typed clients only after final source freeze."
api = "Declares application/problem+json RuntimeApiProblem 409 responses on 25 Core semantic operations; R193 separately owns eight artifact operation response annotations. Raw/binary content remains exact bytes; public verification keeps its nonreceipt outcome."
limitations = "Core and IR CanonInfo tag families remain distinct. New catalog frames attest only the serializer settings of their new bytes; they do not establish producer authority, currentness, or historical eligibility. Existing profileless frames remain unqualified. OpenAPI/client regeneration, runtime tests, API tests, and installed-wheel/native acceptance remain UNRUN pending the root acceptance wave."
