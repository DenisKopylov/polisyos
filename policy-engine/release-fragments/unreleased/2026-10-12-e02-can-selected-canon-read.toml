migration = "No stored artifacts are rewritten or re-profiled. Existing profileless catalog receipts remain unqualified and cannot activate. Older Runtime API v1 responses may omit canon_read_status; clients treat absence as not_evaluated and candidate-only. Regenerate downstream typed clients only after final source freeze."
api = "The optional v1 compatibility addition advances runtime_api_version to 1.1.0. Declares application/problem+json RuntimeApiProblem 409 responses on 25 Core semantic operations; R193 separately owns eight artifact operation response annotations. Raw/binary content remains exact bytes; public verification keeps its nonreceipt outcome."
limitations = "Core and IR CanonInfo tag families remain distinct. New catalog frames attest only the serializer settings of their new bytes; they do not establish producer authority, currentness, or historical eligibility. Existing profileless frames remain unqualified. OpenAPI/client regeneration, runtime tests, API tests, and installed-wheel/native acceptance remain UNRUN pending the root acceptance wave."
