compatibility = "The additive canon_read_status response field is optional on Runtime API v1. Current readers emit their computed status; an older response that omits it maps to not_evaluated, conveys no conformance, and remains candidate-only. Explicit null, unknown values, and malformed present Core profiles refuse projection with a typed 409. Default semantic reads refuse profile absence. Predictive diagnostics and JSON content previews check their exact selected-byte limits before decoding; schema-view key extraction remains uncapped because it has no existing route limit. Artifact bytes and CAS hashes are unchanged. The source-derived authority import closure follows literal lazy facade providers and refuses unresolved or ambiguous dispatch. Generated public-surface inventory review remains pending; from the repository root after source freeze run cd policy-engine && uv run polisyos-tools architecture guardrails sync --skip-deep-import-baseline, then run cd policy-engine && uv run polisyos-tools architecture guardrails check and review the generated snapshot."
