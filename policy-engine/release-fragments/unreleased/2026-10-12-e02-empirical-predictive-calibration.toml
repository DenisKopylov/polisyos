compatibility = "The new POST/GET pair and versioned association are additive. Existing run records are not rewritten; GET returns not found when no association-ref event exists."
change_class = "additive"
surface_classification = "public: POST and GET /api/v1/runs/{run_id}/predictive-calibration; generated OpenAPI/client and dashboard run overview."
migration = "No row migration. Store initialization adds a purpose-neutral runtime_operation_intents table; association artifacts remain immutable and append-only events remain unchanged. Legacy events without recorded principal scope are retained but cannot be replayed automatically and require manual reconciliation."
api = "ForecastOwner, the empirical evidence bridge, and S10 produce a candidate predictive diagnostic. New Core run finalization and recovery return and verify the exact selected CAS manifest profile through RUN_FINALIZED, completed-job progress, fresh RunIndex reads, and the predictive association. If a pending legacy journal already has one verified profileless terminal event, recovery preserves that exact ref and clears only the journal; it does not upgrade the old event or establish a selected profile. Conflicting owner, content, sidecar, or duplicate-terminal evidence fails closed and leaves the journal for reconciliation. The virtual candidate uses a permanent per-run POSIX file lease plus same-process thread coordination across normal finalization and journal recovery; completed legacy reads with no journal or prior lock do not create a lock file. Cross-process race and reopen tests are authored but UNRUN. Observed coverage remains separate from nominal confidence metadata, predictive intervals remain in the selected uncertainty bundle, and counterfactual credibility remains not_established."
limitations = "The run-level candidate route is enabled by default through normal application/container configuration and can be disabled with allow_candidate_run_predictive_calibration_surface=false; this does not grant permission and is separate from the artifact-preview gate. Issuer, source-time currentness, population scope, and counterfactual credibility remain not_established. The proposed shared SQL owner admits one producer for an exact authenticated-principal/run/intent/body across application instances that share the database, and commits the association event with the completed exact-profile ref. Process-loss pending rows require manual reconciliation; legacy events without principal scope are refused for replay; external provider exactly-once is not claimed. SQLite route/process tests are authored but UNRUN pending the parent-controlled API slot, PostgreSQL concurrency is unverified, and canonical OpenAPI/generated-client regeneration is pending. This is not causal or publication authority."
