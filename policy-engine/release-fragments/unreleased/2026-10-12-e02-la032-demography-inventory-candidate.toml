compatibility = "The inventory request route is additive, but the existing public return contract also changes: individual role readers return DemographyRoleProjection, a Mapping[str, object], instead of a plain dict, and UkraineDemographyArtifacts contract v2 requires source_evidence. Existing loader call signatures, mapping key/value reads, and payload equality with mappings remain supported; projections remain read-only and callers requiring mutation can use dict(result). Callers constructing/revalidating v1 DTOs must migrate. Historical readers preserve ValueError for ambiguous/partial layouts, FileNotFoundError for an explicitly missing selected layout, and native JSON decoder errors for malformed selected content. A standalone historical donor read is empty only when no known demographic members exist or a selected complete layout omits donor; absence intent remains legacy_limited/not_established. Candidate refusals remain typed SourceResolutionRefusalError values, and candidate inventories without the required field refuse."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.data_forge.read_api.ukraine"
migration = "Existing loader call signatures and Mapping-style reads remain supported, including mapping equality by payload values. Callers requiring a plain mutable dict can convert a projection with dict(result); direct UkraineDemographyArtifacts construction or v1 payload validation must supply the required v2 source_evidence field. Inventory-backed individual readers share one InventorySourceRequest; historical source evidence remains legacy_limited and preserves the historical error categories."
api = "Exports DemographySourceRequest, InventorySourceRequest, HistoricalLayoutRequest, DemographyRoleProjection, and SourceResolutionRefusalError through read_api.ukraine. Role projections implement Mapping[str, object] and compare by payload values while carrying separate evidence. SourceResolutionRefusalError remains typed by .code and is a ValueError subtype for existing callers. UkraineDemographyArtifacts contract v2 requires source_evidence. Candidate inventory membership remains byte-bound; source authority, semantic completeness, units, and currentness remain not_established."
limitations = "Candidate-only inventory. An independent local review covers the supported Ukraine read facade and the detached payload-view/finite-JSON properties for the exact source and test hashes recorded in the local release-inventory attestation; it does not establish an authoritative inventory, source-owner custody/currentness, or semantic truth. The generated public-surface static parser still reports unresolved exports, so this scoped review does not claim complete symbol enumeration, native acceptance, or G acceptance."
