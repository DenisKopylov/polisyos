compatibility = "New CAN DataSnapshot writes carry the existing owner schema 0.2.0. Selected source refs with missing or mismatched schemas are withheld; old ID-only refs remain profileless and no profile or schema is inferred from an artifact ID. Existing schema-less unselected inputs remain on the compatibility path. No generated request/result DTO or audit_refs shape changes."
change_class = "persisted-artifact-format"
surface_classification = "The existing candidate-only observation continues through FunnelOutcome.audit_refs; no authority, routing, promotion, or public schema surface is added."
migration = "No CAS history is rewritten or backfilled. Existing selected profiles are accepted only when their exact manifest schema matches the current model owner; unsupported or schema-less historical sources remain unqualified."
api = "Each typed Core JSON source owner exposes its existing writer schema name/version to both producer and source reader. The consumer resolves the exact selected manifest, verifies its bytes, compares the manifest artifact_schema to the owner descriptor, and then validates the Core JSON model. CAN DataSnapshot producer opt-in passes the exact owner descriptor through the existing CAS helper, stores the returned typed ref in the runtime bundle, and intake re-resolves and verifies selected profiles before preserving the ref through receipt and bindings."
limitations = "Artifact schema identity proves serialization contract only. Search-risk interpretation, same-subject refinement, unit, valid time/currentness, issuer authority, causal admissibility, and historical-maximum supersession remain not_established. No normalization, lowering, routing, promotion, or current_uncertainty update is introduced. Same-byte false-schema aliases are covered in the candidate test design, but tests, Ruff, runtime import, and the root composed native consumer wave are UNRUN under the active hold."
generated_client_compatibility = "not_applicable"
