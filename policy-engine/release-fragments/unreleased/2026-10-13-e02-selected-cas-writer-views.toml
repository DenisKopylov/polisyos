compatibility = "Payload bytes and schema versions do not change. Current selected refs now retain the exact manifest profile returned by their write. Historical profileless refs remain readable without being rebound or retroactively treated as producer attestations."
change_class = "internal"
surface_classification = "Internal CAS write/read lineage; existing ArtifactRef projections retain the selected profile where these current producers already expose refs. No schema or generated-client change."
migration = "No persisted payload migration is required. Existing profileless refs continue through their historical read paths."
api = "GenerationSourceRepository returns same-write selected views for guarded current N4/N5 producers, and the authority-artifact writer does so for the diagnostic event, envelope, and payload. Consumers compare the selected read profile to the producer ref. These view identifiers do not grant authority or currentness."
limitations = "Historical profileless refs are not backfilled. Default-only context, model-declaration, NCM, and generic history refs keep their existing behavior. A selected profile identifies a CAS manifest view; it does not attest producer authority, issuer, or currentness."
