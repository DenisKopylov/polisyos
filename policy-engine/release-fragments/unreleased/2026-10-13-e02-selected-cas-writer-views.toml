id = "2026-10-13-e02-selected-cas-writer-views"
title = "Preserve exact selected CAS views across current candidate and authority writes"
type = "changed"
component = "runtime"
owner = "team-polisyos"
summary = "Current N4 scenario-source, proposal and candidate-history writers, strict N5 input writers, and linked runtime authority writes return the manifest profile selected in that same write. Their served consumers retain and compare the exact selected ref."
