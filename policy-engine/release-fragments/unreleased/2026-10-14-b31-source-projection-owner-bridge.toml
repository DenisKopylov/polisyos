id = "2026-10-14-b31-source-projection-owner-bridge"
title = "Bind explicit source projections to candidate N8 method runs"
type = "added"
component = "runtime-quality"
owner = "team-runtime-quality"
summary = "An opt-in N8 source-projection request binds selected active outcome, treatment, and covariate profiles through real AIPW/TMLE execution, a persisted Manski bounds bundle, and fresh CAS replay while retaining candidate-only status."
evidence = [
  "tests/unit/runtime/quality/test_value_gate.py",
  "tests/unit/foundry/methods/catalog/causal/test_treatment_effects.py",
]
compatibility = "Additive public_experimental Python API. Existing RealValueOwnerGateway callers that omit source_projection_request retain the legacy no-assignment behavior; present null or malformed values are typed refusals. No report-field or ValueOwnerMethodRunBasisV2 shape change; the CausalMethod enum is additively extended with AIPW."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.runtime.quality"
migration = "Construct ValueOwnerSourceProjectionRequestV1 only when the caller has explicit selected active observation projections for the outcome, binary treatment, and covariate roles, a same-unit identity-scale ATE estimand, and finite outcome support in that declared unit. Pass the request on RealValueOwnerGateway; do not infer treatment or support from candidate metadata. Unsupported transforms, filters, time horizons, units, methods, or malformed selectors remain typed refusals."
api = "Exports ValueOwnerSourceProjectionRequestV1 and ValueOwnerSourceVariableProjectionV1 from polisyos.runtime.quality. N8 persists role projections/profiles, immutable method intent, exact method input, actual AIPW/TMLE report, candidate Manski BoundsBundle, runner receipt, and run basis; the fresh consumer re-resolves and recomputes these sources before returning a search-only ValueOuterSet."
limitations = "All outputs remain candidate-only. Treatment assignment, support validity, source-time currentness, causal identification, sampling assumptions, positivity, exchangeability, calibration, external data authority, and promotion are not established. Manski bounds use caller-declared support without unit conversion; the native statistical interval is not an identification interval. B31 remains open."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
migration_docs = ["src/polisyos/runtime/quality/README.md"]
