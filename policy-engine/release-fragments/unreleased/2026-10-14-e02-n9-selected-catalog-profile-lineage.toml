compatibility = "ArtifactEnvelope remains an internal PDC model, but WorkspaceLoop embeds its producer-selected payload_manifest_profile_sha256 in the existing public GET /api/v1/control/jobs/{job_id} ControlJobResponse.progress projection. The nested progress object is intentionally generic and adds no generated nested client schema; clients that inspect these evidence objects must validate their explicit schema_version. OutcomeReplayProof.v2 and ProductionLoopRunProof.v2 bind the selected profile; the composed verifier checks the exact POST-to-fresh-GET projection. Profileless v1 history remains parseable but is not current evidence; no legacy profile is inferred or backfilled. MeasurementRootProducer refuses to run without a configured ArtifactStore and emits no hash-only pseudo-ref. A direct measurement-admitted WorkspaceLoop without a configured ArtifactStore returns a typed tool_failure with an artifact_missing obligation and emits no measurement root; callers that require measurement admission must provide a supported store."
change_class = "public-projection-additive"
surface_classification = "public stable HTTP projection: GET /api/v1/control/jobs/{job_id}.progress; nested PDC ArtifactEnvelope remains an internal typed model"
migration = "No database migration is required. Existing clients can ignore additive progress members. Evidence consumers must branch on the nested proof schema_version and must not promote profileless v1 history as a current selected-profile chain. New current evidence is reissued only by the existing selected-profile producer and reader path. No-store direct fixture callers remain candidate-only/refused until they supply an explicit ArtifactStore; no shared default CAS is created."
api = "The WorkspaceLoop worker emits the selected profile with the BaseDataset envelope, reads it with a typed Core ArtifactRef, and persists the contract plus OutcomeReplayProof.v2 and ProductionLoopRunProof.v2. A fresh GET /api/v1/control/jobs/{job_id} returns these under the existing generic progress mapping; the deciding validator checks the contract ref, content hash, and selected-profile list from that actual response. N9 bridge bodies remain v3 and carry their exact source view through one fixed-role CAS InputRef."
limitations = "The profile binds exact CAS bytes and a manifest view, not producer authority, external custody, legal authority, freshness, or production currentness. The HTTP progress member is an open projection, not a new generated nested DTO. Independent acceptance, the composed source replay, and native gates remain pending."
