id = "2026-10-15-runtime-api-nullable-default-presence"
title = "Align generated Runtime API presence types with nullable defaults"
type = "changed"
component = "runtime-api"
owner = "team-polisyos"
summary = "The OpenAPI type generator now preserves optional presence for nullable properties with an explicit null default when the schema does not require them, matching the existing response contract and producer output."
evidence = [
  "packages/runtime-api-client/scripts/generate-openapi-types.mjs",
  "packages/runtime-api-client/scripts/generate-openapi-types.test.mjs",
  "schemas/runtime_api_v1.openapi.json",
  "packages/runtime-api-client/types.ts",
  "apps/runtime-dashboard/src/api/types.ts",
]
compatibility = "Nullable default-null properties absent from the OpenAPI required set are optional in generated TypeScript and still accept null. Explicitly required nullable properties and existing non-null default projections retain their requiredness. Runtime wire behavior and routes are unchanged; clients must handle undefined for these optional properties."
change_class = "schema-openapi-abi"
surface_classification = "public_stable: Runtime API v1 OpenAPI schema and generated runtime client/dashboard TypeScript surfaces"
migration = "Regenerate both Runtime API type surfaces. TypeScript consumers should handle omission as well as null for optional nullable default-null response fields; no stored data or server behavior is migrated."
api = "The actual 409 application/problem+json response may omit context and extensions; the OpenAPI required list leaves them optional, and generated DTOs now represent that presence contract without treating default:null as required."
limitations = "Null admission is evaluated for OpenAPI 3.1 boolean schemas, local $ref with sibling conjunction, type, const, enum, allOf, anyOf, oneOf (exactly one matching branch), not, and if/then/else. Cyclic/dynamic references, scoped ids/anchors or custom vocabularies, and unsupported dialects remain required rather than guessed. This is not a general JSON Schema validator and does not change runtime response production, OpenAPI nullability, authority, or endpoint status semantics."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = true
migration_docs = ["packages/runtime-api-client/README.md"]
runbook_docs = []

