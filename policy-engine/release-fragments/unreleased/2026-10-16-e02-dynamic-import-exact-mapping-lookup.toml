id = "2026-10-16-e02-dynamic-import-exact-mapping-lookup"
title = "Resolve exact literal keys when validating dynamic import sources"
type = "fixed"
component = "tooling"
owner = "team-polisyos"
summary = "The dynamic import source analyzer now resolves exact builtin literal keys used by .get(...) and subscription against immutable source-owned mappings using Python's key equality semantics. Nonmatching exact keys no longer add importer targets, so a changed effective lookup makes a stale dynamic-import registry fail validation."
