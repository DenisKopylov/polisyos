migration = "Regenerate Runtime API clients from the updated OpenAPI schema before release. Clients should render candidate-tier results separately from normative claims and retain the typed legal_relation_refusal; an empty result is not a substitute for that refusal. Existing DuckDB graphs are not rewritten in place, so rebuild them through the ordinary producer or graph builder to recompute candidate tiers."
api = "The response adds the typed legal_relation_refusal object with code legal_source_relation_verification_not_established and status verification_missing. Result rows preserve LegalFactResult fields, including trust_tier=search_candidate and the source/provenance fields."
limitations = "No independent verifier establishes the relationship between a complete SPO claim and its source. Quote presence proves text occurrence only; this change does not establish entailment, legal validity, issuer authority, custody, currentness, or production currentness. The r3 cached-model generation-to-fresh-server replay remains UNRUN, so this candidate does not claim a positive runtime consumer receipt. The controlled source fixture is synthetic and is not a legal authority claim."
