compatibility = "No artifact schema or canonical-profile law changes. Natural-language variant params retain legacy artifact-ID fields and a typed selected-ref sibling. In the current run, producer-returned ArtifactRefs keyed by model_variant_id determine selected lineage; every supplied projection is reconciled with that map before consumer manifests are written. Either one matching projection can preserve a map-owned edge, but both absent with a producer-map entry or any malformed/disagreeing supplied projection is refused. With no map entry and no selector projections, the optional dependency remains absent; legacy-only history still requires the existing resolver to identify one profile. Per-variant prompt-tool-ledger CAS manifests carry exact InputRef profiles for producer-selected Trinity and final-claims refs; the strict v1 ledger payload retains its existing ID-string fields. A missing, corrupt, malformed, or item-level refused selected ref while CAS remains available is not collapsed into absence. The tested whole-CAS availability failure follows the existing control-job dependency-failure projection; its retryable flag does not assert that an automatic retry was scheduled. No blanket legacy migration or G-owned profile decision is introduced."
change_class = "internal"
surface_classification = "internal runtime consumer behavior; no new supported facade export or generated-client surface"
migration = "Repair or reissue a malformed selected artifact, or omit the selector only when the existing owner contract permits true absence. Do not encode malformed-present data as an absent input."
api = "The shared selected-view wrapper and variant-ref binding remain internal. Existing consumer outcomes are fail-closed for malformed-present paths: the proof bridge records a blocker, Phase 3 records a blocking reason even when a selected typed candidate serializes to an invalid value, and the selected-claims citation report fails. NL claims producers return their selected ArtifactRef; variant projection preserves it, and citation, grounding, registry, conflict, security, adjudication, and per-variant prompt-tool-ledger manifests retain selected profiles in InputRef. In the tested normal POST/worker job path, a whole-CAS outage reaches the existing job failure envelope and GET status projection as state=failed, code=content_addressed_storage_unavailable, layer=content_addressed_storage, phase=job_execution, retryable=true. This retryable flag is limited to that tested failure condition and does not establish automatic retry scheduling. The prompt-tool ledger payload remains v1 and ID-only; its scorecard gate validates the payload without resolving nested IDs against those manifest inputs."
limitations = "The selected-final-claims behavior described above belongs to the legacy/private `_execute_nl_pipeline` path; ordinary `/runs/nl` consumption is not established by this packet. The whole-CAS outage receipt separately exercises ordinary POST→worker→ControlStore→fresh GET failure publication and does not exercise selected-final-claims consumption. The authentic NL pipeline consumer replay is not established: its source-authenticity guard rejects candidate overlay imports. Same-payload/different-profile behavior is covered by a source-candidate test but remains UNRUN on the composed canonical source. The prompt-tool scorecard consumer reads the v1 ledger payload and does not join nested ID strings to the CAS manifest; that payload therefore remains a legacy projection, not profile-qualified authority evidence. This proposal creates no law, producer identity, issuer, custody, currentness, calibration, or publication authority."
