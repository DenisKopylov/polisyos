id = "2026-10-17-e02-berl-nonexecution-identity"
title = "Keep BERL effective identity unset when no result executed"
type = "fixed"
component = "berl"
owner = "team-scientist"
summary = "BERL diagnostics retain the requested method and refusal reason while the existing nullable effective_method_id stays null unless an accepted attribution result establishes which implementation ran."
