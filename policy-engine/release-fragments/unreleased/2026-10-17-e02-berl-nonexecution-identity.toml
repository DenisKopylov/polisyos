compatibility = "The existing MethodExplanation.effective_method_id field remains nullable and its schema is unchanged. A refused, failed-before-result, or rejected-after-result diagnostic has effective_method_id=null; successful accepted vectors keep the selected implementation identity, alias reuse behavior, and requested-method confidence adjustment."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.berl"
migration = "Consumers should treat effective_method_id=null as no accepted attribution result and use the requested method ID plus diagnostic reason for explanation of the refusal. No stored-artifact migration is required."
api = "No DTO field, schema, export, generated-client contract, issuer, or authority rule is added. The field's existing nullable type is used for no-execution diagnostics."
