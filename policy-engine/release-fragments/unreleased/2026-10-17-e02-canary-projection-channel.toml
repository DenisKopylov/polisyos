limitations = "The canary producer persists generated projections for audit consumers, but this establishes no producer authority, currentness, publication, or positive scorecard basis. Continuity-record fingerprint checks establish content consistency only, not producer identity. Arbitrary markerless ref maps outside known continuity slots remain a bounded diagnostic residual. The diagnostic status behavior change for observation-only required refs remains pending independent G adjudication; G code acceptance remains false."
