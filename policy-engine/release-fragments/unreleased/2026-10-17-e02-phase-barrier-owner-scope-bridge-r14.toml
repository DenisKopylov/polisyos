compatibility = "No public function signature, serialized schema, or generated client changes. The scorecard receives a plain mapping and cannot verify that its owner fields came from a fresh terminal read, so the owner-scope gate remains phase_barrier_owner_scope_not_established even for a matching persisted binding. The persisted same-input closure remains not_closed without an actual typed time-context ref, and missing required barrier records continue to block readiness."
change_class = "internal"
surface_classification = "public_experimental: polisyos.runtime.quality"
migration = "No caller-side signature migration. A profile string, producer label, request digest, or tenant default cannot supply owner proof. NL jobs retain the admitted creation-event and active-lease binding through their terminal attempt; the scorecard still requires a provenance-preserving consumer seam before it can establish owner scope."
api = "The build_quality_scorecard public signature and DTO schemas remain unchanged. The bridge is internal to existing NL progress publication and scorecard payload consumption. Generated projections remain audit-only and are not passed back into scorecard evidence."
limitations = "This bridge establishes current owner scope for the live NL execution path only. It does not create typed policy-time evidence, complete same-input closure, required phase-barrier records, external execution authority, or a positive scorecard. G acceptance and formal closure remain pending."
