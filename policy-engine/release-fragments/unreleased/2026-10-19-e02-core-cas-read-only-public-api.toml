compatibility = "Additive Python API on the already-supported polisyos.core.artifacts entrypoint. The opener-created ReadOnlyFileSystemCAS now also exposes get_manifest_by_profile, get_raw_manifest_bytes, and verify for selected-view validation. These methods add read capability only; existing FileSystemCAS writer construction remains available, and no persisted format or generated client contract changes."
change_class = "python-public-api"
surface_classification = "public_stable: polisyos.core.artifacts"
migration = "No migration is required. Consumers that need read-only inspection of an existing CAS root may use FileSystemCAS.open_existing_read_only; selected-profile consumers can use its get_manifest_by_profile, get_raw_manifest_bytes, and verify reader methods."
api = "The existing public opener/facade is extended with get_manifest_by_profile, get_raw_manifest_bytes, and verify on ReadOnlyFileSystemCAS. The methods expose selected-manifest resolution, exact raw sidecar reads, and integrity verification to read-only consumers; no writer methods or new authority are exposed."
limitations = "The prior inventory/reference review evidence for the original opener is recorded in docs/research/e02-cloud-test-plan/implementation-handoffs/LOCAL/release-inventory-local-review-attestation-20261019-core-common.json, but it predates these three reader methods and does not enumerate class members. Review of this additive public method surface and the generated public-surface outputs is pending; this draft therefore keeps public_surface_inventory_reviewed=false until the team-architecture inventory owner completes or reviews the committed regeneration required by architecture/public_surface/contract.toml. No in-repository product-runtime caller composes this opener with consume_certified_derivation: the runtime recompute path uses FileSystemCAS. The validation tree has a separate read-only opener for passport revalidation; that path uses only ArtifactReader.has/get_bytes and does not call consume_certified_derivation. The selected-profile additions are not used by that diagnostic, and product read-only derivation orchestration is not established. Team-architecture approval and G acceptance are not established."
