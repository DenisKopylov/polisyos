compatibility = "Default-selector references remain valid and retain their existing meaning. Selected derivation and origin-owner references are returned by the actual write; the origin owner writes its dependency receipt, adjudication receipt, and origin statement with those selected refs. All transition consumers recheck the typed CAN contract even on a later read. No public callable signature, persisted transition schema, or historical manifest is rewritten; the internal chronology writer now requires every caller to state its selected-profile mode explicitly, preserving existing false/default-selector behavior."
change_class = "python-runtime-behavior"
surface_classification = "public_stable: polisyos.core.FileSystemSignedArtifactEvidenceRepository exact selected-manifest readback; internal: runtime-quality derivation and epoch-transition production/consumption"
migration = "No persisted-object migration is performed. Existing default refs remain profileless; transition consumers accept them only when the resolved manifest satisfies the existing typed content contract. Historical CAN-less transition manifests and profileless origin-owner outputs remain refused by strict Core readers; produce new current outputs through the existing producer and signer when they are required."
api = "SignedArtifactEvidenceRepository.persist_signed retains its existing signature. Exact signed-artifact reads check an explicit selector against the manifest digest; profileless refs remain profileless. Transition producers pass the existing typed kind, media, schema, CAN and empty-input options across the signing bridge, then read back and decode the exact signed manifest and bytes. Derivation outputs request a selected return only if an input ref has an explicit selected profile. The private chronology persistence helper has a required selected_profile keyword; all current internal callers state True or False explicitly. The transition-origin owner uses the existing selected-profile write path for its three strict-Core-readable outputs and binds returned selectors to their exact readback manifests. Receipt input edges preserve producer refs, including their existing selector values."
limitations = "The external signing institution remains the signer; this change verifies the exact bytes and the local typed CAN write contract and does not assert institutional authority beyond the existing verifier. Transition artifact inputs remain the existing inputs=None contract, so this change adds no upstream transition-lineage claim. consume_certified_derivation has internal epoch-recompute use and validation-tool consumers, but no product HTTP, API, dashboard, or publication orchestration is established by that caller set; its product surface remains out of scope. No G acceptance or closure is claimed."
