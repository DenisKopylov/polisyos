compatibility = "The candidate route emits lineage_resolutions and profile-binding graph fields on batch responses, with no legacy output mode. The previous strict HTTP response DTO rejects added fields, and the prior request model rejects profile-bound request fields. Separately, the public-stable polisyos.fabric.LineageRef shape adds optional artifact_ref, artifact_ref_provenance, and source_run_id fields; existing constructors may omit them, but strict serialized consumers may need review. No consumer tolerance or compatibility window is claimed."
change_class = "schema-openapi-abi; python-public-api"
surface_classification = "public_stable: Runtime API v1 OpenAPI schema and generated runtime client/dashboard TypeScript surfaces; public_stable: polisyos.fabric.LineageRef"
migration = "Regenerate the OpenAPI snapshot, runtime client, and dashboard types; review Python LineageRef readers for the new optional profile-bound fields; and upgrade strict readers before the server emits lineage_resolutions or profile-binding fields. The profile-bound request shape is rejected by the prior strict server, so do not emit it before server support. Regenerate and review the registered public-surface inventory before setting public_surface_inventory_reviewed=true. No request feature gate or supported-consumer rollout sequence is established by this change; verify a coordinated sequence before promotion, and hold if the consumer set or ordering is unknown."
api = "POST /api/v1/lineage/batch accepts aligned selected_artifact_refs and an optional run_id; run-bound requests require the aligned list. Responses include lineage_resolutions and each graph's selected_artifact_ref, profile_binding_status, artifact_ref_provenance, and source_run_id. Pre-OPA binding verifies selected CAS ownership/profile and run selection as authorization context; the lineage service independently resolves the canonical selected decision packet and emits a per-entry run relation only on an exact full-ref match, which the route reconciles before emission. Null refs and wrong-run service resolutions receive no source-run claim. Separately, public-stable polisyos.fabric.LineageRef adds optional artifact_ref, artifact_ref_provenance (run_output_ref or reader_materialized), and source_run_id fields. The LineageRef validators require a selected manifest profile on artifact_ref and require source_run_id for run_output_ref provenance. Dashboard trust admission is one shared generation for the complete lineage/ref/run/origin/time identity across batch, single, cache, popover, and Inspector; rejected revalidation withholds grades from older graphs. Both Inspector controls carry the same subject, and generic follow-on views remain labelled generic. These fields do not establish law, custody, or publication authority."
limitations = "public_surface_inventory_reviewed is explicitly false: the current generated inventory reports polisyos.fabric exports as unresolved with zero known exports, and no inventory regeneration or team-architecture inventory review has been performed. The python-public-api release check therefore remains held; the false marker is not a waiver. The five registered Runtime API/client/dashboard outputs remain UNRUN. The candidate route has no old-output mode, and the prior strict request model rejects profile-bound request fields. No dual-read, dual-write, feature-gated request rollout, or compatibility window is established. The supported external-consumer inventory and coordinated client/server sequence remain not_established; promotion is HOLD. Numeric quantity values can remain visible when a valid primary response has no admitted profile graph, but no trust grade is shown. Malformed primary profile envelopes remain rejected with a visible error. Unbound popovers are informational; they cannot promote an embedded source-run candidate into a profile grade. Dashboard request/cache identities preserve omitted temporal fields separately from explicit nulls, and trust requires an exact response-scope match; query parameters themselves serialize null as omission. Generic follow-on exports and deep dives do not preserve selected-profile context."
generated_client_compatibility = "breaking_requires_consumer_action"
public_surface_inventory_reviewed = false
