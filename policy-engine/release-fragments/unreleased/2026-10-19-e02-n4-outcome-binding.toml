id = "2026-10-19-e02-n4-outcome-binding"
title = "Keep unbound N4 predictive outcomes blocked"
type = "changed"
component = "runtime"
owner = "team-runtime"
summary = "Run-level predictive-calibration responses persist the current S10 owner boundary and keep N4 outcomes blocked while the source-owned target-to-observed metric relation is not established."
evidence = [
  "src/polisyos/runtime/http/services/predictive_calibration.py",
  "src/polisyos/runtime/http/openapi_contract.py",
  "tests/unit/runtime/http/test_control_service_di.py",
  "tests/unit/runtime/http/test_predictive_calibration_profile_boundary.py",
  "docs/reference/api/runs.md",
]
compatibility = "The v3 association response adds typed S10 binding status, limitation refs, owner authority boundary, and purpose denials under the existing /api/v1 endpoint. Older generated clients use strict DTO schemas and may reject the additions, so update or regenerate those clients before consuming the new response. Legacy v2 N4 artifacts without the complete owner projection fail fresh readback with HTTP 409; immutable historical bytes and events are not rewritten."
change_class = "schema-openapi-abi"
surface_classification = "public API: POST and GET /api/v1/runs/{run_id}/predictive-calibration; OpenAPI, generated runtime client, and dashboard run overview."
migration = "Update or regenerate consumers against the v3 response schema before rollout; no in-place migration or retroactive upgrade. Consumers receiving a 409 for an incomplete legacy N4 association may request a new diagnostic with a distinct intent and current selected inputs under existing permissions. An unestablished target relation remains blocked and limited."
api = "PredictiveCalibrationResponse v3 includes the complete typed S10 projection. GET reopens the selected association and compares that projection with current owner recomputation. Missing legacy-v2 N4 owner projection is refused as predictive_calibration_association_invalid."
limitations = "This change does not establish the N4 target variable's relation to the selected observed metric, issuer, currentness, causal effect, or publication authority. Controlled tests use synthetic registered fixtures and do not establish production or external facts."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = false
migration_docs = ["docs/reference/api/runs.md"]
runbook_docs = []

