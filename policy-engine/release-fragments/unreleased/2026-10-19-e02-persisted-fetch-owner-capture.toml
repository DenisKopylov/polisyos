id = "2026-10-19-e02-persisted-fetch-owner-capture"
title = "Bind persisted fetch capture through the retrieval owner"
type = "changed"
component = "fabric"
owner = "team-fabric"
summary = "Retrieval exposes one persisted-fetch capture operation that owns the plan, effective configuration, full catalog binding, registration snapshot, and CAS store across bounded preflight and postflight callbacks. Runtime verifies the actual local connector route from a redacted typed projection using the file connector’s path parser, rechecks the persisted CAS chain, and queues explore-lane promotion only after successful postflight and owner revalidation."
evidence = [
  "src/polisyos/fabric/retrieval/service.py",
