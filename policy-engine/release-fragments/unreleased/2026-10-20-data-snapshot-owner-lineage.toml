compatibility = "Existing DataSnapshot 0.2.0 artifacts and their bytes remain unchanged. The ordinary NL control intake resolves selected Core DataSnapshot profiles for declared versions 0.2.0 and 0.3.0. Recognized owner families require the same fresh source verification under both versions; ordinary 0.2.0 snapshots retain exact typed-field/role closure. For production-data-state payloads, only the exact DataStatePayload schema emitted by materialize_l4_data_state_snapshot remains on that generic path; it does not establish acquisition-owner custody. Profileless references remain refused. The three named producers emit 0.3.0."
migration = "The ordinary NL control intake accepts selected Core DataSnapshot profiles for schema 0.2.0 and 0.3.0. For recognized owner families, schema 0.3.0 uses its typed source_lineage and schema 0.2.0 recovers the existing owner refs from verified source bytes; both require the same owner checks. A 0.2.0 lineage field or incomplete/malformed owner evidence is refused. Keep historical bytes as written: no read-time promotion or manifest rewrite occurs. Other strict readers must recognize schema 0.3.0 before consuming new outputs."
limitations = "This source set verifies measurement-root fetches, Scientist FabricBridge tabular results, and activated acquisition overlays by their existing producer contracts across schema 0.2.0 and 0.3.0. Other 0.2.0 DataSnapshot writers receive only the exact typed-field/role check. The ordinary DataState schema path does not prove acquisition-marker absence or original producer identity, so it cannot be described as acquired-overlay custody. Owner verification proves the specified CAS relations only; it does not establish external source truth, causal adequacy, legal meaning, or publication authority."
