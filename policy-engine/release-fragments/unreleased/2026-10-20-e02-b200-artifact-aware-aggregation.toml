id = "2026-10-20-e02-b200-artifact-aware-aggregation"
title = "Bind uncertainty aggregation to selected artifact views"
type = "fixed"
component = "foundry"
owner = "team-foundry"
summary = "The Foundry uncertainty aggregator no longer treats caller-authored origin strings as source identity; selected-view helpers verify exact CAS profiles, preserve lineage, and reconcile only recognized typed semantic axes."
evidence = [
