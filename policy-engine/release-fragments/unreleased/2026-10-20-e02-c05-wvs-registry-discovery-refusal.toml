id = "2026-10-20-e02-c05-wvs-registry-discovery-refusal"
title = "Preserve malformed WVS registry refusals through independent catalog discovery"
type = "fixed"
component = "fabric"
owner = "team-polisyos"
summary = "The WVS connector reads its shared content-bound registry through Data Forge's supported read API; malformed supplied input remains a typed refusal, while discovery can continue to independent matching providers."
evidence = [
  "src/polisyos/data_forge/domains/catalog/batch/material_inputs.py",
  "src/polisyos/data_forge/read_api/catalog.py",
  "src/polisyos/fabric/api.py",
  "src/polisyos/fabric/connectors/sources/wvs.py",
  "tests/unit/data_forge/read_api/test_wvs_indicator_registry.py",
  "tests/unit/fabric/test_wvs_catalog_discovery.py",
]
compatibility = "Missing WVS registry input retains the existing static fallback. Present malformed input remains a typed schema refusal. An unselected malformed registry does not hide an independent matching provider; when no provider matches, discovery remains typed-incomplete rather than reporting absence."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.data_forge.read_api.catalog; public_stable: polisyos.fabric.connectors"
migration = "Callers of the Data Forge read API may use read_wvs_indicator_registry(path) and must propagate WVSIndicatorRegistryReadError. Fabric callers must preserve CatalogRegistrySchemaError and must not translate it to ConnectorNotFound or an empty catalog."
api = "Data Forge exposes a typed Mapping-based registry reader and its typed malformed-input refusal through read_api.catalog. Fabric exports CatalogRegistrySchemaError as a connector-schema subtype. The reader delegates to the existing shared material snapshot parser; no parallel parser or resource resolution is introduced."
