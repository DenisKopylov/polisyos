compatibility = "The shared recursive mapper follows nested Pydantic exclusion metadata for typed chronology payloads that actually contain an excluded value. The historical discriminator is a nested ArtifactRef with manifest_profile_sha256=null; its profile field is omitted from canonical bytes. Where this value occurs, policy/admission reading reports PolicyBindingMismatchFailure/status=rejected for the old explicit-null alternate, while parse_canonical_statement raises ValueError on a noncanonical statement. Other signed-record and hash/projection paths can observe changed bytes or identities without a reader status. Selected profiles and required nullable fields without exclusion metadata preserve their canonical meaning. This does not claim every chronology or profileless record is affected."
change_class = "persisted-artifact-format"
surface_classification = "public_stable: typed chronology bytes and identity projections containing a nested ArtifactRef with an unselected manifest profile; complete route/member inventory remains pending"
migration = "Keep existing CAS bytes immutable. For a typed chronology value containing a nested ArtifactRef with manifest_profile_sha256=null, strict canonical readers may reject the former explicit-null bytes and downstream hashes or signatures may differ under the corrected projection. Do not normalize bytes in place or infer a profile. Reissue only through the artifact owner after independent source, profile-epoch, content, custody, signature, lineage, and admission revalidation; write a new reference and digest and rebuild dependent bindings. Reader results remain consumer-specific. Where evidence is unavailable, retain the bytes and report the exact typed result or not_established limitation. Production prevalence is not_established."
api = "Public DTOs and call signatures are unchanged. The shared recursive chronology mapper applies nested Pydantic FieldInfo exclude/exclude_if metadata. This affects callers only when their typed value graph includes an excluded value, including policy encoding/admission, anchor statements and lineage, signed-evidence record bytes, and runtime chronology proof/semantic-epoch/qualification hashes or projections. The policy reader and canonical statement parser retain distinct refusal behavior; other hash/projection callers may have no reader status."
limitations = "The focused 3-test candidate probe covers the profileless reference projection, selected-profile preservation, policy/admission typed refusal, and unchanged required-null golden. The canonical 145-test chronology consumer replay remains required after adoption. Production occurrence, signature migration, and transparent legacy-history support are not established. Public-surface inventory review remains pending."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
migration_docs = ["docs/how-to/chronology-profileless-policy-bytes-migration.md"]
