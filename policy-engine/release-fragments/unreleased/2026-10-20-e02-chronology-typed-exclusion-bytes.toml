id = "2026-10-20-e02-chronology-typed-exclusion-bytes"
title = "Align typed chronology bytes with field exclusions"
type = "fixed"
component = "core"
owner = "team-polisyos"
summary = "Align the shared recursive chronology byte projection with Pydantic field exclusions when an affected typed model graph contains an excluded nested value."
evidence = [
  "src/polisyos/core/contracts/chronology.py",
  "src/polisyos/core/security/anchor_lineage.py",
