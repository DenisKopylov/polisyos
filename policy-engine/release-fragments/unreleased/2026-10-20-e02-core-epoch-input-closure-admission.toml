migration = "No historical manifest or hash is rewritten. Existing records that omit their producer's required direct-edge closure or required Core profile remain refusals; use the existing producer/lifecycle to reissue an eligible record under its declared contract. Do not infer selectors, profiles, or ancestry while migrating."
api = "The shared reader requires every protected caller to supply an explicit typed input-closure and schema expectation. Exact schema absence, named schemas, and finite exact schema alternatives are checked from the selected manifest before payload reads; unowned schema scope must be explicit and bounded. Exact-empty writer contracts and required selected-view subsets are checked from the selected manifest before payload reads. Payload-derived input refs are recomputed from the decoded typed owner object and compared before the caller uses it. External ancestry not declared by a specific owner remains not_established."
limitations = "Core CanonInfo and schema tags establish serialization conformance only; they do not apply an IR law or establish institutional authority, currentness, or native-history status. The generic issuance exact-byte reader does not claim undeclared external parent-edge closure. Runtime/pytest qualification remains pending."
