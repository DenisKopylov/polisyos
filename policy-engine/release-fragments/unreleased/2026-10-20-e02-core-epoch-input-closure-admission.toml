compatibility = "No public DTO, API, or producer option shape changes. A default ArtifactRef continues to select the actual default manifest, and selected-profile digests remain bound to their exact view. Existing selected views whose manifest edges violate their producer's already-declared contract now refuse at admission or before owner use."
