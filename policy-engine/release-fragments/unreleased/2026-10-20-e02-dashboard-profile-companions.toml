surface_classification = "internal: runtime-dashboard composer and run-overview profile controls"
migration = "No external migration is required. Draft constructors and fixtures provide the profile selector keys as explicit empty selections. React Hook Form accepts the Zod input type and passes the parsed output type to the launch builder."
api = "Internal dashboard forms and draft storage distinguish z.input from z.output for fields with Zod defaults. Predictive profile selection filters typed refs by runtime.value_data_profile kind, application/json media type, and a present manifest-profile digest before request assembly."
limitations = "A selected profile reference is not evidence of external custody, currentness, causal calibration, issuer authority, or publication permission. The companion is a source proposal; root still needs the composed native typecheck, focused Vitest, and browser/API chain verification."
