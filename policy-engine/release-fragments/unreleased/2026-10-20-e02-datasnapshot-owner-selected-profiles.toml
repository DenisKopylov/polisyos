compatibility = "No request, response, or persisted DTO shape changes. Recognized owner-family references with missing or mismatched selected-profile digests are refused; the generic non-owner DataSnapshot 0.2 structural path remains available without an owner-verification claim. New owner outputs carry profiles returned by the actual CAS writes. The DefaultFabricPort continues to select the current request view when beginning a new snapshot production, and does not attest the request producer's historical selector."
change_class = "internal"
surface_classification = "internal: CAS profile continuity at DataSnapshot owner production and intake; no public DTO or schema surface change."
migration = "Do not rewrite existing manifests or references. Rebuild profileless recognized owner artifacts through their owning producers so the emitted references and input edges carry selected profiles. Historical profileless owner chains remain typed refusals until rebuilt."
api = "ArtifactStore write options and DataSnapshot DTOs are unchanged. Owner readers resolve the exact profile named by each typed reference and require matching parent and child edge selectors before child payload reads."
limitations = "A selected CAS profile proves which manifest view was selected, not external issuer authority or scientific validity. Generic non-owner 0.2 structural compatibility does not establish owner custody. The producer-bound request view selected by DefaultFabricPort is not evidence that the upstream request producer originally selected that view. Runtime tests and public-surface inventory regeneration remain unrun."
