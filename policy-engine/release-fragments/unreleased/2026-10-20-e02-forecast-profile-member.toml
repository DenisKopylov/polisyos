compatibility = "Predictive-calibration association v4 adds selected profile/member refs and a joined_candidate/profileless_legacy status. Older generated clients with strict DTOs may reject the v4 response fields; regenerate them before consuming this response. Existing profileless history remains profileless, and malformed supplied profile inputs fail closed."
change_class = "schema-openapi-abi"
surface_classification = "public API: POST and GET /api/v1/runs/{run_id}/predictive-calibration; generated OpenAPI, runtime client, and dashboard response validation."
migration = "Regenerate the API schema and generated clients against the v4 association response before rollout. No historical association is rewritten or upgraded. A new profile-bound run requires the exact ValueDataProfile ref and selected unit; requests without the pair retain the limited profileless behavior."
api = "The POST producer and fresh GET reader bind to the exact CatalogServingSourcePaths selected by that app's ControlPlaneService; no module-location fallback is used for selected profiles. The runtime creates the ForecastProfileMemberV1 receipt after resolving the selected profile and exact activated-source-projection edge through the canonical Data Forge source, active overlay, receipt, and passport owner, then binding observed snapshot/data refs. Fresh GET reopens and recomputes the join; callers cannot submit the receipt. The API response surfaces the selected profile and member refs plus join status."
limitations = "The receipt is predictive_only. Population scope, completeness, treatment assignment, source relation, source time/currentness, causal calibration, and production authority remain not_established. Missing or wrong request-local source context refuses a selected profile; profileless legacy requests remain candidate-only. Runtime intake applies the current owner producer's one-row-per-unit-period and single-dataset rules; it refuses aggregates or mixed-dataset profiles that the producer does not emit, though the generic row primitive can represent aggregate tuples."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = false
