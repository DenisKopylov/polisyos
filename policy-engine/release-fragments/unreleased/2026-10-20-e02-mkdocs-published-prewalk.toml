title = "Prune excluded subtrees in the docs-accuracy selector"
type = "fixed"
component = "documentation"
owner = "team-polisyos"
summary = "The docs-accuracy selector prunes excluded MkDocs subtrees before walking only when every effective exclusion is positive, while preserving the no-prune fallback whenever any exclusion is negated."
evidence = [
  "tools/quality/validation/check_docs_accuracy.py",
