]
compatibility = "This changes only the internal docs-accuracy selector's published-file membership computation: positive MkDocs exclusions can prune subtrees before traversal; any negated exclusion disables pruning. Pruned-directory identity uses relative paths, and each visited parent's sorted direct-child directory membership is retained. Included files that resolve outside docs_root are refused."
change_class = "internal"
surface_classification = "internal diagnostic only: MkDocs published-membership selector; no site content or public API change"
migration = "None. No docs, MkDocs configuration, stored records, or production data are rewritten."
api = "No public Python API or MkDocs site-build behavior is changed. The candidate updates the repository docs-accuracy selector only."
limitations = "Containment is checked for included files only; excluded files in traversed parents are not path-resolved and pruned directories are not traversed. This is not a filesystem-wide containment census and makes no claim about production content or excluded-path containment. The retained selector probe covered configuration loading and GitIgnoreSpec matching, not a docs_dir walk. The strict MkDocs build, bounded actual native selector/R5 preflight, and Native13 product gates remain unrun."
