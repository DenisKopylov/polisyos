id = "2026-10-20-e02-selected-objective-score-binding"
title = "Bind search scores to selected objective rules and source measurements"
type = "changed"
component = "scientist.search"
owner = "team-polisyos"
summary = "Score availability is recomputed under one configured-source evaluator and requires exact selected/source unit identity for every measured operand. Transfer fingerprints bind each selected objective name to the unit derived from its canonical rule; unknown or mismatched units remain unscored. Policy-vector scalar binding covers all channels, their unit identities, runtime feasibility, and ordered blockers; selected MO/frontier axes require only their own configured and emitted unit bindings. VOI snapshots retain the complete selected source paths, including nested metric-unit maps, and revalidate them on read. Funnel terminal completion requires one source-recomputed AVAILABLE score through both explicit and implicit finalization; a source-mismatched assessment remains INVALID when projections are cleared, absent/unavailable basis defers, and a valid zero remains available. Current runtime policy-vector output has no unit source and remains unscored. Direct policy-mode bundle intake reprojects stale promotion, judge, and readiness state before cache or Phase 5; DecisionPacket and translation/compliance preserve candidate bundles only when the persisted audit snapshot matches the current full source context; governance and verified-report nodes receive projected state with prior output refs cleared."
evidence = [
  "src/polisyos/scientist/methods/search/objective.py",
  "src/polisyos/scientist/methods/search/strategies/transfer.py",
  "src/polisyos/scientist/methods/search/strategies/multi_objective.py",
