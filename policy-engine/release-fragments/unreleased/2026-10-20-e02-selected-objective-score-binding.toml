  "tests/unit/scientist/nodes/test_build_policy_output_bundle.py",
]
compatibility = "Transfer history writers emit schema 5 with objective rule specs and each selected objective's exact configured unit in the identity header and index. Schema 3/4 history and schema-1 score assessments remain diagnostic-only under the unit-aware reader; their self-carried units cannot be upgraded. Schema-5 multi-objective rows may preserve valid selected axes with scalar_score=null; consumers recompute the complete selected basis. WarmStartBridge.evaluations_to_benchmarks requires the selected direction and rule; calls without them emit no benchmark rows. BayesianCandidateGenerator and the source-profile fit verifier derive the normalized scalar binding from the same primary_metric, direction, and unit in SearchMethodRunProfile. BayesianOptimizer derives the canonical rule internally; direct callers without a configured binding remain candidate-only. Policy-vector channels carry optional selected expected_unit plus source metric_units; old vectors lacking them remain inspectable but unscored. Policy-vector scalar source records also bind all channel units, exact feasible, and ordered blocking_reasons operands. Checkpoints with training/model state must carry a matching selected_objective_binding; legacy continuation state is rejected."
change_class = "python-public-api"
surface_classification = "public_stable: WarmStartBridge.evaluations_to_benchmarks selected-rule admission; FunnelOrchestrator.as_stage_a_callable now returns a typed EvaluationBundle for tri-state score/candidate continuation"
migration = "Construct transfer fingerprints from the active objective configuration and provide the corresponding objective_directions and canonical objective_rule_specs. Pass objective_direction and objective_rule_spec to evaluations_to_benchmarks. Preserve old histories for diagnosis; do not backfill their rule identity from their own score assessments. Policy callers constructing BayesianOptimizer directly must pass the selected objective name and source direction; the strategy derives the canonical normalized direction and rule. Carry the exact SearchMethodRunProfile unit into profile fingerprints and require MethodJob metric_units to match; a unit change requires a fresh source profile and GP fit. Policy-vector producers must provide expected_unit from the actual selected objective configuration and metric_units from the source producer; neither may be inferred from channel names or values. Current ObjectiveStack/metrics consumers cannot provide that source map, so their numeric channel values remain unscored. Only standalone candidate-only numeric use may omit a configured binding. Direct callers that unpack FunnelOrchestrator.as_stage_a_callable() should migrate to the typed EvaluationBundle fields; SearchController continues to accept legacy tuple evaluators."
api = "A selected objective is admitted only when the exact configured coordinate set recomputes from retained source under the consumer's names, directions, rules, and exact source unit bindings. Transfer RunFingerprint.units must equal the map derived from its selected rule specs; empty or mismatched maps fail closed. Scalar routes also require the scalar carrier to equal the selected coordinate; MO routes do not require an unrelated scalar aggregate. Search metric direction uses the canonical rule's normalized direction and existing maximize-to-negative/minimize-to-identity scalarization. BayesianOptimizer derives its rule from selected metric, source direction, and unit. The run-profile objective fingerprint is independently recomputed at profile receipt admission and MethodJob request matching. Unconfigured direct BO use is candidate-only. Each policy-vector selected axis recomputes its channel value, selected expected unit, and source metric_units entry; frontier consumers admit only their configured axes. Policy-vector scalar source binding additionally covers every scalar formula channel and unit, feasible, and ordered blocking_reasons. The funnel recomputes selected score assessment before trusting promising/terminal signals; only typed source-consistent limitations continue as candidate work. Its Stage A bridge carries score status and assessment in EvaluationBundle, so a missing/removed basis cannot become an approval or promotion."
limitations = "Candidate only. Source agreement establishes score availability/comparability, not measurement authority, causal validity, calibration, legal authority, production currentness, or publication authority. Unknown selected/source units remain unscored; no unit is inferred or converted. Current ObjectiveStack policy-vector channels have no source-owned unit input; their runtime producer emits an empty unit map, so same-run MO/frontier, scalar ranking, and transfer remain unscored. Typed expected/source units are enforced when supplied, but the upstream producer-to-artifact-to-channel unit bridge is not implemented and requires a named source owner and migration choice from G. Schema 3/4 history remains diagnostic until regenerated with selected units and schema-2 assessments. Funnel candidate continuation under an unestablished score is not approval, rank admission, training admission, or promotion. Runtime/persistence replay and public-surface inventory review remain pending; this fragment is not G acceptance."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
migration_docs = []
runbook_docs = []

