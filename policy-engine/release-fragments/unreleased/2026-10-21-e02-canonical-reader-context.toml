compatibility = "Reader context is additive and not persisted in manifest views. Semantic JSON previews now refuse over-limit or unsupported bounded-owner reads; raw and non-JSON paths keep existing byte behavior."
change_class = "python-public-api"
surface_classification = "public_stable: polisyos.common.canonical_profile.CanonicalProfileRead"
migration = "No manifest rewrite or CAS readdressing. Writers continue to emit the selected profile; consumers should choose Core or IR from their artifact contract rather than infer it from payload tags."
api = "CanonicalProfileRead adds reader_policy_id. Core and IR semantic readers set core-tag-policy@1 and ir-tag-policy@1. HTTP JSON content/schema inspection selects the default or exact profile by bounded owner receipt once, carries the sealed ref into the bounded Core reader, and returns typed refusals when limits or backend receipts are unavailable. Conditional GETs re-evaluate the existing route-purpose admission for the selected view before returning 304, so cached body reuse does not bypass current admission."
limitations = "Reader identity does not attest producer origin, schema adequacy, authority, or currentness. Cached cloud backends do not yet provide bounded durable-owner manifest/member receipts and refuse semantic JSON inspection without using local bytes. Non-JSON preview and explicit raw paths retain existing whole-byte behavior when bounded receipts are unavailable."
