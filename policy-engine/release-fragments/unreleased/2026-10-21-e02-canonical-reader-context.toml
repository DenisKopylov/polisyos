id = "2026-10-21-e02-canonical-reader-context"
title = "Bind canonical reads to their Core or IR reader policy"
type = "changed"
component = "core-cas"
owner = "team-policyos-runtime"
summary = "Canonical profile reads retain a fixed Core or IR tag-policy identity, and HTTP JSON inspection carries one owner-bounded default or exact-profile manifest selection into the Core reader."
