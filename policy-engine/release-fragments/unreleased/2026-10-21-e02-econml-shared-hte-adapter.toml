id = "2026-10-21-e02-econml-shared-hte-adapter"
title = "Bind EconML uncertainty and SHAP outputs to their result APIs"
type = "fixed"
component = "foundry"
owner = "team-foundry"
summary = "Read per-row EconML stderr and optional ATE summary members through one scoped warning boundary, preserve unavailable diagnostics as absent, and use the estimator-native SHAP API with shape validation."
evidence = [
  "src/polisyos/foundry/methods/catalog/causal/_econml_adapter.py",
