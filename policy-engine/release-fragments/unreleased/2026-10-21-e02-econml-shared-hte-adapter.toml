compatibility = "No HTEResult fields, method signatures, or estimator algorithms are added. Missing per-row inference is emitted as empty optional vectors already accepted by HTEResult; malformed, non-finite, negative-SE, misaligned, or ambiguous multi-output values now fail closed. Existing 1.0 and 1.1 ForestDR signatures remain unchanged."
change_class = "internal"
surface_classification = "internal: shared EconML adapter and existing HTEResult consumer; stable public facade unchanged"
migration = "Consumers already accept empty cate_std_values and paired empty per-row CI lists. Callers receiving present malformed outputs must repair their inference provider; no values are padded, truncated, or zero-filled."
api = "The adapter reads the EconML per-row stderr/pred_stderr protocol and routes ATE confidence-interval, pvalue, and mean-level standard-error access through one scoped warning boundary. ATE_OPTIONAL_SUMMARY_MEMBER_UNAVAILABLE records member/phase/exception type; access/call exceptions omit only that optional member and preserve any native interval already obtained, while CI access tries the next supported provider. Present malformed numerical returns still fail closed. It uses ForestDR's estimator-native nested shap_values result for the scalar outcome/treatment contract."
limitations = "The source-bound native ForestDR cold fit on 2026-10-21 reached fit/effect/inference but failed strict HTEResult construction because the previous adapter converted absent std_point into non-finite rows. Its evidence does not validate this proposed repair. Default S/T/X runs without explicit bootstrap still have no native per-row inference. HTEResult also requires a finite ATE interval, so the existing fixed 1.96 CATE-variance normal-Wald fallback remains unratified and unqualified. The existing variance guard can widen or replace a valid native interval using the same fixed 1.96 multiplier; that resulting interval is likewise unqualified. Alpha is forwarded to native methods but does not alter the legacy fallback or widening multiplier. Missing optional ATE members stay absent; getter/call failures are warnings scoped to the member, phase, and exception type; malformed present p-values, standard errors, intervals, shapes, and numeric values remain fail-closed. The additive native SHAP path and corrected ForestDR fit still require an exact frozen-source runtime receipt. No causal identification, external validity, calibration, or publication authority is established."
