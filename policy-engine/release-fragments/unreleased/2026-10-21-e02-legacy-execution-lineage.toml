id = "2026-10-21-e02-legacy-execution-lineage"
title = "Preserve method-capture provenance on legacy simulation results"
type = "changed"
component = "scientist"
owner = "team-polisyos"
summary = "Persist the producer's full-profile method-execution bundle and metric-binding-set refs as SimulationResults manifest roles, then expose bounded capture availability through JobResult."
evidence = [
  "src/polisyos/scientist/compute/job_spec.py",
  "src/polisyos/scientist/compute/runner.py",
  "src/polisyos/scientist/compute/__init__.py",
  "tests/unit/scientist/compute/test_runner_execution_lineage.py",
]
compatibility = "SimulationResults payload/schema stay unchanged. The internal strict JobResult DTO adds method_execution_capture to successful run_job output even when capture roles are unavailable; an older extra=forbid JobResult reader rejects this serialized key. Constructor defaults remain, but default construction does not preserve cross-version serialized-reader compatibility. Legacy provenance remains non-authoritative."
change_class = "internal"
surface_classification = "internal: polisyos.scientist.compute JobResult provenance; the package is not listed as a supported entrypoint and no relevant symbol is re-exported from polisyos.scientist"
migration = "Upgrade any first-party serialized JobResult reader before consuming new run_job output, or use an explicitly versioned consumer projection that removes the new field for an old reader. There is no dual-shape output mode or external compatibility promise for polisyos.scientist.compute. See docs/migration/e02-scientist-internal-search-and-compute-compatibility.md and docs/runbooks/e02-scientist-search-state-compatibility.md."
api = "JobResult.method_execution_capture exposes MethodExecutionCaptureProvenance with availability=available|partial|unavailable and exact full-profile bundle/binding-set refs. read_job_result_method_execution_capture(store, result, *, max_manifest_bytes) validates the selected SimulationResults manifest and each selected input manifest without loading artifact payloads."
limitations = "Availability proves only that the exact profile-qualified refs are present and resolve to the expected artifact kinds. The 256 KiB legacy manifest bound is an operational metadata-read limit, not a payload, process RSS, scientific resource, graph-admission, validity, or authority guarantee. Refs returned with producer failure or partial status remain diagnostic; availability does not establish successful execution."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
migration_docs = ["docs/migration/e02-scientist-internal-search-and-compute-compatibility.md"]
runbook_docs = ["docs/runbooks/e02-scientist-search-state-compatibility.md"]

