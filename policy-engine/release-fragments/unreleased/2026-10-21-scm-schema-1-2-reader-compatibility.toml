compatibility = "Schema 1.2 is the current StructuralCausalModelSpec writer profile. The current reader directly accepts bound schema 1.0 and 1.1 payloads and retains their exact payload/manifest version without migration. Schema 1.2 adds source_graph, source_graph_ref, and graph_projection; strict 1.0/1.1 readers are not declared compatible with 1.2. GCM and native_hybrid schema 1.2 fits require the typed source-graph disposition in addition to their applicable fit-custody fields."
migration = "No stored bytes are rewritten. Keep historical artifacts under their original manifest/payload version and use a 1.2-capable reader for new artifacts; old strict readers must be upgraded before reading 1.2 fields. Reading a historical version does not promote its fit method, provenance, source graph, or authority."
api = "The SCM schema registry declares the existing direct-read behavior as BACKWARD with explicit readable versions 1.0 and 1.1. New model constructors and default writes use 1.2. Historical schema 1.0 missing-payload-version handling remains unchanged. The source schema and worker implementation are unchanged by this compatibility declaration."
limitations = "Schema negotiation is not source custody or causal identification. Manually specified equations remain candidate assumptions. This candidate preserves the genuine locked DoWhy GCM producer test; its pinned DoWhy 0.14 worker remains unavailable in the current Python 3.12 test environment, so no actual selected-worker pass is claimed here. Generated schema-catalog/public-surface reconciliation remains pending its designated owner."
