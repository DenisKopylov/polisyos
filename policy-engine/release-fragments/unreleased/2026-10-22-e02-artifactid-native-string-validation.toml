id = "2026-10-22-e02-artifactid-native-string-validation"
title = "Harden Core and IR artifact identity, schema, and reader boundaries"
type = "fixed"
component = "core and IR artifacts"
owner = "team-polisyos"
summary = "Core and IR ArtifactIDs enforce the SHA-256 wire grammar and typed reader boundaries; generated schemas now describe validation and serialization constraints."
evidence = [
  "src/polisyos/core/artifacts/ids.py",
  "src/polisyos/ir/artifacts/contracts.py",
  "src/polisyos/ir/artifacts/lineage.py",
  "src/polisyos/ir/passes/base.py",
  "src/polisyos/ir/passes/core.py",
  "tests/unit/core/artifacts/test_artifact_id_native_string_validation.py",
  "tests/unit/ir/artifacts/test_artifact_id_native_string_validation.py",
  "tests/unit/core/artifacts/test_artifact_id_serialization_contract.py",
  "tests/unit/ir/registry/test_refs.py",
  "tests/unit/ir/test_phase2_passes.py",
  "architecture/generated_artifacts.toml",
  "schemas/snapshots/ir/_manifest.json",
  "docs/reference/ir/schema-catalog.md",
  "docs/reference/schemas.md",
  "schemas/runtime_api_v1.openapi.json",
  "packages/runtime-api-client/types.ts",
  "packages/runtime-api-client/canonicalRuntimeApiClient.ts",
  "packages/runtime-api-client/canonicalRuntimeApiClient.js",
  "apps/runtime-dashboard/src/api/types.ts",
]
compatibility = "Canonical sha256:<64 lowercase hex> values and persisted bytes remain unchanged. ArtifactID validation schemas accept uppercase or lowercase hex and existing validators normalize accepted input; serialization schemas constrain the canonical lowercase wire form to exactly 71 characters. ArtifactID-bearing IR schemas and Runtime OpenAPI components therefore gain explicit constraints. A trailing newline is rejected rather than stripped; callers must correct such input. No historical valid artifact is rewritten."
change_class = "python-public-api; persisted-artifact-format; schema-openapi-abi; js-package-api"
surface_classification = "public_stable: polisyos.core.artifacts and polisyos.ir; registered IR schemas; Runtime OpenAPI and generated clients"
migration = "Canonical existing sha256:<64 lowercase hex> values and stored bytes remain valid and unchanged. Callers that supplied a trailing newline or another malformed ArtifactID must correct it; no automatic trimming, rewrite, or migration is performed. After the source freeze, regenerate registered IR ABI snapshots and catalogs, Runtime OpenAPI, and both declared generated client families from their canonical owners; do not hand-edit generated outputs."
api = "Core and IR ArtifactID validation and serialization schemas now constrain the prefixed SHA-256 string grammar and exact length (71 characters for sha256:). Validation accepts uppercase or lowercase hex as the existing validators do; serialization emits the canonical lowercase form. This changes registered IR schema snapshots and owner-qualified Runtime OpenAPI constraints while preserving the generic ArtifactID alias, string wire type, routes, and canonical valid values. Regenerate the ABI/schema catalog, Runtime OpenAPI, runtime API client, and dashboard API types with their registered owners. Public-surface inventory review remains pending."
limitations = "The generated ABI, OpenAPI, and client families are required companions and remain pending until regenerated and reviewed from the frozen source; this candidate does not claim they are complete. No inventory of legacy malformed stored IDs or external generated-client deployments is established, and no external status is claimed. These checks do not establish producer provenance, store authority, legal truth, or global E02 readiness. public_surface_inventory_reviewed remains false pending its owner review."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = false
