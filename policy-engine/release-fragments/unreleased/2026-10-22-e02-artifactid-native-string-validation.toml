compatibility = "Valid native ArtifactID text and persisted artifact schemas remain unchanged. The documented IR reference normalizer now refuses malformed mapping, model, or dataclass selector metadata before read or persistence; callers relying on malformed selectors may fail closed. PassContext.require_as is additive, and the lineage builder now types its reader dependency through a narrow structural protocol."
change_class = "python-public-api"
surface_classification = "public_stable: polisyos.core.artifacts and polisyos.ir"
migration = "No persisted artifact or schema migration is required. Callers should provide string-keyed, schema-conforming references and well-formed dataclass selectors; there is no automatic rewrite of existing stored artifacts."
api = "The source slice changes Python-visible behavior in the public Core and IR artifact boundaries: native-string ArtifactID validation is hardened, normalize_artifact_ref rejects malformed selector projections, PassContext gains require_as, and build_artifact_lineage_graph is typed against the private _ArtifactManifestReader protocol. No module-level facade export, DTO schema, or persisted artifact format is changed. Public-surface inventory review remains pending."
limitations = "These typed checks do not establish producer provenance, store authority, legal truth, or global E02 readiness. The commit adds no public-surface inventory regeneration; public_surface_inventory_reviewed remains false until the owner reviews/regenerates the inventory. Full generated/installed consumer and whole-repository verification remain separate."
