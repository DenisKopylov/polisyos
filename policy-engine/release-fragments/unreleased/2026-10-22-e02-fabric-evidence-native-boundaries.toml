summary = "Fabric source-selection and acquisition consumers now reject malformed present report shapes, including malformed outer scenario family intent and required reference facets with no recognized textual ref, while preserving legacy fallbacks for absent aliases and treating present-empty or malformed source-reference aliases as missing evidence, without promotion from a lower-priority alias/default. Non-data artifacts are written and consumed through exact Core profile and DTO owners; decision-data projection retains structural object compatibility; the ceiling registry uses its complete strict owner DTO. Fabric run-bound lineage now requires both a selected artifact profile and provenance when source_run_id is supplied, while legacy rows with no optional profile/run context remain valid."
