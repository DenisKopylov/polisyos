id = "2026-10-22-e02-generation-cycle-history-no-loss"
title = "Refuse generation-cycle history fields outside frozen wire"
type = "fixed"
component = "runtime/quality"
owner = "team-polisyos"
summary = "The N6 v1-v3 historical projector reconciles every serialized model key against frozen wire metadata. It preserves frozen computed and excluded fields and omits other unrepresented declared fields only when both the typed value and its serialization-mode-specific output match the typed default. Unknown serializer-added keys and nondefault current-only values produce a typed refusal. The v4 source-limited serializer applies this projection before frozen-v3 admission, preserving the pre-v6 parser guard while omitting default generic fields."
evidence = [
  "src/polisyos/runtime/quality/generation_cycle.py",
  "tests/unit/runtime/quality/test_generation_cycle_historical_projection_fail_closed.py",
]
compatibility = "Frozen v1-v3 history wire bytes remain unchanged for represented values and explicitly frozen computed/excluded fields. An unrepresented current field is omitted only when its typed value and serialized output both match its typed default; a custom serializer that emits another value, a nondefault current-only value, or an unknown emitted key refuses rather than disappearing. In source-limited v4, default generic simulation fields are projected before v3 validation; nondefault generic fields still refuse and the pre-v6 input guard remains active."
change_class = "internal"
surface_classification = "Internal generation-cycle history projection and validation; no public API schema or facade changes."
migration = "No historical rewrite or schema version change. Existing v1-v3 artifacts retain their bytes; records carrying current-only nondefault data require a history schema that represents that data."
api = "No public API was added. validate_generation_cycle_run_history and the existing v1-v3 projector retain their current signatures."
limitations = "The guard covers typed Pydantic model payloads handled by the versioned N6 projector and the v4-to-v3 downversion path. It does not establish a repository-wide source freeze or repair the separately observed adjacent history-test failures."
generated_client_compatibility = "not_applicable"
public_surface_inventory_reviewed = false
