id = "2026-10-22-fabric-typed-runtime-state"
title = "Validate Fabric connector runtime state at its owner boundary"
type = "changed"
component = "fabric"
owner = "team-polisyos"
summary = "Built-in connectors validate owner-cached state and enforce strict HTTP Content-Length parsing, bounded native-byte response consumption, and PII scanning at shared consumers while preserving the generic connection-state API."
evidence = ["tests/unit/fabric/connectors/test_connection_state_contract.py", "src/polisyos/fabric/connectors/README.md"]
compatibility = "Generic ConnectionHandle state methods remain available; malformed owner state and malformed present Content-Length values fail closed; Content-Length uses ASCII 1*DIGIT and an over-limit declaration is refused before body reads. Bytes subclasses are normalized from their native backing bytes before size checks, callbacks, scanning, or return; non-bytes fallback bodies and chunks fail closed. Async observer and header callbacks are refused under synchronous contracts; native coroutine results are closed, known Futures are cancelled, opaque custom-disposer awaitables remain unawaited, and valid optional hooks plus async executor behavior are preserved."
change_class = "internal"
surface_classification = "internal: internal-only"
migration = ""
api = "Private typed state readers distinguish an absent key from explicit None and validate atomic setdefault winners; nominal executor and observer adapters check actual calls, while the shared HTTP reader validates native Content-Length values and normalizes streamed and fallback bytes at consumption."
limitations = "The HTTP boundary accepts only an absent Content-Length or a present native ASCII-decimal value; optional whitespace and malformed values are refused. The fallback read materializes the body before actual-size and PII checks, and the chunked reader appends each chunk before cumulative size checks, so these checks do not cap transient allocation or scan concurrently with input. This does not change external data authority or source custody."
generated_client_compatibility = "not_applicable"
