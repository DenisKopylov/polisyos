limitations = "Only the existing ExAnte selected-output path is demonstrated. PURE returned values are not ProgramGraph state patches, and the adapter rejects method/mechanism consumers and unsupported transfer. This does not establish scientific validity, causal identification, policy effectiveness, or publication authority."
