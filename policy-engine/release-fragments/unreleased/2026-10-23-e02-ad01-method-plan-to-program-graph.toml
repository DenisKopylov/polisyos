summary = "The existing selected ExecutionPlan producer can bind one exact Trinity candidate profile and the compiler can adapt supported PURE method nodes to the existing ProgramGraph and MethodDispatcher. Exact declared return slots stay bound in the source plan and metric capture while ProgramNode.outputs stays the state-patch plane; unsupported return consumers, non-PURE methods, and graph data transfers refuse as a whole. A selected nonempty method graph (nodes or declared edges) without a supported metric binding also refuses before compile artifacts are emitted."
