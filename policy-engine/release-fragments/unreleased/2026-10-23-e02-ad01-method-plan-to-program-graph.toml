  "tests/integration/foundry/test_compiled_method_metric_projection.py",
]
compatibility = "CompileRequest 1.0 and 1.1 requests without a selected method execution plan preserve existing behavior. Version 1.2 requires an exact selected plan ref and the matching candidate profile. A selected nonempty method graph (nodes or declared edges) without supported metric bindings refuses before compilation; empty plans retain the existing mechanism-only path. Unsupported plans refuse without dropping nodes or normalizing slots."
change_class = "internal"
surface_classification = "internal: internal-only"
migration = "No persisted artifact rewrite is needed. Existing request versions remain accepted; callers opt into version 1.2 only when carrying an exact candidate-bound selected plan."
