id = "2026-10-23-e02-agent-cost-origin-aggregation"
title = "Keep agent cost origin visible in run diagnostics"
type = "changed"
component = "runtime-dashboard"
owner = "team-policyos-runtime"
summary = "Agent model comparisons reduce the whole monetary observation by the verified current-owner ledger scope before grouping or resolving identities. Legacy scalar reconciliation mirrors the validated Core producer projection, including zero subtotals for absent origins, while display totals retain their separate origin-aware and identity-reduced rules. Stale, unowned, non-ledger, and not-established scalar inputs stay outside current-owner totals; conflicting attribution and unknown incremental spend stay unresolved."
evidence = [
  "apps/runtime-dashboard/src/shared/lib/domain/agents.ts",
