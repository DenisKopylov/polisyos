]
compatibility = "Internal runtime-dashboard display behavior only. No runtime API, generated-client, persisted-format, or producer billing semantics change."
change_class = "internal"
surface_classification = "internal: runtime-dashboard run-detail Agent Pipeline cost summary"
migration = "No external migration is required. The dashboard labels reported and estimated amounts separately and deduplicates identical repeated identities only in its display summary. For legacy scalar claim reconciliation, it recomputes the validated Core producer projection over the original event sequence and preserves the producer zero subtotals for absent origins; this scalar basis is not used as the display total. Missing, conflicting, or cross-model current-owner identities remain unresolved in display. Stale, ownerless, non-ledger, and scope-not-established claims stay visible as diagnostics and do not contaminate current-owner totals; reuse events remain lineage rows without implying zero incremental cost."
api = "The existing run-detail view renders origin-specific event totals and an explicit incomplete state from current-owner attempt ledger events."
limitations = "Dashboard aggregation does not establish provider billing correctness or the actual incremental resource cost of cache reuse. Core scalar reconciliation is a consumer-side mirror of the validated AgentPipelineView projection; the retained producer-model fixture covers this mapping but does not prove the complete HTTP route. Unknown and pending current-owner ledger events remain unresolved for display. Unattributed scalar claims remain separately visible with scope not_established and are not assigned to a model total. Conflicting or missing identities among current-owner ledger events are excluded from display subtotals; an identity projected into multiple model variants is left unattributed across those rows. Stale, ownerless, and non-ledger observations are excluded before the shared owner reduction."
