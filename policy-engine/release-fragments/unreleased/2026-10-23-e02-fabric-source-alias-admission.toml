compatibility = "Valid family values retain existing trim and case-insensitive matching. Both present report-declared and caller-supplied family lists are shape-validated and normalized before precedence; a caller list that normalizes empty falls back to the report list rather than erasing it. Malformed present lists are refused. A genuinely omitted source-reference alias retains its existing fallback; a present empty or malformed alias remains explicit no-reference input and cannot fall through to a lower alias or preprojected facet."
change_class = "python-public-api"
surface_classification = "public_experimental: polisyos.runtime.quality.normalize_quality_evidence, polisyos.runtime.quality.build_quality_scorecard; internal: polisyos.fabric.catalog.source_selection_audit"
migration = "Omit an optional reference alias when the existing fallback is intended. Do not use null, empty, or malformed alias values to request fallback. A caller-supplied family list that normalizes empty does not erase a report-declared expectation; valid family text continues to be trimmed and case-folded."
api = "The source-selection leaf is internal by contract and is not re-exported from fabric.catalog. Its normalization feeds the existing public_experimental exports polisyos.runtime.quality.normalize_quality_evidence and build_quality_scorecard, so valid padded family values and source-reference alias handling can change externally observable normalized evidence. The scoped review checked the affected exported names, signatures, callers, and committed inventory; no export or signature change is introduced. This change-specific review does not establish global export resolution or G acceptance."
limitations = "Report-declared family expectations remain candidate declarations; their normalization does not establish independent external admissibility. The R9 11-case canary CAS matrix predates this family-precedence correction and is not an integrated receipt for this candidate. The current 216-case focused matrix exercises direct normalization and the exported scorecard consumer. No external authority, custody/currentness, or qualifying production claim is established."
