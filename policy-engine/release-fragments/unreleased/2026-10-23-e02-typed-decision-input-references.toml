compatibility = "Existing typed artifact inputs retain profile-qualified lineage. Legacy bare input references remain supported where the packet wire declares that contract, and source-bound nested references retain ambiguity refusal. Present JSON basis sections are checked against the existing DecisionBasisSection contract before traversal; a present empty or non-object envelope refuses, while an omitted envelope remains compatible. The current builder producer writes a typed model dump. Core ownership checks and owner admission remain unchanged."
