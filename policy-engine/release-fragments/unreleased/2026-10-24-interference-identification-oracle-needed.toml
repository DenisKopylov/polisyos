id = "2026-10-24-interference-identification-oracle-needed"
title = "Refuse unbound policy-specific interference identification"
type = "fixed"
component = "causal-interference"
owner = "team-polisyos"
summary = "Interference identification runs ordinary original-graph ID only for a complete declared unit partition with no cross-unit edges; otherwise it preserves topology as a diagnostic and returns a typed oracle-needed result without inventing an exposure policy. Nullable topology indicators remain true, false, or unknown through traces and benchmark reports."
