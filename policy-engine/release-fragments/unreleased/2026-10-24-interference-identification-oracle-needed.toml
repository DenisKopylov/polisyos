]
compatibility = "Previously emitted schema 1.0 result payloads and their identified, non_identified, and input_invalid statuses remain readable. New helper results use schema 1.1; oracle_needed, pag_ambiguous, not_recoverable, and null topology indicators are rejected under schema 1.0."
change_class = "internal"
surface_classification = "internal: causal catalog interference identification helper and benchmark contract; supported Foundry facade unchanged"
migration = "No data migration is required. Consumers that validate new results must accept schema 1.1 and preserve oracle_needed separately from non_identified."
api = "A complete explicitly declared unit partition with zero cross-unit edges invokes ID on the original graph and reports ordinary_original_graph_id. Cross-unit edges or missing, partial, or inferred-only partitions return oracle_needed without an estimand AST or negative hedge certificate; topology booleans are null when partition completeness is unknown. Traces, adapter assumptions, benchmark case rows, and JSON reports preserve true, false, and unknown; aggregate spillover detection is null when unknown cases remain and no positive is established."
limitations = "No policy-specific exposure-law producer or binding contract is added. Genuine cross-unit exposure identification remains oracle_needed until a verified exposure-law owner is available; topology candidates remain diagnostic and do not establish that law."
generated_client_compatibility = "not_applicable"
