id = "2026-10-27-e02-cache-reuse-lifetime"
title = "Bind authorized cache reuse to exact shared-cache origins"
type = "fixed"
component = "runtime"
owner = "team-polisyos"
summary = "Keep provider hooks request-local while sharing one bounded cache owner and flight; bind the whole normalized response projection to its physical origin. Admit every ordinary NL factory producer begin under the live job fence and scope lifetime, retain its intent independently in the Core trace, and reconcile fresh job costs against that reopened basis and exact terminal proposal. Keep private evidence off provider wire; freeze full caller values and exact transport before keying; refuse reuse when the successful endpoint or payload differs. The accounting-enabled provider preflight consumes the same prepared request and retains cache resources with fresh wrappers. Exact invocation binding uses lossless native Python values independently of cache/evidence normalization; opaque physical calls retain original Python values without acquiring reuse authority. Close admission independently of blocked monetary I/O and verify the actual returned/read-back begin owner before dispatch."
compatibility = "Existing ledger1.0–1.4 snapshots remain readable; new writes use1.5 with optional typed reuse admission. Ledger monetary response digests retain text semantics. The additive Core producer guard/intent hooks do not change unscoped clients. Historical jobs lacking the new trace basis expose a limited monetary projection. Legacy unknown-scope queued NL LLM work now receives explicit nl_producer_ownership_not_established refusal with a scoped resubmission path. No HTTP request/response DTO change."
change_class = "runtime-state-format"
surface_classification = "public_stable: Core cache settlement and Scientist engine facade; additive registration/admission APIs."
migration = "Upgrade ledger readers before enabling1.5 writers across processes. No source event is copied/reissued. Direct Core flight producers must use cache_response_digest over the allowed response projection and bind retention TTL. New proof sessions are in-process; legacy monetary snapshots remain readable. Runtime Core intent artifacts use the version2.0 actual-begin receipt schema and exact selected profile; an older proposed intent basis is not promoted to actual ownership."
api = "The cross-run bridge verifies a live Core session/response; caller-created admission models cannot authorize ledger writes. No-key, zero-size/TTL, unknown external defaults and tool/strict-seed modes remain uncached. Closed or unavailable strict job admission refuses new work. Fresh job status joins the exact terminal proposal and typed Core attempt, reopens central producer intents, and compares their full event set/identity with the live ledger. Missing rows or source custody withhold monetary projection; dependency failures preserve typed retryable503/504."
limitations = "Local accounting admission does not certify provider invoices or institutional permission. The independent basis covers actual scoped central producer begins, including cache reuse, rather than charges for internal transport retries or catalog requests. A cache publication race can perform physical work only under current job admission; no minimal-call guarantee is made for that race. Already-running blocking dependency threads cannot be killed by the existing guard and may retain bounded worker/dependency resources until return; factory, binding and trace close do not wait on those operations and late admissions cannot dispatch. Actual alternate-endpoint or negotiated-payload outcomes stay uncached. Runtime, HTTP, adversarial and removal verification remains unrun until root composition."
evidence = ["src/polisyos/scientist/orchestration/llm/factory.py", "src/polisyos/runtime/http/services/control/job_nl_execution.py", "src/polisyos/core/llm/cache_settlement.py", "src/polisyos/scientist/orchestration/engine/budget_ledger.py", "tests/unit/core/llm/test_cache_settlement.py", "tests/unit/core/llm/test_traced_client_settlement.py", "tests/unit/scientist/orchestration/llm/test_prompt_cache.py", "tests/integration/runtime/http/test_nl_pipeline_cache_reuse_authorization.py"]
generated_client_compatibility = "not_applicable"
