surface_classification = "internal: polisyos.ddm"
migration = "Upgrade strict registry readers and their JSON schema before using new projections. Configure a selected source explicitly for finite replay; raw-list/default admission stays not_established. Do not enable production promotion until the actual observation owner, selection, coverage and currentness are established. No stored bytes are rewritten."
api = "The monitor accepts an optional configured finite observation source. Current rebind resolves the selected source rather than deriving authority from a caller list or mutable serialized digest. The governed registry schema declares the new applicability binding. No Runtime HTTP or generated client contract is changed by this slice."
limitations = "Finite replay proves only the selected bounded software source and never grants production promotion. Production observation ownership, feed-wide coverage/currentness and the excluded promotion flag's one-way veto relation are not established. Native positive, adversarial/removal and composed consumer verification remain pending until actually executed; no G acceptance or formal closure is claimed."
