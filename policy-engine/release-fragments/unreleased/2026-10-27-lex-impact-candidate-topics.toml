id = "2026-10-27-lex-impact-candidate-topics"
title = "Clarify candidate norm impact topics and legal backend scope"
type = "fixed"
component = "lex"
owner = "team-polisyos"
summary = "Opt-in 1.1 norm comparison reports bind their issued diff view and reconcile locally derivable content; reports identify heuristic topics as unmeasured and record legal backend and input scope limitations."
evidence = ["src/polisyos/lex/legal_evaluation/impact_diff.py", "src/polisyos/lex/simulator/cli.py", "src/polisyos/core/components/_cli_lex.py", "tools/ops_runners/runtime_cli.py", "tests/unit/remediation/test_lex_impact_semantics.py"]
compatibility = "The reader accepts schemas 1.0 and 1.1; omitted writer options retain 1.0. Opt-in 1.1 adds selected diff and report references, so strict old readers must be upgraded first. The 1.0 writer preserves its ID-only shape. Logical report ID formula, historical stored bytes and legacy simulator imports remain unchanged."
change_class = "persisted-artifact-format; tooling"
surface_classification = "public_stable: Lex impact CLI and serialized report content"
migration = "Upgrade readers first, then explicitly select 1.1. Omission retains 1.0; rollback to it preserves 1.1 readers. The default legal backend remains stub; --legal-backend expr_ast evaluates assigned expressions. Existing stored bytes are not rewritten."
api = "The CLI selects stub or expr_ast and report schema 1.0 or 1.1. The 1.1 reader verifies selected views, their manifest edge and internally derived diff/report properties, including a replay of carried issue deltas. Metadata records backend and both input scopes as producer assertions."
limitations = "Backend and jurisdiction metadata are producer records, not verifier-provenance. The stub does not evaluate rules; expr_ast covers only explicitly assigned expressions and does not authenticate source law or establish complete rule coverage. Original-pack completeness, legal issue truth and complete comparison-context binding are not established. Historical report_id values are not guaranteed content-unique; CAS IDs bind report bytes."
generated_client_compatibility = "not_applicable"
