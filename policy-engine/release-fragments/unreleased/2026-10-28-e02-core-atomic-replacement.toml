compatibility = "This additive Python API delegates to the existing atomic replacement implementation and returns None. The existing write_bytes_once API remains create-if-absent and unchanged. Ticket index replacement, caller-owned locks and durable_parent=True behavior are preserved."
change_class = "python-public-api"
surface_classification = "public_stable: polisyos.core.artifacts.write_bytes_atomic"
migration = "Cross-layer mutable-pointer writers may use write_bytes_atomic(path, data, durable_parent=...) through polisyos.core.artifacts. Callers retain serialization locks and domain-level update checks; immutable publication continues to use write_bytes_once. No stored-data or wire migration is required."
api = "write_bytes_atomic(path: pathlib.Path, data: bytes, *, durable_parent: bool = False) -> None. Required parent synchronization still propagates AtomicFileDurabilityError with its existing replaced disclosure."
limitations = "This facade adds no filesystem algorithm, CAS identity, provenance, authority, currentness, multi-host or additional durability guarantee. Public-surface inventory owner review is pending; this fragment is not runtime evidence or E02 acceptance."
