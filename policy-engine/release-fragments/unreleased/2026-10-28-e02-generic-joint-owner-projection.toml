compatibility = "The updated reader retains generic v1–v4 payloads; a v5 parent or owner-status response is rejected by old strict v1–v4 clients. Generated and installed consumers require regeneration and compatibility verification before rollout."
change_class = "schema-openapi-abi; python-public-api"
surface_classification = "public_stable: GET /api/v1/runs/{run_id} generic_cycle_simulation; polisyos.core.artifacts"
migration = "Regenerate OpenAPI, runtime client and dashboard types from the composed source, update strict clients to accept and validate v5, and review the Core public-surface inventory before release."
api = "A v5 response distinguishes joint-parent candidate observations from child rows. It carries typed owner-join status and exact selected result references; an unavailable owner can leave a separately checked result candidate-limited, while a demonstrated invalid or mismatched join blocks that row."
limitations = "A selected request/result/physical-plan consistency check is not numerical-producer authentication, source currentness, causal truth, authored policy composition or publication authority. Parent N8 is at most low-grade value_conditional with explicit scope, provenance and composition limitations. Historical non-generic V2–V5 requests and the unmarked legacy EvalSafety input path still require an owner-bound request/consumer bridge. Parent result unavailability or invalidity is projected separately from readable children; typed ownership denial and filesystem permission failures refuse the GET without child rows. A profileless non-generic compiled reference with an accessible, valid declared canonical manifest remains candidate-readable with a declared selected-view limitation; absent or malformed canonical declarations remain refused. The default-only adapter and resolved acquisition-history witnesses are authored but unrun. A profileless historical generic compiled root or result whose store cannot reopen the derived selected view may leave the generic projection or candidate row not established; that separate default-only compatibility remains unverified. Authored mixed-sibling and after-initial-read removal witnesses remain unrun. Authored API, UI and same-test removal witnesses have not yet run on the composed tree; generated clients and public inventory are pending."
generated_client_compatibility = "breaking_requires_consumer_action"
