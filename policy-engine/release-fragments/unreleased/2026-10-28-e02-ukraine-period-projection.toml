compatibility = "The public projection exports are additive. Normalized period representation, unknown-year household identities, D2/D3 observation fields, and new exact-signoff behavior can differ from historical artifacts; the existing two-series builder aliases remain available. Historical bytes and source versions are not rewritten."
migration = "Reconcile annual and quarterly source grain and affected consumers, then re-evaluate dependent observations from their actual original sources and provenance. Preserve historical artifacts; do not assign a date or source authority to fill an unknown. Requalify users of D2 full-read fallback, stage failure details, and retained scratch before adopting the new behavior."
api = "The Ukraine read facade exports UKRAINE_PERIOD_PROJECTION_VERSION and project_ukraine_observation_periods(values, *, time_grain), returning aligned inclusive bounds, disposition, and reason series."
limitations = "Source review is bounded; authored tests and removal controls do not by themselves establish runtime PASS. Full B146 source/time-role provenance and historical re-evaluation remain unverified. For B147, small self-generated Parquet fixtures exercise a hash-verified temporary snapshot, restart, source replacement and ABA; a pre-copy digest from the mutable path does not establish atomic capture of even one member. No safe admitted full-frame allocation bound, production-size resource profile, producer authenticity, or atomic multi-member generation is established. Generated public inventory review, installed consumers, composed checks, source authority/currentness, G acceptance, and formal closure remain separate."
