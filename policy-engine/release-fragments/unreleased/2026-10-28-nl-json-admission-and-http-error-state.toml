  "tests/unit/runtime/http/test_error_semantics.py",
]
compatibility = "Raw unsupported and non-finite candidate values keep their existing typed refusal. Existing authorization digest profile, snapshot versions, serializer bytes and HTTP problem status/code/projection fields stay unchanged."
change_class = "internal"
surface_classification = "internal: NL admission and HTTP exception transport"
migration = "No request or problem-envelope migration is required. RuntimeHTTPError is no longer a frozen/hash-oriented record; callers should use its existing structured problem projection rather than exception immutability or hashing."
limitations = "Native verification of this source candidate remains required. The cursor still records requested intent only, with actual data consumption and policy/legal authority admitted separately."
