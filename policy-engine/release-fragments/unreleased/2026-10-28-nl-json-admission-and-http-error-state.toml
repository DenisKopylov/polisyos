id = "2026-10-28-nl-json-admission-and-http-error-state"
title = "Admit typed NL cursor wire values without laundering raw candidate JSON"
type = "fixed"
component = "runtime-api"
owner = "team-runtime"
summary = "NL preflight validates raw candidate fields unchanged before delegating closed nested DTOs to their typed serializer. RuntimeHTTPError supports normal mutable traceback state so context-manager propagation preserves its intended status and problem envelope."
evidence = [
  "src/polisyos/runtime/http/services/control/job_attempt_publication.py",
