compatibility = "Legacy default registry hashes and historical registry artifact loading remain unchanged. Explicit contexts without the new content reference refuse live reuse and require explicit re-admission. Optional database_relative_path retains the canonical default and permits a contained existing native member. Variable availability keeps its existing counts and Runtime malformed-row refusal codes. CatalogReadSourceError retains CatalogSelectionError ancestry; raw native-open source change now uses catalog_read_source_changed_while_opening with legacy detail. AcquisitionPlannerBindingError and ValueOwnerAccessError gain optional source_refusal_code without changing persisted DTO fields. A visible native WAL now refuses content-bound reads until its owner checkpoints/closes; no file is deleted. Injected explicit-source graphs must be actual Catalog Store/Graph owners with the selected full read identity."
