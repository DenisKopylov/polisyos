id = "2026-10-29-technical-inspection-http"
title = "Add explicit scoped technical-inspection evidence to artifact previews"
type = "added"
component = "runtime-http"
owner = "team-polisyos"
summary = "Content and schema previews can explicitly select a persisted technical-inspection evidence artifact and its exact manifest profile."
evidence = ["tests/unit/runtime/http/test_technical_inspection_http.py"]
compatibility = "Requests without evidence keep their existing admission behavior. Evidence-selected responses require cache revalidation; raw download is not covered."
change_class = "schema-openapi-abi"
surface_classification = "public_stable: artifact content and schema preview query parameters"
migration = "Provide both evidence ID and its selected profile along with the selected source profile. For GET /api/v1/artifacts/{artifact_id}/content and /schema, omit both optional technical_inspection_evidence_id and technical_inspection_evidence_profile_sha256 or provide exactly one value for each with the selected source profile. A partial pair or repeated selector is rejected with HTTP 400. See src/polisyos/runtime/http/services/README.md and the source route query contract; generated OpenAPI/TypeScript still represent these individually optional fields separately."
limitations = "Technical inspection establishes no closeout, publication, or claim authority. Runtime and generated-contract verification are pending."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = false
migration_docs = ["src/polisyos/runtime/http/services/README.md"]
runbook_docs = ["src/polisyos/runtime/http/services/README.md"]

