id = "2026-10-30-e02-native-predictive-replay"
title = "Retain selected native predictive replay as a limited candidate"
type = "added"
component = "scientist"
owner = "team-polisyos"
summary = "Bind a historical prefix to a derived Trinity, execute selected Foundry trajectories, and reconcile complete native cohorts and reports on fresh read."
evidence = ["src/polisyos/scientist/methods/backtesting/native_replay.py", "tests/unit/scientist/methods/backtesting/test_native_replay.py"]
compatibility = "The native replay is opt-in. Complete multiple-replica cohorts project a pointwise arithmetic mean; an incomplete cohort remains unavailable with its denominator and survivors retained. Native-containing matrix and leaderboard composites remain unavailable. Resolved consistent legacy Matrix scores remain candidate diagnostics with source reconciliation not established and no promotion. Unresolvable or inconsistent matrix results have no composite. A single completed simulation with a later workflow failure remains a degraded scientist_candidate with the failed replica retained. Legacy-only backtest cohort profile behavior is retained."
change_class = "python-public-api"
surface_classification = "Additive Foundry execute and Scientist guarded-reader facades, selected-run callback, and explicitly unverified IR candidate read. The ordinary IR reader refuses native reports that require higher-layer verification."
migration = "Existing legacy reports require no migration. Native report consumers use the guarded Scientist reader and selected source, workflow, and report profiles."
limitations = "Model simulation only; each replica reinitializes Foundry with its seed at every step, and neither temporal stochastic continuity nor independence across replicas is established. No inferred prediction intervals, empirical calibration, producer authenticity, external source authenticity, temporal provenance, causal authority or trust eligibility. The fixture is not production provenance. The bounded coverage inspector does not measure reports without reconciled forecast and holdout source values, or verify cohort semantics."
public_surface_inventory_reviewed = false
migration_docs = ["src/polisyos/foundry/README.md", "src/polisyos/scientist/methods/backtesting/README.md", "src/polisyos/scientist/README.md", "src/polisyos/ir/analytics/README.md", "src/polisyos/calibration/README.md"]
runbook_docs = []

