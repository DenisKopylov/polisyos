id = "2026-10-30-e02-native-predictive-replay"
title = "Retain selected native predictive replay as a limited candidate"
type = "added"
component = "scientist"
owner = "team-polisyos"
summary = "Bind a historical prefix to a derived Trinity, execute a selected Foundry trajectory, and reconcile its persisted native report on fresh read."
evidence = ["src/polisyos/scientist/methods/backtesting/native_replay.py", "tests/unit/scientist/methods/backtesting/test_native_replay.py"]
compatibility = "The native replay is opt-in. Unsupported multiple-replica requests and native matrix aggregation refuse before dispatch. A completed simulation with a later workflow failure remains a degraded scientist_candidate with the failed replica retained. Legacy-only cohort profile behavior is retained."
change_class = "python-public-api"
surface_classification = "Additive Foundry execute and Scientist guarded-reader facades, selected-run callback, and explicitly unverified IR candidate read. The ordinary IR reader refuses native reports that require higher-layer verification."
migration = "Existing legacy reports require no migration. Native report consumers use the guarded Scientist reader and selected source, workflow, and report profiles."
limitations = "Model simulation only; each step reinitializes Foundry with the same seed, and the temporal stochastic law is not established. No inferred prediction intervals, empirical calibration, producer authenticity, external source authenticity, temporal provenance, causal authority or trust eligibility. The fixture is not production provenance. The bounded coverage inspector does not measure any cohort-backed report, including legacy cohorts."
public_surface_inventory_reviewed = false
migration_docs = ["src/polisyos/foundry/README.md", "src/polisyos/scientist/methods/backtesting/README.md", "src/polisyos/scientist/README.md", "src/polisyos/ir/analytics/README.md"]
