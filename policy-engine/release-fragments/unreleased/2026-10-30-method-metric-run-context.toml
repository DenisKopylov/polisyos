compatibility = "No endpoint, response schema, role grant or selection-key rewrite. Typed resource binding adds an explicit related-source basis selector. Related-source admissions use authorization-audit v2 with the complete context and per-target decisions; serialization of historical v1 events is preserved. Existing Core IDs retain their meaning; valid current scoped direct-method control aliases can reach the existing limited metric projection. Populated comparisons require an available policy decision for every source, and any denied or unestablished target refuses the whole comparison. Changed or unestablished ownership fails closed. Every ordinary process-live related-target admission or sealed-dependency failure crosses one common generic boundary and seals one terminal DENY with the actual evaluated prefix; audit-unavailable admission refuses. The cold audit owner verifies typed ordered context/member/digest/permission/outcome bindings and request checksum, preserving historical v1 fields. No authenticated-history or MAC claim. Cancellation/BaseException, process failure and crash durability are outside the admission-boundary property."
