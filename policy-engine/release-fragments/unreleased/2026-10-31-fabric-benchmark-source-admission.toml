surface_classification = "public_stable: polisyos.fabric.data_plane.benchmark_stream_processing"
migration = "Hosts running dedupe benchmarks pass their admitted source_progress_readers. No persisted schema or Runtime API changes."
limitations = "The regression input is a bounded synthetic finite JSONL source. It establishes software replay/dedupe behavior only, not production throughput, key semantics, source authenticity or E02 acceptance."
