title = "Forward source-owned progress admission through streaming benchmarks"
type = "fixed"
component = "fabric"
owner = "team-polisyos"
summary = "Allow streaming benchmarks to supply the existing host-owned finite source readers to the canonical runtime. Keep dedupe admission, replay-only scope and committed checkpoint recovery intact. Restrict world segment error translation to expected filesystem, value and Arrow failures so unexpected defects propagate."
evidence = ["tests/unit/fabric/data_plane/test_benchmarks.py", "tests/unit/fabric/test_world_store.py"]
compatibility = "The new benchmark keyword is optional. Dedupe still refuses missing or mismatched source authority; no keys, versions or production guarantees are inferred. Expected segment IO errors retain their existing wrappers; unexpected exceptions now propagate unchanged."
