migration = "No API migration is required. Reconcile duplicate plugin IDs if callers relied on implicit precedence; caller-supplied development roots now precede the distribution-prefix fallback."
api = "Built-ins, polisyos.plugins entry points, supplied development roots, and prefix-discovered packages are considered in that order. Every candidate must be a DomainPlugin instance with PluginMetadata before it is returned. Precedence only resolves duplicate registration names; it does not attest source trust, quality, or policy authority."
