id = "2026-11-01-lane06-transfer-and-async-cancellation"
title = "Keep event loops responsive and preserve export generations"
type = "added"
component = "core"
owner = "e02-coordinator"
summary = "Reuse the bounded Common worker for result transport and asynchronous cancellation acknowledgement; retain actual displaced export generations with native atomic publication and expose their locators through the existing CLI. Atomic text/bytes cleanup retains foreign replacements and the primary failure. Wire v2 uses semantic depth and validates its exact canonical journal projection before emitting bytes. Early process EOF is classified from fresh completion/exit/deadline observations, and uncertain process or delivery outcomes retain terminal retry semantics through IPC."
evidence = ["tests/unit/common/test_async_tools.py", "tests/unit/common/test_blocking_worker_completion.py", "tests/unit/scientist/orchestration/engine/test_retry.py", "tests/unit/core/artifacts/test_transfer_generation_publication.py", "tests/unit/core/components/test_cli_replay.py", "tests/unit/remediation/test_mig_01.py", "tests/unit/scientist/orchestration/engine/runner/test_serialization_e02.py", "tests/unit/scientist/orchestration/engine/runner/test_timeout_transport_attempt_binding.py"]
compatibility = "Ordinary synchronous Future.cancel remains unchanged. Async requests retain reservations until physical acknowledgement. ExportReport gains optional previous_generation; first-export CLI output remains unchanged. Existing canonical profiles and the newer importer admission remain intact."
change_class = "Compatible bounded execution and phase-aware native export publication."
surface_classification = "public_stable: polisyos.common and polisyos.core.artifacts"
api = "Add wrap_shared_executor_future and request_shared_executor_cancellation in Common async_tools; export ExportDurabilityError and optional retained-generation coordinates. No HTTP or persisted-schema change."
limitations = "Native APFS qualification does not establish Linux, power-loss, hostile-parent or distributed filesystem guarantees. Retained generations require caller-owned reclamation; a locator alone is not a finite operational retention bound. Darwin Core-bound small/1MiB transport does not qualify native Linux supervisor or warm numerical topology. No whole-lane or G acceptance."
generated_client_compatibility = "not_applicable"
