summary = "Keep opaque IDs independent of hard modality requirements, bind the complete value-owner denominator and disposition/ranking trace to a verified selection receipt, validate coupled inputs before work, reject duplicate SMM coordinates and preserve finite paired estimates. Use deterministic inverse-normal quantiles with explicit interval status."
