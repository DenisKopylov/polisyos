id = "2026-11-16-lane01-custody-recovery"
title = "Recover owned acquisition custody and expose reconciled numerical history"
type = "added"
component = "runtime-http"
owner = "team-runtime-quality"
summary = "Recover the same failed acquisition under an exact attempt and selected head, preserving its failure history, and distinguish reconciled historical numerical observations from ordinary completion."
change_class = "Additive custody recovery and historical observation provenance."
surface_classification = "public_experimental: Runtime acquisition requests and initial numerical history"
compatibility = "Existing acquisition bodies and ordinary initial-observation JSON omit the new optional fields. Existing basis and decision artifacts keep their schemas and bytes. Recovery never rewrites the original request, compiled report, completion, failure or physical ledger."
migration = "Regenerate OpenAPI, SDK and dashboard types together. Recovery requests must pin the failed attempt and full selected head; a later failure requires a new explicit request. Historical reconciliation is an internal custodian operation, not a new public mutation endpoint."
api = "Adds an optional custody_recovery descriptor and an explicit historical observation origin with its selected reconciliation receipt. Existing read endpoints expose the origin without performing reconciliation. Generated selected CAS locators retain required profiles, kind and media type; plain legacy ArtifactRef and omitted ordinary origins remain compatible."
limitations = "Custody recovery cannot repeat a provider effect or start fresh protected reentry. Exact selected RAW JSON evidence may omit a typed canonical codec; typed JSON retains that requirement, and ownership/profile/integrity checks remain. Historical reconciliation does not establish current numerical intent equality, empirical source truth, independent numerical verification, current permission or publication authority. Whole-route qualification and remaining dependencies are recorded in E02-WORK-PLAN.md."
generated_client_compatibility = "requires_regeneration"
public_surface_inventory_reviewed = true
migration_docs = ["src/polisyos/runtime/http/README.md", "src/polisyos/runtime/quality/README.md"]
runbook_docs = []
evidence = ["tests/unit/runtime/http/test_native_acquisition_custody_recovery.py", "tests/unit/runtime/http/services/test_acquisition_custody_recovery_binding.py", "tests/unit/runtime/http/services/test_native_derivation_pending_action.py", "tests/unit/core/contracts/test_run_model_input_initial_observation.py", "tests/unit/runtime/quality/test_candidate_acquisition_evaluation_issuance.py"]

