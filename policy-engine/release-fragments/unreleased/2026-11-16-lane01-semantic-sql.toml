compatibility = "The selected SQL occurrence is a distinct schema 2.0 payload under the existing scoped-occurrence artifact name. Existing schema 1.0 occurrence bytes retain their original ScopedMeasurementOccurrence shape. FoundryInputBindings 1.3 combines the existing SQL-admission and semantic-manifest refs; it does not rewrite prior artifacts."
migration = "Readers must select the occurrence DTO by the persisted manifest schema: 1.0 remains ScopedMeasurementOccurrence and 2.0 is RegisteredSQLMeasurementOccurrence. Consumers of the new SQL candidate path must use the updated loader. FoundryInputBindings 1.0 through 1.2 retain their existing meanings; the combined SQL-and-manifest producer path emits payload version 1.3."
api = "Adds Core contract exports and the Data Forge catalog assessor and materializer for one exact registered SQL cell. This slice does not change OpenAPI or generated client shapes; public Runtime execute/result and bounded API composition remain separately under qualification."
limitations = "The selected scalar is candidate-only: meaning, release and scope are consumer-asserted, source currentness is not_established, and the path grants no external source rights or publication authority. A retained public Foundry execution and separate fresh read-only admission preserve the candidate limitations; bounded Runtime API and current-use permission remain separate qualifications."
