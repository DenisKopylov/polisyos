summary = "Lane 01 audit repairs bind measurement aggregation and population to actual occurrences, preserve explicit identification modes and per-claim scopes, keep complete method declarations across cache restoration, and separate complete run discovery from its bounded decoded cache. Trusted application metric registries use one operation snapshot through early NL normalization and persisted downstream bindings. Structured policy components retain independent scope and method lineage."
compatibility = "Existing unextended v1 case bytes and readers, stable method ABI digests and default registry contents are preserved. New structured compound cases and scalar cases carrying structured diagnostic details use v2; older consumers must not reinterpret components as one scalar case. Method caches rebuild after semantic schema changes. Runtime run-linked artifact ownership supports multiple legitimate tenants while retaining CAS tenant/cell and authorization checks. Model-input use selections explicitly use v2 when linked to a persisted routing-use decision; unextended v1 selections retain their wire representation."
change_class = "compatible"
surface_classification = "public_stable: additive native fenced ledger snapshot/raw-byte read and strict wire decoder, Core selected representation loader, manifest-input helper and explicit v2 representation/profile methodology; public_experimental: additive Core component DTO, v2 grammar case, exact identification-origin resolver and candidate-only semantic input limitation codes on the selected N5 successor projection; internal: compiler, method-cache, Runtime index consumers and versioned candidate-only v3 N5 callable content, bounded actual installed/native execution profiles, v2 request-role projections and institutionally signed replay intake, fixed numerical projection and candidate-only blind NCM replay lifecycle"
public_surface_inventory_reviewed = true
migration = "Measurement representations and binding profiles keep v1 by default; declaring a methodology document or methodology axis requires explicit v2 with manifest version 2.0. No historical artifact rewrite. Rebuild derived method caches and qualify them against the current admitted registry before current use. Unextended legacy v1 payloads keep their wire version; new structured fields require v2."
limitations = "Methodology document identity/availability is candidate evidence, not empirical validity or authority; optional unknown methodology remains a typed limitation. The fresh successor projection uses owner-recomputed limitation codes; absence of replay is distinct from a verified empty set. Streaming bounds per-read memory, not total document bytes/time, and legacy readers retain full-byte fallback. Candidate compilation and selected numerical checks do not grant scientific, institutional, publication or G acceptance. V3 callable content and canonical immutable IR inputs pass genuine initial V5 producer/persistence/fresh-reader binding; full sequential retention and genuine original/blind replay remain under qualification. Replay V2 keeps selected source identity distinct from actual producer identity, persists source-only child inputs, reopens parent result/action/profile/ledger bindings and uses separate durable diagnostic units with unknown USD cost. Bounded infrastructure retries retain consumed units; mismatch is terminal. This candidate demo has no protected permission or same-user/OS read isolation. Diagnostic capacity observation is advisory and reserves nothing. Strict restricted execution validates observed read events before projecting canonical read sets through occurrence and persisted witnesses. Process supervision refuses unsafe SIGCHLD dispositions before launching. Replay intake verifies selected bytes and independent configured principals; it grants no protected use, and production remains unappointed without institutional inputs. Caller-declared identification modes constrain method selection; exact grammar defaults/inference and unknown historical origins remain context with limitations, not scientific identification evidence. Controlled text ambiguities remain explicit; this is not universal NL interpretation. A maintained application cache caller and the full late workflow-parameter projection are not established by focused cache/metric bridge tests."
