id = "e02-program-graph-paired-actuation"
title = "Bind candidate simulation to explicit program-graph policy selections"
type = "added"
component = "foundry"
owner = "team-policyos-runtime"
summary = "Persist exact LoweredIR/mask/apply selections for an empty baseline and whole-intervention treatment while preserving world-method execution. Runtime's versioned paired profile records absolute outcomes and effects, preflights the complete physical-work quota, and exposes selected-registry outcome units through the existing candidate result body. Native source linkage retains the original profile separately from its current invocation and rejects absent history ownership. Generic acquisition history uses the existing action-history owner and shared dashboard reader; immutable Foundry readers use existing read-only profile capabilities while producers retain writer checks. Selected method resolution shares exact-version bound builtin admission across cold compiler/executor consumers. Mixed calls permit multiple selected policy mechanisms with registry-derived SUM/OVERRIDE dependencies; exact discrete initial facts and fully replayed method-only predecessors retain their original source identity. Scalar temporal bindings 1.5 now reach exact horizon-step dispatch and historical argument reading; predecessor snapshot labels and current logical steps retain distinct time roles. Typed source-unit declarations bind adopted source/schema/metric/selector evidence and preserve historical replay at a candidate-only ceiling. Epoch passport reference census and codec readers include that optional provenance, preserving strict complete-role and selected-profile checks. Native prepared/N5/final-receipt checkpoints reuse existing CAS/event/lease transactions. Native request/seal/N8 keeps original and current identities separate; action-bound negative admission replays its actual selected deferral/epoch owners, and unresolved resolver errors stay failures."
compatibility = "Absent actuation selection retains legacy execution. Explicit selection uses ExecuteRequest 1.1 and execution basis 1.4. Source-unit declaration 1.1 adds an explicit stable field-set hash profile while legacy SourceContract hashes/snapshots and unit 1.0 retain their original law. Action-bound Native deferral 1.1 adds an explicit admission phase; old 1.0/unbound bytes remain unchanged. Older request, basis and unpaired numerical readers remain supported; no historical artifact is rewritten. Unset optional projection fields preserve legacy DTO wire shape. API projections expose verified unit/history facts or an explicit limitation without rewriting historical artifacts."
change_class = "compatible"
surface_classification = "public_experimental: Core actuation selection contracts and Foundry selection resolver; compatible additive Runtime candidate result unit fields; internal: paired numerical execution and Native source linkage"
public_surface_inventory_reviewed = true
migration = "Regenerate public inventory, Runtime OpenAPI and both TypeScript client families from the composed source. Preserve distinct Core and Control run identifiers. Feedback execution with an actuation selection is unsupported and refuses before dispatch."
limitations = "Candidate only. Real Foundry baseline/treatment and independent component controls are verified; hosted N5-to-frontier/API and paid Native continuation remain separately qualified. Model-declared units do not establish empirical truth, production verifier appointment, publication authority, G acceptance or LANE-01 completion."
