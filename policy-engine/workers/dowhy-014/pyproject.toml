[project]
name = "polisyos-dowhy-worker"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["dowhy==0.14", "pytest==9.0.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "T201", "PT011", "PT018", "E501"]
